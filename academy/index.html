<!DOCTYPE html>
<html lang="en">
<head>
<script id="dj-house-v19">
/* ═══ Daraja house standard — safety net, local dates, talk-into-any-box ═══ */
(function(){
  if(window.__djHouse) return; window.__djHouse = true;

  /* ── 1 · the real local day ──────────────────────────────────────────────
     toISOString() converts to UTC. At 7pm in Illinois that is already tomorrow,
     so "today" landed on the wrong date and daily streaks broke overnight. */
  window.djYMD = function(d){
    d = d || new Date();
    if(typeof d === 'string') d = new Date(d + (d.length === 10 ? 'T12:00:00' : ''));
    return d.getFullYear() + '-' +
           String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0');
  };

  /* ── 2 · saving must never fail silently ─────────────────────────────────
     Every app writes with localStorage.setItem. If the phone refuses, the old
     code threw, the save function stopped halfway, and nobody was told. */
  try{
    var proto = window.Storage && Storage.prototype;
    if(proto && !proto.__djGuarded){
      var realSet = proto.setItem;
      proto.setItem = function(k, v){
        try{ var r = realSet.call(this, k, v); if(String(k).indexOf('dj_')!==0) savedPulse(); return r; }
        catch(err){ djSaveFailed(err); return undefined; }
      };
      proto.__djGuarded = true;
    }
  }catch(e){}

  var toldOnce = false;
  function djSaveFailed(err){
    if(toldOnce) return; toldOnce = true;
    var full = err && (err.name === 'QuotaExceededError' ||
               err.code === 22 || err.code === 1014);
    djBanner(
      full ? 'This phone is out of room, so that did not save.'
           : 'This phone would not let the app save that.',
      full ? 'Free up some space in Settings › General › iPhone Storage, then tap Try again. Nothing you can see on screen has been lost yet — but do not close the app until it saves.'
           : 'This usually means private browsing, or Settings › Safari › Block All Cookies is switched on. Turn that off and tap Try again.',
      [['Try again', function(){ location.reload(); }]]
    );
  }

  /* ── 3 · nothing white-screens without a way out ─────────────────────────
     A single bad record used to leave a blank page and no route back. */
  var netShown = false;
  function net(msg){
    if(netShown) return; netShown = true;
    djBanner('Something went wrong on this screen.',
      'Your saved work is untouched. Reloading fixes almost everything.' +
      (msg ? '\n\n(' + String(msg).slice(0,120) + ')' : ''),
      [['Reload', function(){ location.reload(); }]]);
  }
  window.addEventListener('error', function(e){
    if(e && e.target && e.target !== window && e.target.tagName) return; /* a missing image is not a crash */
    net(e && e.message);
  });
  window.addEventListener('unhandledrejection', function(e){
    net(e && e.reason && e.reason.message);
  });

  /* one calm bar, never an alert() the person cannot read at their own pace */
  function djBanner(title, body, buttons){
    if(!document.body){ document.addEventListener('DOMContentLoaded', function(){ djBanner(title, body, buttons); }); return; }
    var old = document.getElementById('djBanner'); if(old) old.remove();
    var w = document.createElement('div');
    w.id = 'djBanner';
    w.setAttribute('role','alert');
    w.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;'
      + 'background:#7A2E1E;color:#fff;padding:16px 16px calc(16px + env(safe-area-inset-bottom));'
      + 'font:15px/1.45 -apple-system,system-ui,sans-serif;box-shadow:0 -6px 26px rgba(0,0,0,.35)';
    var h = document.createElement('div');
    h.style.cssText = 'font-weight:800;font-size:16px;margin-bottom:4px'; h.textContent = title;
    var p = document.createElement('div');
    p.style.cssText = 'opacity:.94;white-space:pre-wrap'; p.textContent = body;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
    (buttons||[]).forEach(function(b){
      var el = document.createElement('button');
      el.textContent = b[0];
      el.style.cssText = 'font:inherit;font-weight:800;min-height:44px;padding:10px 16px;border:none;'
        + 'border-radius:12px;background:#fff;color:#7A2E1E;cursor:pointer';
      el.onclick = b[1]; row.appendChild(el);
    });
    var x = document.createElement('button');
    x.textContent = 'Dismiss';
    x.setAttribute('aria-label','Dismiss this message');
    x.style.cssText = 'font:inherit;font-weight:700;min-height:44px;padding:10px 16px;border:1px solid rgba(255,255,255,.55);'
      + 'border-radius:12px;background:transparent;color:#fff;cursor:pointer';
    x.onclick = function(){ w.remove(); };
    row.appendChild(x);
    w.appendChild(h); w.appendChild(p); w.appendChild(row);
    document.body.appendChild(w);
  }
  window.djBanner = djBanner;

  /* ── 4 · talk into any typing box ────────────────────────────────────────
     Rafiki and Feedback Studio had this; twenty-one apps did not. The button
     only appears once you tap into a box, so no screen changes until you want it. */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, micBtn = null, curBox = null;

  function eligible(el){
    if(!el || el.dataset.djMic === 'off') return false;
    var t = (el.tagName||'').toLowerCase();
    if(t === 'textarea') return true;
    if(t !== 'input') return false;
    var ty = (el.type||'text').toLowerCase();
    if(['text','search','tel','url','email'].indexOf(ty) < 0) return false;
    if(el.readOnly || el.disabled) return false;
    /* Leave alone any box that already has its own microphone — Rafiki, Feedback
       Studio and In My Own Words built their own and theirs are better placed.
       Stop at <body>: once our own button is on the page its emoji is inside body's
       text, which would make every box after the first one look already-served. */
    var p = el.parentElement;
    for(var i=0; i<3 && p && p !== document.body && p !== document.documentElement; i++, p = p.parentElement){
      var t = p.textContent || '';
      if(micBtn && p.contains(micBtn)) t = t.split('\u{1F3A4}').join('');
      if(t.indexOf('\u{1F3A4}') >= 0) return false;
    }
    return true;
  }

  function place(box){
    if(!micBtn){
      micBtn = document.createElement('button');
      micBtn.type = 'button';
      micBtn.id = 'djMic';
      micBtn.textContent = '\u{1F3A4}';
      micBtn.setAttribute('aria-label','Say it instead of typing');
      micBtn.title = 'Say it instead of typing';
      /* every app has its own button styling — min-height:44px, padding, box-sizing —
         so this one states its shape outright or it comes out the wrong size */
      micBtn.style.cssText = 'position:absolute !important;z-index:2147482000;'
        + 'box-sizing:border-box !important;width:40px !important;height:40px !important;'
        + 'min-width:40px !important;min-height:40px !important;max-width:40px !important;'
        + 'max-height:40px !important;padding:0 !important;margin:0 !important;'
        + 'border-radius:50% !important;border:1px solid rgba(128,128,128,.4);background:#fff;'
        + 'color:#1F2622;font-size:19px;line-height:1;cursor:pointer;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center';
      micBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
      micBtn.addEventListener('click', function(e){ e.preventDefault(); talk(); });
      document.body.appendChild(micBtn);
    }
    var r = box.getBoundingClientRect();
    /* scrolled out of sight — inside a sheet or off the page — so show nothing */
    if(r.bottom < 4 || r.top > window.innerHeight - 4 || r.width < 60){ micBtn.hidden = true; return; }
    micBtn.hidden = false;
    /* measure what the browser actually made, rather than trusting the numbers above */
    var m = micBtn.getBoundingClientRect();
    var w = m.width  || 40, h = m.height || 40;
    micBtn.style.top  = (window.scrollY + r.top + (r.height - h)/2) + 'px';
    micBtn.style.left = (window.scrollX + r.right - w - 6) + 'px';
    /* a short box would be swallowed by the button — sit just outside it instead */
    if(r.width < w + 90) micBtn.style.left = (window.scrollX + r.right + 6) + 'px';
  }
  function hide(){ if(micBtn) micBtn.hidden = true; }

  function talk(){
    var box = curBox; if(!box) return;
    if(rec){ try{ rec.stop(); }catch(e){} return; }
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true;
    rec.continuous = (box.tagName.toLowerCase() === 'textarea');
    var base = (box.value || '').trim();
    micBtn.textContent = '⏹';
    micBtn.style.background = '#D96C4F';
    micBtn.setAttribute('aria-label','Stop listening');
    rec.onresult = function(e){
      var t = '';
      for(var i=0; i<e.results.length; i++) t += e.results[i][0].transcript;
      box.value = (base ? base + ' ' : '') + t;
      box.dispatchEvent(new Event('input', {bubbles:true}));
    };
    function done(){
      rec = null;
      if(micBtn){ micBtn.textContent = '\u{1F3A4}'; micBtn.style.background = '#fff';
                  micBtn.setAttribute('aria-label','Say it instead of typing'); }
      box.dispatchEvent(new Event('change', {bubbles:true}));
    }
    rec.onend = done;
    rec.onerror = done;
    try{ rec.start(); }catch(e){ done(); }
  }


  /* ── 5 · the floating helpers must not sit on the words ──────────────────
     The ? and the 💡 were each pinned to the right edge about 150px up from the
     bottom. On a 5.4" phone that is the middle of the screen, so both sat on top
     of whatever was written there — and in The Key they landed on exactly the same
     spot as each other, which hid one of them completely. They now share one dock
     in the bottom-right corner, stacked, and the dock lifts itself above whatever
     bottom bar the app has so it never covers a menu. */

  /* ── 6 · "Start fresh" must actually clear this app, and only this app ───────
     The first registry I shipped listed key names I had assumed rather than read.
     Against what the apps really write, 21 of 26 were wrong: The Key saves under
     'daraja_thekey_v1', so a person who had filled in their whole will-and-papers
     page was told "there is nothing saved in this app yet". These names were read
     out of each app's own source. Anything belonging to another app is protected
     even when a pattern would otherwise match it. */
  var OWNS = {
    nownext:      {k:['now_next_v1','now_next_profiles_v1','nn7_prefs','nn_code_v1','hz_prefs_v1',
                      'nn_dev','nn_fam_since','nn_family','nn_ph_reg','nn_week_v1'], p:['now_next_v1_','nn_']},
    ahead:        {k:['ahead_v1'], p:['ahead_']},
    breakeven:    {k:['breakeven_v1'], p:['breakeven_']},
    compass:      {k:['daraja_compass_v1','compassTipSeen'], p:['compass_']},
    nextstep:     {k:['nextstep_board_v1'], p:['nextstep_','nsb_']},
    occ:          {k:['occ_counter_v1','occTipSeen'], p:['occ_']},
    drive:        {k:['occ_counter_v1','occTipSeen'], p:['drive_','church_drive_']},
    safety:       {k:['my_safety_plan_v1'], p:['safety_']},
    zuri:         {k:['zuri_ops_v1'], p:['zuri_']},
    academy:      {k:['daraja_academy_v1'], p:['academy_']},
    feedback:     {k:['feedback_studio_v1'], p:['fbs_']},
    storykeeper:  {k:['story_keeper_v1','story_ask_v1'], p:['story_']},
    thekey:       {k:['daraja_thekey_v1'], p:[]},
    churchkey:    {k:['daraja_churchkey_v1'], p:[]},
    drumbeat:     {k:['drumbeat_v1','drumbeat_groups_v1'], p:['drumbeat_']},
    flipkit:      {k:['flipkit_v1','flipkit_aa','flipkit_seen'], p:['flipkit_']},
    rafiki:       {k:['rafiki_v1','rafiki_aa'], p:['rafiki_']},
    pitwall:      {k:['pitwall_state_v1'], p:['pitwall_','f1_']},
    churchhq:     {k:['church_hq_v1'], p:['church_hq_']},
    steward:      {k:['steward_v1'], p:['steward_']},
    serve:        {k:['serveboard_v1'], p:['serveboard_','serve_']},
    clubhouse:    {k:['clubhouse_stars'], p:['clubhouse_']},
    gameday:      {k:[], p:['gameday_','church_gameday_']},
    goodstanding: {k:['goodstanding_v1'], p:['goodstanding_']},
    receipts:     {k:['receiptmaker_org_v1'], p:['receiptmaker_','receipts_']}
  };

  function slugOf(){
    var s = (window.DJ_START && window.DJ_START.slug) ||
            (location.pathname.replace(/\/index\.html$/,'').split('/').filter(Boolean).pop() || '');
    s = String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
    var alias = {churchkey:'churchkey', thekey:'thekey', churchserve:'serve', churchsteward:'steward',
                 churchhq:'churchhq', churchdrive:'drive', churchclubhouse:'clubhouse',
                 churchgameday:'gameday', npgoodstanding:'goodstanding', npreceipts:'receipts',
                 f1:'pitwall', feedbackstudio:'feedback', storykeeper:'storykeeper'};
    return alias[s] || s;
  }

  function myKeys(){
    var me = slugOf(), mine = OWNS[me];
    if(!mine) return null;                            /* unknown app — do not guess */
    var guard = {};
    Object.keys(OWNS).forEach(function(a){
      if(a === me) return;
      OWNS[a].k.forEach(function(x){ guard[x] = a; });
    });
    /* two apps genuinely share the shoebox count, so neither may erase it */
    var shared = {'occ_counter_v1':1, 'occTipSeen':1, 'now_next_v1':(me !== 'nownext') ? 1 : 0};
    var out = [];
    try{
      for(var i=0; i<localStorage.length; i++){
        var k = localStorage.key(i); if(!k) continue;
        if(k.indexOf('dj_') === 0) continue;
        if(shared[k]) continue;
        var owned = mine.k.indexOf(k) >= 0;
        if(!owned) for(var j=0; j<mine.p.length; j++) if(k.indexOf(mine.p[j]) === 0){ owned = true; break; }
        if(!owned && k.indexOf('fs_coach_' + me) === 0) owned = true;
        if(!owned) continue;
        if(guard[k] && mine.k.indexOf(k) < 0) continue;   /* another app's, by name */
        out.push(k);
      }
    }catch(e){}
    return out;
  }

  function startFresh(){
    var keys = myKeys();
    if(keys === null){ alert('This app is not set up to erase itself yet — tell Jerry.'); return; }
    if(!keys.length){ alert('There is nothing saved in this app yet — nothing to erase.'); return; }
    if(!confirm('Erase everything in THIS app?\n\nThis will clear:\n  • ' + keys.join('\n  • ') +
                '\n\nYour other Daraja apps are not touched. This cannot be undone.')) return;
    if(!confirm('Last check — erase this app’s data?')) return;
    try{ keys.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
    location.replace(location.pathname);
  }

  /* The older erase layer sits at the end of the page, so it assigns AFTER this one
     and its guessed key names win. Claim the name again once the page is built. */
  window.djStartFresh = startFresh;
  function claimStartFresh(){
    window.djStartFresh = startFresh;
    setTimeout(function(){ window.djStartFresh = startFresh; }, 300);
    setTimeout(function(){ window.djStartFresh = startFresh; }, 1500);
  }


  /* ── 7 · the 425-things audit (10 Sep 2026, every page at 360×780) ────────
     257 pieces of text under 13px · 49 tap targets under 40px · 36 typing boxes
     whose only label is a placeholder that vanishes the moment you type · 10 boxes
     under 40px tall. Fixed here for every app at once. */
  function auditFixCSS(){
    if(document.getElementById('djAuditCSS') || !document.head) return;
    var st = document.createElement('style'); st.id = 'djAuditCSS';
    st.textContent =
      /* nothing a person reads may be under 13px — the earlier floor missed div, button, headings */
      'div,button,a,h1,h2,h3,h4,h5,h6,th,strong,b,em,i,time,summary,figcaption,dt,dd,legend,option,' +
      'blockquote,cite,q,code,pre,address,caption{font-size:max(13px,1em);}' +
      /* a box you type in is at least a fingertip tall */
      'input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),' +
      'select,textarea{min-height:44px;}' +
      /* the label that stays: shown above a box once it has words in it, from its placeholder */
      '.dj-stay{display:block;font-size:12.5px;font-weight:700;letter-spacing:.04em;opacity:.75;margin:6px 0 2px;line-height:1.2;}' +
      /* store cards: the little links under the buttons were 21px tall */
      '.app > a,.app .row a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 10px;}';
    document.head.appendChild(st);
  }

  /* placeholder-only boxes get (a) a spoken name and (b) a label that appears above
     them the moment there are words inside, so what the box is for never disappears */
  function stayLabels(){
    var boxes = document.querySelectorAll('input[placeholder],textarea[placeholder]');
    for(var i=0;i<boxes.length;i++){
      var b = boxes[i];
      if(b.__djStay) continue;
      if(/^(hidden|button|submit|checkbox|radio)$/.test(b.type||'')) continue;
      var id = b.id;
      var has = (id && document.querySelector('label[for="'+id.replace(/"/g,'')+'"]')) || b.closest('label') || b.getAttribute('aria-label') || b.getAttribute('aria-labelledby');
      if(has) continue;
      var words = (b.placeholder||'').replace(/^e\.g\.\s*/i,'').replace(/…|\.\.\.$/,'').trim();
      if(!words) continue;
      b.setAttribute('aria-label', words);
      b.__djStay = true;
      (function(box, text){
        var lab = null;
        function sync(){
          var on = !!box.value;
          if(on && !lab){
            lab = document.createElement('span'); lab.className='dj-stay'; lab.textContent = text;
            box.parentNode.insertBefore(lab, box);
          } else if(!on && lab){ lab.remove(); lab = null; }
        }
        box.addEventListener('input', sync); box.addEventListener('change', sync); sync();
      })(b, words.length > 48 ? words.slice(0,45) + '…' : words);
    }
  }

  /* buttons that are only an emoji get a name a screen reader can say */
  var NAMES = {wkBtn:'Week view', sermonNotesBtn:'Sermon notes', fab:'Add', qsBtn:'Quick setup'};
  function nameButtons(){
    var els = document.querySelectorAll('button,a,[role="button"]');
    for(var i=0;i<els.length;i++){
      var e = els[i];
      if(e.getAttribute('aria-label') || e.getAttribute('title')) continue;
      var t = (e.textContent||'').trim();
      if(!t || /[A-Za-z0-9]/.test(t)) continue;               /* has real words already */
      var guess = NAMES[e.id] || (e.className && typeof e.className==='string' && NAMES[e.className.split(' ')[0]]) || null;
      if(guess) e.setAttribute('aria-label', guess);
    }
  }

  /* Ahead of It family: the round ＋ sat on top of the Quick setup button */
  function fabLift(){
    var fab = document.querySelector('button.fab'); if(!fab) return;
    var f = fab.getBoundingClientRect(), top = null;
    /* anything else parked in the bottom corner: the app's own quick-start, our dock */
    [document.getElementById('qsBtn'), document.getElementById('djDock')].forEach(function(o){
      if(!o) return; var q = o.getBoundingClientRect(); if(!q.width) return;
      if(f.right<=q.left||q.right<=f.left||f.bottom<=q.top||q.bottom<=f.top) return;
      if(top===null || q.top<top) top = q.top;
    });
    if(top===null) return;
    var lift = (window.innerHeight - top) + 10;
    fab.style.setProperty('bottom', 'calc(' + Math.round(lift) + 'px + env(safe-area-inset-bottom))', 'important');
  }


  /* ── 8 · the floors that actually hold ───────────────────────────────────
     v14 set font-size:max(13px,1em) on div/button/etc. It measured almost no
     change: an app's own ".lbl{font-size:12px}" is a class selector and outranks
     an element selector, so the app won every time. Reading the computed size and
     writing an inline value is the only thing that beats every stylesheet. Same
     for tap targets: buttons and links the app styled at 21px tall. */
  function floors(){
    var MIN_FONT = 13, MIN_TAP = 44, n = 0;
    var all = document.body ? document.body.getElementsByTagName('*') : [];
    for(var i=0; i<all.length; i++){
      var el = all[i];
      if(el.__djFloored) continue;
      var tag = el.tagName;
      if(tag==='SCRIPT'||tag==='STYLE'||tag==='SVG'||tag==='PATH') continue;
      var cs = getComputedStyle(el);
      if(cs.display==='none') continue;
      /* text: only elements that carry their own words */
      var own = false;
      for(var c = el.firstChild; c; c = c.nextSibling){ if(c.nodeType===3 && c.textContent.trim().length>1){ own = true; break; } }
      if(own){
        var fs = parseFloat(cs.fontSize);
        if(fs && fs < MIN_FONT){
          el.style.setProperty('font-size', MIN_FONT+'px', 'important');
          var lh = parseFloat(cs.lineHeight);
          if(lh && lh < MIN_FONT*1.2) el.style.setProperty('line-height', '1.25', 'important');
          n++;
        }
      }
      /* taps: real controls that were styled too small to hit */
      var isCtl = tag==='BUTTON' || tag==='SELECT' || el.getAttribute('role')==='button' ||
                  (tag==='A' && el.getAttribute('href') && cs.display!=='inline');
      if(isCtl){
        var r = el.getBoundingClientRect();
        if(r.height>0 && r.height < 40){
          el.style.setProperty('min-height', MIN_TAP+'px', 'important');
          if(cs.display==='inline-block' || cs.display==='block') { el.style.setProperty('display','inline-flex','important'); el.style.setProperty('align-items','center','important'); }
          n++;
        }
        /* a 23px-wide arrow button is as hard to hit as a 23px-tall one */
        if(tag==='BUTTON' && r.width>0 && r.width < 32){
          el.style.setProperty('min-width', MIN_TAP+'px', 'important');
          el.style.setProperty('justify-content', 'center', 'important');
          n++;
        }
      }
      /* the browser's 13px checkbox is the smallest thing on any screen */
      if(tag==='INPUT' && (el.type==='checkbox' || el.type==='radio')){
        var rc = el.getBoundingClientRect();
        if(rc.width>0 && rc.width < 22){ el.style.setProperty('width','22px','important'); el.style.setProperty('height','22px','important'); n++; }
      }
      el.__djFloored = true;
    }
    return n;
  }
  /* the dock and the app's own bars keep moving for a few seconds after load, so the + button is re-checked on the same schedule */
  function floorsSoon(){ [0, 700, 2200, 4500, 7000].forEach(function(ms){ setTimeout(function(){ try{ floors(); }catch(e){} try{ fabLift(); }catch(e){} }, ms); }); }

  function auditFixes(){
    try{ auditFixCSS(); }catch(e){}
    try{ stayLabels(); }catch(e){}
    try{ nameButtons(); }catch(e){}
    try{ fabLift(); }catch(e){}
  }

  function occupied(){
    /* How far up the bottom edge is already spoken for — by a bottom bar across the
       screen, OR by another floating button already parked in the bottom-right.
       Without the second test the dock lands straight on top of an app's own round
       button, which is exactly what happened to My Productive Partner's calendar. */
    var bar = 0, right = 0;
    var all = document.body ? document.body.getElementsByTagName('*') : [];
    var VH = window.innerHeight, VW = window.innerWidth;
    for(var i=0; i<all.length; i++){
      var el = all[i];
      if(el.id === 'djDock' || (dockEl && dockEl.contains(el))) continue;
      var cs = getComputedStyle(el);
      if(cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if(cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity === 0) continue;
      var r = el.getBoundingClientRect();
      if(r.height < 20 || r.width < 20) continue;
      if(r.height > VH * 0.5) continue;                 /* a full-screen overlay is not a bar */

<script id="daraja-readable-v4-js">
/* ═══ Readability corrector v4 ═══
   v3 had a bug of my own making: it decided which way to move a colour purely from the
   background's lightness, so white text on a mid-blue button was pushed *whiter* — no help
   at all. It now tries both directions and takes whichever actually reaches the target with
   the smaller change. Also labels boxes that have nothing to announce, using the words
   already sitting next to them. */
(function(){
  if(window.__djReadable4) return; window.__djReadable4 = true;

  var rgb = function(c){ return (String(c).match(/[\d.]+/g)||[0,0,0]).slice(0,3).map(Number); };
  var lum = function(c){
    var p = rgb(c).map(function(x){ x/=255; return x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4); });
    return 0.2126*p[0] + 0.7152*p[1] + 0.0722*p[2];
  };
  var ratio = function(a,b){ var l1=lum(a), l2=lum(b); return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); };

  function behind(el){
    var n = el;
    while(n && n !== document.documentElement){
      var cs = getComputedStyle(n), c = cs.backgroundColor;
      if(c && !/rgba?\(0,\s*0,\s*0,\s*0\)|transparent/.test(c)){
        var parts = (String(c).match(/[\d.]+/g)||[]);
        if(parts[3] === undefined || parseFloat(parts[3]) > 0.55)
          return 'rgb('+parts[0]+','+parts[1]+','+parts[2]+')';
      }
      if(cs.backgroundImage && cs.backgroundImage !== 'none') return null;
      n = n.parentElement;
    }
    return getComputedStyle(document.body).backgroundColor || 'rgb(255,255,255)';
  }

  /* try darker AND lighter; keep whichever reaches the target with the least change */
  function lift(color, bg, need){
    var c = rgb(color);
    var best = null, bestStep = 99;
    [true, false].forEach(function(lighter){
      for(var step = 1; step <= 24; step++){
        var f = step/24;
        var nc = c.map(function(v){ return lighter ? v + (255-v)*f : v*(1-f); });
        var s = 'rgb('+nc.map(Math.round).join(',')+')';
        if(ratio(s, bg) >= need){
          if(step < bestStep){ bestStep = step; best = s; }
          break;
        }
      }
    });
    return best || (lum(bg) > 0.5 ? 'rgb(0,0,0)' : 'rgb(255,255,255)');
  }

  function fixContrast(){
    var fixed = 0;
    var nodes = document.querySelectorAll('p,span,li,td,label,small,h1,h2,h3,h4,div,a,button,strong,b,em,i');
    for(var i = 0; i < nodes.length && i < 900; i++){
      var el = nodes[i];
      if(el.children.length) continue;
      if((el.textContent||'').trim().length < 2) continue;
      var cs = getComputedStyle(el);
      if(cs.display==='none' || cs.visibility==='hidden') continue;
      var r = el.getBoundingClientRect(); if(!r.width || !r.height) continue;
      var bg = behind(el); if(!bg) continue;
      var size = parseFloat(cs.fontSize), bold = parseInt(cs.fontWeight,10) >= 700;
      var need = (size >= 24 || (size >= 18.66 && bold)) ? 3 : 4.5;
      if(ratio(cs.color, bg) >= need) continue;
      el.style.setProperty('color', lift(cs.color, bg, need), 'important');
      var op = parseFloat(cs.opacity);
      if(op < 1 && op > 0) el.style.opacity = '1';
      fixed++;
    }
    return fixed;
  }

  /* a box with no label, given the words already beside it */
  function fixLabels(){
    var n = 0;
    document.querySelectorAll('input:not([type=hidden]):not([type=submit]):not([type=button]),textarea,select').forEach(function(el){
      if(el.getAttribute('aria-label') || el.getAttribute('placeholder') || el.getAttribute('title')) return;
      if(el.id && document.querySelector('label[for="'+CSS.escape(el.id)+'"]')) return;
      if(el.closest('label')) return;
      var txt = '';
      var prev = el.previousElementSibling;
      if(prev && /^(LABEL|SPAN|B|STRONG|DIV|P|H[1-6])$/.test(prev.tagName)) txt = (prev.textContent||'').trim();
      if(!txt && el.parentElement){
        var p = el.parentElement.cloneNode(true);
        p.querySelectorAll('input,textarea,select,button').forEach(function(x){ x.remove(); });
        txt = (p.textContent||'').trim();
      }
      if(!txt) txt = el.type === 'date' ? 'Date' : (el.name || 'Type here');
      el.setAttribute('aria-label', txt.replace(/\s+/g,' ').slice(0, 60));
      n++;
    });
    return n;
  }

  function pass(){
    var a = fixContrast(), b = fixLabels();
    window.__djFixed = { contrast:(window.__djFixed?window.__djFixed.contrast:0)+a,
                         labels:(window.__djFixed?window.__djFixed.labels:0)+b };
  }
  function boot(){
    pass();
    var t=null;
    new MutationObserver(function(){ clearTimeout(t); t=setTimeout(pass, 350); })
      .observe(document.body, {childList:true, subtree:true});
    window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(pass, 350); });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script id="dj-clear-v2">
/* ═══ Start fresh — v2 (safe) ═══ */
(function(){
  if(window.__djClear2) return; window.__djClear2 = true;

  /* Who owns what. Every app on this address shares one storage area, so this list is
     the only thing standing between "clear my data" and "clear everyone's data". */
  var OWNERS = {
    nownext:      ['now_next_v1','now_next_profiles_v1','nn7_prefs','nn_code_v1','hz_prefs_v1'],
    ahead:        ['ahead_v1','aheadofit_v1'],
    nextstep:     ['nextstep_v1','next_step_v1'],
    breakeven:    ['breakeven_v1'],
    safety:       ['safety_v1','safetyplan_v1'],
    occ:          ['occ_v1'],
    zuri:         ['zuri_v1','zuri_ops_v1'],
    compass:      ['compass_v1'],
    feedback:     ['fbs_v1'],
    storykeeper:  ['story_v1','storykeeper_v1'],
    academy:      ['academy_v1'],
    thekey:       ['thekey_v1','key_v1'],
    drumbeat:     ['drumbeat_v1'],
    flipkit:      ['flipkit_v1'],
    rafiki:       ['rafiki_v1','rafiki_aa'],
    pitwall:      ['f1_v1','pitwall_v1','f1league_v1'],
    churchhq:     ['church_hq_v1'],
    steward:      ['steward_v1'],
    serve:        ['serveboard_v1','serve_v1'],
    drive:        ['drive_v1','church_drive_v1'],
    clubhouse:    ['clubhouse_v1','church_clubhouse_v1'],
    gameday:      ['gameday_v1','church_gameday_v1'],
    churchkey:    ['churchkey_v1','church_key_v1'],
    goodstanding: ['goodstanding_v1'],
    receipts:     ['receipts_v1','np_receipts_v1']
  };

  var SLUG = (window.DJ_START && window.DJ_START.slug) ||
             (location.pathname.replace(/\/index\.html$/,'').split('/').filter(Boolean).pop() || 'app');
  SLUG = String(SLUG).toLowerCase().replace(/[^a-z0-9]/g,'');

  function myKeys(){
    var mine = (OWNERS[SLUG] || []).slice();
    var declared = (window.DJ_START && window.DJ_START.dataKeys) || [];
    declared.forEach(function(k){ if(mine.indexOf(k) < 0) mine.push(k); });

    /* everything any OTHER app owns is off limits, whatever the patterns say */
    var protectedKeys = {};
    Object.keys(OWNERS).forEach(function(app){
      if(app === SLUG) return;
      OWNERS[app].forEach(function(k){ if(mine.indexOf(k) < 0) protectedKeys[k] = app; });
    });

    var out = [];
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k) continue;
        if(k.indexOf('dj_') === 0) continue;
        if(protectedKeys[k]) continue;                       /* another app's data */
        if(mine.indexOf(k) >= 0){ out.push(k); continue; }
        /* this app's own coach/progress keys, which are always slug-stamped */
        if(k.indexOf('fs_coach_' + SLUG) === 0 || k.indexOf(SLUG + '_') === 0) out.push(k);
      }
    }catch(e){}
    return out;
  }

  window.djStartFresh = function(){
    var keys = myKeys();
    if(!keys.length){
      alert('There is nothing saved in this app yet — nothing to erase.');
      return;
    }
    var msg = 'Erase everything in THIS app?\n\nThis will clear:\n  • ' + keys.join('\n  • ') +
              '\n\nYour other Daraja apps are not touched. This cannot be undone.';
    if(!confirm(msg)) return;
    if(!confirm('Last check — erase this app\'s data?')) return;
    try{ keys.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
    location.replace(location.pathname);
  };

  function addLink(){
    var old = document.getElementById('djFreshLink');
    if(old) old.remove();                                    /* retire the unsafe one */
    if(document.getElementById('djFreshLink2')) return;
    var host = document.querySelector('footer') || document.body;
    var w = document.createElement('div');
    w.id = 'djFreshLink2';
    w.style.cssText = 'text-align:center;padding:14px 12px 26px;font:13px -apple-system,system-ui,sans-serif;opacity:.75';
    w.innerHTML = '<button onclick="djStartFresh()" style="font:inherit;font-weight:700;'
      + 'border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;'
      + 'border-radius:9px;padding:10px 14px;min-height:44px;cursor:pointer">'
      + '\u{1F9F9} Start fresh — erase this app\u2019s data</button>';
    host.appendChild(w);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addLink);
  else addLink();
})();
</script>

(function(){ try{

<script>
/* ===== Helpful hovers v2 (2026-08-29) — hover bubbles on desktop, and on
   phones a 💡 button that labels every control for a few seconds. ===== */
(function(){
try{
  var tip=null;
  function ensure(){
    if(tip) return tip;
    tip=document.createElement('div');
    tip.style.cssText='position:fixed;z-index:200;max-width:240px;background:#2b2620;color:#faf6ee;font:600 13px/1.45 -apple-system,Segoe UI,sans-serif;padding:8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;display:none;';
    document.body.appendChild(tip);
    return tip;
  }
  function textFor(el){
    return el.getAttribute('data-help') || el.getAttribute('title') || el.getAttribute('aria-label') || '';
  }
  document.addEventListener('mouseover', function(e){
    try{
      var el=e.target.closest ? e.target.closest('[title],[data-help],[aria-label]') : null;
      if(!el) return;
      var txt=textFor(el); if(!txt) return;
      if(el.getAttribute('title')){ el.setAttribute('data-help', el.getAttribute('title')); el.removeAttribute('title'); }
      var t=ensure(); t.textContent=txt; t.style.display='block';
      var r=el.getBoundingClientRect();
      t.style.left=Math.min(window.innerWidth-250, Math.max(8, r.left))+'px';
      t.style.top=Math.max(6, r.top>60 ? r.top-52 : r.bottom+10)+'px';
    }catch(err){}
  }, true);
  document.addEventListener('mouseout', function(){ if(tip) tip.style.display='none'; }, true);
  document.addEventListener('click', function(){ if(tip) tip.style.display='none'; }, true);

  /* phone: 💡 shows every label at once for 7 seconds */
  var touchy = window.matchMedia && window.matchMedia('(hover: none)').matches;
  if(touchy){
    setTimeout(function(){
      if(document.getElementById('dTipDot')) return;
      var d=document.createElement('button'); d.id='dTipDot'; d.textContent='💡';
      d.setAttribute('aria-label','Show what every button does');
      d.style.cssText='position:fixed;right:10px;bottom:150px;z-index:150;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(128,120,100,.45);background:rgba(250,246,238,.92);font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);';
      d.onclick=function(){ labelAll(); };
      document.body.appendChild(d);
    }, 1800);
  }
  var labels=[];
  function clearLabels(){ labels.forEach(function(l){ try{l.remove();}catch(e){} }); labels=[]; }
  function labelAll(){
    clearLabels();
    var els=document.querySelectorAll('[title],[data-help],[aria-label]');
    var n=0;
    els.forEach(function(el){
      if(n>=12) return;
      if(el.id==='dTipDot') return;
      var r=el.getBoundingClientRect();
      if(r.width===0 || r.bottom<0 || r.top>window.innerHeight) return;
      var txt=textFor(el); if(!txt) return;
      var b=document.createElement('div');
      b.textContent=txt.length>60 ? txt.slice(0,57)+'…' : txt;
      b.style.cssText='position:fixed;z-index:190;max-width:200px;background:#2b2620;color:#faf6ee;font:600 12px/1.4 -apple-system,Segoe UI,sans-serif;padding:6px 10px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none;';
      b.style.left=Math.min(window.innerWidth-210, Math.max(6, r.left))+'px';
      b.style.top=Math.max(4,(r.top>50 ? r.top-40 : r.bottom+6))+'px';
      document.body.appendChild(b); labels.push(b); n++;
    });
    if(n) setTimeout(clearLabels, 7000);
  }
}catch(e){}
})();
</script>
