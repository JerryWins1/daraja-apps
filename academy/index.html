<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daraja Academy — AI for Grandparents</title>
<style>
  :root{
    --paper:#faf6ee; --card:#ffffff; --ink:#2b2620; --soft:#6f6557;
    --line:#e5dccb; --warm:#b3502f; --gold:#c9982a; --green:#4a7c59;
    --blue:#3d6f96; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh; font-size:20px; line-height:1.55;
  }
  .hide{display:none !important;}
  .wrap{max-width:640px; margin:0 auto; padding:18px 18px 60px;}

  #top{text-align:center; padding:26px 16px 4px;}
  #top .school{font-size:14px; font-weight:800; letter-spacing:.18em; color:var(--gold); text-transform:uppercase;}
  #top h1{font-family:var(--serif); font-size:34px; margin-top:4px;}
  #top h1 span{color:var(--warm);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:26px 26px; margin:16px 0; box-shadow:0 3px 14px rgba(80,60,30,.06);
  }
  h2{font-family:var(--serif); font-size:29px; margin-bottom:12px; line-height:1.25;}
  p{margin-bottom:14px;}
  p.big{font-size:22px;}
  .soft{color:var(--soft);}
  b{color:var(--warm);}

  .btn{
    display:inline-block; border:none; cursor:pointer; font-size:21px; font-weight:700;
    padding:17px 32px; border-radius:999px; background:var(--warm); color:#fff;
    font-family:inherit; transition:transform .08s; text-decoration:none;
  }
  .btn:active{transform:scale(.97);}
  .btn.big{font-size:23px; padding:20px 38px;}
  .btn.wide{display:block; width:100%; text-align:center;}
  .btn.ghost{background:#fff; color:var(--soft); border:2px solid var(--line);}
  .btn.green{background:var(--green);}
  .btn.blue{background:var(--blue);}

  /* progress dots */
  #dots{display:flex; gap:9px; justify-content:center; padding:14px 0 4px;}
  #dots i{width:13px; height:13px; border-radius:50%; background:#ddd3c0;}
  #dots i.on{background:var(--warm);}
  #dots i.done{background:var(--green);}

  /* listen button */
  .listen{
    display:inline-flex; align-items:center; gap:8px; background:#f2ead9; border:1.5px solid var(--line);
    border-radius:999px; padding:9px 18px; font-size:16.5px; font-weight:700; color:var(--soft);
    cursor:pointer; margin-bottom:14px; font-family:inherit;
  }
  .listen.on{background:var(--gold); color:#221; border-color:var(--gold);}

  /* practice chat */
  .chat{background:#f7f2e7; border:1.5px solid var(--line); border-radius:16px; padding:16px; margin:14px 0;}
  .bubble{border-radius:16px; padding:14px 18px; margin:10px 0; font-size:19px; max-width:94%;}
  .bubble.you{background:var(--warm); color:#fff; margin-left:auto;}
  .bubble.ai{background:#fff; border:1.5px solid var(--line);}
  .bubble.ai .who{font-size:13px; font-weight:800; color:var(--gold); letter-spacing:.08em; margin-bottom:6px;}
  .askRow{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .askBtn{
    background:#fff; border:2px solid var(--line); border-radius:14px; padding:15px 18px;
    font-size:19px; text-align:left; cursor:pointer; font-family:inherit; line-height:1.4;
  }
  .askBtn:hover{border-color:var(--warm);}
  .askBtn:disabled{opacity:.45; cursor:default;}

  input[type=text]{
    width:100%; font:inherit; font-size:20px; padding:15px 16px; border-radius:14px;
    border:2px solid var(--line); background:#fff; outline:none;
  }
  input[type=text]:focus{border-color:var(--warm);}

  .tip{background:#fdf6e3; border:1.5px solid var(--gold); border-radius:16px; padding:18px 20px; margin:14px 0; font-size:18.5px;}
  .tip b{color:var(--gold);}

  /* quiz */
  .quizBtn{
    display:block; width:100%; background:#fff; border:2px solid var(--line); border-radius:14px;
    padding:16px 18px; font-size:19px; text-align:left; cursor:pointer; font-family:inherit; margin:8px 0;
  }
  .quizBtn.right{border-color:var(--green); background:#eef6ef;}
  .quizBtn.wrong{border-color:#c0392b; background:#fbeeec;}

  /* certificate */
  .cert{
    border:3px double var(--gold); border-radius:14px; background:#fffdf6;
    padding:26px; text-align:center; font-family:var(--serif); margin:14px 0;
  }
  .cert .t{font-size:13px; letter-spacing:.2em; color:var(--gold); font-weight:700; text-transform:uppercase;}
  .cert h3{font-size:26px; margin:10px 0 4px;}
  .cert .n{font-size:22px; color:var(--warm); font-style:italic;}
  .cert .d{font-size:14px; color:var(--soft); margin-top:10px;}

  .navRow{display:flex; gap:10px; justify-content:space-between; margin-top:10px;}
  #ver{text-align:center; color:#c9c0ae; font-size:12px; padding:24px 0 40px;}
  @media print{ body *{visibility:hidden;} .cert, .cert *{visibility:visible;} .cert{position:absolute; top:20px; left:0; right:0;} }
</style>
</head>
<body>
<div id="dsSplash" style="position:fixed;inset:0;z-index:9999;background:#f6f1e7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .45s;color:#2b2620;font-family:-apple-system,sans-serif"><div style="font-size:62px">🎓</div><div style="font-size:28px;font-weight:800">Daraja Academy</div><div style="font-size:13px;color:#8a8272;font-weight:700">v1.1 · updated Sep 1</div><div style="font-size:11px;color:#b8ab94;font-weight:700">daraja studio</div></div><script>setTimeout(function(){var s=document.getElementById("dsSplash");if(s){s.style.opacity="0";setTimeout(function(){s.remove();},500);}},1300);</script>


<div id="top">
  <div class="school">🌉 Daraja Academy</div>
  <h1>AI for <span>Grandparents</span></h1>
</div>
<div id="dots"></div>

<div class="wrap" id="stage"></div>
<div id="ver">Daraja Academy · Lesson 1 preview · v1.1 · 2026-09-01 · every course helps a student in Kenya stay in school</div>

<script>
/* ============ narration ============ */
let voiceOn=true, currentSay='';
let _armed=false;
document.addEventListener('pointerdown', function(e){
  if(_armed) return;
  var tg=e.target && e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT') { _armed=true; return; } /* typing your name should never restart the narrator */
  _armed=true;
  if(voiceOn && currentSay && window.speechSynthesis && !speechSynthesis.speaking){
    setTimeout(function(){ say(currentSay); }, 150);
  }
}, {once:false, capture:true});
let _sayGen=0;
function say(text){
  if(!voiceOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const gen=++_sayGen;
  const parts=String(text).split(/(?<=[.!?:])\s+/).filter(Boolean);
  let i=0;
  (function next(){
    if(gen!==_sayGen || i>=parts.length) return;
    const u=new SpeechSynthesisUtterance(parts[i++]);
    u.rate=.92;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/Samantha|Google US English|en-US/i.test(v.name+v.lang));
    if(v) u.voice=v;
    u.onend=function(){ setTimeout(next, 420); };
    u.onerror=function(){ setTimeout(next, 200); };
    speechSynthesis.speak(u);
  })();
  return; /* legacy single-utterance path below unused */
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.92;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/Samantha|Google US English|en-US/i.test(v.name+v.lang));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function toggleVoice(btn){
  voiceOn=!voiceOn;
  document.querySelectorAll('.listen').forEach(b=>{
    b.classList.toggle('on',voiceOn);
    b.innerHTML = voiceOn ? '🔊 Reading to you — tap to stop' : '🔊 Read this page to me';
  });
  if(voiceOn) say(currentSay); else if(window.speechSynthesis) speechSynthesis.cancel();
}

/* ============ lesson screens ============ */
const LS='daraja_academy_v1';
let db; try{ db=JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ db={}; }
function save(){ localStorage.setItem(LS, JSON.stringify(db)); }

let step = 0;
const STEPS = [welcome, whatIsIt, theRule, practice1, practice2, scamTip, quiz, finish];

function dots(){
  document.getElementById('dots').innerHTML =
    STEPS.map((s,i)=>`<i class="${i<step?'done':i===step?'on':''}"></i>`).join('');
}
function go(n){
  if(window.speechSynthesis) speechSynthesis.cancel();
  step=n; dots();
  STEPS[step]();
  window.scrollTo(0,0);
}
function listenBtn(){ return `<button class="listen" onclick="toggleVoice(this)">${voiceOn?'🔊 Reading to you — tap to stop':'🔊 Read this page to me'}</button>`; }
function nav(backOk, nextLabel){
  return `<div class="navRow">
    ${backOk?'<button class="btn ghost" onclick="go('+(step-1)+')">‹ Back</button>':'<span></span>'}
    <button class="btn green" onclick="go(${step+1})">${nextLabel||'Next ›'}</button>
  </div>`;
}
const stage = ()=>document.getElementById('stage');

/* ---- 1. welcome ---- */
function welcome(){
  currentSay = "Welcome to A I for Grandparents. Lesson one: Just ask it. In the next ten minutes, you'll talk to an A I for the very first time. You can't break anything. I promise. My name doesn't matter. Your questions do. Let's begin.";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>Lesson 1: Just ask it. 🕊</h2>
    <p class="big">In the next <b>ten minutes</b>, you'll talk to an AI for the very first time.</p>
    <p class="big">You can't break anything. <b>I promise.</b></p>
    <p class="soft">No account. No typing skills needed. Big buttons, one thing at a time — the Daraja way.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;">
      <span style="font-weight:700;">First — what's your name?</span>
      <input type="text" id="nm" placeholder="Your first name" style="max-width:230px" value="${(db.name||'').replace(/"/g,'&quot;')}" onchange="db.name=this.value.trim();save()">
    </div>
    <div style="margin-top:20px;">${nav(false,"I'm ready ›")}</div>
  </div>`;
  say(currentSay);
}

/* ---- 2. what is it ---- */
function whatIsIt(){
  currentSay = "So what IS an A I? Think of it as a very well-read helper who has read almost everything, never gets tired of your questions, and never ever thinks a question is silly. It is not magic. It is not alive. And it is not always right, which we'll talk about later. It's a tool. Like a telephone, once upon a time, it just takes a little getting used to.";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>So… what IS it?</h2>
    <p class="big">Think of AI as a <b>very well-read helper</b> who:</p>
    <p class="big">📚 has read almost everything<br>
    🙋 never gets tired of your questions<br>
    😊 never thinks a question is silly</p>
    <p>It's <b>not magic</b>, it's not alive, and it's not always right — we'll get to that.
    It's a tool. Like the telephone once was: it just takes a little getting used to.</p>
    ${nav(true)}
  </div>`;
  say(currentSay);
}

/* ---- 3. the rule ---- */
function theRule(){
  currentSay = "Here is the only rule you need today. Talk to it like a person. Not computer code. Not magic words. Just say what you want, the way you'd ask a helpful neighbor. Watch: instead of typing 'chicken recipe', you can say: I have chicken, rice, and not much energy tonight. What's an easy dinner? The second one gets a better answer, because you talked like a person.";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>The only rule: talk like a person.</h2>
    <p class="big">No computer code. No magic words. Just say what you want — like you'd ask a <b>helpful neighbor</b>.</p>
    <div class="chat">
      <div class="bubble you">chicken recipe</div>
      <p class="soft" style="text-align:center;font-size:15px;">😐 okay… but watch this:</p>
      <div class="bubble you">I have chicken, rice, and not much energy tonight. What's an easy dinner?</div>
      <p class="soft" style="text-align:center;font-size:15px;">⭐ THIS gets the good answer — because you talked like a person.</p>
    </div>
    ${nav(true,'Let me try ›')}
  </div>`;
  say(currentSay);
}

/* ---- 4. practice 1: tap to ask ---- */
const CANNED = {
 a:{q:"What does 'atrial fibrillation' mean, in plain words?",
    r:"It means the top chambers of the heart are beating out of rhythm — quivering instead of pumping smoothly. It's common, especially over 65, and very treatable. A good next question for your doctor: 'Is mine the kind that comes and goes, or steady?' (And always confirm medical things with your doctor — I'm a helper, not a physician.)"},
 b:{q:"Help me write a short birthday note to my granddaughter who loves horses.",
    r:"Here's a start you can make your own:\n\n\"Happy birthday, sweetheart! I hope your day is full of cake, laughing, and horses — maybe not in that order. You make this grandpa's heart gallop. I love you more than all the hay in Kentucky. — Grandpa\"\n\nWant it funnier, or more tender? Just tell me."},
 c:{q:"I have chicken, rice, and not much energy tonight. What's an easy dinner?",
    r:"One-pan chicken and rice: put rice and broth in a pan, lay the chicken on top, sprinkle whatever seasoning you like, cover, and let it simmer about 25 minutes while you sit down. One pan, one spoon to wash. Would you like a version for two people, or with what's in your freezer?"}
};
function practice1(){
  currentSay = "Your turn — and this one is safe practice, right here in the lesson. Tap any question below, and watch how the A I answers a plain, human question. Tap all three if you like. Notice: real questions, real life, no computer talk.";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>Practice: tap a question. 👇</h2>
    <p class="soft">This is a <b>practice robot</b> living inside the lesson — safe as a rocking chair. Tap one (or all three):</p>
    <div class="askRow">
      <button class="askBtn" id="qa" onclick="ask('a')">🩺 “${CANNED.a.q}”</button>
      <button class="askBtn" id="qb" onclick="ask('b')">🎂 “${CANNED.b.q}”</button>
      <button class="askBtn" id="qc" onclick="ask('c')">🍗 “${CANNED.c.q}”</button>
    </div>
    <div id="chatOut"></div>
    <div id="p1nav" class="hide">${nav(true,'That was easy ›')}</div>
    <div id="p1wait"><br><p class="soft" style="text-align:center">tap a question above to see what happens…</p></div>
  </div>`;
  say(currentSay);
}
let asked=0;
function ask(k){
  const c=CANNED[k];
  document.getElementById('q'+k).disabled=true;
  const out=document.getElementById('chatOut');
  out.innerHTML = `<div class="chat">
    <div class="bubble you">${c.q}</div>
    <div class="bubble ai"><div class="who">PRACTICE AI</div>${c.r.replace(/\n/g,'<br>')}</div>
  </div>`;
  setTimeout(function(){ try{ out.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){} }, 200);
  document.getElementById('p1wait').classList.add('hide');
  document.getElementById('p1nav').classList.remove('hide');
  say(c.r);
  asked++;
}

/* ---- 5. practice 2: your own ---- */
function practice2(){
  currentSay = "Now the real thing. Think of something YOU actually want to know or write — a recipe, a letter, a word your doctor used, help planning a trip. Say it or type it below, like you'd ask a neighbor. Then press the copy button, and I'll show you exactly where to take it.";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>Now ask something REAL. ✍️</h2>
    <p>Think of something <b>you</b> actually want — a recipe, a letter, a word your doctor used, trip ideas. Ask it like a neighbor:</p>
    <button onclick="micAsk()" title="Say your question instead of typing it" style="font-size:20px;border:1px solid var(--line,#ccc);background:none;border-radius:10px;padding:8px 12px;cursor:pointer;margin-right:6px">🎤</button><input type="text" id="myAsk" placeholder="Type your question here… (example: help me write a note to my sister)" value="${(db.myAsk||'').replace(/"/g,'&quot;')}" onchange="db.myAsk=this.value;save();document.getElementById('aiBtns').style.display=this.value.trim()?'block':'none'">
    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn blue" onclick="copyAsk()">📋 Copy my question</button>
    </div>
    <div id="aiBtns" style="display:none;margin-top:12px;text-align:center">
      <p class="soft" style="margin-bottom:8px"><b>Or skip the copying — one tap does it all:</b></p>
      <button class="btn blue" onclick="openAI('claude')">🤖 Ask this in Claude →</button>
      <button class="btn blue" onclick="openAI('chatgpt')">💬 Ask this in ChatGPT →</button>
      <p class="soft" style="font-size:12.5px;margin-top:6px">Your question rides along — it'll be waiting in the box when the page opens.</p>
    </div>
    <div class="tip" id="copyTip" style="display:none">
      <b>Copied! Now the field trip 🚌</b><br>
      Open <b>claude.ai</b> or <b>chatgpt.com</b> in your browser, tap the message box,
      hold your finger down (or right-click) and choose <b>Paste</b>. Then send it — and enjoy your first real answer.
      Come back here after — I'll wait right here.
    </div>
    ${nav(true,'I did it (or I will!) ›')}
  </div>`;
  say(currentSay);
}
function openAI(which){
  const v=(document.getElementById('myAsk').value||'').trim();
  if(!v){ alert('Type your question first — anything at all.'); return; }
  const q=encodeURIComponent(v);
  const url = which==='claude' ? 'https://claude.ai/new?q='+q : 'https://chatgpt.com/?q='+q;
  say('Opening it now. Your question is already typed in. Just press send.');
  window.open(url,'_blank');
}
function micAsk(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Talking needs Chrome or Edge. Typing works everywhere.'); return; }
  const r=new SR(); r.lang='en-US'; r.interimResults=false;
  say(''); if(window.speechSynthesis) speechSynthesis.cancel();
  r.onresult=function(e){ const t=e.results[0][0].transcript;
    const el=document.getElementById('myAsk'); el.value=t; db.myAsk=t; save();
    document.getElementById('aiBtns').style.display='block'; };
  r.onerror=function(){};
  r.start();
}
function copyAsk(){
  const v=document.getElementById('myAsk').value.trim();
  if(!v){ alert('Type your question first — anything at all.'); return; }
  db.myAsk=v; save();
  navigator.clipboard.writeText(v).then(()=>{
    document.getElementById('copyTip').style.display='block';
    document.getElementById('aiBtns').style.display='block';
    say("Copied! Now open claude dot A I or chat G P T dot com, tap the message box, choose paste, and send it. Your first real answer is waiting.");
  });
}

/* ---- 6. scam tip ---- */
function scamTip(){
  currentSay = "One more thing before your diploma — the grandparent safety rule. A I can write anything, including lies. So: a real A I helper answers when YOU ask. It never calls you. It never emails you first. It never asks for money or bank numbers. If a voice on the phone sounds exactly like your grandchild asking for money — hang up and call the family directly. That one habit beats every scam they've invented.";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>The safety rule. 🛡</h2>
    <p class="big">AI can write anything — <b>including lies.</b> So remember:</p>
    <div class="tip">
      <b>A real AI helper answers when YOU ask.</b><br>
      It never calls you. It never emails you first. It <b>never</b> asks for money or bank numbers.
    </div>
    <div class="tip">
      📞 If a voice sounds <i>exactly</i> like your grandchild asking for money —
      <b>hang up and call the family directly.</b> That one habit beats every scam they've invented.
    </div>
    ${nav(true,'Got it ›')}
  </div>`;
  say(currentSay);
}

/* ---- 7. quiz ---- */
function quiz(){
  currentSay = "Quick check — one question. The phone rings. A voice like your grandson says he's in trouble and needs gift cards fast. What do you do?";
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>One-question quiz. 📞</h2>
    <p class="big">The phone rings. A voice <i>just like your grandson</i> says he's in trouble and needs <b>gift cards, fast.</b> What do you do?</p>
    <button class="quizBtn" onclick="quizPick(this,false)">A. Buy the gift cards — it sounded just like him</button>
    <button class="quizBtn" onclick="quizPick(this,false)">B. Give him your card number so it's faster</button>
    <button class="quizBtn" onclick="quizPick(this,true)">C. Hang up — and call him or his mom directly</button>
    <div id="quizNav" class="hide" style="margin-top:14px;">${nav(true,'Finish the lesson ›')}</div>
  </div>`;
  say(currentSay);
}
function quizPick(btn, right){
  document.querySelectorAll('.quizBtn').forEach(b=>b.disabled=true);
  if(right){
    btn.classList.add('right');
    say("Exactly right. Hang up, call the family directly. You just beat the newest scam in America. Now come get your diploma.");
    db.quizRight=true; save();
  }else{
    btn.classList.add('wrong');
    document.querySelectorAll('.quizBtn')[2].classList.add('right');
    say("Careful! That's exactly how the scam works. The safe move: hang up, and call him or his mom directly. Now you know — and knowing is the whole game.");
  }
  document.getElementById('quizNav').classList.remove('hide');
}

/* ---- 8. finish ---- */
function finish(){
  const nm = db.name || 'Friend';
  const today = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  currentSay = "Congratulations, "+nm+". You just talked to an A I, asked a real question, and learned the safety rule most people never get taught. That's lesson one. Print your certificate — and yes, send a picture of it to the grandkids. Lesson two, Spot the Fake, is coming soon.";
  db.done1=true; save();
  stage().innerHTML = `<div class="card">
    ${listenBtn()}
    <h2>You did it, ${nm}. 🎓</h2>
    <p class="big">Today you: talked to an AI ✓ · asked like a person ✓ · learned the safety rule ✓</p>
    <div class="cert">
      <div class="t">🌉 Daraja Academy · Certificate of Bravery</div>
      <h3>This certifies that</h3>
      <div class="n">${nm}</div>
      <p style="margin-top:8px;">talked to an AI for the very first time —<br>and asked it something that mattered.</p>
      <div class="d">Lesson 1: "Just Ask It" · completed ${today}<br><i>"I speak AI."</i></div>
    </div>
    <button class="btn gold wide" onclick="window.print()" style="background:var(--gold);color:#221;">🖨 Print my certificate</button>
    <p class="soft" style="text-align:center;margin-top:14px;">📸 Send a picture of it to the grandkids. Go on.</p>
    <div class="tip" style="margin-top:18px;">
      <b>Coming in Lesson 2: "Spot the Fake."</b> Deepfakes, too-good deals, and the three-second test
      that catches almost all of them.<br><br>
      <b>And when you're ready:</b> use what you learned tonight to start
      <a href="https://jerrywins1.github.io/daraja-apps/story-keeper/" style="color:var(--warm);font-weight:700;">your life story book →</a>
    </div>
    <div style="margin-top:16px;padding:14px;border-radius:12px;background:rgba(201,152,42,.12);text-align:center">
      <b>Where to next?</b><br>

<script>
/* ===== Helpful hovers v2 (2026-08-29) — hover bubbles on desktop, and on
   phones a 💡 button that labels every control for a few seconds. ===== */
(function(){
try{
  var tip=null;
  function ensure(){
    if(tip) return tip;
    tip=document.createElement('div');
    tip.style.cssText='position:fixed;z-index:200;max-width:240px;background:#2b2620;color:#faf6ee;font:600 13px/1.45 -apple-system,Segoe UI,sans-serif;padding:8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;display:none;';
    document.body.appendChild(tip);
    return tip;
  }
  function textFor(el){
    return el.getAttribute('data-help') || el.getAttribute('title') || el.getAttribute('aria-label') || '';
  }
  document.addEventListener('mouseover', function(e){
    try{
      var el=e.target.closest ? e.target.closest('[title],[data-help],[aria-label]') : null;
      if(!el) return;
      var txt=textFor(el); if(!txt) return;
      if(el.getAttribute('title')){ el.setAttribute('data-help', el.getAttribute('title')); el.removeAttribute('title'); }
      var t=ensure(); t.textContent=txt; t.style.display='block';
      var r=el.getBoundingClientRect();
      t.style.left=Math.min(window.innerWidth-250, Math.max(8, r.left))+'px';
      t.style.top=Math.max(6, r.top>60 ? r.top-52 : r.bottom+10)+'px';
    }catch(err){}
  }, true);
  document.addEventListener('mouseout', function(){ if(tip) tip.style.display='none'; }, true);
  document.addEventListener('click', function(){ if(tip) tip.style.display='none'; }, true);

  /* phone: 💡 shows every label at once for 7 seconds */
  var touchy = window.matchMedia && window.matchMedia('(hover: none)').matches;
  if(touchy){
    setTimeout(function(){
      if(document.getElementById('dTipDot')) return;
      var d=document.createElement('button'); d.id='dTipDot'; d.textContent='💡';
      d.setAttribute('aria-label','Show what every button does');
      d.style.cssText='position:fixed;right:10px;bottom:150px;z-index:150;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(128,120,100,.45);background:rgba(250,246,238,.92);font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);';
      d.onclick=function(){ labelAll(); };
      document.body.appendChild(d);
    }, 1800);
  }
  var labels=[];
  function clearLabels(){ labels.forEach(function(l){ try{l.remove();}catch(e){} }); labels=[]; }
  function labelAll(){
    clearLabels();
    var els=document.querySelectorAll('[title],[data-help],[aria-label]');
    var n=0;
    els.forEach(function(el){
      if(n>=12) return;
      if(el.id==='dTipDot') return;
      var r=el.getBoundingClientRect();
      if(r.width===0 || r.bottom<0 || r.top>window.innerHeight) return;
      var txt=textFor(el); if(!txt) return;
      var b=document.createElement('div');
      b.textContent=txt.length>60 ? txt.slice(0,57)+'…' : txt;
      b.style.cssText='position:fixed;z-index:190;max-width:200px;background:#2b2620;color:#faf6ee;font:600 12px/1.4 -apple-system,Segoe UI,sans-serif;padding:6px 10px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none;';
      b.style.left=Math.min(window.innerWidth-210, Math.max(6, r.left))+'px';
      b.style.top=Math.max(4,(r.top>50 ? r.top-40 : r.bottom+6))+'px';
      document.body.appendChild(b); labels.push(b); n++;
    });
    if(n) setTimeout(clearLabels, 7000);
  }
}catch(e){}
})();
</script>
