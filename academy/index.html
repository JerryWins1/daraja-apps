<meta charset="utf-8"><!-- 22 Nov 2026: FIRST, before anything else in the head. A browser only
     looks at the first 1024 bytes for this, and the house block is ~300 KB, so every app in the
     house was declaring its encoding long past the point anything reads it. GitHub Pages sends
     charset=utf-8 in the header and covers it there, but any other copy - a local server, a file
     opened from disk, a downloaded page - is left to the browser's guess, and a wrong guess turns
     every dash and apostrophe into mojibake. Caught by the beta check, which serves the same bytes
     twice and read them two different ways. The app's own charset line further down is left where
     it is: the first one wins, and theirs is theirs. -->

<style>
  :root{
    --paper:#faf6ee; --card:#ffffff; --ink:#2b2620; --soft:#6f6557;
    --line:#e5dccb; --warm:#b3502f; --gold:#c9982a; --green:#4a7c59;
    --blue:#3d6f96; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; font-size:20px; line-height:1.55; }

  .wrap{max-width:640px; margin:0 auto; padding:18px 18px 60px;}
  #top{text-align:center; padding:22px 16px 4px;}
  #top .school{font-size:14px; font-weight:800; letter-spacing:.18em; color:var(--gold); text-transform:uppercase;}
  #top h1{font-family:var(--serif); font-size:34px; margin-top:4px; line-height:1.15;}
  #top h1 span{color:var(--warm);}
  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px 26px; margin:16px 0; box-shadow:0 3px 14px rgba(80,60,30,.06); }
  @media (max-width:480px){ .card{ padding:22px 40px 22px 20px; } }   /* 7 Oct deep check: a lane for the ? button */
  h2{font-family:var(--serif); font-size:29px; margin-bottom:12px; line-height:1.25;}
  p{margin-bottom:14px;} p.big{font-size:22px;} .soft{color:var(--soft);} b{color:var(--warm);}
  .btn{ display:inline-block; border:none; cursor:pointer; font-size:21px; font-weight:700; padding:17px 32px; border-radius:999px; background:var(--warm); color:#fff; font-family:inherit; transition:transform .08s; text-decoration:none; }
  .btn:active{transform:scale(.97);} .btn.big{font-size:23px; padding:20px 38px;} .btn.wide{display:block; width:100%; text-align:center;}
  .btn.ghost{background:#fff; color:var(--soft); border:2px solid var(--line);} .btn.green{background:var(--green);} .btn.blue{background:var(--blue);}
  #dots{display:flex; gap:9px; justify-content:center; padding:14px 0 4px; flex-wrap:wrap;}
  #dots i{width:13px; height:13px; border-radius:50%; background:#ddd3c0;} #dots i.on{background:var(--warm);} #dots i.done{background:var(--green);}
  .listen{ display:inline-flex; align-items:center; gap:8px; background:#f2ead9; border:1.5px solid var(--line); border-radius:999px; padding:9px 18px; font-size:16.5px; font-weight:700; color:var(--soft); cursor:pointer; margin-bottom:14px; font-family:inherit; }
  .listen.on{background:var(--gold); color:#221; border-color:var(--gold);}
  .chat{background:#f7f2e7; border:1.5px solid var(--line); border-radius:16px; padding:16px; margin:14px 0;}
  .bubble{border-radius:16px; padding:14px 18px; margin:10px 0; font-size:19px; max-width:94%;}
  .bubble.you{background:var(--warm); color:#fff; margin-left:auto;} .bubble.ai{background:#fff; border:1.5px solid var(--line);}
  .bubble.ai .who{font-size:13px; font-weight:800; color:var(--gold); letter-spacing:.08em; margin-bottom:6px;}
  .askRow{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .askBtn{ background:#fff; border:2px solid var(--line); border-radius:14px; padding:15px 18px; font-size:19px; text-align:left; cursor:pointer; font-family:inherit; line-height:1.4; }
  .askBtn:hover{border-color:var(--warm);} .askBtn:disabled{opacity:.45; cursor:default;}
  input[type=text]{ width:100%; font:inherit; font-size:20px; padding:15px 16px; border-radius:14px; border:2px solid var(--line); background:#fff; outline:none; }
  input[type=text]:focus{border-color:var(--warm);}
  .tip{background:#fdf6e3; border:1.5px solid var(--gold); border-radius:16px; padding:18px 20px; margin:14px 0; font-size:18.5px;} .tip b{color:var(--gold);}
  .quizBtn{ display:block; width:100%; background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px 18px; font-size:19px; text-align:left; cursor:pointer; font-family:inherit; margin:8px 0; }
  .quizBtn.right{border-color:var(--green); background:#eef6ef;} .quizBtn.wrong{border-color:#c0392b; background:#fbeeec;}
  .cert{ border:3px double var(--gold); border-radius:14px; background:#fffdf6; padding:26px; text-align:center; font-family:var(--serif); margin:14px 0; }
  .cert .t{font-size:13px; letter-spacing:.2em; color:var(--gold); font-weight:700; text-transform:uppercase;} .cert h3{font-size:26px; margin:10px 0 4px;}
  .cert .n{font-size:22px; color:var(--warm); font-style:italic;} .cert .d{font-size:14px; color:var(--soft); margin-top:10px;}
  .navRow{display:flex; gap:10px; justify-content:space-between; margin-top:10px; flex-wrap:wrap;}
  #ver{text-align:center; color:#c9c0ae; font-size:12px; padding:24px 0 40px;}
  /* course home */
  .host{ background:#2f4a3d; color:#fff; border-radius:18px; padding:16px 18px; margin:14px 0; box-shadow:0 8px 24px rgba(0,0,0,.16); }
  .host b{ color:#fff; display:block; font-size:18px; margin-bottom:4px; } .host p{ margin:0 0 10px; font-size:17px; opacity:.95; }
  .host .btn{ background:#fff; color:#2b2620; font-size:18px; padding:12px 22px; }
  .lessons{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lcard{ background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:16px 12px 14px; text-align:center; cursor:pointer; font-family:inherit; box-shadow:0 6px 18px rgba(80,60,30,.08); position:relative; min-height:160px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; }
  .lcard .num{ font-size:44px; font-weight:900; line-height:1; color:var(--blue); font-variant-numeric:tabular-nums; } .lcard.done .num{ color:var(--green); }
  .lcard .em{ font-size:30px; } .lcard .nm{ font-weight:800; font-size:16.5px; line-height:1.2; color:var(--ink); } .lcard .mins{ font-size:13px; color:var(--soft); font-weight:700; }
  .lcard .tick{ position:absolute; top:8px; right:10px; font-size:20px; } .lcard.next{ outline:3px solid var(--gold); }
  .lcard.grad{ grid-column:1 / -1; background:#fffdf6; border-color:var(--gold); min-height:0; flex-direction:row; gap:12px; justify-content:center; }
  .progress{ height:12px; background:#e9e1cf; border-radius:999px; overflow:hidden; margin:6px 0 14px; } .progress i{ display:block; height:100%; background:var(--green); border-radius:999px; }
  .home{ font:inherit; font-size:15px; font-weight:800; background:none; border:1.5px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer; color:var(--soft); margin-bottom:8px; }
  .pick{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; } .pick button{ font:inherit; font-size:17px; font-weight:700; border:2px solid var(--line); background:#fff; border-radius:999px; padding:10px 16px; cursor:pointer; min-height:44px; } .pick button.on{ background:var(--warm); color:#fff; border-color:var(--warm); }
  .note{ white-space:pre-wrap; background:#fffdf6; border:1.5px dashed var(--gold); border-radius:14px; padding:16px; font-family:var(--serif); font-size:19px; }
  @media print{ body *{visibility:hidden;} .cert, .cert *{visibility:visible;} .cert{position:absolute; top:20px; left:0; right:0;} }
</style>

<div id="dsSplash" style="position:fixed;inset:0;z-index:9999;background:#f6f1e7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .45s;color:#2b2620;font-family:-apple-system,sans-serif"><div style="font-size:62px">🎓</div><div style="font-size:28px;font-weight:800">Daraja Academy</div><div style="font-size:13px;color:#8a8272;font-weight:700">six lessons · AI for Grandparents</div><div style="font-size:11px;color:#b8ab94;font-weight:700">daraja studio</div></div><script>setTimeout(function(){var s=document.getElementById("dsSplash");if(s){s.style.opacity="0";setTimeout(function(){s.remove();},500);}},1300);</script>

<div id="top">
  <div class="school">🌉 Daraja Academy</div>
  <h1>AI for <span>Grandparents</span></h1>
</div>
<div id="dots"></div>
<div class="wrap" id="stage"></div>
<div id="ver">Daraja Academy · v2.10 · 2026-11-25 · donations help orphans and students in Kenya</div>

<script>
/* ============ narration ============ */
let voiceOn=true, currentSay='';
let _armed=false;
document.addEventListener('pointerdown', function(e){
  if(_armed) return;
  var tg=e.target && e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT') { _armed=true; return; }
  _armed=true;
  if(voiceOn && currentSay && window.speechSynthesis && !speechSynthesis.speaking){ setTimeout(function(){ say(currentSay); }, 150); }
}, {capture:true});
let _sayGen=0;
function say(text){
  if(!voiceOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const gen=++_sayGen;
  const parts=String(text).split(/(?<=[.!?:])\s+/).filter(Boolean);
  let i=0;
  (function next(){
    if(gen!==_sayGen || i>=parts.length) return;
    const u=new SpeechSynthesisUtterance(parts[i++]);
    u.rate=.92;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/Samantha|Google US English|en-US/i.test(v.name+v.lang));
    if(v) u.voice=v;
    u.onstart=function(){ paintListen(voiceOn); };
    u.onend=function(){ if(i>=parts.length) setTimeout(function(){ if(!speaking()) paintListen(false); },500); setTimeout(next, 420); };
    u.onerror=function(){ setTimeout(next, 200); };
    speechSynthesis.speak(u);
  })();
}
const speaking=()=>!!(window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending));
function listenLabel(on){ return on ? '🔊 Reading to you — tap to stop' : '🔊 Read this page to me'; }
function paintListen(on){ document.querySelectorAll('.listen').forEach(b=>{ b.classList.toggle('on',on); b.innerHTML = listenLabel(on); }); }
function toggleVoice(){
  _armed=true;
  if(voiceOn && !speaking()){ say(currentSay); paintListen(true); return; }   /* nothing playing yet (iPhone waits for a tap) — so this tap starts it */
  voiceOn=!voiceOn;
  paintListen(voiceOn);
  if(voiceOn) say(currentSay); else if(window.speechSynthesis) speechSynthesis.cancel();
}
function listenBtn(){ return `<button class="listen" onclick="toggleVoice()">${listenLabel(voiceOn && speaking())}</button>`; }

/* ============ course data ============ */
const LS='daraja_academy_v1';
let db; try{ db=JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ db={}; }
db.done = db.done || {}; if(db.done1) db.done[1]=true; try{ if(!db.name&&localStorage.getItem('dj_name')) db.name=localStorage.getItem('dj_name'); }catch(e){}   /* the old lesson-1 flag */
function save(){ localStorage.setItem(LS, JSON.stringify(db)); }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=()=>db.name||'Friend';
/* 7 Oct deep check: headings said "Lesson 1 done, Friend" when no name was given — use the real name or none */
const realName=()=>{ if(db.name) return db.name; try{ return localStorage.getItem('dj_name')||''; }catch(e){ return ''; } };
const nmc=()=>realName()?', '+realName():'';
const stage = ()=>document.getElementById('stage');
let lesson=0, step=0;      /* lesson 0 = the course home */

const COURSE=[
  {n:1, em:'🕊', name:'Just ask it', mins:10, screens:null},
  {n:2, em:'🛡', name:'Spot the fake', mins:8, screens:null},
  {n:3, em:'💬', name:'Ask it better', mins:8, screens:null},
  {n:4, em:'🔍', name:'Trust, but check', mins:7, screens:null},
  {n:5, em:'✍️', name:'Let it write with you', mins:9, screens:null},
  {n:6, em:'📱', name:'AI in your pocket', mins:8, screens:null}
];
const doneCount=()=>COURSE.filter(l=>db.done[l.n]).length;
const nextLesson=()=>COURSE.find(l=>!db.done[l.n]);

/* ============ shared pieces ============ */
function nav(backOk, nextLabel){
  return `<div class="navRow">
    ${backOk?'<button class="btn ghost" onclick="go('+(step-1)+')">‹ Back</button>':'<button class="btn ghost" onclick="home()">‹ Lessons</button>'}
    <button class="btn green" onclick="go(${step+1})">${nextLabel||'Next ›'}</button>
  </div>`;
}
function dots(){ const L=COURSE[lesson-1]; document.getElementById('dots').innerHTML = lesson? L.screens.map((s,i)=>`<i class="${i<step?'done':i===step?'on':''}"></i>`).join('') : ''; }
function go(n){
  if(window.speechSynthesis) speechSynthesis.cancel();
  const L=COURSE[lesson-1]; if(!L) return home();
  if(n>=L.screens.length) return home();
  step=n; db.at={l:lesson,s:step}; save(); dots();
  L.screens[step]();
  window.scrollTo(0,0);
}
function openLesson(n){ lesson=n; go(0); }
function finishLesson(){ db.done[lesson]=true; db.doneOn=db.doneOn||{}; db.doneOn[lesson]=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); save(); }
/* a one-question quiz, same shape in every lesson.
   v2.8 · 20 Nov: ‹ Back is there before you answer too, and on the fake-or-real and check-it games.
   Jerry: "If you go one screen too far or something, you can't go back to the previous one." */
const QZ=[];   /* quiz replies live here, so the button only carries a number */
function quizPick(btn, right, rightIdx, id){
  const z=QZ[id]||{};
  document.querySelectorAll('.quizBtn').forEach(b=>b.disabled=true);
  if(right){ btn.classList.add('right'); say(z.rightSay); }
  else { btn.classList.add('wrong'); document.querySelectorAll('.quizBtn')[rightIdx].classList.add('right'); say(z.wrongSay); }
  document.getElementById('quizNav').classList.remove('hide');
  var qb=document.getElementById('quizBack'); if(qb) qb.classList.add('hide');
}
function quizScreen(title, q, opts, rightIdx, rightSay, wrongSay, nextLabel){
  const id=QZ.push({rightSay:rightSay, wrongSay:wrongSay})-1;
  return function(){
    currentSay = q;
    stage().innerHTML = `<div class="card">${listenBtn()}<h2>${title}</h2><p class="big">${q}</p>
      ${opts.map((o,i)=>`<button class="quizBtn" onclick="quizPick(this,${i===rightIdx},${rightIdx},${id})">${'ABCD'[i]}. ${o}</button>`).join('')}
      <div id="quizBack" class="navRow" style="margin-top:14px;"><button class="btn ghost" onclick="go(step-1)">‹ Back</button></div>
      <div id="quizNav" class="hide" style="margin-top:14px;">${nav(true,nextLabel||'Finish the lesson ›')}</div></div>`;
    say(currentSay);
  };
}
/* the last screen of every lesson */
function doneScreen(n, learned, teaser){
  return function(){
    finishLesson();
    const all=doneCount()===COURSE.length;
    currentSay = `Well done${nmc()}. That's lesson ${n} finished. `+(all?'And that was the last one. Your diploma is waiting on the lessons page.':'Come back tomorrow for the next one — ten minutes a day is plenty.');
    stage().innerHTML = `<div class="card">${listenBtn()}<h2>Lesson ${n} done${esc(nmc())}. ✅</h2>
      <p class="big">Today you learned: ${learned}</p>
      ${teaser?`<div class="tip">${teaser}</div>`:''}
      ${all?`<div class="tip"><b>🎓 That was the last lesson.</b> Your diploma is ready on the lessons page.</div>`:''}
      <div class="navRow"><button class="btn ghost" onclick="go(0)">↻ Take it again</button><button class="btn green" onclick="home()">${all?'Get my diploma ›':'Back to the lessons ›'}</button></div></div>`;
    say(currentSay);
  };
}

/* ============ the course home ============ */
function home(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  lesson=0; step=0; db.at=null; save(); dots();
  const h=new Date().getHours(); const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const d=doneCount(), nx=nextLesson(); const resume=db.at&&db.at.l;
  let hb,hp,ha;
  if(!db.name){ hb=g+'. I’m your teacher for this.'; hp='Six short lessons, ten minutes each, nothing you can break. What should I call you?'; ha=`<input type="text" id="nm" placeholder="Your first name" style="max-width:240px;margin-bottom:10px" autocomplete="given-name"><p id="nmHint" class="soft hide" style="font-size:15px;margin:0 0 8px">Just your first name is fine.</p><button class="btn" onclick="var v=document.getElementById('nm').value.trim();if(!v){document.getElementById('nmHint').classList.remove('hide');document.getElementById('nm').focus();return;}db.name=v;try{localStorage.setItem('dj_name',db.name)}catch(e){};save();home()">That’s me ›</button>`; }
  else if(d===0){ hb=g+', '+esc(db.name)+'.'; hp='Lesson one takes ten minutes and you’ll talk to an AI for the first time. Ready?'; ha=`<button class="btn" onclick="openLesson(1)">Start lesson 1 ›</button>`; }
  else if(nx){ hb=g+', '+esc(db.name)+'. '+d+' of 6 done.'; hp=`Next up is “${nx.name}” — about ${nx.mins} minutes. Shall we?`; ha=`<button class="btn" onclick="openLesson(${nx.n})">Lesson ${nx.n} ›</button>`; }
  else { hb='You finished the whole course, '+esc(db.name)+'.'; hp='Print the diploma, then show a friend how it’s done. That’s how this spreads.'; ha=`<button class="btn" onclick="graduate()">🎓 My diploma ›</button>`; }
  stage().innerHTML = `<div class="host"><b>${hb}</b><p>${hp}</p>${ha}</div>
    <div class="soft" style="font-size:15px;font-weight:700">${d} of 6 lessons done</div><div class="progress"><i style="width:${Math.round(d/6*100)}%"></i></div>
    <div class="lessons">${COURSE.map(l=>`<button class="lcard ${db.done[l.n]?'done':''} ${nx&&nx.n===l.n?'next':''}" onclick="openLesson(${l.n})">${db.done[l.n]?'<span class="tick">✅</span>':''}<div class="num">${l.n}</div><div class="em">${l.em}</div><div class="nm">${l.name}</div><div class="mins">${db.done[l.n]?'done · tap to redo':l.mins+' min'}</div></button>`).join('')}
      <button class="lcard grad" onclick="graduate()"><span class="em">🎓</span><span class="nm">${d===6?'Your diploma':'Diploma — after all six'}</span></button></div>
    <p class="soft" style="font-size:14px;margin-top:16px;text-align:center">Lesson 1 is free. The course is $19 — all six are open while we’re testing. Donations go to Loving InDeed, which helps orphans and students in Kenya.</p>`;
  currentSay = hb+' '+hp.replace(/<[^>]+>/g,'');
  if(_armed) say(currentSay);
}
function graduate(){
  lesson=0; dots(); const d=doneCount(); const done=db.doneOn||{}; const today=done[6]||Object.values(done).pop()||new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if(d<6){ currentSay=`${6-d} lessons to go, ${nm()}. The diploma is waiting.`; stage().innerHTML=`<div class="card">${listenBtn()}<h2>Almost. 🎓</h2><p class="big">${6-d} ${6-d===1?'lesson':'lessons'} to go, then this page becomes your diploma.</p><button class="btn ghost" onclick="home()">‹ Lessons</button></div>`; say(currentSay); return; }
  currentSay=`Congratulations${nmc()}. You finished AI for Grandparents. Six lessons. You can ask, check, write, and stay safe. Print this, and send a picture to the grandkids.`;
  stage().innerHTML=`<div class="card">${listenBtn()}<h2>You did it${esc(nmc())}. 🎓</h2>

<script>
(function(){
  var CFG = window.DJ_START; if(!CFG) return;
  var SEEN = 'dj_start_' + CFG.slug;

  function framed(){ try{ return window.self !== window.top; }catch(e){ return true; } }
  function seen(){ try{ return !!localStorage.getItem(SEEN); }catch(e){ return true; } }
  function mark(){ try{ localStorage.setItem(SEEN,'1'); }catch(e){} }

  /* "empty" means the owner genuinely has nothing yet — a returning user is never nagged */
  function empty(){
    try{
      if(!CFG.dataKeys) return true;
      for(var i=0;i<CFG.dataKeys.length;i++){
        var raw = localStorage.getItem(CFG.dataKeys[i]);
        if(!raw) continue;
        var d = JSON.parse(raw);
        if(!d) continue;
        if(Array.isArray(d) && d.length) return false;
        for(var k in d){ if(Array.isArray(d[k]) && d[k].length) return false; }
      }
    }catch(e){}
    return true;
  }

  function close(){
    var el=document.getElementById('djStart'); if(el) el.remove();
    var h=document.getElementById('djHelp'); if(h) h.style.display='block';
    mark();
  }
  window.djStartClose = close;

  function firstStep(){
    close();
    setTimeout(function(){
      if(CFG.firstAction){ try{ CFG.firstAction(); return; }catch(e){} }
      if(CFG.firstSelector){
        var t=document.querySelector(CFG.firstSelector);
        if(t){ t.scrollIntoView({block:'center',behavior:'smooth'});
          t.style.transition='box-shadow .3s';
          t.style.boxShadow='0 0 0 4px rgba(242,177,52,.85)';
          setTimeout(function(){ t.style.boxShadow=''; }, 2600);
          if(CFG.firstClick) try{ t.click(); }catch(e){}
        }
      }
    }, 260);
  }
  window.djStartGo = firstStep;

  function show(){
    if(document.getElementById('djStart')) return;
    var d=document.createElement('div'); d.id='djStart';
    d.innerHTML = '<div class="card">'
      + '<div class="em">'+(CFG.em||'✨')+'</div>'
      + '<h2>'+CFG.title+'</h2>'
      + '<div class="lede">'+CFG.lede+'</div>'
      + '<ol>'+CFG.steps.map(function(s){ return '<li><span>'+s+'</span></li>'; }).join('')+'</ol>'
      + '<button class="go" onclick="djStartGo()">'+(CFG.cta||'Start with step 1')+'</button>'
      + '<button class="look" onclick="djStartClose()">I’ll look around myself</button>'
      + '</div>';
    document.body.appendChild(d);
  }
  window.djStartShow = show;

  function help(){
    var b=document.createElement('button'); b.id='djHelp'; b.textContent='?';
    b.title='What am I doing here?';
    b.onclick=function(){ var el=document.getElementById('djStart'); if(el){ el.remove(); return; } show(); };
    document.body.appendChild(b);
    if(seen() || !empty() || framed()) b.style.display='block';
  }

  function boot(){
    help();
    /* inside the store's video player the tour does the explaining — don't photo-bomb it */
    if(framed()) return;
    if(seen()) return;
    if(!empty()){ mark(); return; }
    setTimeout(show, 500);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script id="daraja-readable-v4-js">
/* ═══ Readability corrector v4 ═══
   v3 had a bug of my own making: it decided which way to move a colour purely from the
   background's lightness, so white text on a mid-blue button was pushed *whiter* — no help
   at all. It now tries both directions and takes whichever actually reaches the target with
   the smaller change. Also labels boxes that have nothing to announce, using the words
   already sitting next to them. */
(function(){
  if(window.__djReadable4) return; window.__djReadable4 = true;

  var rgb = function(c){ return (String(c).match(/[\d.]+/g)||[0,0,0]).slice(0,3).map(Number); };
  var lum = function(c){
    var p = rgb(c).map(function(x){ x/=255; return x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4); });
    return 0.2126*p[0] + 0.7152*p[1] + 0.0722*p[2];
  };
  var ratio = function(a,b){ var l1=lum(a), l2=lum(b); return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); };

  function behind(el){
    var n = el;
    while(n && n !== document.documentElement){
      var cs = getComputedStyle(n), c = cs.backgroundColor;
      if(c && !/rgba?\(0,\s*0,\s*0,\s*0\)|transparent/.test(c)){
        var parts = (String(c).match(/[\d.]+/g)||[]);
        if(parts[3] === undefined || parseFloat(parts[3]) > 0.55)
          return 'rgb('+parts[0]+','+parts[1]+','+parts[2]+')';
      }
      if(cs.backgroundImage && cs.backgroundImage !== 'none') return null;
      n = n.parentElement;
    }
    return getComputedStyle(document.body).backgroundColor || 'rgb(255,255,255)';
  }

  /* try darker AND lighter; keep whichever reaches the target with the least change */
  function lift(color, bg, need){
    var c = rgb(color);
    var best = null, bestStep = 99;
    [true, false].forEach(function(lighter){
      for(var step = 1; step <= 24; step++){
        var f = step/24;
        var nc = c.map(function(v){ return lighter ? v + (255-v)*f : v*(1-f); });
        var s = 'rgb('+nc.map(Math.round).join(',')+')';
        if(ratio(s, bg) >= need){
          if(step < bestStep){ bestStep = step; best = s; }
          break;
        }
      }
    });
    return best || (lum(bg) > 0.5 ? 'rgb(0,0,0)' : 'rgb(255,255,255)');
  }

  function fixContrast(){
    var fixed = 0;
    var nodes = document.querySelectorAll('p,span,li,td,label,small,h1,h2,h3,h4,div,a,button,strong,b,em,i');
    for(var i = 0; i < nodes.length && i < 900; i++){
      var el = nodes[i];
      if(el.children.length) continue;
      if((el.textContent||'').trim().length < 2) continue;
      var cs = getComputedStyle(el);
      if(cs.display==='none' || cs.visibility==='hidden') continue;
      var r = el.getBoundingClientRect(); if(!r.width || !r.height) continue;
      var bg = behind(el); if(!bg) continue;
      var size = parseFloat(cs.fontSize), bold = parseInt(cs.fontWeight,10) >= 700;
      var need = (size >= 24 || (size >= 18.66 && bold)) ? 3 : 4.5;
      if(ratio(cs.color, bg) >= need) continue;
      el.style.setProperty('color', lift(cs.color, bg, need), 'important');
      var op = parseFloat(cs.opacity);
      if(op < 1 && op > 0) el.style.opacity = '1';
      fixed++;
    }
    return fixed;
  }

  /* a box with no label, given the words already beside it */
  function fixLabels(){
    var n = 0;
    document.querySelectorAll('input:not([type=hidden]):not([type=submit]):not([type=button]),textarea,select').forEach(function(el){
      if(el.getAttribute('aria-label') || el.getAttribute('placeholder') || el.getAttribute('title')) return;
      if(el.id && document.querySelector('label[for="'+CSS.escape(el.id)+'"]')) return;
      if(el.closest('label')) return;
      var txt = '';
      var prev = el.previousElementSibling;
      if(prev && /^(LABEL|SPAN|B|STRONG|DIV|P|H[1-6])$/.test(prev.tagName)) txt = (prev.textContent||'').trim();
      if(!txt && el.parentElement){
        var p = el.parentElement.cloneNode(true);
        p.querySelectorAll('input,textarea,select,button').forEach(function(x){ x.remove(); });
        txt = (p.textContent||'').trim();
      }
      if(!txt) txt = el.type === 'date' ? 'Date' : (el.name || 'Type here');
      el.setAttribute('aria-label', txt.replace(/\s+/g,' ').slice(0, 60));
      n++;
    });
    return n;
  }

  function pass(){
    var a = fixContrast(), b = fixLabels();
    window.__djFixed = { contrast:(window.__djFixed?window.__djFixed.contrast:0)+a,
                         labels:(window.__djFixed?window.__djFixed.labels:0)+b };
  }
  function boot(){
    pass();
    var t=null;
    new MutationObserver(function(){ clearTimeout(t); t=setTimeout(pass, 350); })
      .observe(document.body, {childList:true, subtree:true});
    window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(pass, 350); });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script id="dj-clear-v2">
/* ═══ Start fresh — v2 (safe) ═══ */
(function(){
  if(window.__djClear2) return; window.__djClear2 = true;

  /* Who owns what. Every app on this address shares one storage area, so this list is
     the only thing standing between "clear my data" and "clear everyone's data". */
  var OWNERS = {
    nownext:      ['now_next_v1','now_next_profiles_v1','nn7_prefs','nn_code_v1','hz_prefs_v1'],
    ahead:        ['ahead_v1','aheadofit_v1'],
    nextstep:     ['nextstep_v1','next_step_v1'],
    breakeven:    ['breakeven_v1'],
    safety:       ['safety_v1','safetyplan_v1'],
    occ:          ['occ_v1'],
    zuri:         ['zuri_v1','zuri_ops_v1'],
    compass:      ['compass_v1'],
    feedback:     ['fbs_v1'],
    storykeeper:  ['story_v1','storykeeper_v1'],
    academy:      ['academy_v1'],
    thekey:       ['thekey_v1','key_v1'],
    drumbeat:     ['drumbeat_v1'],
    flipkit:      ['flipkit_v1'],
    rafiki:       ['rafiki_v1','rafiki_aa'],
    pitwall:      ['f1_v1','pitwall_v1','f1league_v1'],
    churchhq:     ['church_hq_v1'],
    steward:      ['steward_v1'],
    serve:        ['serveboard_v1','serve_v1'],
    drive:        ['drive_v1','church_drive_v1'],
    clubhouse:    ['clubhouse_v1','church_clubhouse_v1'],
    gameday:      ['gameday_v1','church_gameday_v1'],
    churchkey:    ['churchkey_v1','church_key_v1'],
    goodstanding: ['goodstanding_v1'],
    receipts:     ['receipts_v1','np_receipts_v1']
  };

  var SLUG = (window.DJ_START && window.DJ_START.slug) ||
             (location.pathname.replace(/\/index\.html$/,'').split('/').filter(Boolean).pop() || 'app');
  SLUG = String(SLUG).toLowerCase().replace(/[^a-z0-9]/g,'');

  function myKeys(){
    var mine = (OWNERS[SLUG] || []).slice();
    var declared = (window.DJ_START && window.DJ_START.dataKeys) || [];
    declared.forEach(function(k){ if(mine.indexOf(k) < 0) mine.push(k); });

    /* everything any OTHER app owns is off limits, whatever the patterns say */
    var protectedKeys = {};
    Object.keys(OWNERS).forEach(function(app){
      if(app === SLUG) return;
      OWNERS[app].forEach(function(k){ if(mine.indexOf(k) < 0) protectedKeys[k] = app; });
    });

    var out = [];
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k) continue;
        if(k.indexOf('dj_') === 0) continue;
        if(protectedKeys[k]) continue;                       /* another app's data */
        if(mine.indexOf(k) >= 0){ out.push(k); continue; }
        /* this app's own coach/progress keys, which are always slug-stamped */
        if(k.indexOf('fs_coach_' + SLUG) === 0 || k.indexOf(SLUG + '_') === 0) out.push(k);
      }
    }catch(e){}
    return out;
  }

  window.djStartFresh = function(){
    var keys = myKeys();
    if(!keys.length){
      alert('There is nothing saved in this app yet — nothing to erase.');
      return;
    }
    var msg = 'Erase everything in THIS app?\n\nThis will clear:\n  • ' + keys.join('\n  • ') +
              '\n\nYour other Daraja apps are not touched. This cannot be undone.';
    if(!confirm(msg)) return;
    if(!confirm('Last check — erase this app\'s data?')) return;
    try{ keys.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
    location.replace(location.pathname);
  };

  function addLink(){
    var old = document.getElementById('djFreshLink');
    if(old) old.remove();                                    /* retire the unsafe one */
    if(document.getElementById('djFreshLink2')) return;
    var host = document.querySelector('footer') || document.body;
    var w = document.createElement('div');
    w.id = 'djFreshLink2';
    w.style.cssText = 'text-align:center;padding:14px 12px 26px;font:13px -apple-system,system-ui,sans-serif;opacity:.75';
    w.innerHTML = '<button onclick="djStartFresh()" style="font:inherit;font-weight:700;'
      + 'border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;'
      + 'border-radius:9px;padding:10px 14px;min-height:44px;cursor:pointer">'
      + '\u{1F9F9} Start fresh — erase this app\u2019s data</button>';
    host.appendChild(w);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addLink);
  else addLink();
})();
</script>

<script>
/* ===== Helpful hovers v2 (2026-08-29) — hover bubbles on desktop, and on
   phones a 💡 button that labels every control for a few seconds. ===== */
(function(){
try{
  var tip=null;
  function ensure(){
    if(tip) return tip;
    tip=document.createElement('div');
    tip.style.cssText='position:fixed;z-index:200;max-width:240px;background:#2b2620;color:#faf6ee;font:600 13px/1.45 -apple-system,Segoe UI,sans-serif;padding:8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;display:none;';
    document.body.appendChild(tip);
    return tip;
  }
  function textFor(el){
    return el.getAttribute('data-help') || el.getAttribute('title') || el.getAttribute('aria-label') || '';
  }
  document.addEventListener('mouseover', function(e){
    try{
      var el=e.target.closest ? e.target.closest('[title],[data-help],[aria-label]') : null;
      if(!el) return;
      var txt=textFor(el); if(!txt) return;
      if(el.getAttribute('title')){ el.setAttribute('data-help', el.getAttribute('title')); el.removeAttribute('title'); }
      var t=ensure(); t.textContent=txt; t.style.display='block';
      var r=el.getBoundingClientRect();
      t.style.left=Math.min(window.innerWidth-250, Math.max(8, r.left))+'px';
      t.style.top=Math.max(6, r.top>60 ? r.top-52 : r.bottom+10)+'px';
    }catch(err){}
  }, true);
  document.addEventListener('mouseout', function(){ if(tip) tip.style.display='none'; }, true);
  document.addEventListener('click', function(){ if(tip) tip.style.display='none'; }, true);

  /* phone: 💡 shows every label at once for 7 seconds */
  var touchy = window.matchMedia && window.matchMedia('(hover: none)').matches;
  if(touchy){
    setTimeout(function(){
      if(document.getElementById('dTipDot')) return;
      var d=document.createElement('button'); d.id='dTipDot'; d.textContent='💡';
      d.setAttribute('aria-label','Show what every button does');
      d.style.cssText='position:fixed;right:10px;bottom:150px;z-index:150;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(128,120,100,.45);background:rgba(250,246,238,.92);font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);';
      d.onclick=function(){ labelAll(); };
      document.body.appendChild(d);
    }, 1800);
  }
  var labels=[];
  function clearLabels(){ labels.forEach(function(l){ try{l.remove();}catch(e){} }); labels=[]; }
  function labelAll(){
    clearLabels();
    var els=document.querySelectorAll('[title],[data-help],[aria-label]');
    var n=0;
    els.forEach(function(el){
      if(n>=12) return;
      if(el.id==='dTipDot') return;
      var r=el.getBoundingClientRect();
      if(r.width===0 || r.bottom<0 || r.top>window.innerHeight) return;
      var txt=textFor(el); if(!txt) return;
      var b=document.createElement('div');
      b.textContent=txt.length>60 ? txt.slice(0,57)+'…' : txt;
      b.style.cssText='position:fixed;z-index:190;max-width:200px;background:#2b2620;color:#faf6ee;font:600 12px/1.4 -apple-system,Segoe UI,sans-serif;padding:6px 10px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none;';
      b.style.left=Math.min(window.innerWidth-210, Math.max(6, r.left))+'px';
      b.style.top=Math.max(4,(r.top>50 ? r.top-40 : r.bottom+6))+'px';
      document.body.appendChild(b); labels.push(b); n++;
    });
    if(n) setTimeout(clearLabels, 7000);
  }
}catch(e){}
})();
</script>
