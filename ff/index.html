<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Scores">
<meta name="theme-color" content="#0b1220">
<title>My Scores</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --line:#223049; --ink:#f3f6fb; --dim:#8b9bb4;
    --me:#4ade80; --accent:#3b82f6; --gold:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px}
  [hidden]{display:none !important}
  header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0}
  header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  header .right{display:flex;align-items:center;gap:10px}
  header .wk{color:var(--dim);font-size:14px;font-weight:600}
  .link{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:13px;
    font-weight:600;-webkit-tap-highlight-color:transparent}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h2 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card h2 .status{flex:none;font-size:11px;padding:3px 8px;border-radius:999px;background:#1f2a40;color:var(--dim);
    text-transform:none;letter-spacing:0;font-weight:600}
  .card h2 .status.live{background:#14532d;color:#86efac}
  .card h2 .status.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#4ade80;margin-right:6px;vertical-align:1px;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}

  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .side{min-width:0;text-align:center}
  .side .logo{width:44px;height:44px;border-radius:50%;background:#1f2a40;object-fit:cover;margin:0 auto 6px;display:block}
  .side .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .rec{font-size:12px;color:var(--dim);margin-top:2px}
  .side .pts{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
  .side .proj{font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
  .side.me .name{color:var(--me)}
  .side.lead .pts{color:var(--gold)}
  .mid{color:var(--dim);font-size:12px;font-weight:700;text-align:center}
  .foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
    font-size:12px;color:var(--dim)}
  .foot b{color:var(--ink)}

  .msg{color:var(--dim);font-size:14px;line-height:1.5;padding:6px 0}
  .msg.err{color:#fca5a5}
  .msg b{color:var(--ink)}

  .big{width:100%;border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:800;
    background:var(--accent);color:#fff;letter-spacing:.01em;box-shadow:0 8px 20px rgba(59,130,246,.35);
    -webkit-tap-highlight-color:transparent}
  .big:active{transform:scale(.98)}
  .big[disabled]{opacity:.6}
  #main .big{margin-top:auto}
  .stamp{text-align:center;color:var(--dim);font-size:12px}
  .stamp small{opacity:.7}

  /* setup */
  #setup h2{margin:0 0 4px;font-size:20px;font-weight:800}
  #setup p{margin:0 0 12px;color:var(--dim);font-size:14px;line-height:1.5}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .teams button{background:#1a2438;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 10px;font-size:14px;
    font-weight:700;text-align:left;-webkit-tap-highlight-color:transparent;line-height:1.25;word-break:break-word}
  .teams button:active{background:var(--accent)}
  .teams button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input.tl{width:100%;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e1626;color:var(--ink);margin-top:8px}
  input.tl::placeholder{color:#5d6b84}
</style>
</head>
<body>
<header>
  <h1>My Scores</h1>
  <div class="right"><div class="wk" id="week"></div><button class="link" id="teamsBtn" type="button">My teams</button></div>
</header>

<!-- ===== Scores ===== -->
<div id="main">
  <div id="cards"></div>
  <button id="update" class="big" type="button">Update scores</button>
  <div class="stamp" style="margin-top:12px"><span id="updated">Tap Update to get today's scores</span></div>
</div>

<!-- ===== Setup ===== -->
<div id="setup" hidden>
  <div class="card">
    <h2 style="font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink)">Which teams are yours?</h2>
    <p>Tap your team in each league. Your picks are saved on this device only.</p>
  </div>
  <div id="pickers"></div>
  <button id="done" class="big" type="button">Show my scores</button>
</div>

<div class="stamp"><small>v1.1 · 2026-09-21</small></div>

<script>
const API = "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/";
const KEY = "myscores.picks";

// The two leagues everyone here plays in. Each person picks their own team once.
const FIXED = [
  { leagueId:1580058143, label:"Lets Win Slow and Lother Later" },
  { leagueId:75576161,   label:"Newport Cove Football" },
];

// picks: { "<leagueId>": {teamId, teamName} }  — saved on this device
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function save(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }
let PICKS = load();
function leagues(){ return FIXED.filter(f=>PICKS[f.leagueId]).map(f=>Object.assign({}, f, PICKS[f.leagueId])); }

// A link like  …/#t=1580058143:1,75576161:16  sets the picks once, then drops the hash.
(function importHash(){
  const m = /[#&]t=([\d:,]+)/.exec(location.hash||"");
  if(!m) return;
  m[1].split(",").map(p=>p.split(":")).filter(p=>p.length===2).forEach(p=>{ PICKS[+p[0]] = {teamId:+p[1]}; });
  save(PICKS);
  history.replaceState(null, "", location.pathname + location.search);
})();

// ---------- helpers ----------
function season(){ const d=new Date(); return d.getMonth()>=7 ? d.getFullYear() : d.getFullYear()-1; }
function n1(x){ return (Math.round((x||0)*100)/100).toFixed(2); }
function teamName(t){ return t.name || ((t.location||"")+" "+(t.nickname||"")).trim() || ("Team "+t.id); }
function rec(t){ const r=(t.record&&t.record.overall)||{}; return (r.wins||0)+"-"+(r.losses||0)+((r.ties)?"-"+r.ties:""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const PRIVATE_FIX = `ESPN keeps this league private, so it can't be read without a login.<br>
  <b>Fix (one time):</b> the league manager opens League Settings → Basic Settings →
  <b>Make League Viewable to Public: Yes</b>. Then tap Update.`;

async function getLeague(id){
  const url = API + season() + "/segments/0/leagues/" + id + "?view=mTeam&view=mMatchupScore&view=mSettings&_=" + Date.now();
  let res;
  try { res = await fetch(url, {credentials:"include", cache:"no-store"}); } catch(e){ res = null; }
  if(!res || !res.ok){ res = await fetch(url, {cache:"no-store"}); }
  if(res.status===401) throw new Error("PRIVATE");
  if(res.status===404) throw new Error("NOTFOUND");
  if(!res.ok) throw new Error("ESPN said "+res.status);
  return res.json();
}

function pick(d, cfg){
  const teams = {}; (d.teams||[]).forEach(t=>teams[t.id]=t);
  const me = teams[cfg.teamId];
  const wk = (d.status && d.status.currentMatchupPeriod) || d.scoringPeriodId;
  const sp = d.scoringPeriodId;
  if(!me) throw new Error("Team "+cfg.teamId+" isn't in this league any more");
  const m = (d.schedule||[]).find(x => x.matchupPeriodId===wk &&
      ((x.home&&x.home.teamId===cfg.teamId)||(x.away&&x.away.teamId===cfg.teamId)));
  const leagueName = d.settings && d.settings.name;
  if(!m || !m.away || !m.home) return {leagueName, wk, me, bye:true};
  const mine = (m.home.teamId===cfg.teamId)? m.home : m.away;
  const theirs = (mine===m.home)? m.away : m.home;
  const pts = s => (s.totalPointsLive!=null) ? s.totalPointsLive : (s.totalPoints || ((s.pointsByScoringPeriod||{})[sp]) || 0);
  const proj = s => (s.totalProjectedPointsLive!=null) ? s.totalProjectedPointsLive : (s.totalProjectedPoints||0);
  return { leagueName, wk, me, opp: teams[theirs.teamId], final: m.winner && m.winner!=="UNDECIDED",
    myPts: pts(mine), oppPts: pts(theirs), myProj: proj(mine), oppProj: proj(theirs),
    winProb: mine.winProbability, started: pts(mine)>0 || pts(theirs)>0 };
}

function sideHTML(t, p, proj, cls){
  return `<div class="side ${cls}">
    <img class="logo" src="${esc(t.logo||'')}" alt="" onerror="this.style.visibility='hidden'">
    <div class="name">${esc(teamName(t))}</div>
    <div class="rec">${rec(t)}</div>
    <div class="pts">${n1(p)}</div>
    <div class="proj">proj ${n1(proj)}</div>
  </div>`;
}

function cardHTML(cfg, r, err){
  const title = esc((r&&r.leagueName) || cfg.label);
  if(err){
    const body = err.message==="PRIVATE" ? `<div class="msg err">${PRIVATE_FIX}</div>`
      : `<div class="msg err">Couldn't get this league (${esc(err.message)}). Check the connection and tap Update again.</div>`;
    return `<div class="card"><h2><span class="t">${title}</span><span class="status">no data</span></h2>${body}</div>`;
  }
  if(r.bye) return `<div class="card"><h2><span class="t">${title}</span><span class="status">Week ${r.wk}</span></h2>
     <div class="msg">${esc(teamName(r.me))} has no matchup this week. Record ${rec(r.me)}.</div></div>`;
  const status = r.final ? '<span class="status">Final</span>' : r.started ? '<span class="status live">Live</span>' : '<span class="status">Not started</span>';
  const lead = r.myPts===r.oppPts ? "" : (r.myPts>r.oppPts ? "me" : "opp");
  const verdict = r.final ? (r.myPts>r.oppPts ? "You won" : r.myPts<r.oppPts ? "You lost" : "Tie")
                : r.started ? (r.myPts>r.oppPts ? "You're ahead" : r.myPts<r.oppPts ? "You're behind" : "Tied")
                : "Kickoff pending";
  const odds = (!r.final && r.winProb!=null) ? `Win odds <b>${Math.round(r.winProb*100)}%</b>` : "";
  return `<div class="card">
    <h2><span class="t">${title}</span>${status}</h2>
    <div class="vs">
      ${sideHTML(r.me, r.myPts, r.myProj, "me"+(lead==="me"?" lead":""))}
      <div class="mid">VS</div>
      ${sideHTML(r.opp, r.oppPts, r.oppProj, lead==="opp"?"lead":"")}
    </div>
    <div class="foot"><span><b>${verdict}</b> by ${n1(Math.abs(r.myPts-r.oppPts))}</span><span>${odds}</span></div>
  </div>`;
}

// ---------- scores screen ----------
const $ = id => document.getElementById(id);
let busy=false;
async function update(){
  const LEAGUES = leagues();
  if(busy || !LEAGUES.length) return; busy=true;
  $("update").disabled=true; $("update").textContent="Getting scores…";
  const results = await Promise.all(LEAGUES.map(async cfg=>{
    try { return {cfg, r: pick(await getLeague(cfg.leagueId), cfg)}; } catch(e){ return {cfg, err:e}; }
  }));
  $("cards").innerHTML = results.map(x=>cardHTML(x.cfg, x.r, x.err)).join("");
  const wk = results.map(x=>x.r&&x.r.wk).find(Boolean);
  $("week").textContent = wk ? "Week "+wk : "";
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  $("update").disabled=false; $("update").textContent="Update scores"; busy=false;
}

function show(which){
  $("main").hidden = which!=="main"; $("setup").hidden = which!=="setup";
  $("teamsBtn").textContent = which==="main" ? "My teams" : "Back";
  $("teamsBtn").hidden = (which==="setup" && !leagues().length);   // nothing to go back to yet
  if(which==="setup") renderPickers(); else update();
}

// ---------- setup screen ----------
const CACHE = {};   // leagueId -> {name, teams} or {error}
async function leagueTeams(id){
  if(CACHE[id]) return CACHE[id];
  try{ const d = await getLeague(id); CACHE[id] = {name:(d.settings&&d.settings.name)||"", teams:d.teams||[]}; }
  catch(e){ CACHE[id] = {error:e.message}; }
  return CACHE[id];
}
function pickerHTML(f, info){
  const p = PICKS[f.leagueId];
  const title = esc((info&&info.name)||f.label);
  if(!info) return `<div class="card"><h2><span class="t">${title}</span></h2><div class="msg">Getting the team list…</div></div>`;
  if(info.error){
    const chosen = p ? `Your team here: <b>${esc(p.teamName||("team "+p.teamId))}</b>.` : "";
    const note = info.error==="PRIVATE"
      ? `${PRIVATE_FIX}<br><br>Until then, paste the link to <b>your team page</b> in this league (it has teamId= in it):`
      : `Couldn't reach ESPN for this league (${esc(info.error)}). You can still paste the link to your team page:`;
    return `<div class="card"><h2><span class="t">${title}</span><span class="status">no data</span></h2>
      <div class="msg">${chosen} ${note}</div>
      <input class="tl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" data-l="${f.leagueId}"
        placeholder="https://fantasy.espn.com/football/team?leagueId=${f.leagueId}&teamId=…"></div>`;
  }
  return `<div class="card"><h2><span class="t">${title}</span></h2>
    <div class="teams" data-l="${f.leagueId}">${info.teams.map(t=>
      `<button type="button" data-t="${t.id}" class="${p&&p.teamId===t.id?'on':''}">${esc(teamName(t))}</button>`).join("")}</div></div>`;
}
async function renderPickers(){
  const box=$("pickers");
  box.innerHTML = FIXED.map(f=>pickerHTML(f,null)).join("");
  const infos = await Promise.all(FIXED.map(f=>leagueTeams(f.leagueId)));
  box.innerHTML = FIXED.map((f,i)=>pickerHTML(f,infos[i])).join("");
  $("done").hidden = !leagues().length;
}
$("pickers").addEventListener("click", e=>{
  const b=e.target.closest("button[data-t]"); if(!b) return;
  const grid=b.closest(".teams"), id=+grid.dataset.l, info=CACHE[id];
  const t=info && info.teams.find(x=>x.id===+b.dataset.t); if(!t) return;
  PICKS[id]={teamId:t.id, teamName:teamName(t)}; save(PICKS);
  grid.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
  $("done").hidden=false;
});
$("pickers").addEventListener("input", e=>{
  const inp=e.target.closest("input.tl"); if(!inp) return;
  const m=/teamId=(\d+)/i.exec(inp.value); if(!m) return;
  const id=+inp.dataset.l;
  PICKS[id]={teamId:+m[1], teamName:"team "+m[1]}; save(PICKS);
  inp.style.borderColor="var(--me)"; $("done").hidden=false;
});
$("done").addEventListener("click", ()=>show("main"));
$("teamsBtn").addEventListener("click", ()=>show($("main").hidden ? "main" : "setup"));

$("update").addEventListener("click", update);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !$("main").hidden) update(); });

show(leagues().length ? "main" : "setup");
</script>
</body>
</html>
