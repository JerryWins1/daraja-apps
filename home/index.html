<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><!-- 22 Nov 2026: FIRST, before anything else in the head. A browser only
     looks at the first 1024 bytes for this, and the house block is ~300 KB, so every app in the
     house was declaring its encoding long past the point anything reads it. GitHub Pages sends
     charset=utf-8 in the header and covers it there, but any other copy - a local server, a file
     opened from disk, a downloaded page - is left to the browser's guess, and a wrong guess turns
     every dash and apostrophe into mojibake. Caught by the beta check, which serves the same bytes
     twice and read them two different ways. The app's own charset line further down is left where
     it is: the first one wins, and theirs is theirs. -->
<script id="dj-house-v88" src="../house/house-v88.js" charset="utf-8"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daraja</title>
<meta name="description" content="Your family of apps, one front door.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="theme-color" content="#1C2B29">
<style>
  :root{ color-scheme:light dark;
    --bg:#F7F4EC; --surface:#FFFFFF; --ink:#1F2622; --soft:#55605B; --line:#E2DCCF;
    --brand:#23504F; --accent:#D96C4F; --ok:#2F6E52; --gold:#C9982A; --felt:#1F5C45; --card:#FFFDF7; --blue:#3D6F96; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1D2224; --ink:#ECEAE3; --soft:#B0B7B1; --line:#2C3336;
    --brand:#7FB4B1; --accent:#E8886A; --ok:#6DC296; --gold:#E0B04A; --felt:#173F31; --card:#22282A; --blue:#8FB4D0; } }
  :root[data-theme="dark"]{ --bg:#14181A; --surface:#1D2224; --ink:#ECEAE3; --soft:#B0B7B1; --line:#2C3336; --brand:#7FB4B1; --accent:#E8886A; --ok:#6DC296; --gold:#E0B04A; --felt:#173F31; --card:#22282A; --blue:#8FB4D0; }
  *{ box-sizing:border-box; } html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap{ max-width:620px; margin:0 auto; padding:14px 14px calc(96px + env(safe-area-inset-bottom)); }
  header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  header h1{ font-size:26px; margin:0; line-height:1.1; color:var(--brand); } header p{ margin:0; color:var(--soft); font-size:14px; }
  .host{ background:var(--felt); color:#fff; border-radius:18px; padding:14px 16px; margin-bottom:14px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .host b{ display:block; font-size:17px; margin-bottom:4px; } .host p{ margin:0 0 10px; font-size:15px; opacity:.95; }
  .host .row button{ background:#fff; color:#1F2622; border:0; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  button{ font:inherit; font-weight:800; min-height:46px; padding:10px 16px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  button.primary{ background:var(--brand); color:#fff; border-color:transparent; } button.ghost{ background:transparent; }
  h2.shelf{ font-size:20px; margin:6px 0 2px; } .shelfSub{ color:var(--soft); font-size:14px; margin:0 0 10px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .app{ background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:14px 10px 12px; text-align:center; cursor:pointer; font:inherit; color:var(--ink); min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:4px; box-shadow:0 6px 18px rgba(0,0,0,.07); position:relative; }
  .app .em{ font-size:40px; line-height:1; } .app .nm{ font-weight:900; font-size:16.5px; line-height:1.15; } .app .sub{ font-size:12.5px; color:var(--soft); line-height:1.25; }
  .app .st{ font-size:12px; font-weight:900; border-radius:999px; padding:4px 10px; margin-top:2px; }
  .app.use{ border-color:var(--ok); } .app.use .st{ background:var(--ok); color:#fff; } .app.try .st{ background:var(--line); color:var(--soft); }
  .app .new{ position:absolute; top:8px; right:10px; font-size:10.5px; font-weight:900; background:var(--gold); color:#1F2622; border-radius:999px; padding:2px 7px; letter-spacing:.04em; }
  .pickShelf{ display:grid; gap:10px; margin-top:10px; } .pickShelf button{ text-align:left; min-height:60px; font-size:17px; display:flex; gap:12px; align-items:center; } .pickShelf button span{ font-size:28px; }
  nav{ position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20; }
  nav button{ flex:1; border:0; border-radius:0; background:transparent; font-size:10.5px; font-weight:800; color:var(--soft); min-height:58px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; }
  nav button span{ font-size:22px; } nav button.on{ color:var(--brand); }
  .foot{ color:var(--soft); font-size:13px; text-align:center; margin-top:22px; } .foot a{ color:var(--brand); font-weight:800; }
  /* the app runs inside, with a slim bar to come back */
  #frame{ position:fixed; inset:0; z-index:50; background:var(--bg); display:none; flex-direction:column; }
  #frame.on{ display:flex; }
  #frame .bar{ display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top)); background:var(--brand); color:#fff; }
  #frame .bar button{ background:#fff; color:var(--brand); border:0; min-height:40px; padding:6px 14px; border-radius:12px; font-size:15px; }
  #frame .bar b{ flex:1; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #frame .bar a{ color:#fff; font-size:13px; font-weight:800; text-decoration:none; opacity:.9; padding:8px; }
  #frame .win{ flex:1; min-height:0; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; background:#fff; } #frame iframe{ position:absolute; inset:0; display:block; border:0; width:100%; height:100%; min-height:100%; background:#fff; }
  .small{ font-size:13px; color:var(--soft); }
  .foot a{ display:inline-flex; align-items:center; min-height:44px; padding:10px 8px; }
</style>

<body>
<div class="wrap">
  <header><div style="font-size:36px" aria-hidden="true">🌉</div><div><h1>Daraja</h1><p>your family of apps, one front door</p></div></header>
  <div class="host" id="host"></div>
  <div id="startDay"></div>
  <div id="shelfView"></div>
  <p class="foot">Daraja v1.8 · 2026-11-25 · <a href="https://jerrywins1.github.io/daraja-apps/shop/">the store</a> · <a href="https://jerrywins1.github.io/daraja-apps/whats-new/">what’s new</a> · new apps appear here on their own · donations help orphans and students in Kenya, through Loving InDeed</p>
</div>
<nav id="nav"></nav>
<div id="frame"><div class="bar"><button onclick="closeApp()">‹ Daraja</button><b id="frameTitle"></b><a id="frameOut" href="#" target="_blank" rel="noopener">open on its own ↗</a></div><div class="win"><iframe id="frameIn" allow="microphone; camera; clipboard-write; web-share" title="app"></iframe></div></div>

<script src="../shop/apps_data.js"></script>
<script>
const LS='dj_home_v1'; window.DJ_OWNS=[LS];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } }
function save(){ localStorage.setItem(LS,JSON.stringify(db)); }
let db=load();
const SHELF={ home:{em:'🏠',name:'Your household',sub:'The day, the dates, and where everything is.'}, later:{em:'🌷',name:'Later life & the people we love',sub:'Company, stories, and learning at your own pace.'}, church:{em:'⛪',name:'Your church',sub:'For the people who keep a church running.'}, work:{em:'💼',name:'Your business or nonprofit',sub:'The back office, for people who do not have one.'}, free:{em:'🎁',name:'Free, and for good',sub:'The ones that were never about money.'}, fun:{em:'🏁',name:'Just for fun',sub:'The league, and whatever comes next.'}, ownday:{em:'🧭',name:'Your own day',sub:'A hand with your own day, whoever you are.'} };
const ORDER=['home','later','church','work','free','fun','ownday'];
/* 15 Nov 2026: 'ownday' had a full SHELF entry and a name Jerry picked, but it was on
   neither ORDER — which drives both the nav and the "which shelf is yours?" picker — so
   One Thing, a finished app, could not be reached from the front door at all. The nav's
   short names used to be a ternary chain ending in 'Fun', so any shelf added after it
   was silently labelled "Fun"; they are a map now, and a shelf with no short name falls
   back to its own full one instead of to the wrong one. 'kenya' is deliberately still
   off: it has no SHELF entry, and Duka, its only app, is reachable under Business. */
const NAVNAME={home:'Household',later:'Later',church:'Church',work:'Business',free:'Free',fun:'Fun',ownday:'Your day',kenya:'Kenya'};
/* Jerry’s sort for the door, 18 Sep — the store keeps its own shelves for selling */
const DOOR_LOCAL={ pitwall:'fun', everyday:'home', nourishdairy:'home', nourishpeanut:'home', academy:'later' };
const shelfOf=k=>((typeof DOOR!=='undefined'?DOOR:DOOR_LOCAL)[k])||APPS[k].cat;
/* 8 Nov: shelfOf still answers "which ONE shelf is this app's" — db.shelf and the hash
   jump both want a single answer. Membership goes through here instead, so an app with
   also:[...] shows on each of its shelves. */
const doorOnShelf=(k,s)=>(typeof djOnShelf==='function')?djOnShelf(k,s,(typeof DOOR!=='undefined'?DOOR:DOOR_LOCAL)):shelfOf(k)===s;
/* what each app saves under, so the door knows which ones you already use */
const USES={ nownext:['now_next_v1','now_next_profiles_v1'], ahead:['ahead_v1'], thekey:['daraja_thekey_v1'], pitwall:['pitwall_state_v1'], rafiki:['rafiki_v1'], storykeeper:['story_keeper_v1'], churchkey:['daraja_churchkey_v1'], churchserve:['serveboard_v1'], churchdrive:['occ_counter_v1'], occ:['occ_counter_v1'], npreceipts:['receiptmaker_org_v1'], nextstep:['nextstep_board_v1'], academy:['daraja_academy_v1'], whoscoming:['dj_whoscoming_v1'], ourtable:['dj_ourtable_v1'], everyday:['dj_everyday_v1'], safety:['my_safety_plan_v1'], breakeven:['breakeven_v1'], compass:['daraja_compass_v1'], drumbeat:['drumbeat_v1'], flipkit:['flipkit_v1'], zuri:['zuri_ops_v1'], churchhq:['church_hq_v1'], churchsteward:['steward_v1'], churchclubhouse:['clubhouse_stars'], npgoodstanding:['goodstanding_v1'], feedback:['feedback_studio_v1'] };
const inUse=k=>(USES[k]||[]).some(x=>{ try{ return !!localStorage.getItem(x); }catch(e){ return false; } });
const APPLIST=Object.keys(typeof APPS==='object'?APPS:{}).filter(k=>k!=='home'&&(APPS[k].try||APPS[k].kind==='download')&&APPS[k].cat&&APPS[k].cat!=='off');
const url=k=>APPS[k].try||('https://jerrywins1.github.io/daraja-apps/shop/#'+k);
const j=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
const ymd=d=>{ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* ── the host: one glance across every app you use ─────────── */
function hostLine(){
  const h=new Date().getHours(); const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const name=db.name?', '+esc(db.name):'';
  if(!db.shelf){ $('host').innerHTML=`<b>${g}. Welcome in.</b><p>This is the front door to every Daraja app. Which shelf is yours? You can visit the others any time.</p><div class="pickShelf">${ORDER.map(s=>`<button onclick="setShelf('${s}')"><span>${SHELF[s].em}</span>${SHELF[s].name}</button>`).join('')}</div>`; return; }
  const facts=[]; let act='';
  const nnP=j('now_next_profiles_v1'); const nn=j(nnP&&nnP.cur?'now_next_v1_'+nnP.cur:'now_next_v1'); if(nn&&Array.isArray(nn.tasks)){ const open=nn.tasks.filter(t=>!t.done); if(open.length){ facts.push(`One Thing: <b style="display:inline;font-size:inherit">${esc(open[0].text)}</b>${open.length>1?' and '+(open.length-1)+' more':''}`); act=act||`<button onclick="openApp('nownext')">Do the one thing</button>`; } }
  const ot=j('dj_ourtable_v1'); if(ot&&ot.week&&ot.recipes){ const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun']; const id=ot.week[D[(new Date().getDay()+6)%7]]; const r=id&&ot.recipes.find(x=>x.id===id); if(r){ facts.push(`Dinner tonight: ${r.em||''} ${esc(r.name)}`); act=act||`<button onclick="openApp('ourtable')">See the recipe</button>`; } }
  const ed=j('dj_everyday_v1'); if(ed&&Array.isArray(ed.habits)&&ed.habits.length){ const t=ymd(); const wd=(new Date().getDay()+6)%7; const due=ed.habits.filter(x=>(x.days||[0,1,2,3,4,5,6]).includes(wd)); const left=due.filter(x=>!(ed.log&&ed.log[t]&&ed.log[t][x.id])).length; if(left) { facts.push(`Every Day: ${left} card${left===1?'':'s'} left`); act=act||`<button onclick="openApp('everyday')">Turn a card</button>`; } else if(due.length) facts.push('Every Day: all done ✓'); }
  const ah=j('ahead_v1'); if(ah&&Array.isArray(ah.items)){ const t=ymd(); const soon=ah.items.filter(x=>x.due&&x.due>=t).sort((a,b)=>String(a.due).localeCompare(String(b.due)))[0]; if(soon){ const days=Math.round((new Date(soon.due+'T12:00:00')-new Date(t+'T12:00:00'))/864e5); facts.push(`Ahead of It: ${esc(soon.n||soon.name||'next date')} ${days===0?'today':days===1?'tomorrow':'in '+days+' days'}`); act=act||`<button onclick="openApp('ahead')">See what’s coming</button>`; } }
  const used=APPLIST.filter(inUse).length;
  const TRY=['Ask Our Table to fill the week, then text the list to whoever shops.','Open Every Day and turn one card you have been ignoring.','Ask the grandkids one question through Who’s Coming — lunch, a drive, anything.','Take a picture of a letter and ask the ✨ what it wants you to do (Academy, lesson 6).','Put one date you always forget into Ahead of It. Just one.','Tell In My Own Words one story from before you were twenty.','Print your Academy diploma and put it on the fridge.','Send a friend the free Academy lesson from the diploma page.','Open The Key and fill in one section for the person who would need it.','Tap 🌉 inside any app — it shows you the ones you have not tried.'];
  const seed=Number(ymd().replace(/-/g,''))%TRY.length;
  let b,p;
  if(facts.length){ b=g+name+'.'; p=facts.slice(0,3).join(' · ')+`<div style="margin-top:6px;font-size:14px;opacity:.9">Today, if you like: ${TRY[seed]}</div>`; }
  else if(used){ b=g+name+'.'; p='Nothing is waiting on you across your apps. Today, if you like: '+TRY[seed]; act=`<button onclick="showShelf('${db.shelf}')">My shelf</button>`; }
  else { b=g+name+'. Your shelf is ready.'; p='Tap any card to open it right here. The green ones are the ones you already use.'; act=''; }
  $('host').innerHTML=`<b>${b}</b><p>${p}</p>${act?`<div class="row">${act}</div>`:''}`;
}
function setShelf(s){ db.shelf=s; save(); if(!db.name){ let n=''; try{ n=localStorage.getItem('dj_name')||''; }catch(e){} if(!n){ n=prompt('And what should I call you?')||''; } if(n.trim()){ db.name=n.trim(); try{ localStorage.setItem('dj_name',db.name); }catch(e){} } save(); } render(); }

/* ── what a card says it costs ──────────────────────────
   15 Nov 2026: this was a ternary chain inside the card template, and it had never been
   taught about PHASE 'donate', which went on 12 Nov. So while the store said "Free" and
   "Get it free", the door was still quoting the old prices — 42 cards of them, including
   "$149 first year · then $49 a year" for The Church App. The words here are the store's
   own (shop/index.html card()): in donate mode every launched app is free, an app not yet
   in LAUNCH is "Coming soon", and no card names a price. A blank price used to leave a
   dangling separator — Duka and the Family Money Dashboard both read "try it · " with
   nothing after it — so no price now means say nothing after the words.
   It is a function and not a ternary so that the store and the door can be compared. */
function offerOf(k){
  const a = APPS[k]; if(!a) return '';
  const book = a.kind === 'download';
  if(typeof PHASE !== 'undefined' && PHASE === 'donate'){
    if(typeof LAUNCH !== 'undefined' && LAUNCH.indexOf(k) < 0) return 'Coming soon';
    return book ? 'a book' : 'free';
  }
  if(typeof PHASE !== 'undefined' && PHASE === 'testing') return 'try it · free while testing';
  const p = String(a.price || '');
  if(book) return p ? 'a book · ' + p : 'a book';
  if(p === 'Free') return 'free';
  return p ? 'try it · ' + p : 'try it';
}

/* ── shelves ─────────────────────────────────────────────────── */
let cur='';
function showShelf(s){ cur=s; db.last=s; save(); const S=SHELF[s]; const apps=APPLIST.filter(k=>doorOnShelf(k,s)).sort((a,b)=>(inUse(b)-inUse(a))||((APPS[b].fresh?1:0)-(APPS[a].fresh?1:0)));
  $('shelfView').innerHTML=`<h2 class="shelf">${S.em} ${S.name}</h2><p class="shelfSub">${S.sub}${s===db.shelf?' · your shelf':''}</p><div class="grid">${apps.map(k=>{ const a=APPS[k]; const u=inUse(k); return `<button class="app ${u?'use':'try'}" onclick="openApp('${k}')" aria-label="${esc(a.name)}, ${esc(u?'you use this':offerOf(k))}">${a.fresh?'<span class="new">NEW</span>':''}<div class="em">${a.em||'📱'}</div><div class="nm">${esc(a.name)}</div><div class="sub">${esc(a.sub||a.tag||'')}</div><div class="st">${esc(u?'you use this':offerOf(k))}</div></button>`; }).join('')||'<p class="small">Nothing on this shelf yet.</p>'}</div>`;
  $('nav').innerHTML=ORDER.map(x=>`<button class="${x===s?'on':''}" onclick="showShelf('${x}')"><span>${SHELF[x].em}</span>${esc(NAVNAME[x]||SHELF[x].name)}</button>`).join('');
  window.scrollTo({top:0}); }

/* ── open an app inside the door ────────────────────────────── */
function openApp(k){ const a=APPS[k]; if(!a) return; db.opened=db.opened||{}; db.opened[k]=ymd(); save();
  $('frameTitle').textContent=(a.em||'')+' '+a.name; $('frameOut').href=url(k); $('frameIn').src=url(k); $('frame').classList.add('on'); document.body.style.overflow='hidden';
  history.pushState({app:k},'','#'+k); }
function closeApp(){ $('frame').classList.remove('on'); $('frameIn').src='about:blank'; document.body.style.overflow=''; if(location.hash) history.replaceState(null,'',location.pathname); render(); }
window.addEventListener('popstate',()=>{ if($('frame').classList.contains('on')) closeApp(); });

function render(){ hostLine(); if(db.shelf) showShelf(cur||db.last||db.shelf); else { $('shelfView').innerHTML=''; $('nav').innerHTML=''; } }
/* ✨ the door's own question */
window.DJ_AI={ title:'Which app should I open?', prompt:function(){ return 'I use these small apps: '+APPLIST.map(k=>APPS[k].name+' ('+(APPS[k].sub||'')+')').join('; ')+'. In one sentence, which one should I open for: '; } };
render();
/* v65 (15 Oct, Jerry: "let's have all the apps in one place"): a link to one app inside the door (home/#businessmanager)
   works for someone brand new too: their shelf becomes that app's shelf, and the app opens. */
if(location.hash){ const k=location.hash.slice(1); if(APPS[k]){ if(!db.shelf){ db.shelf=shelfOf(k); save(); render(); } openApp(k); } }
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

<script id="dj-home-start-v1">
/* ☀️ Start my day (4 Oct 2026). Jerry: "If I end the day and start tomorrow, I come to the start menu of the day,
   and I tell it what I want to do: do my schedule, a journal entry, create a menu." One tap opens the right app,
   inside the door, already on that job (?dj_go=). */
(function(){
  var JOBS = [
    ['nownext','🎯','Do my schedule','plan','What needs doing today'],
    ['storykeeper','📖','Write in my journal','today','Just talk about your day'],
    ['ourtable','🍽️','Plan a meal','plan','Pick a day, pick the dinner'],
    ['ahead','🧭','What’s coming due','due','Bills, renewals, deadlines'],
    ['whoscoming','🙋','Ask the family something','ask','Lunch Sunday? Who can drive?'],
    ['everyday','🌞','My everyday habits','today','Tap each card when it’s done']
  ];
  window.startGo = function(k, go){ var a = APPS[k]; if(!a) return; var u = url(k); u = u + (u.indexOf('?') >= 0 ? '&' : '?') + 'dj_go=' + go;
    db.opened = db.opened || {}; db.opened[k] = ymd(); save();
    $('frameTitle').textContent = (a.em || '') + ' ' + a.name; $('frameOut').href = url(k); $('frameIn').src = u; $('frame').classList.add('on'); document.body.style.overflow = 'hidden'; history.pushState({ app:k }, '', '#' + k); };
  function paint(){
    var el = $('startDay'); if(!el) return; if(!db.shelf){ el.innerHTML = ''; return; }
    var jobs = JOBS.filter(function(x){ return APPS[x[0]]; });
    el.innerHTML = '<h2 class="shelf" style="margin-top:6px">☀️ What would you like to do?</h2>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px">' + jobs.map(function(x){ return '<button type="button" onclick="startGo(\'' + x[0] + '\',\'' + x[3] + '\')" style="font:inherit;text-align:left;min-height:96px;padding:12px;border-radius:18px;border:1.5px solid rgba(128,128,128,.3);background:var(--card,rgba(255,255,255,.9));color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px"><span style="font-size:28px;line-height:1">' + ((APPS[x[0]] && APPS[x[0]].em) || x[1]) + '</span><b style="font-size:17px;line-height:1.2">' + esc(x[2]) + '</b><span style="font-size:13.5px;opacity:.75">' + esc(x[4]) + '</span></button>'; }).join('') + '</div>';
  }
  var _render = window.render; window.render = function(){ var r = _render.apply(this, arguments); try{ paint(); }catch(e){} return r; };
  try{ paint(); }catch(e){}
})();
</script>
