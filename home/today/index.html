<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daraja Today</title>
<meta name="description" content="Your whole day, and what is coming, read from every Daraja app on this phone.">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg">
<meta name="theme-color" content="#1C2B29">
<style>
  :root{ color-scheme:light dark;
    --bg:#F7F4EC; --surface:#FFFFFF; --ink:#1F2622; --soft:#55605B; --line:#E2DCCF;
    --brand:#23504F; --accent:#D96C4F; --ok:#2F6E52; --gold:#C9982A; --felt:#1F5C45; --card:#FFFDF7; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1D2224; --ink:#ECEAE3; --soft:#B0B7B1; --line:#2C3336;
    --brand:#7FB4B1; --accent:#E8886A; --ok:#6DC296; --gold:#E0B04A; --felt:#173F31; --card:#22282A; } }
  :root[data-theme="dark"]{ --bg:#14181A; --surface:#1D2224; --ink:#ECEAE3; --soft:#B0B7B1; --line:#2C3336; --brand:#7FB4B1; --accent:#E8886A; --ok:#6DC296; --gold:#E0B04A; --felt:#173F31; --card:#22282A; }
  *{ box-sizing:border-box; } html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap{ max-width:620px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }
  header{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  header h1{ font-size:26px; margin:0; line-height:1.1; color:var(--brand); } header p{ margin:0; color:var(--soft); font-size:14px; }
  header a.back{ margin-left:auto; color:var(--brand); font-weight:800; font-size:14px; text-decoration:none; min-height:44px; display:inline-flex; align-items:center; padding:0 6px; }
  h2{ font-size:20px; margin:20px 0 2px; } .sub{ color:var(--soft); font-size:14px; margin:0 0 8px; }
  .list{ background:var(--card); border:1.5px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.06); }
  a.row{ display:flex; align-items:center; gap:12px; padding:12px 12px; min-height:60px; color:var(--ink); text-decoration:none; border-top:1px solid var(--line); }
  a.row:first-child{ border-top:0; }
  a.row .em{ font-size:26px; line-height:1; flex:none; width:32px; text-align:center; }
  a.row .tx{ flex:1; min-width:0; } a.row .tx b{ display:block; font-size:16.5px; line-height:1.3; overflow-wrap:anywhere; }
  a.row .tx span{ display:block; font-size:13px; color:var(--soft); }
  a.row .go{ flex:none; color:var(--soft); font-size:20px; }
  a.row.late .tx b{ color:var(--accent); }
  .none{ color:var(--soft); font-size:15px; margin:0; padding:12px 14px; }
  button{ font:inherit; font-weight:800; min-height:52px; padding:10px 16px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  button.primary{ background:var(--brand); color:#fff; border-color:transparent; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) button.primary{ color:#10201F; } }
  #ask{ width:100%; margin-top:22px; font-size:18px; min-height:58px; }
  #answer{ display:none; margin-top:12px; background:var(--felt); color:#fff; border-radius:18px; padding:14px 16px; white-space:pre-wrap; font-size:16.5px; line-height:1.5; }
  #answer small{ display:block; opacity:.85; font-size:12.5px; margin-top:8px; }
  .small{ font-size:13px; color:var(--soft); margin:10px 2px 0; }
  .empty{ background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:16px; }
  .empty p{ margin:0 0 10px; font-size:17px; }
  .foot{ color:var(--soft); font-size:13px; text-align:center; margin-top:26px; }
  .link{ font:inherit; font-size:14px; font-weight:400; color:var(--soft); background:none; border:0; min-height:44px; padding:0 8px; text-decoration:underline; cursor:pointer; }
  #sheetBg{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  #sheetBg.on{ display:flex; }
  #sheet{ background:var(--bg); color:var(--ink); width:100%; max-width:620px; border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
  #sheet h3{ margin:0 0 6px; font-size:19px; } #sheet p{ margin:0 0 10px; color:var(--soft); font-size:14.5px; }
  #words{ width:100%; min-height:200px; font:inherit; font-size:14.5px; line-height:1.4; padding:10px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); margin-bottom:10px; }
  #sheet .two{ display:flex; justify-content:space-between; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="font-size:36px" aria-hidden="true">🌅</div>
    <div><h1>Today</h1><p id="date"></p></div>
    <a class="back" href="../">All apps ›</a>
  </header>
  <div id="main"></div>
  <button type="button" class="primary" id="ask" style="display:none">✨ What should I know?</button>
  <div id="answer" role="status"></div>
  <div id="notes"></div>
  <p class="foot">Daraja Today · preview · v0.1<br>This page only reads. It never changes anything in your apps.</p>
</div>
<div id="sheetBg"><div id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></div></div>

<script>
/* ── Daraja Today · v0.1 · 22 Nov 2026 ─────────────────────────────────────────
   One screen that READS every Daraja app's storage on this phone and writes nothing.
   Every app lives on the same site, so they share localStorage; that is the whole trick.

   Each reader below mirrors the app's own code (the file and the function are named on
   each one). Every reader is wrapped: a missing key, an odd shape or a throw gives no
   lines, never a broken page.

   A line is { em, text, app, url, d, late, ai }.  d = days from today (0 today).
   `ai` is what the AI button would send for that line when it differs from `text`
   (Business Manager bills go without their amount). */
(function(){
  'use strict';
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WEEK = 7, FAR = 56;   /* this week = the next 7 days; coming up = day 8 to 8 weeks out */

  function lsRaw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsJ(k){ try{ var v = JSON.parse(lsRaw(k) || 'null'); return (v && typeof v === 'object') ? v : null; }catch(e){ return null; } }
  function arr(v){ return Array.isArray(v) ? v : []; }
  function str(v){ return (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim(); }
  function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function okDate(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseD(s)); }
  function parseD(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n){ var d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
  function daysTo(s, t){ return Math.round((parseD(s) - parseD(t)) / 86400000); }
  function nice(s){ var d = parseD(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function inDays(d){ return d === 0 ? 'today' : d === 1 ? 'tomorrow' : 'in ' + d + ' days'; }
  function when(s, t){ var d = daysTo(s, t); return d <= 1 ? inDays(d) : nice(s) + ' (' + inDays(d) + ')'; }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(v){ var n = parseFloat(String(v == null ? '' : v).replace(/\b(kes|kshs?|shs?)\.?/ig, '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; }
  function unEx(s){ return str(s).replace(/\s*\(example\)\s*$/i, ''); }
  function isEx(s){ return /\(example\)\s*$/i.test(str(s)); }

  var APPS = {
    nownext: { name:'One Thing', url:'../../Apps%20(installable%20site)/nownext/' },
    biz:     { name:'Business Manager', url:'../../business-manager/' },
    table:   { name:'Our Table', url:'../../ourtable/' },
    every:   { name:'Every Day', url:'../../everyday/' },
    ahead:   { name:'Ahead of It', url:'../../ahead-of-it/' },
    whos:    { name:'Who’s Coming', url:'../../whoscoming/' },
    circle:  { name:'My Circle', url:'../../circle/' }
  };
  function line(app, em, text, d, extra){
    var o = { app:APPS[app].name, url:APPS[app].url, em:em, text:text, d:d, late:false, ai:null };
    if(extra) for(var k in extra) o[k] = extra[k];
    return o;
  }

  /* ── One Thing — Apps (installable site)/nownext/index.html ──
     KEY (L3273): now_next_v1_<profiles.cur>, or now_next_v1_tmp with no profile.
     current() (L3373) = the first task not done. tasks belong to db.dayKey; the app only
     rolls the day over when it is opened (L3301), so a list stamped another day is NOT
     today's and is not shown as if it were. upcoming (L3874) = {text, date}; regulars are
     due by dueToday() (L3305). */
  function readOneThing(t){
    var out = [], P = lsJ('now_next_profiles_v1');
    var db = lsJ((P && P.cur) ? 'now_next_v1_' + P.cur : 'now_next_v1_tmp');
    if(!db) return out;
    var A = 'nownext', tasks = arr(db.tasks).filter(function(x){ return x && str(x.text); });
    var todays = [];
    if(db.dayKey === t){
      todays = tasks.filter(function(x){ return !x.done; }).map(function(x){ return str(x.text); });
    } else {
      var left = tasks.filter(function(x){ return !x.done; }).length;
      if(left) out.push(line(A, '🎯', left + (left === 1 ? ' thing' : ' things') + ' left over from last time. Open One Thing to carry ' + (left === 1 ? 'it' : 'them') + ' into today', 0));
    }
    arr(db.upcoming).forEach(function(u){
      if(!u || !str(u.text) || !okDate(u.date)) return;
      var d = daysTo(u.date, t);
      if(d <= 0){ if(todays.indexOf(str(u.text)) < 0) todays.push(str(u.text)); }
      else if(d <= FAR) out.push(line(A, '🎯', str(u.text) + ', ' + when(u.date, t), d));
    });
    var now = parseD(t), rd = (db.regDone && typeof db.regDone === 'object') ? db.regDone : {};
    arr(db.regulars).forEach(function(r){
      if(!r || !str(r.text) || rd[r.id] === t) return;
      var due = r.kind === 'daily' ? true
        : r.kind === 'weekly' ? arr(r.days).indexOf(now.getDay()) >= 0
        : r.kind === 'monthly' ? now.getDate() === Math.min(r.dom || 1, new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate())
        : false;
      if(due && todays.indexOf(str(r.text)) < 0) todays.push(str(r.text));
    });
    if(todays.length){
      out.unshift(line(A, '🎯', todays[0], 0, { sub: 'Your one thing' + (todays.length > 1 ? ', and ' + (todays.length - 1) + ' more after it' : '') }));
    }
    return out;
  }

  /* ── Business Manager — business-manager/index.html ──
     Only a real book: s.v truthy (L3007), setup.done, and not the example business.
     Jobs today = todayJobs() (L3162) less the finished ones, as the morning brief does (L3199).
     Bills = repeats[] through repeatDates() (L4295), only the ones the app itself would warn
     about (repWarn, L4294). Tax dates = open to-dos with cat 'tax', by effDue() (L4911).
     NEVER read here: invoices, job totals, crew rates, the bank balance. Those are pay. */
  function readBiz(t){
    var out = [], S = lsJ('bizmgr_v1');
    if(!S || !S.v || !S.setup || !S.setup.done || S.setup.demo) return out;
    var A = 'biz', KE = S.region === 'ke', quotes = S.mode === 'quotes', F = (S.features && typeof S.features === 'object') ? S.features : {};
    function feat(k){ return !!F[k] && !quotes; }
    function money0(n){ n = Math.round(+n || 0); return KE ? 'KES ' + Math.abs(n).toLocaleString('en-KE') : '$' + Math.abs(n).toLocaleString('en-US'); }
    function cust(id){ var c = arr(S.customers).filter(function(x){ return x && x.id === id; })[0]; return c ? str(c.name) : ''; }
    function clock(hm){ var m = /^(\d{1,2}):(\d{2})$/.exec(str(hm)); if(!m) return ''; var h = +m[1]; return ((h % 12) || 12) + ':' + m[2] + (h < 12 ? ' am' : ' pm'); }
    var base = APPS.biz.url;

    if(feat('schedule')) arr(S.jobs).filter(function(j){
      return j && okDate(j.date) && j.status !== 'lost' && j.status !== 'closed' && j.status !== 'done';
    }).sort(function(a, b){ return (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')); }).forEach(function(j){
      var d = daysTo(j.date, t); if(d < 0 || d > FAR) return;
      var who = cust(j.customerId), what = str(j.title) || 'A job';
      var txt = (d === 0 ? (clock(j.time) ? clock(j.time) + ': ' : '') : '') + what + (who ? ' for ' + who : '') + (d === 0 ? '' : ', ' + when(j.date, t) + (clock(j.time) ? ' at ' + clock(j.time) : ''));
      out.push(line(A, '🧰', txt, d, { url: base + '#job/' + encodeURIComponent(j.id), sub: d === 0 ? 'Job today' : 'Job' }));
    });

    var BIG = KE ? 20000 : 500;
    function every(r){ var e = Math.round(num(r.every)); return e === 3 || e === 12 ? e : 1; }
    function warn(r){ return r.warn != null ? !!r.warn : (every(r) > 1 || num(r.amount) >= BIG); }
    function repeatDates(r, from, to){
      var res = [], d = parseD(from), end = parseD(to), ev = every(r);
      if(ev === 1){ var day = Math.min(31, Math.max(1, Math.round(num(r.day)) || 1));
        for(var y = d.getFullYear(), m = d.getMonth(), g = 0; g < 40 && new Date(y, m, 1) <= end; g++, m++){
          var last = new Date(y, m + 1, 0).getDate(), w1 = new Date(y, m, Math.min(day, last));
          if(w1 >= d && w1 <= end) res.push(ymd(w1)); }
        return res; }
      if(!okDate(r.next)) return res;
      var a = parseD(r.next), ad = a.getDate();
      for(var k = 0; k < 80; k++){ var y2 = a.getFullYear(), m2 = a.getMonth() + k * ev, last2 = new Date(y2, m2 + 1, 0).getDate(), w = new Date(y2, m2, Math.min(ad, last2));
        if(w > end) break; if(w >= d) res.push(ymd(w)); }
      return res;
    }
    if(feat('expenses')) arr(S.repeats).forEach(function(r){
      if(!r || !str(r.name) || !num(r.amount) || !warn(r)) return;
      repeatDates(r, t, addDays(t, FAR)).forEach(function(dt){
        var d = daysTo(dt, t), tail = ' is due ' + when(dt, t);
        out.push(line(A, '💳', str(r.name) + ' ' + money0(num(r.amount)) + tail, d, { url: base + '#ahead', sub: 'Business bill', ai: str(r.name) + tail + ' (a business bill)' }));
      });
    });

    if(feat('todos')) arr(S.todos).forEach(function(x){
      if(!x || x.done || x.cat !== 'tax' || !str(x.text) || !okDate(x.due)) return;
      var due = x.due;
      if(!KE){ var wd = parseD(due).getDay(); due = wd === 6 ? addDays(due, 2) : wd === 0 ? addDays(due, 1) : due; }
      var d = daysTo(due, t); if(d > FAR) return;
      out.push(d < 0 ? line(A, '🏛️', str(x.text) + ' was due ' + nice(due), 0, { url: base + '#todo', sub: 'Tax date, late', late: true })
                     : line(A, '🏛️', str(x.text) + ' is due ' + when(due, t), d, { url: base + '#todo', sub: 'Tax date' }));
    });
    return out;
  }

  /* ── Our Table — ourtable/index.html ──
     db.week = {Mon..Sun: recipe id | 'txt:own words'} and belongs to the week starting
     db.weekOf (local Monday). The app only clears a stale week when opened (L2941), so the
     Monday is checked here. Fallback: dj_ourtable_plan['YYYY-MM-DD'] = recipe id (L3579). */
  function readTable(t){
    var db = lsJ('dj_ourtable_v1'); if(!db) return [];
    var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], now = parseD(t), idx = (now.getDay() + 6) % 7;
    var mon = addDays(t, -idx), v = null;
    if(db.weekOf === mon && db.week && typeof db.week === 'object') v = db.week[DAYS[idx]];
    if(!v){ var plan = lsJ('dj_ourtable_plan'); if(plan) v = plan[t]; }
    if(!v) return [];
    var name = '';
    if(String(v).indexOf('txt:') === 0) name = str(String(v).slice(4));
    else { var r = arr(db.recipes).filter(function(x){ return x && x.id === v; })[0]; if(r) name = unEx(r.name); }
    return name ? [line('table', '🍽️', name, 0, { sub: 'Dinner tonight' })] : [];
  }

  /* ── Every Day — everyday/index.html ──
     dueOn / doneOn (L2841–2862). Monday = 0. A times-a-week card is never "left".
     The six cards the app puts there itself on first open are not the person's own yet,
     so nothing is shown until they have ticked one or made one. */
  function readEvery(t){
    var db = lsJ('dj_everyday_v1'); if(!db) return [];
    var hs = arr(db.habits).filter(function(h){ return h && str(h.name); }), log = (db.log && typeof db.log === 'object') ? db.log : {};
    var SEED = ['Walk outside','Morning pills','Call someone','Read a bit','Drink water','Quiet time'];
    var ticked = Object.keys(log).some(function(k){ return log[k] && typeof log[k] === 'object' && Object.keys(log[k]).length; });
    var own = hs.some(function(h){ return SEED.indexOf(str(h.name)) < 0; });
    if(!hs.length || (!ticked && !own)) return [];
    if(db.off && db.off[t]) return [];
    var idx = (parseD(t).getDay() + 6) % 7, dayLog = (log[t] && typeof log[t] === 'object') ? log[t] : {};
    var due = hs.filter(function(h){ var n = +h.per; if(n >= 1 && n <= 6) return false; return (Array.isArray(h.days) ? h.days : [0,1,2,3,4,5,6]).indexOf(idx) >= 0; });
    var left = due.filter(function(h){ return !dayLog[h.id]; });
    if(!due.length) return [];
    if(!left.length) return [line('every', '🌞', 'Every card done for today', 0, { sub: due.length + ' of ' + due.length })];
    var names = left.slice(0, 3).map(function(h){ return str(h.name); }).join(', ') + (left.length > 3 ? ' and ' + (left.length - 3) + ' more' : '');
    return [line('every', '🌞', names, 0, { sub: left.length + (left.length === 1 ? ' habit' : ' habits') + ' left today' })];
  }

  /* ── Ahead of It — ahead-of-it/index.html ──
     aheadofit_v1.items (ahead_v1 only until the merged app has been opened once, as the house
     block's aheadKey() does). due = 'YYYY-MM-DD'; a handled item has had its due moved on
     (cycleDone, L3285), so a past due date means it is really overdue. amt is free text. */
  function readAhead(t){
    var h = lsJ('aheadofit_v1'); if(!h || !Array.isArray(h.items)) h = lsJ('ahead_v1');
    if(!h) return [];
    return arr(h.items).filter(function(it){ return it && str(it.n) && okDate(it.due) && String(it.id || '').indexOf('djex') !== 0 && !isEx(it.n); })
      .map(function(it){
        var d = daysTo(it.due, t), amt = str(it.amt).replace(/^\$\s*/, ''), nm = str(it.n) + (amt ? ' ($' + amt + ')' : '');
        if(d < 0) return line('ahead', '🧭', nm + ' is ' + (-d) + (d === -1 ? ' day' : ' days') + ' overdue', 0, { sub: 'Was due ' + nice(it.due), late: true });
        if(d > FAR) return null;
        return line('ahead', '🧭', nm + ' is due ' + when(it.due, t), d, { sub: 'Coming due' });
      }).filter(Boolean);
  }

  /* ── Who's Coming — whoscoming/index.html ──
     Not answered = peopleOf(a.groupId).filter(p => !a.answers[p.id]) over asks not closed
     (L2861–2863). a.when is the optional "answer by" date; the app never compares it with
     today, so here an ask with no date, or one already past, sits under This week / Today. */
  function readWhos(t){
    var db = lsJ('dj_whoscoming_v1'); if(!db) return [];
    var out = [];
    arr(db.asks).forEach(function(a){
      if(!a || a.closed || a.id === 'tourask' || !str(a.q) || isEx(a.q)) return;
      var g = arr(db.groups).filter(function(x){ return x && x.id === a.groupId; })[0];
      var ans = (a.answers && typeof a.answers === 'object') ? a.answers : {};
      var wait = arr(g && g.people).filter(function(p){ return p && str(p.name) && !ans[p.id]; });
      if(!wait.length) return;
      var names = wait.slice(0, 3).map(function(p){ return str(p.name); }).join(', ') + (wait.length > 3 ? ' and ' + (wait.length - 3) + ' more' : '');
      var q = str(a.q); if(q.length > 60) q = q.slice(0, 58) + '…';
      var d = 1, tail = '';
      if(okDate(a.when)){ var dd = daysTo(a.when, t); if(dd > FAR) return; d = Math.max(0, dd); tail = dd < 0 ? '. Answers were wanted by ' + nice(a.when) : '. Answer by ' + when(a.when, t); }
      out.push(line('whos', '🙋', names + (wait.length === 1 ? ' has' : ' have') + ' not answered' + tail, d, { sub: '“' + q + '”', url: APPS.whos.url + '?dj_go=answers' }));
    });
    return out;
  }

  /* ── My Circle — circle/index.html ──
     Who may be shown follows djCircle.summary() (house block): nobody when share.people is
     false, never a person marked private. Birthday needs bm and bd (daysTo, L2891). */
  function readCircle(t){
    var c = lsJ('dj_circle_v1'); if(!c) return [];
    if(c.share && c.share.people === false) return [];
    var now = parseD(t), out = [];
    arr(c.people).forEach(function(p){
      if(!p || !str(p.name) || p.private) return;
      var bm = +p.bm, bd = +p.bd; if(!(bm >= 1 && bm <= 12 && bd >= 1 && bd <= 31)) return;
      var nx = new Date(now.getFullYear(), bm - 1, bd); if(nx < now) nx = new Date(now.getFullYear() + 1, bm - 1, bd);
      var d = Math.round((nx - now) / 86400000); if(d > FAR) return;
      out.push(line('circle', '🎂', str(p.name) + '’s birthday is ' + (d === 0 ? 'today' : when(ymd(nx), t)), d, { sub: str(p.rel) || 'Birthday' }));
    });
    return out;
  }

  /* Family Money Dashboard is not read at all in this version. With a passcode on, its data
     key holds 'ENC1:…' (familydash/index.html, sealNow L6155) and could not be read anyway. */
  function moneyLocked(){
    return ['dj_familydash_v1', 'dj_familydash_practice'].some(function(k){ return String(lsRaw(k) || '').slice(0, 5) === 'ENC1:'; });
  }

  var READERS = [readOneThing, readBiz, readTable, readEvery, readAhead, readWhos, readCircle];
  function gather(t){
    var all = [];
    READERS.forEach(function(fn){ try{ all = all.concat(fn(t) || []); }catch(e){} });
    return all.filter(function(l){ return l && l.text && typeof l.d === 'number' && l.d >= 0 && l.d <= FAR; });
  }

  var SHOWN = { today:[], week:[], later:[] };
  function rows(list){
    return '<div class="list">' + list.map(function(l){
      return '<a class="row' + (l.late ? ' late' : '') + '" href="' + esc(l.url) + '"><span class="em" aria-hidden="true">' + l.em + '</span><span class="tx"><b>' + esc(l.text) + '</b><span>' + esc((l.sub ? l.sub + ' · ' : '') + l.app) + '</span></span><span class="go" aria-hidden="true">›</span></a>';
    }).join('') + '</div>';
  }
  function section(id, title, sub, list, none){
    return '<section id="' + id + '"><h2>' + title + '</h2><p class="sub">' + sub + '</p>' + (list.length ? rows(list) : '<div class="list"><p class="none">' + none + '</p></div>') + '</section>';
  }
  function render(){
    var now = new Date(), t = ymd(now), all = gather(t);
    var byDay = function(a, b){ return a.d - b.d; };
    SHOWN.today = all.filter(function(l){ return l.d === 0; });
    SHOWN.week  = all.filter(function(l){ return l.d >= 1 && l.d <= WEEK; }).sort(byDay);
    SHOWN.later = all.filter(function(l){ return l.d > WEEK; }).sort(byDay);
    document.getElementById('date').textContent = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()] + ' ' + now.getDate() + ' ' + MON[now.getMonth()];
    var main = document.getElementById('main'), ask = document.getElementById('ask');
    if(!all.length){
      main.innerHTML = '<div class="empty" id="empty"><p><b>Open an app and add something, and it will show up here.</b></p>'
        + '<div class="list">'
        + '<a class="row" href="' + APPS.nownext.url + '"><span class="em" aria-hidden="true">🎯</span><span class="tx"><b>Pick your one thing for today</b><span>One Thing</span></span><span class="go" aria-hidden="true">›</span></a>'
        + '<a class="row" href="' + APPS.ahead.url + '"><span class="em" aria-hidden="true">🧭</span><span class="tx"><b>Put in one bill or renewal with its date</b><span>Ahead of It</span></span><span class="go" aria-hidden="true">›</span></a>'
        + '<a class="row" href="' + APPS.circle.url + '"><span class="em" aria-hidden="true">🎂</span><span class="tx"><b>Add someone and their birthday</b><span>My Circle</span></span><span class="go" aria-hidden="true">›</span></a>'
        + '</div></div>';
      ask.style.display = 'none';
    } else {
      main.innerHTML = section('secToday', 'Today', 'What is on your plate right now', SHOWN.today, 'Nothing down for today.')
        + section('secWeek', 'This week', 'The next seven days', SHOWN.week, 'Nothing in the next seven days.')
        + section('secLater', 'Coming up', 'The next two months, so nothing sneaks up on you', SHOWN.later, 'Nothing further out yet.');
      ask.style.display = '';
    }
    var notes = '';
    if(moneyLocked()) notes += '<p class="small" id="moneyNote">🔒 Family Money is locked with a passcode, so nothing from it is on this page and nothing from it is ever sent.</p>';
    notes += '<p class="small">Today can only see apps opened in the same place as this page. On an iPhone, an app added to the Home Screen keeps its own things apart, so it will not show here yet.</p>';
    document.getElementById('notes').innerHTML = notes;
  }

  /* ── ✨ What should I know? ──
     Sends ONLY the lines on the screen, and shows the exact words first, as the house does
     (confirmWords in any app's house block). Business bills go without their amount, and any
     long run of digits is taken out, so no pay figure and no account number can ride along.
     The door is the one in control/ai.json — the same Worker and the same body the house sends. */
  function scrub(s){ return String(s).replace(/\d[\d\- ]{6,}\d/g, '[number left out]'); }
  function words(){
    function block(title, list){ return title + ':\n' + (list.length ? list.map(function(l){ return '- ' + scrub((l.ai || l.text) + (l.sub && !l.ai ? ' [' + l.sub + ']' : '')); }).join('\n') : '- nothing'); }
    return 'Here is what my apps say about my days. Use only this; do not invent anything.\n\n'
      + block('Today', SHOWN.today) + '\n\n' + block('This week', SHOWN.week) + '\n\n' + block('Coming up, over the next two months', SHOWN.later)
      + '\n\nAnswer in exactly three short, warm, plain sentences, each on its own line: first, what matters most today; second, one thing coming that is easy to miss; third, one small thing that would make the week easier.';
  }
  var bg = document.getElementById('sheetBg'), sh = document.getElementById('sheet');
  function closeSheet(){ bg.classList.remove('on'); sh.innerHTML = ''; }
  bg.addEventListener('click', function(e){ if(e.target === bg) closeSheet(); });
  var CFG = null;
  function aiConfig(){
    if(CFG) return Promise.resolve(CFG);
    return fetch('../../control/ai.json?cb=' + Math.floor(Date.now() / 600000)).then(function(r){ return r.json(); }).then(function(j){ CFG = j || {}; return CFG; }, function(){ return {}; });
  }
  function copyWords(text, btn){
    function manual(){ var ta = document.getElementById('words'); if(ta){ try{ ta.focus(); ta.select(); }catch(e){} } btn.textContent = 'Press and hold the words to copy'; }
    try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ btn.textContent = 'Copied ✓ now paste it into your own AI'; }, manual); else manual(); }catch(e){ manual(); }
  }
  function showAnswer(text){
    var a = document.getElementById('answer');
    a.textContent = text;
    var s = document.createElement('small'); s.textContent = 'From Daraja’s own AI, reading only the lines above. It can be wrong; the lines are the truth.';
    a.appendChild(s); a.style.display = 'block';
    try{ a.scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
  }
  document.getElementById('ask').addEventListener('click', function(){
    render();   /* the words must match what is on the screen this second */
    var text = words();
    aiConfig().then(function(c){
      var door = c && c.endpoint;
      sh.innerHTML = '<h3 id="shT">What should I know?</h3>'
        + '<p>' + (door ? 'These exact words go to <b>Daraja’s own AI</b>, and nothing else does.' : 'Daraja’s own AI is not switched on, so nothing is sent from here. You can copy these words into your own AI.') + '</p>'
        + '<textarea id="words" readonly aria-label="The words that would be sent"></textarea>'
        + (door ? '<button type="button" class="primary" id="send" style="width:100%">Send it →</button>' : '<button type="button" class="primary" id="copy" style="width:100%">Copy the words</button>')
        + '<p id="wait" style="display:none;margin:10px 0 0"></p>'
        + '<div class="two">' + (door ? '<button type="button" class="link" id="copy">copy the words instead</button>' : '<span></span>') + '<button type="button" class="link" id="cancel">cancel</button></div>';
      sh.querySelector('#words').value = text;
      bg.classList.add('on');
      sh.querySelector('#cancel').onclick = closeSheet;
      sh.querySelector('#copy').onclick = function(){ copyWords(text, this); };
      var send = sh.querySelector('#send');
      if(send) send.onclick = function(){
        var w = sh.querySelector('#wait'); send.disabled = true; send.textContent = 'Thinking, a few seconds…';
        var code = ''; try{ code = localStorage.getItem('dj_tester_code') || ''; }catch(e){}
        fetch(door, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ prompt:text, app:'today', want:'text', code:code }) })
          .then(function(r){ return r.json().then(function(j){ if(!r.ok || !j || !j.text) throw new Error((j && j.error) || ('HTTP ' + r.status)); return j.text; }); })
          .then(function(ans){ closeSheet(); showAnswer(String(ans).trim()); })
          .catch(function(e){
            send.style.display = 'none'; w.style.display = 'block';
            w.textContent = 'That did not work (' + ((e && e.message) || 'no answer') + '). Nothing is lost. You can copy the words into your own AI instead.';
            var cp = sh.querySelector('#copy'); cp.className = 'primary'; cp.style.width = '100%'; cp.textContent = 'Copy the words'; sh.insertBefore(cp, sh.querySelector('.two'));
          });
      };
    });
  });

  try{ render(); }catch(e){ document.getElementById('main').innerHTML = '<div class="empty"><p>This page could not read the phone just now. Close it and open it again.</p></div>'; }
  /* coming back from an app: read again, so the page is never showing the visit before */
  window.addEventListener('pageshow', function(){ try{ render(); }catch(e){} });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ try{ render(); }catch(e){} } });
  window.__djToday = { gather:gather, words:words };   /* for the test script only */
})();
</script>
