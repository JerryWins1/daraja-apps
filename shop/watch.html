<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="A 2-minute Daraja app video — watch it work, then try it free">
<meta property="og:type" content="video.other">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<title>Daraja Store — watch</title>
<style>
  :root{
    --paper:#f6f1e7; --ink:#2b2620; --soft:#7a7062; --line:#e5dccb;
    --warm:#b3502f; --green:#3f7452; --gold:#c9982a;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; font-size:17px;
  }
  a{text-decoration:none; color:inherit;}
  #back{align-self:flex-start; margin:14px 16px 0; color:var(--soft); font-weight:700; font-size:15px;}

  #movie{
    position:relative; width:min(700px,94vw); aspect-ratio:4/3; margin-top:10px;
  }
  #movie.live{ aspect-ratio:auto; height:min(84vh, 900px); }
  #movie.tall{ aspect-ratio:auto; height:min(76vh, 860px); }
  #movie.tall #cap{ padding-bottom:.7em; }
  #movie.live #appFrame{ height:calc(100% - 10px) !important; }
  #movie{
    background:#221e18; border-radius:20px; overflow:hidden;
    box-shadow:0 24px 60px rgba(60,45,20,.35);
  }
  /* slide area */
  #slide{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:26px;
  }
  #slideEm{font-size:clamp(64px,14vw,110px); filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));}
  #slideName{font-family:var(--serif); color:#f5efe2; font-size:clamp(22px,4.5vw,34px); font-weight:700;}
  #slidePrice{color:var(--gold); font-weight:800; font-size:clamp(14px,2.5vw,18px); letter-spacing:.06em;}
  #cap{
    position:absolute; left:0; right:0; bottom:0; padding:2em 1.2em 1.1em; text-align:center;
    background:linear-gradient(transparent, rgba(20,17,12,.94) 35%);
  }
  #capText{
    display:inline-block; background:rgba(0,0,0,.6); border-radius:.6em; padding:.55em 1em;
    color:#fff; font-size:clamp(14px,2.6vw,19px); font-weight:600; line-height:1.5; max-width:92%;
  }
  #prog{position:absolute; top:0; left:0; height:5px; background:var(--warm); width:0; transition:width .5s; z-index:5;}

  /* play overlay */
  #ov{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:radial-gradient(500px 380px at 50% 38%, #35301f 0%, rgba(24,20,14,.97) 75%);
    color:#f5efe2; padding:24px;
  }
  #ov .em{font-size:60px;}
  #ov h2{font-family:var(--serif); font-size:clamp(20px,4vw,30px);}
  #ov p{opacity:.8; font-size:clamp(13px,2.4vw,16px); max-width:420px; line-height:1.5;}
  #bigPlay{
    width:clamp(80px,14vw,104px); height:clamp(80px,14vw,104px); border-radius:50%;
    background:var(--warm); border:none; color:#fff; font-size:clamp(28px,5vw,40px);
    cursor:pointer; padding-left:.15em; box-shadow:0 12px 40px rgba(179,80,47,.5);
  }
  #bigPlay:hover{transform:scale(1.05);}
  #endBtns{display:none; gap:12px; flex-wrap:wrap; justify-content:center;}
  .btn{
    display:inline-block; font-weight:800; font-size:16px; padding:13px 26px;
    border-radius:999px; border:none; cursor:pointer; font-family:inherit;
  }
  .btn.try{background:#fff; color:var(--ink);}
  .btn.get{background:var(--green); color:#fff;}

  #ctrl{display:flex; gap:10px; padding:14px; flex-wrap:wrap; justify-content:center;}
  .cbtn{background:#fff; border:1.5px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  #ver{color:#c9c0ae; font-size:11px; padding-bottom:18px;}
</style>
</head>
<body>

<a id="back" href="index.html">‹ Back to the store</a>

<div id="movie">
  <div id="prog"></div>
  <div id="slide">
    <div id="slideEm"></div>
    <div id="slideName"></div>
    <div id="slidePrice"></div>
  </div>
  <div id="appView" style="display:none;position:absolute;inset:0;background:#17181C;">
    <div style="position:absolute;inset:10px 0 0 0;display:flex;justify-content:center;">
      <iframe id="appFrame" style="width:min(390px,94%);height:calc(100% - 10px);border:none;border-radius:14px 14px 0 0;background:#fff;" title="the app"></iframe>
    </div>
    <div id="shield" style="position:absolute;inset:0;"></div>
    <div id="liveBar" style="display:none;position:absolute;left:0;right:0;bottom:0;background:rgba(20,17,12,.92);padding:8px 12px;text-align:center;font:700 13px -apple-system,Segoe UI,sans-serif;color:#f5efe2;z-index:25;">
      👆 You're using the <span style="color:var(--gold)">real app</span> — go ahead, tap around.
      <button onclick="restart()" style="margin-left:10px;background:none;border:1px solid #6b6353;color:#d8cfbc;border-radius:999px;padding:5px 12px;font:700 12px -apple-system,sans-serif;cursor:pointer;">↻ Replay the tour</button>
    </div>
  </div>
  <div id="cap" style="display:none"><span id="capText"></span></div>
  <div id="ov">
    <div class="em" id="ovEm"></div>
    <h2 id="ovTitle"></h2>
    <p id="ovSub">Two minutes: what it does, how it works, and why it's worth it. Sound on.</p>
    <button id="bigPlay" onclick="play()">▶</button>
    <div id="endBtns">
      <button class="btn" id="hereBtn" style="background:var(--gold);color:#221;" onclick="tryHere()">👆 Try it right here</button>
      <a class="btn try" id="tryBtn" target="_blank">Open it full size</a>
      <a class="btn get" id="getBtn" target="_blank">Get it</a>
    </div>
  </div>
</div>

<div id="ctrl">
  <button class="cbtn" id="pBtn" onclick="togglePause()" style="display:none">⏸ Pause</button>
  <button class="cbtn" onclick="restart()">↻ Start over</button>
  <button class="cbtn" id="sndBtn" onclick="toggleSound()">🔊 Sound on</button>
</div>
<div id="ver">Daraja Store video player v2.1 · 2026-09-05 — watch the tour, then use the real app right here</div>

<script>document.write('<scr'+'ipt src="apps_data.js?v='+Date.now()+'"></scr'+'ipt>')</script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('app') || 'nownext';
const app = APPS[id] || APPS.nownext;
const EXTRA = (app.extra && params.get('mode') && app.extra[params.get('mode')]) || null; /* extra short videos, e.g. ?mode=draft */
const MODE = (params.get('mode')==='train' && app.train) ? 'train' : EXTRA ? 'extra' : 'overview';
const LINES = MODE==='train' ? app.train : EXTRA ? EXTRA.lines : app.lines;
const $ = x=>document.getElementById(x);

$('slideEm').textContent = app.em;
$('slideName').textContent = app.name;
$('slidePrice').textContent = app.price;
$('ovEm').textContent = app.em;
$('ovTitle').textContent = app.name;
const freshTry = app.try + (app.try.includes('?')?'&':'?') + 'v=' + Date.now(); /* the store ALWAYS hands out the newest copy */
$('tryBtn').href = freshTry; $('getBtn').href = freshTry;
document.title = app.name + (MODE==='train' ? ' — training' : ' — 2-minute video') + ' · Daraja Store';
if(EXTRA){
  document.title = app.name + ' — ' + EXTRA.title + ' · Daraja Store';
  $('ovTitle').textContent = app.name + ' — ' + EXTRA.title;
  $('ovSub').textContent = EXTRA.sub || 'A short one. Sound on.';
  $('slidePrice').textContent = '▶ ' + EXTRA.title;
}
if(MODE==='train'){
  $('ovTitle').textContent = app.name + ' — training';
  $('ovSub').textContent = 'Five minutes: how to set it up and use it, step by step. Sound on.';
  $('slidePrice').textContent = '🎓 Training';
}

let i=-1, playing=false, paused=false, soundOn=true;
function speak(text, cb){
  if(!soundOn || !window.speechSynthesis){ setTimeout(cb, Math.max(2600, text.length*60)); return; }
  /* smooth-talk pass: dashes and dots become natural beats, not run-ons */
  const spoken = text.replace(/\s+\u2014\s+/g, '\u2026 ').replace(/\s+\u00b7\s+/g, '\u2026 ').replace(/\u2014/g, ',');
  const u = new SpeechSynthesisUtterance(spoken);
  u.rate=.95; u.pitch=1;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>/Samantha/i.test(x.name))
        || vs.find(x=>/Google US English/i.test(x.name))
        || vs.find(x=>/Aria|Jenny|Michelle|Natural/i.test(x.name))
        || vs.find(x=>/^en[-_]US/i.test(x.lang||''));
  if(v) u.voice=v;
  let done=false;
  const fin=()=>{ if(done) return; done=true; cb(); };
  u.onend=fin; u.onerror=fin;
  speechSynthesis.speak(u);
  /* safety net only \u2014 generous, and it silences a stuck line instead of talking over it */
  setTimeout(function(){ if(!done){ try{ speechSynthesis.cancel(); }catch(e){} fin(); } }, 4000 + spoken.length*130);
}
function play(){
  $('ov').style.display='none'; $('cap').style.display='block';
  const fr=$('appFrame');
  try{ localStorage.setItem('daraja_intro_'+id,'1'); }catch(e){}
  try{
    var ck='fs_coach_'+id, cs=JSON.parse(localStorage.getItem(ck)||'{}');
    cs.seen=1; localStorage.setItem(ck, JSON.stringify(cs));
  }catch(e){}
  if(fr && !fr.src){
    fr.src = app.try + (app.try.includes('?')?'&':'?') + 'v=' + Date.now();
    fr.addEventListener('load', function(){
      var quiet=function(){ try{
        const d=fr.contentDocument;
        if(d){
          /* silence ANY app's own first-visit overlay while the tour narrates —
             one generic list so new apps never photo-bomb the video again */
          ['introOv','fsIntro','welcome','introCard','firstVisit','resumeOv','fsBar','fsPill','tabIntroOv'].forEach(function(id){
            var el=d.getElementById(id); if(el) el.style.display='none';
          });
          /* keep every link inside this window during the tour */
          d.querySelectorAll('a[target]').forEach(function(a){ a.removeAttribute('target'); });
          if(fr.contentWindow && !fr.contentWindow.__tourTamed){
            fr.contentWindow.__tourTamed=true;
            fr.contentWindow.open=function(u){ if(u) fr.contentWindow.location.href=u; return null; };
          }
        }
      }catch(e){} };
      setTimeout(quiet, 900); setTimeout(quiet, 2500);
      setInterval(function(){ if(playing) quiet(); }, 3000); /* only while the tour narrates — trying the real app keeps its own intros */
    });
  }
  $('appView').style.display='block'; $('slide').style.display='none';
  $('movie').classList.add('tall'); /* the app is portrait — give it room, keep captions off its content */
  $('pBtn').style.display='inline-block';
  playing=true; paused=false; i=-1;
  if(window.speechSynthesis) speechSynthesis.getVoices();
  next();
}
function lineText(l){ return typeof l==='string' ? l : l.t; }
let pointDot=null, pointTmr=null;
function pointAt(sel){
  try{
    const fr=$('appFrame'); if(!fr||!fr.contentDocument) return;
    const el=fr.contentDocument.querySelector(sel); if(!el) return;
    try{ el.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
    setTimeout(function(){ try{
      const er=el.getBoundingClientRect(), frr=fr.getBoundingClientRect(), mv=$('movie').getBoundingClientRect();
      if(er.width===0) return;
      if(!pointDot){
        pointDot=document.createElement('div');
        pointDot.style.cssText='position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(179,80,47,.55);border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:30;pointer-events:none;transition:all .7s cubic-bezier(.5,0,.3,1);';
        $('movie').appendChild(pointDot);
      }
      pointDot.style.display='block';
      pointDot.style.left=(frr.left-mv.left+er.left+er.width/2-17)+'px';
      pointDot.style.top =(frr.top -mv.top +er.top +er.height/2-17)+'px';
      pointDot.animate([{transform:'scale(1)'},{transform:'scale(.7)'},{transform:'scale(1)'}],{duration:600,iterations:3});
      clearTimeout(pointTmr);
      pointTmr=setTimeout(function(){ if(pointDot) pointDot.style.display='none'; }, 4500);
    }catch(e){} }, 650);
  }catch(e){}
}
function direct(l){
  if(typeof l==='string') return;
  try{
    const fr=$('appFrame');
    if(l.js && fr && fr.contentWindow) fr.contentWindow.eval(l.js);
  }catch(e){}
  if(l.point) setTimeout(function(){ pointAt(l.point); }, 350);
}
function next(){
  if(!playing || paused) return;
  i++;
  if(i >= LINES.length){ end(); return; }
  const l = LINES[i];
  direct(l);
  $('capText').textContent = lineText(l);
  $('prog').style.width = Math.round(((i+1)/LINES.length)*100)+'%';
  speak(lineText(l), ()=>setTimeout(next, 950));
}
function end(){
  playing=false;
  $('cap').style.display='none'; $('pBtn').style.display='none';
  $('ovTitle').textContent = 'Ready to try '+app.name+'?';
  $('ovSub').textContent = 'It opens right in your browser — nothing to install to try it.';
  $('bigPlay').style.display='none';
  $('endBtns').style.display='flex';
  $('ov').style.display='flex';
}
function restart(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  $('movie').classList.remove('live');
  $('shield').style.display='block'; $('liveBar').style.display='none';
  playing=false; paused=false;
  $('bigPlay').style.display='flex'; $('endBtns').style.display='none';
  $('ovTitle').textContent = app.name;
  $('ovSub').textContent = 'Two minutes: what it does, how it works, and why it\'s worth it. Sound on.';
  $('prog').style.width='0';
  $('pBtn').textContent='⏸ Pause';
  play();
}
function togglePause(){
  if(!playing) return;
  paused=!paused;
  $('pBtn').textContent = paused ? '▶ Resume' : '⏸ Pause';
  if(window.speechSynthesis){ paused ? speechSynthesis.pause() : speechSynthesis.resume(); }
  if(!paused && !(window.speechSynthesis&&speechSynthesis.speaking)) next();
}
function tryHere(){
  $('ov').style.display='none';
  $('appView').style.display='block';
  $('shield').style.display='none';
  $('liveBar').style.display='block';
  $('movie').classList.add('live'); /* movie box becomes a full-height app window */
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function toggleSound(){
  soundOn=!soundOn;
  $('sndBtn').textContent = soundOn?'🔊 Sound on':'🔇 Sound off';
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
}
if(window.speechSynthesis) speechSynthesis.getVoices();
</script>
</body>
</html>
<script>
/* ===== Sound rescue v1 (2026-08-30) =====
   1. Chrome quietly pauses long speech — a heartbeat keeps resuming it.
   2. iPhones mute the narrator when the side silent switch is on — code can't
      fix that, so we say it plainly on the page. */
(function(){
try{
  if(window.speechSynthesis){
    setInterval(function(){ try{
      if(speechSynthesis.speaking && !speechSynthesis.paused) return;
      if(speechSynthesis.speaking && speechSynthesis.paused && !(typeof paused!=='undefined' && paused)) speechSynthesis.resume();
    }catch(e){} }, 3000);
    try{ speechSynthesis.getVoices(); }catch(e){}
  }
  setTimeout(function(){
    if(document.getElementById('sndHelp')) return;
    var d=document.createElement('div'); d.id='sndHelp';
    d.innerHTML='🔇 <b>No voice?</b> Turn the volume up — and on iPhone, flip the little <b>silent switch</b> on the side. Then tap ↻ Start over.';
    d.style.cssText='max-width:560px;margin:2px auto 14px;text-align:center;font:600 12.5px/1.5 -apple-system,Segoe UI,sans-serif;color:#8a8272;padding:0 16px;';
    var ctrl=document.getElementById('ctrl');
    if(ctrl && ctrl.parentNode) ctrl.parentNode.insertBefore(d, ctrl.nextSibling);
    else document.body.appendChild(d);
  }, 900);
}catch(e){}
})();
</script>
