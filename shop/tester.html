<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How testing works — Daraja Store</title>
<style>
  :root{
    --paper:#f6f1e7; --ink:#2b2620; --soft:#7a7062; --line:#e5dccb;
    --warm:#b3502f; --green:#3f7452; --gold:#c9982a;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; font-size:17px;
  }
  a{text-decoration:none; color:inherit;}
  #back{align-self:flex-start; margin:14px 16px 0; color:var(--soft); font-weight:700; font-size:15px;}

  #movie{
    position:relative; width:min(700px,94vw); aspect-ratio:4/3; margin-top:10px;
    background:#1f2b23; border-radius:20px; overflow:hidden;
    box-shadow:0 24px 60px rgba(40,55,40,.4);
  }
  #prog{position:absolute; top:0; left:0; height:5px; background:var(--gold); width:0; transition:width .5s; z-index:5;}
  #slide{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center; padding:28px;
    color:#f2ede2;
  }
  #stepNum{font-size:15px; font-weight:800; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; min-height:20px;}
  #stepEm{font-size:clamp(60px,13vw,100px); filter:drop-shadow(0 8px 24px rgba(0,0,0,.4)); transition:opacity .4s;}
  #stepTitle{font-family:var(--serif); font-size:clamp(20px,4.2vw,30px); max-width:480px; line-height:1.3; min-height:1.3em;}
  #cap{
    position:absolute; left:0; right:0; bottom:0; padding:2em 1.2em 1.1em; text-align:center;
    background:linear-gradient(transparent, rgba(14,20,15,.94) 35%);
  }
  #capText{
    display:inline-block; background:rgba(0,0,0,.6); border-radius:.6em; padding:.55em 1em;
    color:#fff; font-size:clamp(14px,2.6vw,18.5px); font-weight:600; line-height:1.5; max-width:92%;
  }
  #ov{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:radial-gradient(520px 400px at 50% 38%, #2c4033 0%, rgba(14,20,15,.97) 75%);
    color:#f2ede2; padding:24px;
  }
  #ov h2{font-family:var(--serif); font-size:clamp(21px,4.2vw,30px);}
  #ov p{opacity:.82; font-size:clamp(13px,2.4vw,16px); max-width:460px; line-height:1.55;}
  #bigPlay{
    width:clamp(80px,14vw,104px); height:clamp(80px,14vw,104px); border-radius:50%;
    background:var(--gold); border:none; color:#221; font-size:clamp(28px,5vw,40px);
    cursor:pointer; padding-left:.15em; box-shadow:0 12px 40px rgba(201,152,42,.45);
  }
  #endBtns{display:none; gap:12px; flex-wrap:wrap; justify-content:center;}
  .btn{display:inline-block; font-weight:800; font-size:16px; padding:13px 24px; border-radius:999px; border:none; cursor:pointer; font-family:inherit;}
  .btn.shelf{background:#fff; color:var(--ink);}
  .btn.fs{background:var(--warm); color:#fff;}

  #ctrl{display:flex; gap:10px; padding:14px; flex-wrap:wrap; justify-content:center;}
  .cbtn{background:#fff; border:1.5px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  #ver{color:#c9c0ae; font-size:11px; padding-bottom:18px;}
</style>
</head>
<body>

<a id="back" href="index.html">‹ Back to the store</a>

<div id="movie">
  <div id="prog"></div>
  <div id="slide">
    <div id="stepNum"></div>
    <div id="stepEm">🧪</div>
    <div id="stepTitle"></div>
  </div>
  <div id="cap" style="display:none"><span id="capText"></span></div>
  <div id="ov">
    <div style="font-size:56px">🧪</div>
    <h2>How testing works</h2>
    <p>Three minutes. You're about to be our most important person: the honest customer. Sound on.</p>
    <button id="bigPlay" onclick="play()">▶</button>
    <div id="endBtns">
      <a class="btn shelf" href="index.html">🛍 Go to the shelves</a>
      <a class="btn fs" href="https://jerrywins1.github.io/daraja-apps/feedback-studio/" target="_blank">🎙 Open Feedback Studio</a>
    </div>
  </div>
</div>

<div id="ctrl">
  <button class="cbtn" id="pBtn" onclick="togglePause()" style="display:none">⏸ Pause</button>
  <button class="cbtn" onclick="restart()">↻ Start over</button>
  <button class="cbtn" id="sndBtn" onclick="toggleSound()">🔊 Sound on</button>
</div>
<div id="ver">Daraja tester guide v1.0 · 2026-08-28</div>

<script>
const S = [
 {n:'Welcome', em:'👋', t:'Thank you for testing with us.',
  say:"Welcome — and thank you. You're about to test apps from Daraja Studio, a small family business. Every app you'll try helps a student in Kenya stay in school. Here's the whole job, in three steps."},
 {n:'The one rule', em:'🛒', t:'Act like a buyer, not a friend.',
  say:"First, the one rule. Please don't test like our friend — test like a stranger with a wallet. Would YOU pay for this? Friends say 'looks great.' Buyers say 'I don't get it' and close the tab. We need the buyer. Honest beats nice, every single time."},
 {n:'Step 1', em:'🎬', t:'Watch the 2-minute video.',
  say:"Step one. On the store shelf, every app has a two-minute video: what it does, how it works, and why it's worth the price. Watch it like an ad you stumbled onto. Notice what confused you — that's gold."},
 {n:'Step 2', em:'📱', t:'Try it for real — 10 minutes.',
  say:"Step two. Press 'Try it' and use the app for real, on your own phone if you can. Put YOUR real stuff in — your tasks, your dates, your numbers. Ten minutes minimum. If something makes you stop and squint — remember exactly where."},
 {n:'Step 3', em:'🎙', t:'Tell us the truth — by talking.',
  say:"Step three — the fun part. Open Feedback Studio, our own app, and put the app you tested in its window. Press the red button, use the app again, and just SAY what you're thinking, out loud, as you go. 'This button's too small.' 'I don't know what this does.' 'Oh, that's nice.' All of it."},
 {n:'Step 3', em:'📋', t:'One tap builds your report.',
  say:"When you're done talking, tap 'Build the report,' then copy — and text or email it to Jerry. That's it. Five minutes of talking beats an hour of typing, and it tells us exactly where things went wrong."},
 {n:'What matters most', em:'💡', t:'Confusion is treasure. Say the price out loud.',
  say:"What matters most to us: the exact moment you got confused. The button you couldn't find. And one more thing — say out loud whether you'd pay the price on the shelf. If it's not worth it, say so. That answer is worth more than a hundred compliments."},
 {n:'Ready', em:'🚀', t:'That\'s the whole job. Go shopping.',
  say:"That's the whole job: watch the video, try it for real, talk your feedback. You're not just testing apps — you're helping a family business send kids to school. Head to the shelves and pick your first one. Thank you — truly."},
];
const $ = x=>document.getElementById(x);
let i=-1, playing=false, paused=false, soundOn=true;
function speak(text, cb){
  if(!soundOn || !window.speechSynthesis){ setTimeout(cb, Math.max(2400, text.length*55)); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate=.97;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v=>/Samantha|Google US English|en-US/i.test(v.name+v.lang));
  if(v) u.voice=v;
  let done=false; const fin=()=>{ if(!done){done=true; cb();} };
  u.onend=fin; u.onerror=fin;
  speechSynthesis.speak(u);
  setTimeout(fin, 1200 + text.length*90);
}
function play(){
  $('ov').style.display='none'; $('cap').style.display='block'; $('pBtn').style.display='inline-block';
  playing=true; paused=false; i=-1;
  if(window.speechSynthesis) speechSynthesis.getVoices();
  next();
}
function next(){
  if(!playing || paused) return;
  i++;
  if(i>=S.length){ end(); return; }
  $('stepNum').textContent=S[i].n; $('stepEm').textContent=S[i].em; $('stepTitle').textContent=S[i].t;
  $('capText').textContent=S[i].say;
  $('prog').style.width = Math.round(((i+1)/S.length)*100)+'%';
  speak(S[i].say, ()=>setTimeout(next,500));
}
function end(){
  playing=false;
  $('cap').style.display='none'; $('pBtn').style.display='none';
  $('ov').querySelector('h2').textContent='You\'re ready. Happy testing!';
  $('ov').querySelector('p').textContent='Pick an app from the shelves — and when you try one, talk to us through Feedback Studio.';
  $('bigPlay').style.display='none'; $('endBtns').style.display='flex';
  $('ov').style.display='flex';
}
function restart(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  playing=false; $('bigPlay').style.display='flex'; $('endBtns').style.display='none';
  $('ov').querySelector('h2').textContent='How testing works';
  $('ov').querySelector('p').textContent='Three minutes. You\'re about to be our most important person: the honest customer. Sound on.';
  $('prog').style.width='0'; $('pBtn').textContent='⏸ Pause';
  play();
}
function togglePause(){
  if(!playing) return;
  paused=!paused;
  $('pBtn').textContent = paused?'▶ Resume':'⏸ Pause';
  if(window.speechSynthesis){ paused?speechSynthesis.pause():speechSynthesis.resume(); }
  if(!paused && !(window.speechSynthesis&&speechSynthesis.speaking)) next();
}
function toggleSound(){
  soundOn=!soundOn;
  $('sndBtn').textContent = soundOn?'🔊 Sound on':'🔇 Sound off';
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
}
if(window.speechSynthesis) speechSynthesis.getVoices();
</script>
</body>
</html>
<script>
/* ===== Sound rescue v1 (2026-08-30) =====
   1. Chrome quietly pauses long speech — a heartbeat keeps resuming it.
   2. iPhones mute the narrator when the side silent switch is on — code can't
      fix that, so we say it plainly on the page. */
(function(){
try{
  if(window.speechSynthesis){
    setInterval(function(){ try{
      if(speechSynthesis.speaking && !speechSynthesis.paused) return;
      if(speechSynthesis.speaking && speechSynthesis.paused && !(typeof paused!=='undefined' && paused)) speechSynthesis.resume();
    }catch(e){} }, 3000);
    try{ speechSynthesis.getVoices(); }catch(e){}
  }
  setTimeout(function(){
    if(document.getElementById('sndHelp')) return;
    var d=document.createElement('div'); d.id='sndHelp';
    d.innerHTML='🔇 <b>No voice?</b> Turn the volume up — and on iPhone, flip the little <b>silent switch</b> on the side. Then tap ↻ Start over.';
    d.style.cssText='max-width:560px;margin:2px auto 14px;text-align:center;font:600 12.5px/1.5 -apple-system,Segoe UI,sans-serif;color:#8a8272;padding:0 16px;';
    var ctrl=document.getElementById('ctrl');
    if(ctrl && ctrl.parentNode) ctrl.parentNode.insertBefore(d, ctrl.nextSibling);
    else document.body.appendChild(d);
  }, 900);
}catch(e){}
})();
</script>
