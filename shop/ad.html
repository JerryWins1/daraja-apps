<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daraja Store — 30 seconds</title>
<style>
  :root{ --paper:#f6f1e7; --ink:#2b2620; --warm:#b3502f; --gold:#c9982a; --green:#3f7452; --serif:Georgia,'Times New Roman',serif; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#1c1712; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#f5efe2; padding:20px;
  }
  #stage{
    width:min(680px,94vw); aspect-ratio:16/10; position:relative; border-radius:22px;
    background:radial-gradient(600px 420px at 50% 40%, #2a2318 0%, #1c1712 80%);
    overflow:hidden; box-shadow:0 26px 70px rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:6%;
  }
  #line{
    font-family:var(--serif); font-size:clamp(22px,4.6vw,40px); line-height:1.3;
    font-weight:700; opacity:0; transform:translateY(14px); transition:all .55s ease;
    max-width:92%;
  }
  #line.show{opacity:1; transform:none;}
  #line .w{color:#e8905f;}
  #line .g{color:#e5c56b;}
  #line small{display:block; font-family:-apple-system,sans-serif; font-size:clamp(13px,2.2vw,17px); font-weight:600; color:#b8ab94; margin-top:14px; line-height:1.5;}
  #prog{position:absolute; top:0; left:0; height:5px; background:var(--warm); width:0; transition:width .5s; z-index:5;}
  #ov{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:rgba(20,16,11,.94); text-align:center; padding:22px;
  }
  #ov h2{font-family:var(--serif); font-size:clamp(22px,4.5vw,32px);}
  #ov h2 span{color:#e8905f;}
  #ov p{color:#b8ab94; font-size:clamp(13px,2.3vw,16px);}
  #bigPlay{
    width:clamp(80px,13vw,100px); height:clamp(80px,13vw,100px); border-radius:50%;
    background:var(--warm); border:none; color:#fff; font-size:clamp(28px,5vw,38px);
    cursor:pointer; padding-left:.14em; box-shadow:0 12px 44px rgba(179,80,47,.55);
  }
  #endBtn{display:none; background:#e5c56b; color:#221; font-weight:800; font-size:clamp(15px,2.6vw,19px); padding:15px 30px; border-radius:999px; text-decoration:none;}
  #ctrl{display:flex; gap:10px; padding:16px; justify-content:center;}
  .cbtn{background:#2a2318; border:1.5px solid #4a4030; color:#b8ab94; border-radius:999px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  #ver{color:#57503f; font-size:11px; padding-bottom:14px;}
</style>
</head>
<body>

<div id="stage">
  <div id="prog"></div>
  <div id="line"></div>
  <div id="ov">
    <h2>daraja <span>store</span> — in 30 seconds</h2>
    <p>Sound on. Worth it.</p>
    <button id="bigPlay" onclick="play()">▶</button>
    <a id="endBtn" href="index.html">🛍 Visit the store</a>
  </div>
</div>
<div id="ctrl">
  <button class="cbtn" onclick="restart()">↻ Again</button>
  <button class="cbtn" id="sndBtn" onclick="toggleSound()">🔊 Sound on</button>
</div>
<div id="ver">Daraja Store ad v1.0 · 2026-08-29 · share this page freely</div>

<script>
const S = [
 {h:'What if apps were <span class="w">simple</span> again?', v:"What if apps were simple again?"},
 {h:'One app that ends the <span class="w">morning yelling</span>.<small>Now &amp; Next — one thing at a time, for brains that run fast</small>', v:"One app that ends the morning yelling."},
 {h:'A book made from your <span class="g">mother\'s voice</span>.<small>In My Own Words — her stories, in her words, in print</small>', v:"A book made from your mother's voice."},
 {h:'One page that makes sure <span class="g">nothing is ever lost</span>.<small>The Key — free, forever</small>', v:"And one free page that makes sure nothing your family needs is ever lost."},
 {h:'No accounts. No ads.<br><span class="w">No subscriptions.</span><small>Pay once. Own it forever. Try everything free first.</small>', v:"No accounts. No ads. No subscriptions. Pay once, own it forever — and try everything free first."},
 {h:'Every purchase keeps a student in <span class="g">Kenya</span> in school.', v:"And every purchase helps keep a student in Kenya in school."},
 {h:'daraja <span class="w">store</span><small>Watch. Try. Take it home.</small>', v:"The Daraja Store. Watch, try, take it home."},
];
const $ = x=>document.getElementById(x);
let i=-1, playing=false, soundOn=true;
function speak(t, cb){
  if(!soundOn || !window.speechSynthesis){ setTimeout(cb, Math.max(2200, t.length*60)); return; }
  const u=new SpeechSynthesisUtterance(t); u.rate=.97;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/Samantha|Google US English|en-US/i.test(v.name+v.lang));
  if(v) u.voice=v;
  let done=false; const fin=()=>{ if(!done){done=true; cb();} };
  u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
  setTimeout(fin, 1100 + t.length*90);
}
function play(){
  $('ov').style.display='none'; playing=true; i=-1;
  if(window.speechSynthesis) speechSynthesis.getVoices();
  next();
}
function next(){
  if(!playing) return;
  i++;
  if(i>=S.length){ end(); return; }
  const el=$('line');
  el.classList.remove('show');
  setTimeout(()=>{ el.innerHTML=S[i].h; el.classList.add('show'); },220);
  $('prog').style.width = Math.round(((i+1)/S.length)*100)+'%';
  speak(S[i].v, ()=>setTimeout(next, 420));
}
function end(){
  playing=false;
  $('bigPlay').style.display='none';
  $('endBtn').style.display='inline-block';
  $('ov').querySelector('h2').innerHTML='Simple. Honest. <span>Yours.</span>';
  $('ov').querySelector('p').textContent='Everything is free to try, right now.';
  $('ov').style.display='flex';
}
function restart(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  playing=false;
  $('bigPlay').style.display='inline-block'; $('endBtn').style.display='none';
  $('ov').querySelector('h2').innerHTML='daraja <span>store</span> — in 30 seconds';
  $('ov').querySelector('p').textContent='Sound on. Worth it.';
  $('prog').style.width='0';
  play();
}
function toggleSound(){
  soundOn=!soundOn;
  $('sndBtn').textContent=soundOn?'🔊 Sound on':'🔇 Sound off';
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
}
if(window.speechSynthesis) speechSynthesis.getVoices();
</script>
</body>
</html>
