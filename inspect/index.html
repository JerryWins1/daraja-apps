<!doctype html>
<meta charset="utf-8">
<title>Daraja — house inspection</title>
<style>
  body{font:14px/1.5 -apple-system,system-ui,sans-serif;background:#14181A;color:#ECEAE3;margin:0;padding:16px}
  h1{font-size:18px;margin:0 0 4px} p{color:#9AA39D;margin:0 0 14px}
  #stage{position:fixed;left:-9999px;top:0;width:390px;height:844px;border:0}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{border-bottom:1px solid #2C3336;padding:6px 8px;text-align:left;vertical-align:top}
  th{color:#7C857F;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .s1{color:#F08A6A;font-weight:800} .s2{color:#E0B04A} .s3{color:#7FB4B1}
  #sum{background:#1D2224;border:1px solid #2C3336;border-radius:12px;padding:12px;margin-bottom:14px}
</style>
<h1>Daraja — house inspection</h1>
<p>Each app is loaded at 390×844 (an iPhone) and measured as it actually renders.</p>
<div id="sum">Loading…</div>
<table><thead><tr><th>App</th><th>Sev</th><th>What</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="stage"></iframe>

<script>
const APPS = [
 ['nownext','Apps (installable site)/nownext/'],
 ['ahead','Apps (installable site)/ahead/'],
 ['nextstep','Apps (installable site)/nextstep/'],
 ['breakeven','Apps (installable site)/breakeven/'],
 ['safety','Apps (installable site)/safety/'],
 ['occ','Apps (installable site)/occ/'],
 ['zuri','Apps (installable site)/zuri/'],
 ['compass','Apps (installable site)/compass/'],
 ['feedback','feedback-studio/'],
 ['storykeeper','story-keeper/'],
 ['academy','academy/'],
 ['thekey','thekey/'],
 ['drumbeat','drumbeat/'],
 ['flipkit','flipkit/'],
 ['rafiki','rafiki/'],
 ['pitwall','f1/'],
 ['churchhq','church-hq/'],
 ['churchsteward','church-steward/'],
 ['churchserve','church-serve/'],
 ['churchdrive','church-drive/'],
 ['churchclubhouse','church-clubhouse/'],
 ['churchgameday','church-gameday/'],
 ['churchkey','church-key/'],
 ['npgoodstanding','np-goodstanding/'],
 ['npreceipts','np-receipts/'],
 ['shop','shop/']
];

function audit(doc, win){
  const F=[], add=(s,c,d)=>F.push([s,c,d]);
  const vw=doc.documentElement.clientWidth, vh=doc.documentElement.clientHeight;
  const cs=e=>win.getComputedStyle(e);
  const seen=e=>{const s=cs(e);if(s.display==='none'||s.visibility==='hidden'||+s.opacity===0)return false;const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
  const rgb=c=>(String(c).match(/[\d.]+/g)||[0,0,0]).slice(0,3).map(Number);
  const lum=c=>{const[r,g,b]=rgb(c).map(x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
  const ra=(a,b)=>{const l1=lum(a),l2=lum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};
  const bgOf=e=>{let n=e;while(n&&n!==doc.documentElement){const c=cs(n).backgroundColor;if(c&&!/rgba?\(0, 0, 0, 0\)|transparent/.test(c))return c;n=n.parentElement}return cs(doc.body).backgroundColor||'rgb(255,255,255)'};

  if(doc.documentElement.scrollWidth>vw+2)
    add(1,'scrolls sideways', (doc.documentElement.scrollWidth-vw)+'px too wide');

  const sm=[...doc.querySelectorAll('button,a,[role=button],select')].filter(seen)
    .filter(e=>{const r=e.getBoundingClientRect();return (r.height<40||r.width<32)&&(e.textContent||'').trim().length<30});
  if(sm.length) add(2,'tap target too small', sm.length+' · '+sm.slice(0,3).map(e=>'"'+((e.textContent||e.getAttribute('aria-label')||'?').trim().slice(0,12))+'" '+Math.round(e.getBoundingClientRect().height)+'px').join(', '));

  const lc=[];
  [...doc.querySelectorAll('p,span,li,td,label,small,h1,h2,h3,div,a,button')]
    .filter(e=>seen(e)&&!e.children.length&&(e.textContent||'').trim().length>3).slice(0,500)
    .forEach(e=>{const s=cs(e),sz=parseFloat(s.fontSize),bd=+s.fontWeight>=700;
      const need=(sz>=24||(sz>=18.66&&bd))?3:4.5, r=ra(s.color,bgOf(e));
      if(r<need) lc.push('"'+(e.textContent||'').trim().slice(0,18)+'" '+r.toFixed(1)+':1')});
  if(lc.length) add(1,'text too faint to read', lc.length+' · '+lc.slice(0,3).join(' · '));

  const ty=[...doc.querySelectorAll('p,li,td,label,span')].filter(e=>seen(e)&&!e.children.length&&(e.textContent||'').trim().length>20)
    .filter(e=>parseFloat(cs(e).fontSize)<13);
  if(ty.length) add(2,'text under 13px', ty.length+' passages');

  const nn=[...doc.querySelectorAll('button,[role=button],a')].filter(seen)
    .filter(e=>!(e.textContent||'').trim()&&!e.getAttribute('aria-label')&&!e.getAttribute('title'));
  if(nn.length) add(2,'control with no name', nn.length+'');

  const ul=[...doc.querySelectorAll('input:not([type=hidden]):not([type=submit]):not([type=button]),textarea,select')].filter(seen)
    .filter(e=>{if(e.getAttribute('aria-label')||e.getAttribute('placeholder')||e.getAttribute('title'))return false;
      if(e.id&&doc.querySelector('label[for="'+CSS.escape(e.id)+'"]'))return false; return !e.closest('label')});
  if(ul.length) add(2,'box with no label', ul.length+'');

  const zoomers=[...doc.querySelectorAll('input,textarea,select')].filter(seen)
    .filter(e=>parseFloat(cs(e).fontSize)<16);
  if(zoomers.length) add(1,'iPhone zooms on tap', zoomers.length+' boxes under 16px');

  const fl=[...doc.querySelectorAll('body *')].filter(e=>{const s=cs(e);
    if(!['fixed','sticky','absolute'].includes(s.position))return false;
    const z=parseInt(s.zIndex,10);return !isNaN(z)&&z>=20&&seen(e)});
  const cl=[];
  for(let i=0;i<fl.length;i++)for(let j=i+1;j<fl.length;j++){
    const a=fl[i].getBoundingClientRect(),b=fl[j].getBoundingClientRect();
    const cov=r=>(r.width*r.height)/(vw*vh); if(cov(a)>.5||cov(b)>.5)continue;
    if(!(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom))
      cl.push((fl[i].id||fl[i].tagName)+' over '+(fl[j].id||fl[j].tagName))}
  if(cl.length) add(1,'things stacked on top', cl.slice(0,2).join('; '));

  const bi=[...doc.images].filter(i=>i.complete&&!i.naturalWidth);
  if(bi.length) add(1,'image failed to load', bi.length+'');

  const bars=fl.filter(e=>{const r=e.getBoundingClientRect();return r.bottom>=vh-4&&r.height<140&&r.width>vw*.6});
  if(bars.length){const bt=Math.min(...bars.map(b=>b.getBoundingClientRect().top));
    const pd=parseFloat(cs(doc.body).paddingBottom)||0, nd=vh-bt;
    if(pd<nd-8) add(2,'content hides behind bottom bar','bar covers '+Math.round(nd)+'px, page reserves '+Math.round(pd)+'px')}

  const dups={}; doc.querySelectorAll('[id]').forEach(e=>dups[e.id]=(dups[e.id]||0)+1);
  const d=Object.entries(dups).filter(([k,v])=>v>1);
  if(d.length) add(1,'duplicate id on the page', d.map(x=>x[0]+'×'+x[1]).slice(0,3).join(', '));

  if(!doc.querySelector('h1')) add(3,'no main heading','');
  return F;
}

const rows=document.getElementById('rows'); let total=0, done=0;
const results={};
function next(i){
  if(i>=APPS.length){
    document.getElementById('sum').textContent =
      'Inspected '+APPS.length+' apps at 390×844 — '+total+' findings. '+
      Object.entries(results).filter(([k,v])=>!v.length).length+' came back clean.';
    window.__AUDIT_DONE = {total, results};
    return;
  }
  const [id,path]=APPS[i];
  const fr=document.getElementById('stage');
  fr.onload=()=>{
    setTimeout(()=>{
      let F=[];
      try{ F=audit(fr.contentDocument, fr.contentWindow); }
      catch(e){ F=[[1,'could not inspect', String(e.message||e)]]; }
      results[id]=F; total+=F.length;
      F.forEach(([s,c,d])=>{
        const tr=document.createElement('tr');
        tr.innerHTML='<td>'+id+'</td><td class="s'+s+'">'+s+'</td><td>'+c+'</td><td>'+(d||'')+'</td>';
        rows.appendChild(tr);
      });
      if(!F.length){ const tr=document.createElement('tr');
        tr.innerHTML='<td>'+id+'</td><td class="s3">–</td><td colspan="2">✓ clean</td>'; rows.appendChild(tr); }
      next(i+1);
    }, 1500);
  };
  fr.src='../'+path+'?audit='+Date.now();
}
next(0);
</script>
