<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pit Wall</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:#EEF0F3; --paper:#FFFFFF; --paper-2:#F5F6F8; --ink:#171A1F; --ink-2:#3C434D; --muted:#6B7480;
    --line:#D8DCE2; --line-strong:#B9BFC8; --accent:#6D3BD6; --accent-soft:#6D3BD61A; --flag:#E4B623; --flag-soft:#E4B62333;
    --ok:#2E7D4F; --ok-soft:#2E7D4F1A; --bad:#C0392B; --bad-soft:#C0392B1A; --board:#15171C; --board-ink:#F3F4F6; --board-dim:#9AA3AF;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#101215; --paper:#191C22; --paper-2:#20242C; --ink:#EEF0F3; --ink-2:#C5CAD2; --muted:#8A929E;
    --line:#2C313A; --line-strong:#454C58; --accent:#A98AF0; --accent-soft:#A98AF022; --flag:#F0C84A; --flag-soft:#F0C84A2A;
    --ok:#5CBF88; --ok-soft:#5CBF8822; --bad:#E5705F; --bad-soft:#E5705F22; --board:#0B0C0F; --board-ink:#EEF0F3; --board-dim:#8A929E;
  } }
  :root[data-theme="dark"] {
    --bg:#101215; --paper:#191C22; --paper-2:#20242C; --ink:#EEF0F3; --ink-2:#C5CAD2; --muted:#8A929E;
    --line:#2C313A; --line-strong:#454C58; --accent:#A98AF0; --accent-soft:#A98AF022; --flag:#F0C84A; --flag-soft:#F0C84A2A;
    --ok:#5CBF88; --ok-soft:#5CBF8822; --bad:#E5705F; --bad-soft:#E5705F22; --board:#0B0C0F; --board-ink:#EEF0F3; --board-dim:#8A929E;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system, "Segoe UI", Roboto, system-ui, sans-serif; font-size:16px; line-height:1.45; padding-bottom:calc(74px + env(safe-area-inset-bottom)); }
  .disp { font-family:"Barlow Condensed", "Arial Narrow", sans-serif; }
  .mono { font-family:"IBM Plex Mono", Menlo, Consolas, monospace; font-variant-numeric:tabular-nums; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  [hidden] { display:none !important; }

  header.top { background:var(--board); color:var(--board-ink); padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header.top h1 { margin:0; font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:26px; letter-spacing:.01em; line-height:1; }
  header.top h1 small { display:block; font-weight:500; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--flag); margin-top:3px; }
  .me { display:flex; align-items:center; gap:8px; background:#FFFFFF14; border:1px solid #FFFFFF22; color:var(--board-ink); border-radius:999px; padding:6px 12px 6px 8px; font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:15px; letter-spacing:.04em; }
  .me .dot { width:10px; height:10px; border-radius:50%; background:var(--flag); }
  .me.offline .dot { background:var(--board-dim); }

  main { max-width:760px; margin:0 auto; padding:14px 14px 20px; display:grid; gap:14px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:22px; margin:0 0 8px; line-height:1.1; display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .card h2 .sub { font-weight:500; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .lab { font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .muted { color:var(--muted); } .small { font-size:13.5px; } p { margin:0 0 10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .btn { border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); border-radius:10px; padding:10px 14px; font-weight:600; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.flag { background:var(--flag); border-color:var(--flag); color:#1B1E24; }
  .btn.ghost { background:transparent; }
  .btn.sm { padding:6px 10px; font-size:14px; border-radius:8px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 10px; font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:13px; letter-spacing:.06em; text-transform:uppercase; background:var(--paper-2); color:var(--ink-2); border:1px solid var(--line); }
  .pill.ok { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .pill.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
  .pill.flag { background:var(--flag-soft); color:var(--ink); border-color:transparent; }
  .pill.acc { background:var(--accent-soft); color:var(--accent); border-color:transparent; }

  /* tower */
  .tower { display:grid; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); }
  .tower .tr { display:grid; grid-template-columns:34px 1fr auto auto; gap:10px; align-items:center; padding:10px 12px; border-top:1px solid var(--line); }
  .tower .tr:first-child { border-top:none; }
  .tower .pos { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:22px; color:var(--muted); text-align:center; }
  .tower .tr.lead .pos { color:var(--flag); }
  .tower .name { font-weight:600; font-size:17px; }
  .tower .name small { display:block; font-weight:400; font-size:12.5px; color:var(--muted); }
  .tower .pts { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:24px; font-variant-numeric:tabular-nums; }
  .tower .gap { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  .tower .tr.me-row { background:var(--accent-soft); }

  /* weekend card */
  .weekend { background:var(--board); color:var(--board-ink); border-radius:12px; padding:16px; }
  .weekend .lab { color:var(--board-dim); }
  .weekend h2 { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:28px; margin:2px 0 4px; line-height:1; }
  .count { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:34px; line-height:1; font-variant-numeric:tabular-nums; color:var(--flag); }
  .count.due { color:var(--board-dim); }
  .weekend .sess { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:12px 0; }
  .weekend .sess div { background:#FFFFFF0F; border-radius:8px; padding:8px 10px; font-size:13px; color:var(--board-dim); }
  .weekend .sess b { display:block; color:var(--board-ink); font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:16px; letter-spacing:.02em; }
  .drivers { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
  .drv { border:2px solid #FFFFFF22; background:#FFFFFF0A; color:var(--board-ink); border-radius:10px; padding:10px 12px; text-align:left; display:grid; gap:2px; }
  .drv b { font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:19px; letter-spacing:.01em; }
  .drv span { font-size:12.5px; color:var(--board-dim); font-variant-numeric:tabular-nums; }
  .drv.on { border-color:var(--flag); background:#E4B62322; }
  .drv:disabled { opacity:.4; cursor:not-allowed; }
  .wild { grid-column:1 / -1; border-style:dashed; }
  .wild.on { border-color:var(--accent); background:#6D3BD633; }
  .lineup-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .lineup-grid div { background:#FFFFFF0F; border-radius:8px; padding:8px 10px; font-size:13.5px; }
  .lineup-grid b { font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; display:block; color:var(--board-dim); }

  /* usage */
  .usage { display:grid; gap:10px; }
  .u-p { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--paper); }
  .u-p h3 { margin:0 0 6px; font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:19px; display:flex; justify-content:space-between; }
  .u-d { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; font-size:14.5px; padding:3px 0; }
  .bar { height:6px; background:var(--paper-2); border-radius:3px; overflow:hidden; grid-column:1 / -1; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .u-d .n { font-family:"IBM Plex Mono", monospace; font-size:13px; color:var(--ink-2); }
  .u-d.out { color:var(--muted); } .u-d.out .bar i { background:var(--line-strong); }

  /* tables */
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:14px; background:var(--paper); }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:var(--paper-2); position:sticky; top:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  td.fl { color:var(--accent); font-weight:600; }

  .race-list { display:grid; gap:8px; }
  .race { display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:left; color:var(--ink); }
  .race .rnd { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:20px; color:var(--muted); text-align:center; }
  .race b { font-size:16px; } .race small { display:block; color:var(--muted); font-size:12.5px; }
  .race.canceled { opacity:.55; text-decoration:line-through; }

  .board { background:var(--board); color:var(--board-ink); border-radius:10px; padding:12px 14px; font-family:"IBM Plex Mono", Menlo, monospace; font-size:13px; line-height:1.5; white-space:pre-wrap; overflow-x:auto; margin:8px 0; }

  /* paddock */
  .chat { display:grid; gap:8px; max-height:60vh; overflow:auto; padding:2px; }
  .msg { justify-self:start; max-width:85%; background:var(--paper-2); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:8px 12px; }
  .msg.mine { justify-self:end; background:var(--accent-soft); border-color:transparent; border-radius:14px 14px 4px 14px; }
  .msg b { font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; }
  .msg time { display:block; font-size:11px; color:var(--muted); margin-top:2px; }

  /* forms */
  label.f { display:grid; gap:4px; font-size:13.5px; color:var(--ink-2); }
  input, select, textarea { font:inherit; font-size:16px; padding:9px 11px; border:1.5px solid var(--line-strong); border-radius:9px; background:var(--paper); color:var(--ink); width:100%; }
  textarea { min-height:80px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .grid4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
  details { border:1px solid var(--line); border-radius:10px; background:var(--paper); }
  details summary { cursor:pointer; padding:12px 14px; font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:18px; list-style:none; display:flex; justify-content:space-between; }
  details summary::-webkit-details-marker { display:none; }
  details summary::after { content:"+"; color:var(--muted); } details[open] summary::after { content:"–"; }
  details .in { padding:0 14px 14px; display:grid; gap:10px; }
  .note { background:var(--flag-soft); border-radius:8px; padding:8px 12px; font-size:13.5px; }
  .warn { background:var(--bad-soft); border-radius:8px; padding:8px 12px; font-size:13.5px; color:var(--bad); }

  nav.tabs { position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:20; }
  nav.tabs button { flex:1; background:none; border:none; color:var(--muted); font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:12px; letter-spacing:.06em; text-transform:uppercase; display:grid; gap:2px; justify-items:center; padding:6px 2px; border-radius:8px; }
  nav.tabs button span.ic { font-size:20px; line-height:1; }
  nav.tabs button.on { color:var(--accent); background:var(--accent-soft); }

  .toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--board); color:var(--board-ink); padding:10px 16px; border-radius:999px; font-size:14px; z-index:50; box-shadow:0 6px 20px #0006; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .modal { position:fixed; inset:0; background:#0009; display:flex; align-items:flex-end; justify-content:center; z-index:40; padding:14px; }
  .modal .card { width:100%; max-width:520px; }
  @media (min-width:600px) { .modal { align-items:center; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>Pit Wall <small id="hdrSub">F1 Group · fantasy league</small></h1>
  <button class="me offline" id="meBtn" onclick="openIdentity()"><span class="dot"></span><span id="meName">Who are you?</span></button>
</header>

<main id="view"></main>

<nav class="tabs" role="tablist">
  <button data-tab="home" class="on" onclick="go('home')"><span class="ic">🏁</span>Home</button>
  <button data-tab="standings" onclick="go('standings')"><span class="ic">🏆</span>Standings</button>
  <button data-tab="usage" onclick="go('usage')"><span class="ic">🔢</span>Usage</button>
  <button data-tab="races" onclick="go('races')"><span class="ic">🗓</span>Races</button>
  <button data-tab="paddock" onclick="go('paddock')"><span class="ic">💬</span>Paddock</button>
  <button data-tab="setup" onclick="go('setup')"><span class="ic">⚙️</span>Setup</button>
</nav>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script src="engine.js"></script>
<script src="seed.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Pit Wall v0.9 · the F1 Group's fantasy league, run the way Steve runs it.
   Data lives in a Google Apps Script mailbox (shared) or on this device (local mode).
   Results come from the free Jolpica F1 API in the browser.
   ═══════════════════════════════════════════════════════════════════ */
const E = F1Engine;
const API = 'https://api.jolpi.ca/ergast/f1/';
const LS_STATE = 'pitwall_state_v1', LS_API = 'pitwall_api_v1', LS_ME = 'pitwall_me_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let state = null, me = null, tab = 'home', apiCache = {}, drivers = {}, schedule = null, seasonYear = null, selRace = null, pendingPick = { drivers: [], wildcard: false };

/* ---------- storage: local or mailbox ---------- */
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_STATE)); if (s && s.players) return s; } catch (e) { } return null; }
function saveLocal() { try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch (e) { } }
function mailbox() { return state && state.league && state.league.mailboxUrl && /^https:\/\/script\.google\.com\/.+\/exec$/.test(state.league.mailboxUrl) ? state.league.mailboxUrl : null; }
async function pullRemote(silent) {
  const url = mailbox(); if (!url) return false;
  try {
    const r = await fetch(url + '?league=' + encodeURIComponent(state.league.key || 'f1'), { cache: 'no-store' });
    const j = await r.json();
    if (j && j.ok && j.state && j.state.players) { const keepUrl = state.league.mailboxUrl, key = state.league.key; state = j.state; state.league.mailboxUrl = keepUrl; state.league.key = key; saveLocal(); return true; }
    if (j && j.ok && j.empty) { await pushRemote('seed', {}); return true; } // brand new mailbox: seed it with this device's state
  } catch (e) { if (!silent) toast('Could not reach the mailbox. Showing what this device has.'); }
  return false;
}
async function pushRemote(action, payload) {
  const url = mailbox(); if (!url) return { ok: true, local: true };
  const body = Object.assign({ league: state.league.key || 'f1', action, player: me && me.id, pin: me && me.pin, seedState: action === 'seed' ? state : undefined }, payload);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j && j.ok && j.state) { const keepUrl = state.league.mailboxUrl, key = state.league.key; state = j.state; state.league.mailboxUrl = keepUrl; state.league.key = key; saveLocal(); }
    return j || { ok: false, error: 'No reply' };
  } catch (e) { return { ok: false, error: 'Could not reach the mailbox' }; }
}
// One write path: apply locally, then send. In local mode the local apply is the whole story.
async function commit(action, payload, localApply) {
  if (localApply) localApply(state);
  saveLocal();
  const r = await pushRemote(action, payload);
  if (!r.ok) toast(r.error || 'Not saved to the mailbox'); else if (!r.local) toast('Saved');
  render();
}

/* ---------- Jolpica ---------- */
function loadApiCache() { try { apiCache = JSON.parse(localStorage.getItem(LS_API)) || {}; } catch (e) { apiCache = {}; } }
function saveApiCache() { try { localStorage.setItem(LS_API, JSON.stringify(apiCache)); } catch (e) { /* full: drop oldest */ apiCache = {}; } }
async function api(path, ttlMs) {
  const k = path, now = Date.now(), c = apiCache[k];
  if (c && (ttlMs === Infinity || now - c.t < ttlMs)) return c.d;
  if (window.__PITWALL_MOCK__ && window.__PITWALL_MOCK__[path]) { apiCache[k] = { t: now, d: window.__PITWALL_MOCK__[path] }; return apiCache[k].d; }
  const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + 'limit=100');
  if (!r.ok) throw new Error('F1 data ' + r.status);
  const j = await r.json();
  apiCache[k] = { t: now, d: j.MRData }; saveApiCache();
  return j.MRData;
}
const slug = s => String(s).toLowerCase().replace(/grand prix/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
async function loadSchedule(year) {
  const d = await api(year + '.json', 6 * 3600e3);
  const races = (d.RaceTable && d.RaceTable.Races) || [];
  return races.map(r => ({
    round: +r.round, key: slug(r.raceName), name: r.raceName, circuit: r.Circuit && r.Circuit.circuitName, country: r.Circuit && r.Circuit.Location && r.Circuit.Location.country,
    date: r.date, time: r.time, qualifying: r.Qualifying, sprintQualifying: r.SprintQualifying || r.SprintShootout, sprint: r.Sprint,
  }));
}
async function loadDrivers(year) {
  const d = await api(year + '/drivers.json', 24 * 3600e3);
  const out = {}; ((d.DriverTable && d.DriverTable.Drivers) || []).forEach(x => out[x.driverId] = { id: x.driverId, name: x.familyName, full: x.givenName + ' ' + x.familyName, code: x.code, num: x.permanentNumber });
  return out;
}
function dname(id) { return (drivers[id] && drivers[id].name) || (id ? id.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '—'); }
// Results for a round: null until the race has results. Cached forever once complete.
async function loadResults(year, round, race) {
  const raceDone = race && new Date(race.date + 'T' + (race.time || '23:59:00Z')) < new Date();
  if (!raceDone) return null;
  const ttl = (Date.now() - new Date(race.date).getTime() > 4 * 86400e3) ? Infinity : 30 * 60e3;
  const [rr, qq] = await Promise.all([api(year + '/' + round + '/results.json', ttl), api(year + '/' + round + '/qualifying.json', ttl)]);
  const R = rr.RaceTable && rr.RaceTable.Races && rr.RaceTable.Races[0];
  if (!R || !R.Results || !R.Results.length) return null;
  const out = { quali: {}, race: {}, sprint: null, hasSprint: !!(race && race.sprint) };
  R.Results.forEach(x => out.race[x.Driver.driverId] = { position: +x.position, status: x.status, fastestLap: !!(x.FastestLap && x.FastestLap.rank === '1') });
  const Q = qq.RaceTable && qq.RaceTable.Races && qq.RaceTable.Races[0];
  if (Q && Q.QualifyingResults) Q.QualifyingResults.forEach(x => out.quali[x.Driver.driverId] = +x.position);
  if (race && race.sprint) {
    try {
      const ss = await api(year + '/' + round + '/sprint.json', ttl);
      const S = ss.RaceTable && ss.RaceTable.Races && ss.RaceTable.Races[0];
      if (S && S.SprintResults) { out.sprint = {}; S.SprintResults.forEach(x => out.sprint[x.Driver.driverId] = { position: +x.position, status: x.status, fastestLap: !!(x.FastestLap && x.FastestLap.rank === '1') }); }
    } catch (e) { }
  }

    <label class="f">League name<input id="lgName" value="${esc(state.league.name || 'F1 Group')}" ${ro}></label>
    <div class="lab">Players</div>
    ${state.players.map(p => `<div class="row"><input class="grow" value="${esc(p.name)}" ${ro} onchange="renamePlayer('${p.id}',this.value)"><label class="row small" style="gap:6px"><input type="checkbox" style="width:auto" ${p.active !== false ? 'checked' : ''} ${ro} onchange="adminSet(['players',${state.players.indexOf(p)},'active'],this.checked,'Player')"> playing</label>${c ? `<button class="btn sm ghost" onclick="resetPin('${p.id}')">reset PIN</button>` : ''}</div>`).join('')}
    ${c ? `<div class="row"><input id="newPlayer" class="grow" placeholder="Add a player"><button class="btn sm" onclick="addPlayer()">Add</button></div>` : ''}
    <label class="f">Commissioner<select id="lgCommish" ${ro} onchange="adminSet(['league','commissioner'],this.value,'Commissioner')">${state.players.map(p => `<option value="${p.id}" ${state.league.commissioner === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    ${c ? `<button class="btn sm primary" onclick="adminSet(['league','name'],$('lgName').value,'League name')">Save league name</button>` : ''}
    <div class="lab" style="margin-top:6px">Champions</div>
    ${(state.history || []).slice().sort((a, b) => a.year - b.year).map((h, i) => `<div class="row small"><span style="min-width:44px" class="mono">${h.year}</span><span class="grow">${esc(h.champion)}${h.note ? ' · <span class="muted">' + esc(h.note) + '</span>' : ''}</span></div>`).join('')}
    ${c ? `<div class="grid4"><input id="chYear" type="number" placeholder="Year"><input id="chWho" placeholder="Champion"><input id="chNote" placeholder="Note"><button class="btn sm" onclick="addChampion()">Add</button></div>` : ''}
    <div class="lab" style="margin-top:6px">Seasons</div>
    <div class="row">${Object.keys(state.seasons).sort().map(y => `<button class="btn sm ${+y === +seasonYear ? 'primary' : ''}" onclick="switchSeason(${y})">${y}</button>`).join('')}${c ? `<button class="btn sm ghost" onclick="newSeason()">+ new season</button>` : ''}</div>
  </div></details>`;
  html += `<details><summary>About &amp; data</summary><div class="in"><p class="small">Pit Wall v0.9. Race calendar, entry list, qualifying, sprint and race results come from the free <a href="https://github.com/jolpica/jolpica-f1" target="_blank" rel="noopener">Jolpica F1</a> service and are cached on this device. Rules follow the F1 Group Rulebook.</p>
    <div class="row"><button class="btn sm" onclick="refreshResults()">↻ Refresh results</button><button class="btn sm" onclick="exportState()">⬇ Export league data</button><button class="btn sm ghost" onclick="if(confirm('Forget this device\\'s copy and reload?')){localStorage.removeItem('${LS_STATE}');localStorage.removeItem('${LS_API}');location.reload();}">Reset this device</button></div></div></details>`;
  return html;
}
/* setup actions */
async function connectMailbox() { const url = $('mbUrl').value.trim(), key = $('mbKey').value.trim() || 'f1'; if (url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { toast('That does not look like an Apps Script /exec URL'); return; } state.league.mailboxUrl = url; state.league.key = key; if (url) { state.league.testMode = false; if (me && me.pin === '0000') { me = null; saveMe(); } } saveLocal(); toast(url ? 'Connecting…' : 'Mailbox disconnected'); if (url) { const ok = await pullRemote(); toast(ok ? 'Connected' : 'Could not reach the mailbox'); } await refresh(); }
async function saveSeasonNumbers() { const y = seasonYear; await commit('set', { path: ['seasons', y], value: Object.assign({}, season(), { driversPer: +$('stDrivers').value, drivesPer: +$('stDrives').value, wildcardsPer: +$('stWild').value, perRace: +$('stPer').value }) }, st => { const s = st.seasons[y]; s.driversPer = +$('stDrivers').value; s.drivesPer = +$('stDrives').value; s.wildcardsPer = +$('stWild').value; s.perRace = +$('stPer').value; }); toast('Season numbers saved'); await refresh(); }
async function saveStart() {
  if (!isCommish()) { toast('Commissioner only'); return; }
  const s = season(); const afterKey = $('spRace').value;
  if (!afterKey) { await adminSet(['seasons', seasonYear, 'start'], null, 'Starting point cleared'); return; }
  const standings = {}, usage = {};
  playersActive().forEach(p => { standings[p.id] = +($('sp_pts_' + p.id).value || 0); usage[p.id] = { _wild: $('sp_wild_' + p.id).value === '' ? s.wildcardsPer : +$('sp_wild_' + p.id).value }; (s.roster[p.id] || []).forEach(d => { const v = $('sp_' + p.id + '_' + d).value; usage[p.id][d] = v === '' ? s.drivesPer : +v; }); });
  const race = schedule.find(r => r.key === afterKey);
  await adminSet(['seasons', seasonYear, 'start'], { afterKey, standings, usage, note: 'Entered by ' + pname(me.id) + ' as of after ' + (race ? race.name.replace(' Grand Prix', ' GP') : afterKey) + ', ' + new Date().toLocaleDateString() }, 'Starting point');
}
async function useSeedStart() { if (!isCommish()) { toast('Commissioner only'); return; } const st = JSON.parse(JSON.stringify(PITWALL_SEED.seasons[seasonYear].start)); await adminSet(['seasons', seasonYear, 'start'], st, 'Starting point from the group text'); }
async function toggleCanceled(key, on) { const list = (season().canceled || []).filter(k => k !== key); if (on) list.push(key); await adminSet(['seasons', seasonYear, 'canceled'], list, on ? 'Race canceled' : 'Race restored'); }
async function saveScoring() { const nums = v => v.split(/[,\s]+/).filter(Boolean).map(Number).filter(n => !isNaN(n)); const sc = { racePlace: nums($('scRace').value), rowPoints: nums($('scRow').value), fastestLapBonus: +$('scFL').value, sprintFastestLapBonus: +$('scSFL').value, sprintUsesRows: $('scSprint').value === 'rows', unclassifiedScoresZero: $('scDNF').value === 'zero', perRace: season().perRace || 2 }; await adminSet(['seasons', seasonYear, 'scoring'], sc, 'Scoring'); }
async function setRoster(pid, i, val) { const r = (season().roster[pid] || []).slice(); r[i] = val; await adminSet(['seasons', seasonYear, 'roster', pid], r.filter(Boolean), 'Roster'); }
async function backfill(clear) { const key = $('bfRace').value, pid = $('bfPlayer').value; if (!isCommish()) { toast('Commissioner only'); return; } let value = null; if (!clear) { if ($('bfWild').checked) value = { wildcard: true, ts: new Date().toISOString(), backfilled: true }; else { const ds = [$('bfD1').value, $('bfD2').value].filter(Boolean); if (ds.length !== (season().perRace || 2)) { toast('Choose ' + (season().perRace || 2) + ' drivers or tick wild card'); return; } value = { drivers: ds, ts: new Date().toISOString(), backfilled: true }; } } await adminSet(['seasons', seasonYear, 'picks', key, pid], value, clear ? 'Pick cleared' : 'Pick saved'); }
async function renamePlayer(pid, name) { const i = state.players.findIndex(p => p.id === pid); await adminSet(['players', i, 'name'], name.trim() || pid, 'Name'); }
async function addPlayer() { const name = $('newPlayer').value.trim(); if (!name) return; const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '') || ('p' + Date.now()); if (state.players.some(p => p.id === id)) { toast('Already here'); return; } await adminSet(['players', state.players.length], { id, name, active: true }, 'Player added'); }
async function resetPin(pid) { if (!confirm('Reset ' + pname(pid) + "'s PIN? They set a new one next time they tap their name.")) return; await commit('resetpin', { target: pid }, st => { const p = st.players.find(x => x.id === pid); if (p) p.pin = ''; }); }
async function addChampion() { const y = +$('chYear').value, w = $('chWho').value.trim(); if (!y || !w) return; const h = (state.history || []).filter(x => x.year !== y); h.push({ year: y, champion: w, note: $('chNote').value.trim() }); await adminSet(['history'], h, 'Champion'); }
async function switchSeason(y) { seasonYear = +y; schedule = null; render(); await refresh(); }
async function newSeason() { const y = +prompt('Season year?', new Date().getFullYear() + 1); if (!y) return; if (state.seasons[y]) { switchSeason(y); return; } const prev = season(); const roster = {}; playersActive().forEach(p => roster[p.id] = []); await adminSet(['seasons', y], { year: y, driversPer: prev.driversPer, drivesPer: prev.drivesPer, wildcardsPer: prev.wildcardsPer, perRace: prev.perRace || 2, scoring: prev.scoring, roster, picks: {}, canceled: [], overrides: {} }, 'Season ' + y + ' created'); switchSeason(y); }
async function refreshResults() { for (const k in apiCache) if (/results|qualifying|sprint|driverStandings/.test(k)) delete apiCache[k]; saveApiCache(); toast('Fetching fresh results…'); await refresh(); }
function exportState() { const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pitwall-' + seasonYear + '.json'; a.click(); }

/* ---------- misc ---------- */
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }
function modal(html) { $('modalHost').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${html}</div></div>`; }
function closeModal() { $('modalHost').innerHTML = ''; }
function copyText(t) { if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied. Paste it in the group text.'), () => toast('Could not copy')); else toast('Copy not available here'); }

/* ---------- boot ---------- */
let loadError = '';
async function refresh() {
  try {
    if (!schedule) schedule = await loadSchedule(seasonYear);
    if (!Object.keys(drivers).length) drivers = await loadDrivers(seasonYear);
    if (!schedule.length) loadError = 'No ' + seasonYear + ' calendar published yet.';
    await computeSeason();
  } catch (e) { loadError = 'Could not load F1 data: ' + e.message; }
  render();
}
(async function boot() {
  loadApiCache(); loadMe();
  state = loadLocal() || (typeof PITWALL_SEED !== 'undefined' ? JSON.parse(JSON.stringify(PITWALL_SEED)) : null);
  if (!state) { $('view').innerHTML = '<div class="card"><h2>No league data</h2></div>'; return; }
  // A device that is not on the group mailbox yet follows the newest seeded starting point (Steve's latest post), keeping its own picks and PIN.
  if (typeof PITWALL_SEED !== 'undefined' && (state.seedVersion || 1) < (PITWALL_SEED.seedVersion || 1) && !(state.league && state.league.mailboxUrl)) {
    for (const y in PITWALL_SEED.seasons) { const src = PITWALL_SEED.seasons[y]; state.seasons[y] = state.seasons[y] || JSON.parse(JSON.stringify(src)); if (src.start) state.seasons[y].start = JSON.parse(JSON.stringify(src.start)); if (src.canceled) state.seasons[y].canceled = src.canceled.slice(); }
    state.history = JSON.parse(JSON.stringify(PITWALL_SEED.history)); state.seedVersion = PITWALL_SEED.seedVersion; saveLocal();
  }
  seasonYear = state.league.currentSeason || Math.max.apply(null, Object.keys(state.seasons).map(Number));
  render();
  await pullRemote(true);
  await refresh();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  // keep fresh: pull the mailbox every 2 minutes while open
  setInterval(async () => { if (mailbox() && document.visibilityState === 'visible') { const ok = await pullRemote(true); if (ok) { await computeSeason(); if (tab !== 'setup') render(); } } }, 120000);
})();
</script>
