name = "ff-yahoo"
main = "src/worker.js"
compatibility_date = "2026-10-25"

# Plain settings. None of these are secret — the client ID is public by design, and
# the three URLs are visible in the browser's address bar anyway.
#
# YAHOO_CLIENT_ID is left blank here on purpose: fill it in with the Client ID from
# the Yahoo app before deploying. The Client Secret is NOT in this file and must
# never be. It goes in with:
#
#     wrangler secret put YAHOO_CLIENT_SECRET
#
# which stores it with Cloudflare and keeps it out of the repo.
[vars]
YAHOO_CLIENT_ID = ""
REDIRECT_URI = "https://ff-yahoo.daraja-studio.workers.dev/callback"
APP_RETURN_URL = "https://jerrywins1.github.io/daraja-apps/ff/"

# Who is allowed to call this Worker from a browser. Comma-separated, no spaces
# needed. Add "http://localhost:8788" temporarily if testing the page locally, and
# take it back out afterwards.
APP_ORIGIN = "https://jerrywins1.github.io"
