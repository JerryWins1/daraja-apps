<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#23504F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NextStep">

<style>
  #pwaInstall { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:9999; background:#D96C4F; color:#fff; border:none; border-radius:999px; padding:11px 18px; font:600 14px -apple-system,system-ui,sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.25); display:none; cursor:pointer; }
  #pwaInstall.show { display:inline-flex; gap:8px; align-items:center; }
  #pwaTip { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:9999; background:#1C2B29; color:#F5F1EA; border-radius:14px; padding:12px 14px; font:14px -apple-system,system-ui,sans-serif; display:none; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  #pwaTip.show { display:block; } #pwaTip b { color:#E58A6E; } #pwaTip button { float:right; background:none; border:none; color:#F5F1EA; font-size:18px; cursor:pointer; margin:-4px -4px 0 8px; }

<title>Next Step Board — by Daraja Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#F4F4F1; --surface:#FFFFFF; --surface-2:#ECEDE8; --ink:#1B2421; --soft:#50605C; --faint:#83918D; --brand:#23504F; --brand-soft:#23504F14; --coral:#D96C4F; --coral-soft:#D96C4F1A; --ok:#2E8B57; --ok-soft:#2E8B5718; --warn:#D9822B; --warn-soft:#D9822B1A; --line:#DADDD6; --line-strong:#BCC2BA; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11171A; --surface:#1A2226; --surface-2:#212B2F; --ink:#E7ECEA; --soft:#A9B6B2; --faint:#72817D; --brand:#7FB3B1; --brand-soft:#7FB3B122; --coral:#E58A6E; --coral-soft:#E58A6E22; --ok:#5FB78D; --ok-soft:#5FB78D22; --warn:#F0A05A; --warn-soft:#F0A05A22; --line:#2A3539; --line-strong:#3B484D; } }
  :root[data-theme="dark"] { --bg:#11171A; --surface:#1A2226; --surface-2:#212B2F; --ink:#E7ECEA; --soft:#A9B6B2; --faint:#72817D; --brand:#7FB3B1; --brand-soft:#7FB3B122; --coral:#E58A6E; --coral-soft:#E58A6E22; --ok:#5FB78D; --ok-soft:#5FB78D22; --warn:#F0A05A; --warn-soft:#F0A05A22; --line:#2A3539; --line-strong:#3B484D; }
  :root[data-theme="light"] { --bg:#F4F4F1; --surface:#FFFFFF; --surface-2:#ECEDE8; --ink:#1B2421; --soft:#50605C; --faint:#83918D; --brand:#23504F; --brand-soft:#23504F14; --coral:#D96C4F; --coral-soft:#D96C4F1A; --ok:#2E8B57; --ok-soft:#2E8B5718; --warn:#D9822B; --warn-soft:#D9822B1A; --line:#DADDD6; --line-strong:#BCC2BA; }
  * { box-sizing:border-box; } html,body { margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; line-height:1.45; padding-bottom:40px; }
  header { position:sticky; top:0; z-index:10; background:var(--brand); color:#fff; padding:14px 18px; }
  .hrow { max-width:980px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; font-weight:700; } header h1 small { font-weight:500; opacity:.8; font-size:12px; margin-left:8px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .filters button { background:rgba(255,255,255,.16); border:none; color:#fff; font:inherit; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; }
  .filters button.on { background:#fff; color:var(--brand); }
  main { max-width:980px; margin:0 auto; padding:16px 14px; }
  .banner { background:var(--coral-soft); border:1px solid var(--coral); border-radius:12px; padding:12px 16px; font-size:14px; margin-bottom:14px; display:flex; gap:10px; align-items:flex-start; }
  .banner b { color:var(--coral); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:12px; }
  .card, .one, .next { min-width:0; overflow-wrap:anywhere; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .card.paused { opacity:.7; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .name { font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .name .em { font-size:20px; }
  .status { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .status.active { background:var(--ok-soft); color:var(--ok); } .status.waiting { background:var(--warn-soft); color:var(--warn); } .status.paused { background:var(--surface-2); color:var(--faint); } .status.blocked { background:var(--coral-soft); color:var(--coral); }
  .one { font-size:13.5px; color:var(--soft); }
  .next { background:var(--brand-soft); border-left:3px solid var(--brand); border-radius:0 8px 8px 0; padding:8px 12px; font-size:14px; }
  .next b { display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--brand); margin-bottom:2px; }
  .next .who { font-size:11px; color:var(--faint); margin-top:3px; }
  .meta { display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint); flex-wrap:wrap; gap:6px; }
  .meta .stale { color:var(--coral); font-weight:700; }
  .pri { display:inline-flex; align-items:center; gap:2px; font-size:11px; color:var(--faint); }
  .pri button { background:none; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:11px; padding:1px 6px; cursor:pointer; color:var(--ink); }
  .pri b { color:var(--brand); font-size:12px; min-width:18px; text-align:center; }
  .due { font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--faint); }
  .due.soon { background:var(--warn-soft); color:var(--warn); } .due.over { background:var(--coral-soft); color:var(--coral); }
  .duebar { background:var(--coral-soft); border:1px solid var(--coral); border-radius:12px; padding:10px 14px; font-size:13.5px; margin-bottom:12px; display:none; }
  .duebar.show { display:block; } .duebar b { color:var(--coral); }
  .duebar .ics { font-size:11.5px; margin-left:8px; color:var(--brand); cursor:pointer; text-decoration:underline; }
  .acts { display:flex; gap:5px; flex-wrap:nowrap; margin-top:2px; }
  .acts button, .acts a { font:inherit; font-size:12px; font-weight:600; padding:6px 4px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap; flex:1; text-align:center; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .acts button.x { flex:0 0 30px; }
  .acts button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .acts button.done { background:var(--ok); color:#fff; border-color:var(--ok); }
  .tasks { border-top:1px dashed var(--line); padding-top:8px; margin-top:2px; }
  .task { display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:3px 0; }
  .task input { width:17px; height:17px; margin-top:2px; accent-color:var(--brand); flex:none; }
  .task.done span { text-decoration:line-through; color:var(--faint); }
  .task .who { font-size:10.5px; color:var(--faint); margin-left:4px; }
  .add { display:flex; gap:6px; margin-top:6px; }
  .add input { flex:1; font:inherit; font-size:13px; padding:6px 9px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); }
  .add button { font:inherit; font-size:13px; padding:6px 10px; border-radius:8px; border:none; background:var(--brand); color:#fff; cursor:pointer; }
  .foot { max-width:980px; margin:18px auto 0; padding:0 14px; font-size:12px; color:var(--faint); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .foot button { font:inherit; font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; }
  .foot label { cursor:pointer; }
  textarea.edit { width:100%; font:inherit; font-size:13px; padding:8px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); min-height:60px; }
  .card.clear-glow { animation:glow 1.6s ease-out; border-color:var(--ok); }
  @keyframes glow { 0% { box-shadow:0 0 0 0 rgba(46,139,87,.55); } 100% { box-shadow:0 0 0 22px rgba(46,139,87,0); } }
  .allclear { background:var(--ok-soft); border:1px solid var(--ok); color:var(--ok); border-radius:12px; padding:10px 16px; font-size:14px; font-weight:700; margin-bottom:12px; display:none; }
  .allclear.show { display:block; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; }
  details summary { cursor:pointer; font-size:12.5px; color:var(--faint); list-style:none; } details summary::-webkit-details-marker { display:none; }
</style>
</head>
<body>
<button id="pwaInstall">⬇ Install app</button>
<div id="pwaTip"><button onclick="this.parentNode.classList.remove('show');localStorage.setItem('pwaTipSeen','1')">×</button><b>Install on iPhone:</b> tap the Share button <span style="font-size:16px">&#x2B06;&#xFE0E;</span>, then <b>“Add to Home Screen”</b>. It becomes an app icon and works offline.</div>
<header><div class="hrow">
  <h1><span id="boardName" onclick="renameBoard()" title="Tap to rename" style="cursor:pointer">My Next Step Board</span> <small id="stamp"></small></h1>
  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="waiting">Waiting on me</button><button data-f="paused">Paused</button><button data-f="mine">Needs me</button>
  </div>
</div></header>
<main>
  <div class="banner" id="banner"></div>
  <div class="duebar" id="duebar"></div>
  <div class="allclear" id="allclear"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="foot">
  <span id="count"></span>
  <button onclick="addProject()">+ Add project</button>
  <button onclick="askNotify()">🔔 Notifications</button>
  <button onclick="exportJSON()">Backup</button>
  <label><input type="file" accept="application/json" style="display:none" onchange="importJSON(event)">Restore</label>
  <button onclick="resetSeed()">Reset to examples</button><button onclick="startBlank()">Start blank</button>
  <span>Stored in this browser · Backup weekly · <b>Next Step Board</b> v1.0 · <i>daraja</i> studio — every download builds a bridge</span>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const TODAY=today();
const KEY='nextstep_board_v1';
const SEED={updated:'',name:'My Next Step Board',projects:[
 {id:'welcome',emoji:'👋',name:'Start here (delete me when you\'re ready)',status:'active',one:'This board answers one question for every project: what is the single next step, and whose turn is it? Tap "Edit next step" to change it. Tap a status to cycle it. Check things off. Tap the board title to rename it.',
  next:'Add your first real project with "+ Add project" at the bottom',who:'You · 1 min',link:'',touched:TODAY,
  tasks:[['Rename the board (tap the title)','You',0],['Add a project','You',0],['Give it a next step and an owner','You',0],['Tap "Backup" once a week — your data lives in this browser','You',0],['Delete this card (Status ▸ … or the ✕ in the checklist header)','You',0]]},
 {id:'ex1',emoji:'🚀',name:'Example: Launch the new service',status:'active',one:'A sample project so you can see how a card reads. Replace or delete it.',
  next:'Write the one-paragraph offer and price',who:'Me · 45 min',link:'',touched:TODAY,
  tasks:[['Draft the offer','Me',1],['Pick a price','Me',0],['Tell 5 past clients','Me',0]]},
 {id:'ex2',emoji:'📚',name:'Example: Bookkeeping catch-up',status:'waiting',one:'"Waiting" means the ball is in someone else\'s court — or yours, and you know it.',
  next:'Send Q2 receipts to the accountant',who:'Me · 20 min',link:'',touched:TODAY,
  tasks:[['Export Q2 transactions','Me',1],['Match receipts','Me',0],['Email accountant','Me',0]]},
 {id:'ex3',emoji:'🌴',name:'Example: Paused idea',status:'paused',one:'Paused projects fade back so they don\'t nag — but they don\'t disappear either.',
  next:'Revisit in the fall',who:'—',link:'',touched:TODAY,tasks:[]}
]};
let db=load(); let filter='all';
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.projects) return d; }catch(e){} return JSON.parse(JSON.stringify(SEED)); }
function save(){ localStorage.setItem(KEY,JSON.stringify(db)); }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1600); }
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days=d=>Math.floor((Date.now()-new Date(d))/864e5);
const order={active:0,waiting:1,blocked:2,paused:3};

function render(){
  document.getElementById('stamp').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  const ps=db.projects.filter(p=>filter==='all'||(filter==='mine'?(p.status!=='paused'&&!/^(—|-|claude|them|waiting on them)/i.test((p.who||'').trim())):p.status===filter)).sort((a,b)=>(order[a.status]-order[b.status])||((a.pri||3)-(b.pri||3))||((a.due||'9999').localeCompare(b.due||'9999')));
  const waiting=db.projects.filter(p=>p.status==='waiting'||p.status==='blocked').length;
  const open=db.projects.reduce((t,p)=>t+p.tasks.filter(x=>!x[2]).length,0);
  const first=db.projects.filter(p=>p.status==='active').sort((a,b)=>a.touched.localeCompare(b.touched))[0]||db.projects.find(p=>p.status!=='paused');
  document.getElementById('banner').innerHTML=`<span>👋</span><div><b>Where you left off:</b> ${waiting} project${waiting!==1?'s':''} waiting · ${open} open item${open!==1?'s':''}${first?` · Start with <b>${esc(first.emoji+' '+first.name)}</b>: ${esc(first.next)}`:''}</div>`;
  document.getElementById('boardName').textContent=db.name||'My Next Step Board'; document.title=(db.name||'Next Step Board')+' — Next Step Board';
  if(!db.projects.length){ document.getElementById('grid').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;color:var(--faint)">No projects yet. Tap <b>+ Add project</b> below — or <b>Reset to examples</b> to see how cards work.</div>'; document.getElementById('count').textContent='0 projects'; return; }
  document.getElementById('grid').innerHTML=ps.map(p=>{
    const stale=days(p.touched); const openT=p.tasks.filter(t=>!t[2]);
    return `<div class="card ${p.status==='paused'?'paused':''}" data-id="${p.id}">
      <div class="top"><div class="name"><span class="em">${p.emoji}</span>${esc(p.name)}</div><span class="status ${p.status}">${p.status==='waiting'?'waiting on me':p.status}</span></div>
      <div class="one">${esc(p.one)}</div>
      <div class="next"><b>Next step</b>${esc(p.next)}<div class="who">${esc(p.who)}${p.link?` · <span style="color:var(--brand)">📄 ${esc(p.link)}</span>`:''}</div></div>
      <div class="meta"><span class="pri"><button onclick="pri('${p.id}',-1)" title="higher priority">▲</button><b>P${p.pri||3}</b><button onclick="pri('${p.id}',1)" title="lower priority">▼</button></span>${p.due?`<span class="due ${dueClass(p.due)}" onclick="editDue('${p.id}')" style="cursor:pointer">${dueLabel(p.due)}</span>`:`<span class="due" onclick="editDue('${p.id}')" style="cursor:pointer">+ due date</span>`}<span class="${stale>14?'stale':''}">touched ${stale}d ago</span></div>
      <div class="acts">
        <button class="primary" onclick="editNext('${p.id}')">✏️ Next</button>
        <button onclick="setStatus('${p.id}')">Status ▸</button>
        <button class="done" onclick="touch('${p.id}')">✓ Today</button>
        <button onclick="editProject('${p.id}')">✏️ Card</button>
        <button class="x" onclick="delProject('${p.id}')" title="Delete project" style="color:var(--coral)">✕</button>
      </div>
      <details ${openT.length&&p.status!=='paused'?'open':''}><summary>${p.tasks.length?`Checklist (${openT.length} open)`:'No checklist yet'} ▾</summary>
        <div class="tasks">${p.tasks.map((t,i)=>`<div class="task ${t[2]?'done':''}"><input type="checkbox" ${t[2]?'checked':''} onchange="toggleTask('${p.id}',${i},this.checked)"><span>${esc(t[0])}<span class="who">— ${esc(t[1])}</span></span></div>`).join('')}
        <div class="add"><input placeholder="add an item…" id="add-${p.id}" onkeydown="if(event.key==='Enter')addTask('${p.id}')"><button onclick="addTask('${p.id}')">Add</button></div></div>
      </details>
    </div>`; }).join('');
  document.getElementById('count').textContent=`${db.projects.length} project${db.projects.length!==1?'s':''}`;
  renderDue();
  (function(){ const el=document.getElementById('allclear'); if(!el) return;
    const overdue=db.projects.some(p=>p.due&&p.status!=='paused'&&(new Date(p.due+'T23:59:59')-Date.now())<0);
    const waiting=db.projects.filter(p=>p.status==='waiting'||p.status==='blocked').length;
    const anyOpen=db.projects.some(p=>p.tasks&&p.tasks.some(t=>!t[2]));
    if(db.projects.length&&!overdue&&!waiting){ el.classList.add('show'); el.textContent = anyOpen? '🌤 Nothing overdue, nothing waiting on you. Whatever you do next is a choice, not a debt.' : '🏆 Every checklist clear, nothing waiting, nothing overdue. Go enjoy the day — the board will hold the fort.'; }
    else el.classList.remove('show'); })();
}
document.getElementById('filters').addEventListener('click',e=>{ if(e.target.dataset.f){ filter=e.target.dataset.f; document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b===e.target)); render(); }});
window.pri=(id,d)=>{ const p=db.projects.find(x=>x.id===id); p.pri=Math.min(5,Math.max(1,(p.pri||3)+d)); save(); render(); };
const dueDays=d=>Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5);
window.dueClass=d=>{ const n=dueDays(d); return n<0?'over':n<=3?'soon':''; };
window.dueLabel=d=>{ const n=dueDays(d); return n<0?`overdue ${-n}d`:n===0?'due today':n===1?'due tomorrow':`due in ${n}d`; };
window.editDue=id=>{ const p=db.projects.find(x=>x.id===id); const v=prompt('Due date for the next step (YYYY-MM-DD), or blank to clear:',p.due||''); if(v===null) return; p.due=/^\d{4}-\d{2}-\d{2}$/.test(v.trim())?v.trim():''; save(); render(); if(p.due) toast('Due date set'); };
function renderDue(){ const items=db.projects.filter(p=>p.due&&p.status!=='paused').map(p=>({p,n:dueDays(p.due)})).filter(x=>x.n<=7).sort((a,b)=>a.n-b.n);
  const bar=document.getElementById('duebar'); if(!items.length){ bar.classList.remove('show'); return; }
  bar.classList.add('show'); bar.innerHTML=`<b>⏰ Coming up:</b> `+items.map(x=>`${x.p.emoji} <b style="color:var(--ink)">${esc(x.p.name)}</b> — ${esc(x.p.next)} <span class="due ${dueClass(x.p.due)}">${dueLabel(x.p.due)}</span><span class="ics" onclick="ics('${x.p.id}')">add to calendar</span>`).join('<br>');
  // browser notification (only while the page is open) — once per day per project
  if('Notification' in window && Notification.permission==='granted'){ const key='nsb_notified_'+today(); const done=JSON.parse(localStorage.getItem(key)||'[]'); items.filter(x=>x.n<=1&&!done.includes(x.p.id)).forEach(x=>{ try{ new Notification((x.n<0?'Overdue: ':x.n===0?'Due today: ':'Due tomorrow: ')+x.p.name,{body:x.p.next}); }catch(e){} done.push(x.p.id); }); localStorage.setItem(key,JSON.stringify(done)); }
}
window.askNotify=()=>{ if(!('Notification' in window)){ toast('Notifications not supported here'); return; } Notification.requestPermission().then(p=>{ toast(p==='granted'?'Notifications on (while the board is open)':'Notifications off'); renderDue(); }); };
window.ics=id=>{ const p=db.projects.find(x=>x.id===id); if(!p.due) return; const d=p.due.replace(/-/g,''); const dt=new Date(p.due+'T09:00:00'); const stamp=dt.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const text=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Next Step Board//EN','BEGIN:VEVENT','UID:'+p.id+'-'+d+'@nextstepboard','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+d,'SUMMARY:'+(p.emoji+' '+p.name+' — '+p.next).replace(/[,;]/g,' '),'DESCRIPTION:'+('Next step: '+p.next+' ('+p.who+')').replace(/[,;]/g,' '),'BEGIN:VALARM','TRIGGER:-PT15H','ACTION:DISPLAY','DESCRIPTION:'+p.name.replace(/[,;]/g,' '),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  downloadAny((p.name.replace(/[^a-z0-9]+/gi,'-')+'-'+p.due+'.ics'), text, 'text/calendar'); };
async function downloadAny(name,text,type){ let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use('downloads'); }catch(e){} if(dl){ try{ await dl.save({filename:name,data:text}); return; }catch(e){ if(e&&e.code==='extension_not_enabled'){ try{ await dl.save({filename:name.replace(/\.ics$/,'.txt'),data:text}); toast('Saved as .txt — rename to .ics and open it'); return; }catch(e2){} } toast(e&&e.code==='declined'?'Cancelled':'Open the board file directly to export'); return; } } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
window.toggleTask=(id,i,v)=>{ const p=db.projects.find(x=>x.id===id); p.tasks[i][2]=v?1:0; p.touched=today(); save(); render();
  if(v && p.tasks.length && p.tasks.every(t=>t[2])){ const card=document.querySelector(`.card[data-id="${id}"]`); if(card) card.classList.add('clear-glow');
    toast('🏁 '+p.emoji+' '+p.name+' — checklist CLEAR. Set the next step or let it rest.');
    setTimeout(()=>{ if(card) card.classList.remove('clear-glow'); },1700); } };
window.addTask=id=>{ const el=document.getElementById('add-'+id); const v=el.value.trim(); if(!v) return; const p=db.projects.find(x=>x.id===id); p.tasks.push([v,'Jerry',0]); p.touched=today(); save(); render(); toast('Added'); };
window.editNext=id=>{ const p=db.projects.find(x=>x.id===id); const v=prompt('Next step for '+p.name+':',p.next); if(v===null) return; p.next=v.trim(); const w=prompt('Who / how long?',p.who); if(w!==null) p.who=w.trim(); p.touched=today(); save(); render(); };
window.setStatus=id=>{ const p=db.projects.find(x=>x.id===id); const opts=['active','waiting','blocked','paused']; const cur=opts.indexOf(p.status); p.status=opts[(cur+1)%opts.length]; p.touched=today(); save(); render(); toast('Status: '+p.status); };
window.touch=id=>{ const p=db.projects.find(x=>x.id===id); p.touched=today(); save(); render(); toast('Marked touched today'); };
window.addProject=()=>{ const n=prompt('Project name:'); if(!n) return; const em=prompt('Pick an emoji for it (or leave blank):','📁')||'📁'; const one=prompt('One line: what is this project?')||''; const nx=prompt('Next step:')||''; const who=prompt('Who / how long? (e.g. "Me · 30 min")','Me')||'Me'; db.projects.push({id:'p'+Date.now().toString(36),emoji:em.trim().slice(0,4),name:n.trim(),status:'active',one:one.trim(),next:nx.trim(),who:who.trim(),link:'',touched:today(),tasks:[]}); save(); render(); toast('Project added'); };
window.delProject=id=>{ const p=db.projects.find(x=>x.id===id); if(!confirm('Delete "'+p.name+'" and its checklist? (Backup first if unsure)')) return; db.projects=db.projects.filter(x=>x.id!==id); save(); render(); toast('Deleted'); };
window.renameBoard=()=>{ const v=prompt('Board name:',db.name||'My Next Step Board'); if(v===null) return; db.name=v.trim()||'My Next Step Board'; save(); render(); };
window.editProject=id=>{ const p=db.projects.find(x=>x.id===id); const n=prompt('Project name:',p.name); if(n===null) return; p.name=n.trim()||p.name; const em=prompt('Emoji:',p.emoji); if(em!==null&&em.trim()) p.emoji=em.trim().slice(0,4); const one=prompt('One line — what is it?',p.one); if(one!==null) p.one=one.trim(); save(); render(); };
async function download(name,text){ let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use('downloads'); }catch(e){} if(dl){ try{ await dl.save({filename:name,data:text}); return; }catch(e){ toast(e&&e.code==='declined'?'Cancelled':'Open the file directly to export'); return; } } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
window.exportJSON=()=>download('next-step-board-'+today()+'.json',JSON.stringify(db,null,1));
window.importJSON=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.projects) throw 0; if(confirm('Replace current dashboard with this backup?')){ db=d; save(); render(); toast('Restored'); } }catch(e){ toast('Not a dashboard backup'); } }; r.readAsText(f); };
window.resetSeed=()=>{ if(confirm('Replace everything with the example cards? (Backup first.)')){ db=JSON.parse(JSON.stringify(SEED)); save(); render(); toast('Examples loaded'); } };
window.startBlank=()=>{ if(confirm('Remove all cards and start with an empty board? (Backup first.)')){ db={updated:'',name:db.name||'My Next Step Board',projects:[]}; save(); render(); toast('Blank board'); } };
render();
})();
</script>

<script>
/* ===== "What am I doing here?" intro v1 (2026-08-29) — Jerry's idea:
   30 readable seconds with examples, the moment you first arrive. ===== */
(function(){
try{
  var SLUG='nextstep', EM='🗂', TITLE="What am I doing here?", LINES=["You're juggling projects — say: <b>the church event, the bathroom remodel, the taxes</b>.","For each one, you write only the <b>NEXT step</b>: 'call the plumber.' 'Email Susan the flyer.'","Every morning: open this board, read down the list, do the next steps. That's the whole system.","Start by adding one real project — then write its next step."];
  var K='daraja_intro_'+SLUG;
  function show(force){
    if(!force && localStorage.getItem(K)) return;
    if(document.getElementById('introOv')) return;
    var ov=document.createElement('div');
    ov.id='introOv';
    ov.style.cssText='position:fixed;inset:0;z-index:120;background:rgba(18,16,12,.96);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;';
    ov.innerHTML='<div style="max-width:440px;background:#faf6ee;color:#2b2620;border-radius:22px;padding:28px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);font-family:-apple-system,Segoe UI,sans-serif;">'
      +'<div style="font-size:44px;">'+EM+'</div>'
      +'<div style="font-family:Georgia,serif;font-size:23px;font-weight:700;margin:8px 0 14px;">'+TITLE+'</div>'
      +LINES.map(function(l){return '<p style="font-size:16.5px;line-height:1.55;margin-bottom:11px;text-align:left;">'+l+'</p>';}).join('')
      +'<div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;">'
      +'<button id="introListen" style="background:#fff;border:1.5px solid #e5dccb;color:#7a7062;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;">🔊 Read it to me</button>'
      +'<button id="introGo" style="background:#b3502f;border:none;color:#fff;border-radius:999px;padding:12px 26px;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;">Got it — let&#39;s go ›</button>'
      +'</div></div>';
    document.body.appendChild(ov);
    document.getElementById('introGo').onclick=function(){
      localStorage.setItem(K,'1');
      if(window.speechSynthesis) speechSynthesis.cancel();
      ov.remove();
    };
    document.getElementById('introListen').onclick=function(){
      if(!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var plain=LINES.map(function(l){return l.replace(/<[^>]*>/g,'');}).join(' ');
      var u=new SpeechSynthesisUtterance(plain); u.rate=.95;
      var vs=speechSynthesis.getVoices();
      var v=vs.filter(function(v){return /Samantha|Google US English|en-US/i.test(v.name+v.lang);})[0];
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    };
  }
  setTimeout(function(){ show(false); }, 700);
  setTimeout(function(){
    if(document.getElementById('introDot')) return;
    var d=document.createElement('button'); d.id='introDot'; d.textContent='?';
    d.title='What is this app? (30 seconds)';
    d.style.cssText='position:fixed;top:10px;right:10px;z-index:60;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(128,120,100,.4);background:rgba(250,246,238,.85);color:#7a7062;font-weight:800;font-size:15px;cursor:pointer;';
    d.onclick=function(){ show(true); };
    document.body.appendChild(d);
  }, 1500);
}catch(e){}
})();
</script>
<script>
/* ===== Helpful hovers v2 (2026-08-29) — hover bubbles on desktop, and on
   phones a 💡 button that labels every control for a few seconds. ===== */
(function(){
try{
  var tip=null;
  function ensure(){
    if(tip) return tip;
    tip=document.createElement('div');
    tip.style.cssText='position:fixed;z-index:200;max-width:240px;background:#2b2620;color:#faf6ee;font:600 13px/1.45 -apple-system,Segoe UI,sans-serif;padding:8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;display:none;';
    document.body.appendChild(tip);
    return tip;
  }
  function textFor(el){
    return el.getAttribute('data-help') || el.getAttribute('title') || el.getAttribute('aria-label') || '';
  }
  document.addEventListener('mouseover', function(e){
    try{
      var el=e.target.closest ? e.target.closest('[title],[data-help],[aria-label]') : null;
      if(!el) return;
      var txt=textFor(el); if(!txt) return;
      if(el.getAttribute('title')){ el.setAttribute('data-help', el.getAttribute('title')); el.removeAttribute('title'); }
      var t=ensure(); t.textContent=txt; t.style.display='block';
      var r=el.getBoundingClientRect();
      t.style.left=Math.min(window.innerWidth-250, Math.max(8, r.left))+'px';
      t.style.top=Math.max(6, r.top>60 ? r.top-52 : r.bottom+10)+'px';
    }catch(err){}
  }, true);
  document.addEventListener('mouseout', function(){ if(tip) tip.style.display='none'; }, true);
  document.addEventListener('click', function(){ if(tip) tip.style.display='none'; }, true);

  /* phone: 💡 shows every label at once for 7 seconds */
  var touchy = window.matchMedia && window.matchMedia('(hover: none)').matches;
  if(touchy){
    setTimeout(function(){
      if(document.getElementById('dTipDot')) return;
      var d=document.createElement('button'); d.id='dTipDot'; d.textContent='💡';
      d.setAttribute('aria-label','Show what every button does');
      d.style.cssText='position:fixed;right:10px;bottom:150px;z-index:150;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(128,120,100,.45);background:rgba(250,246,238,.92);font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);';
      d.onclick=function(){ labelAll(); };
      document.body.appendChild(d);
    }, 1800);
  }
  var labels=[];
  function clearLabels(){ labels.forEach(function(l){ try{l.remove();}catch(e){} }); labels=[]; }
  function labelAll(){
    clearLabels();
    var els=document.querySelectorAll('[title],[data-help],[aria-label]');
    var n=0;
    els.forEach(function(el){
      if(n>=12) return;
      if(el.id==='dTipDot') return;
      var r=el.getBoundingClientRect();
      if(r.width===0 || r.bottom<0 || r.top>window.innerHeight) return;
      var txt=textFor(el); if(!txt) return;
      var b=document.createElement('div');
      b.textContent=txt.length>60 ? txt.slice(0,57)+'…' : txt;
      b.style.cssText='position:fixed;z-index:190;max-width:200px;background:#2b2620;color:#faf6ee;font:600 12px/1.4 -apple-system,Segoe UI,sans-serif;padding:6px 10px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none;';
      b.style.left=Math.min(window.innerWidth-210, Math.max(6, r.left))+'px';
      b.style.top=Math.max(4,(r.top>50 ? r.top-40 : r.bottom+6))+'px';
      document.body.appendChild(b); labels.push(b); n++;
    });
    if(n) setTimeout(clearLabels, 7000);
  }
}catch(e){}
})();
</script>
