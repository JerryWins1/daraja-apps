<html lang="en">

<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
 #pwaInstall { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:9999; background:#1F4E5F; color:#fff; border:none; border-radius:999px; padding:11px 18px; font:600 14px -apple-system,system-ui,sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.25); display:none; cursor:pointer; }
 #pwaInstall.show { display:inline-flex; gap:8px; align-items:center; }
 #pwaTip { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:9999; background:#1C2B29; color:#F5F1EA; border-radius:14px; padding:12px 14px; font:14px -apple-system,system-ui,sans-serif; display:none; box-shadow:0 8px 24px rgba(0,0,0,.3); }
 #pwaTip.show { display:block; } #pwaTip b { color:#E58A6E; } #pwaTip button { float:right; background:none; border:none; color:#F5F1EA; font-size:18px; cursor:pointer; margin:-4px -4px 0 8px; }

<title>Daraja Compass</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
 :root{--bg:#F6F3EB;--surface:#fff;--s2:#EEE8DA;--ink:#1F2620;--soft:#57604F;--faint:#8A9282;--brand:#1F4E5F;--brand-soft:#1F4E5F14;--gold:#C08A2D;--gold-soft:#C08A2D1A;--green:#2F6E52;--green-soft:#2F6E5219;--line:#E2DBC9;--lineS:#C8BFA9;--red:#B4432F}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141719;--surface:#1C2124;--s2:#252B2F;--ink:#ECEAE1;--soft:#B2B8AC;--faint:#7C847A;--brand:#7FB6C9;--brand-soft:#7FB6C922;--gold:#D9A84E;--gold-soft:#D9A84E22;--green:#6DC296;--green-soft:#6DC29622;--line:#2C3336;--lineS:#48524F;--red:#E77B62}}
 :root[data-theme="dark"]{--bg:#141719;--surface:#1C2124;--s2:#252B2F;--ink:#ECEAE1;--soft:#B2B8AC;--faint:#7C847A;--brand:#7FB6C9;--brand-soft:#7FB6C922;--gold:#D9A84E;--gold-soft:#D9A84E22;--green:#6DC296;--green-soft:#6DC29622;--line:#2C3336;--lineS:#48524F;--red:#E77B62}
 *{box-sizing:border-box}html,body{margin:0}
 body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16.5px;line-height:1.5;padding-bottom:40px}
 header{max-width:560px;margin:0 auto;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center}
 h1{margin:0;font-size:21px;font-weight:800;color:var(--brand)} h1 small{display:block;font-size:12px;color:var(--faint);font-weight:600}
 main{max-width:560px;margin:0 auto;padding:8px 14px}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
 .kick{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--gold)}
 .q{font-size:20px;font-weight:800;margin:6px 0 10px}
 .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
 .chips button{font:inherit;font-size:15px;font-weight:700;padding:11px 14px;border-radius:999px;border:1.5px solid var(--lineS);background:var(--s2);color:var(--ink);cursor:pointer}
 .chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
 textarea,input[type=text],input[type=number],input[type=date]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--lineS);border-radius:12px;background:var(--surface);color:var(--ink)}
 textarea{min-height:64px;resize:vertical}
 .nav{display:flex;gap:8px;margin-top:12px}
 .nav button{font:inherit;font-weight:800;font-size:16px;padding:13px 16px;border-radius:14px;border:none;cursor:pointer}
 .nav .go{flex:1;background:var(--brand);color:#fff}.nav .bk{background:var(--s2);color:var(--soft);border:1px solid var(--lineS)}
 .prog{height:7px;background:var(--s2);border-radius:99px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
 .portrait{background:linear-gradient(150deg,var(--brand-soft),var(--gold-soft));border:2px solid var(--gold);border-radius:20px;padding:18px;font-size:17px;line-height:1.65}
 .portrait h2{margin:0 0 8px;color:var(--brand)}
 .goal{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
 .goal b.t{font-size:16.5px}
 .rungs{margin:8px 0 0;padding:0;list-style:none}
 .rungs li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line);font-size:14.5px}
 .rungs .when{flex:none;font-weight:800;color:var(--gold);font-size:12px;width:74px}
 .verse{background:var(--s2);border-radius:14px;padding:12px 14px;font-size:14.5px;font-style:italic}
 .verse b{font-style:normal}
 .big{font-size:38px;font-weight:800;color:var(--green);line-height:1.1}
 .btn{display:inline-block;font:inherit;font-weight:800;font-size:15px;padding:11px 16px;border-radius:12px;border:none;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
 .btn.gold{background:var(--gold)} .btn.ghost{background:var(--s2);color:var(--ink);border:1.5px solid var(--lineS)}
 .row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
 .row:first-child{border-top:none}
 .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--lineS);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
 .done .chk{background:var(--green);border-color:var(--green)} .done span.t{text-decoration:line-through;color:var(--faint)}
 .row span.t{flex:1}
 .small{font-size:13px;color:var(--faint)} .foot{font-size:12px;color:var(--faint);text-align:center;margin-top:16px}
 .stars{font-size:22px;letter-spacing:2px}
 @media print{.nav,.btn,header button{display:none!important}body{background:#fff;color:#000}.portrait{border-color:#000}}
</style>
</head>
<body>
<header><h1>🧭 Daraja Compass <small>your life, mapped by you</small></h1><button onclick="window.print()" style="font:inherit;font-size:13px;font-weight:700;border:1px solid var(--lineS);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer">🖨</button></header>
<main id="main"></main>
<script>
const KEY='daraja_compass_v1';
const NN='https://jerrywins1.github.io/daraja-apps/Apps%20(installable%20site)/nownext/index.html';
const LP='https://jerrywins1.github.io/daraja-apps/Apps%20(installable%20site)/workshop/workshop/index.html';
const BE='../breakeven/index.html';
const VERSES=[["For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","Jeremiah 29:11"],["Commit thy works unto the LORD, and thy thoughts shall be established.","Proverbs 16:3"],["Where there is no vision, the people perish.","Proverbs 29:18"],["The plans of the diligent lead surely to abundance.","Proverbs 21:5"],["I can do all things through Christ which strengtheneth me.","Philippians 4:13"],["Trust in the LORD with all thine heart.","Proverbs 3:5"],["Let us run with patience the race that is set before us.","Hebrews 12:1"],["But seek ye first the kingdom of God.","Matthew 6:33"],["Whatsoever thy hand findeth to do, do it with thy might.","Ecclesiastes 9:10"],["Being confident of this very thing, that he which hath begun a good work in you will perform it.","Philippians 1:6"]];
const Q=[
 {k:'name',t:'What is your name?',ph:'First name',type:'text'},
 {k:'age',t:'How old are you?',type:'num'},
 {k:'from',t:'Where are you from, and where do you live now?',ph:'your places',type:'text',ex:['Grew up in a village, now in town','Born and raised right here','Moved for school and stayed']},
 {k:'admire',t:'Who is someone you admire — and what is it about them?',ph:'their name and their why',type:'ta',ex:['My mother — she never gave up','A teacher who saw something in me','My uncle — built his shop from nothing','A pastor who serves everyone']},
 {k:'goodat',t:'What would the people who love you say you are good at?',ph:'a strength, not bragging',type:'ta',ex:['Good with my hands','Good with numbers','People trust me','I explain things well','I keep going when it gets hard']},
 {k:'losetime',t:'What work or activity makes you lose track of time?',ph:'your thing',type:'ta',ex:['Fixing things','Cooking','Teaching kids','Music','Farming','Selling — I love the market','Phones and computers']},
 {k:'work',t:'In FIVE years, what work do you see yourself doing?',ph:'dream specific',type:'ta',ex:['My own small shop','A trade — electrician, tailor, mechanic','Farming that actually pays','Teaching','Tech — apps, design, computers','A steady job plus a side hustle']},
 {k:'income',t:'What monthly income would make that life possible?',ph:'a number and currency',type:'text',ex:['KES 20,000','KES 40,000','KES 80,000','$500','$2,000']},
 {k:'married',t:'Marriage — do you picture it in the next five years?',opts:['Yes','Maybe','Not in 5 years'],type:'pick'},
 {k:'kids',t:'Children in five years?',opts:['Yes','Maybe','Not yet'],type:'pick'},
 {k:'home',t:'Where are you living in five years — renting or owning?',ph:'town, rooms, land…',type:'ta',ex:['Renting rooms in town','With family, saving hard','My own small house','Land first, build slowly']},
 {k:'wheels',t:'Getting around in five years?',opts:['Walking/matatu','Motorbike','Car','Bicycle'],type:'pick'},
 {k:'faith',t:'What part does faith play in the life you picture?',ph:'your words',type:'ta',ex:['Church every week, serving somewhere','Praying more than I do now','Leading others someday','Still figuring it out — honestly']},
 {k:'give',t:'Five years from now, how will you help somebody else up?',ph:'your way of reaching back',type:'ta',ex:['Employ someone','Pay school fees for a sibling','Tithe faithfully','Train a young person in my trade']},
 {k:'fear',t:'Honestly — what most often stops you or slows you down?',ph:'name it and it shrinks',type:'ta',ex:['No capital','I doubt myself','No connections','I start things and then stop','Distractions']},
];
let db;try{db=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!db) db={view:'hello',qi:0,a:{},goals:[],checkins:[],lastCheck:null,starts:Date.now()};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const $=s=>document.getElementById(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);
const V=VERSES[doy%VERSES.length];
function portraitText(){ const a=db.a; const age5=a.age?(' At '+(Number(a.age)+5)+','):' In five years,';
 let p=(a.name||'You')+' —'+age5+' you are '+(a.work?String(a.work).trim().replace(/\.$/,''):'doing work that fits you')+'.';
 if(a.income) p+=' The work brings in around '+a.income+' a month.';
 if(a.home) p+=' Home is '+String(a.home).trim().replace(/\.$/,'')+'.';
 if(a.married==='Yes') p+=' You are married'+(a.kids==='Yes'?', with children':'')+'.';
 else if(a.married==='Maybe') p+=' Marriage may be part of the picture'+(a.kids==='Yes'?' — children too':'')+'.';
 if(a.wheels&&a.wheels!=='Walking/matatu') p+=' A '+a.wheels.toLowerCase()+' gets you where you need to go.';
 if(a.faith) p+=' Faith is not a corner of this life — '+String(a.faith).trim().replace(/\.$/,'')+'.';
 if(a.give) p+=' And you are already reaching back: '+String(a.give).trim().replace(/\.$/,'')+'.';
 p+=' The person you admire'+(a.admire?' — '+String(a.admire).split('—')[0].trim()+' —':'')+' would recognize what you built.';
 return p; }
function render(){ const m=$('main'); const v=db.view;
 if(v==='hello'){ m.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:52px">🧭</div>
  <h2 style="margin:6px 0">Where are you going?</h2>
  <p style="color:var(--soft)">Fifteen questions — every one has tap-able answers to start from, and a 🎤 to speak instead of type. Then Compass paints a picture of your life five years from now — <b>written by you</b> — and helps you walk toward it one month at a time.</p>
  <div class="verse">“${V[0]}” — <b>${V[1]}</b></div>
  <div class="nav"><button class="go" onclick="db.view='q';save();render()">Start my Compass →</button></div>
  <p class="small">About 10 minutes · saves on this phone · nothing is sent anywhere</p></div>`; return; }
 if(v==='q'){ const q=Q[db.qi]; const val=db.a[q.k]||'';
  m.innerHTML=`<div class="prog"><i style="width:${Math.round(db.qi/Q.length*100)}%"></i></div>
  <div class="card"><div class="kick">Question ${db.qi+1} of ${Q.length}</div><div class="q">${q.t}</div>
  ${q.type==='pick'?`<div class="chips">${q.opts.map(o=>`<button class="${val===o?'on':''}" onclick="pick('${q.k}','${o}')">${o}</button>`).join('')}</div>`
   :(q.ex?`<div class="chips" style="margin-bottom:8px">${q.ex.map(e=>`<button style="font-size:13.5px;padding:9px 12px" onclick="useEx(this)">${esc(e)}</button>`).join('')}</div><p class="small" style="margin:0 0 8px">Tap one and fix it to fit you — or say it with the mic.</p>`:'')+
    (q.type==='ta'?`<div style="display:flex;gap:6px;align-items:flex-start"><textarea id="ans" placeholder="${q.ph||''}" style="flex:1">${esc(val)}</textarea><button id="mic" onclick="dictate()" style="font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--lineS);background:var(--s2);cursor:pointer">🎤</button></div>`
   :q.type==='num'?`<input type="number" id="ans" value="${esc(val)}" inputmode="numeric">`
   :`<div style="display:flex;gap:6px"><input type="text" id="ans" placeholder="${q.ph||''}" value="${esc(val)}" style="flex:1"><button id="mic" onclick="dictate()" style="font:inherit;font-size:20px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--lineS);background:var(--s2);cursor:pointer">🎤</button></div>`)}
  <div class="nav">${db.qi>0?'<button class="bk" onclick="step(-1)">‹ Back</button>':''}<button class="go" onclick="step(1)">${db.qi===Q.length-1?'Paint my picture →':'Next →'}</button></div>
  <p class="small">No wrong answers. Skip anything — you can come back.</p></div>`; 
  const el=$('ans'); if(el) setTimeout(()=>el.focus(),50); return; }
 if(v==='portrait'){ m.innerHTML=`<div class="portrait"><div class="kick">YOUR FIVE-YEAR PICTURE</div><h2>${esc(db.a.name||'You')}, five years from now</h2><p>${esc(portraitText())}</p></div>
  <div class="card"><b>Is that the life you want?</b><p class="small" style="margin:4px 0 10px">If not — go back and change any answer. This picture belongs to you.</p>
  <div class="nav"><button class="bk" onclick="db.view='q';db.qi=0;save();render()">✎ Change answers</button><button class="go" onclick="makeGoals()">Yes — build my path →</button></div></div>`; return; }
 if(v==='goals'){ m.innerHTML=`<div class="card"><div class="kick">WALKING BACKWARD</div><div class="q" style="font-size:18px">Big dreams become small steps. For each one: what must be true earlier?</div></div>`+
  db.goals.map((g,i)=>`<div class="goal"><b class="t">${esc(g.t)}</b>
   <ul class="rungs">${g.r.map((r,j)=>`<li><span class="when">${r.w}</span><input type="text" value="${esc(r.t)}" placeholder="${r.ph}" onchange="db.goals[${i}].r[${j}].t=this.value;save()"></li>`).join('')}</ul></div>`).join('')+
  `<div class="nav"><button class="bk" onclick="db.view='portrait';save();render()">‹ Picture</button><button class="go" onclick="db.view='home';db.lastCheck=Date.now();save();render()">Save my path → my Compass</button></div>`; return; }
 if(v==='home'){ const met=db.goals.reduce((a,g)=>a+g.r.filter(r=>r.done).length,0); const total=db.goals.reduce((a,g)=>a+g.r.length,0);
  const days=db.lastCheck?Math.floor((Date.now()-db.lastCheck)/86400000):0; const due=days>=28;
  const month=db.goals.flatMap((g,i)=>g.r.map((r,j)=>({g:i,j,...r}))).filter(r=>r.w==='This month');
  m.innerHTML=`<div class="card" style="text-align:center"><div class="kick">GOALS MET</div><div class="big">${met}<span style="font-size:20px;color:var(--faint)"> / ${total}</span></div><div class="stars">${'⭐'.repeat(Math.min(met,10))||'—'}</div>
   ${due?`<p style="color:var(--red);font-weight:800">🧭 It's Check-in Day — how did the month go?</p><button class="btn gold" onclick="checkin()">Do my monthly check-in</button>`:`<p class="small">Next check-in in ${28-days} day${28-days===1?'':'s'} — Compass will ask how the month went.</p>`}</div>
  <div class="card"><div class="kick">THIS MONTH</div>${month.length?month.map(r=>`<div class="row ${r.done?'done':''}"><div class="chk" onclick="tick(${r.g},${r.j})">${r.done?'✓':''}</div><span class="t">${esc(r.t||'(write this step on your path)')}</span><a class="btn ghost" style="padding:7px 10px;font-size:12.5px" href="${NN}?add=${encodeURIComponent(r.t||'My Compass step')}&by=Compass" target="_blank">📲 to my list</a></div>`).join(''):'<p class="small">No this-month steps written yet — open your path below.</p>'}</div>
  <div class="card"><div class="kick">MONEY MATH</div>${moneyHtml()}</div>
  <div class="portrait" style="font-size:14.5px"><b>${esc(db.a.name||'You')}, five years from now:</b> ${esc(portraitText()).slice(0,220)}… <a href="#" onclick="db.view='portrait';save();render();return false" style="color:var(--brand);font-weight:800">read it all</a></div>
  <div class="card"><div class="verse">“${V[0]}” — <b>${V[1]}</b></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
   <button class="btn ghost" onclick="db.view='goals';save();render()">🗺 My path</button>
   <a class="btn ghost" href="${LP}" target="_blank">🚪 Need income? Launchpad</a>
   <button class="btn ghost" onclick="ics()">📅 Put Check-in Day on my calendar</button></div></div>
  <p class="foot">Daraja Compass <b>v2</b> · 2026-08-25 · yours, on this phone · by Daraja Studio</p>`; return; }
}
window.useEx=btn=>{ const el=$('ans'); if(!el) return; el.value=btn.textContent; el.focus(); };
window.dictate=()=>{ const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){ alert('Voice typing: tap the box, then use the microphone key on your phone keyboard.'); return; }
 const el=$('ans'); const mic=$('mic'); const r=new R(); r.lang='en-US'; r.interimResults=false;
 mic.textContent='👂'; mic.style.background='var(--gold-soft)';
 r.onresult=e=>{ const t=e.results[0][0].transcript; el.value=(el.value?el.value+' ':'')+t; };
 r.onend=()=>{ mic.textContent='🎤'; mic.style.background='var(--s2)'; };
 r.onerror=r.onend; try{ r.start(); }catch(e){ r.onend(); } };
window.pick=(k,o)=>{ db.a[k]=o; save(); render(); };
window.step=d=>{ const q=Q[db.qi]; const el=$('ans'); if(el) db.a[q.k]=el.value.trim();
 db.qi+=d; if(db.qi>=Q.length){ db.qi=Q.length-1; db.view='portrait'; } if(db.qi<0)db.qi=0; save(); render(); };
function makeGoals(){ if(!db.goals.length){ const a=db.a;
 const g=[]; g.push({t:'💼 The work: '+((a.work||'my calling').split('\n')[0].slice(0,60)),r:[
  {w:'2 years',t:'',ph:'e.g. running it small but real'},{w:'1 year',t:'',ph:'e.g. first paying customers'},{w:'6 months',t:'',ph:'e.g. trained / tools in hand / started'},{w:'This month',t:'',ph:'ONE step — specific, small, dated'}]});
 if(a.income) g.push({t:'💰 The money: '+a.income+' a month',r:[
  {w:'2 years',t:'',ph:'e.g. half of it coming in steadily'},{w:'1 year',t:'',ph:'e.g. first regular income + saving'},{w:'6 months',t:'',ph:'e.g. first shillings earned'},{w:'This month',t:'',ph:'e.g. open the savings, count the costs'}]});
 if(a.home) g.push({t:'🏠 The home: '+String(a.home).split(',')[0].slice(0,50),r:[
  {w:'2 years',t:'',ph:'what must be true by then?'},{w:'1 year',t:'',ph:'and a year from now?'},{w:'6 months',t:'',ph:'and in six months?'},{w:'This month',t:'',ph:'ONE small step'}]});
 db.goals=g; }
 db.view='goals'; save(); render(); }
window.tick=(gi,j)=>{ const r=db.goals[gi].r[j]; r.done=!r.done; save(); render(); };
window.checkin=()=>{ db.lastCheck=Date.now(); db.checkins.push({at:Date.now()});
 alert('Check-in, three questions:\n\n1. Which steps happened? Tick them ✓\n2. Which are behind? Move them to a truthful date — no shame.\n3. Has the DREAM changed? Then change the picture — the map serves you, not the other way.\n\nThen write next month\'s ONE step for each goal.');
 db.view='goals'; save(); render(); };
function moneyHtml(){ const a=db.a; const inc=String(a.income||'').replace(/[^\d]/g,'');
 if(!inc) return '<p class="small">Add a monthly income number to your answers and Compass does the math.</p>';
 const n=Number(inc);
 return `<p style="margin:4px 0">Your picture needs about <b>${a.income}</b> a month.</p>
 <p class="small" style="margin:4px 0 8px">A business that clears that after costs — or work plus a side hustle. Two doors:</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="${BE}" target="_blank">🧮 Break-Even: will my idea clear it?</a><a class="btn ghost" href="${LP}" target="_blank">🚪 Launchpad: 7 ways to earn</a></div>`; }
window.ics=()=>{ const dt=new Date(); dt.setDate(dt.getDate()+28); const p=n=>String(n).padStart(2,'0');
 const stamp=dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate());
 const ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Daraja//Compass//EN\r\nBEGIN:VEVENT\r\nUID:compass-'+Date.now()+'@daraja\r\nDTSTART;VALUE=DATE:'+stamp+'\r\nRRULE:FREQ=MONTHLY\r\nSUMMARY:🧭 Compass Check-in Day\r\nDESCRIPTION:Open Daraja Compass. Tick what happened. Be honest about the rest. Write next month one small step.\r\nEND:VEVENT\r\nEND:VCALENDAR';

<script>
(function(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  var btn=document.getElementById('pwaInstall'), tip=document.getElementById('pwaTip'), deferred=null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; btn.classList.add('show'); });
  btn.addEventListener('click', function(){ if(deferred){ deferred.prompt(); deferred=null; btn.classList.remove('show'); } });
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS&&!standalone&&!localStorage.getItem('compassTipSeen')){ setTimeout(function(){ tip.classList.add('show'); },1500); }
})();
</script>
