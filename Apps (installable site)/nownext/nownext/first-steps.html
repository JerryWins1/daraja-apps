<meta charset="utf-8">
<title>Now & Next — First Steps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root { --bg:#F7F4EC; --surface:#fff; --surface-2:#EFEAE0; --ink:#1F2622; --soft:#55605B; --faint:#8C958F; --brand:#3B7EA1; --brand-soft:#3B7EA114; --now:#E0653C; --now-soft:#E0653C1C; --ok:#2F6E52; --ok-soft:#2F6E521C; --line:#E2DCCF; --line-strong:#C9C1AE; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15191A; --surface:#1D2224; --surface-2:#262C2E; --ink:#ECEAE3; --soft:#B2B8B2; --faint:#7C857F; --ok:#6DC296; --ok-soft:#6DC29622; --line:#2E3537; --line-strong:#45504F; } }
  :root[data-theme="dark"] { --bg:#15191A; --surface:#1D2224; --surface-2:#262C2E; --ink:#ECEAE3; --soft:#B2B8B2; --faint:#7C857F; --ok:#6DC296; --ok-soft:#6DC29622; --line:#2E3537; --line-strong:#45504F; }
  * { box-sizing:border-box; } html,body { margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; font-size:16px; line-height:1.45; padding-bottom:30px; }
  header { max-width:600px; margin:0 auto; padding:16px 16px 6px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; font-weight:800; color:var(--brand); } header h1 small { display:block; font-size:12px; font-weight:600; color:var(--faint); }
  .prog { font-size:13px; font-weight:800; color:var(--ok); background:var(--ok-soft); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  main { max-width:600px; margin:0 auto; padding:6px 14px 20px; }
  .bar { height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:4px 0 12px; } .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .4s; }
  /* video */
  .video { background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; margin-bottom:12px; }
  .stage { position:relative; height:250px; background:linear-gradient(160deg,var(--brand-soft),var(--now-soft)); cursor:pointer; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px 22px; opacity:0; transform:translateY(10px); transition:opacity .45s, transform .45s; }
  .slide.on { opacity:1; transform:none; }
  .slide .em { font-size:46px; margin-bottom:6px; } .slide h2 { margin:0 0 6px; font-size:clamp(18px,5vw,24px); line-height:1.2; } .slide h2 b { color:var(--now); } .slide p { margin:0; color:var(--soft); font-size:14px; max-width:36ch; }
  .vctrl { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); align-items:center; }
  .vctrl button { font:inherit; font-size:13px; font-weight:800; padding:8px 12px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); cursor:pointer; }
  .vctrl .play { background:var(--now); color:#fff; border-color:var(--now); } .vctrl .vbar { flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; } .vctrl .vbar i { display:block; height:100%; width:0; background:var(--now); transition:width .3s linear; }
  .video.done .stage { height:0; } .video.done .vctrl { border-top:none; }
  /* now card */
  .now { background:var(--now-soft); border:2px solid var(--now); border-radius:22px; padding:18px; margin-bottom:12px; }
  .now .lbl { font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--now); display:flex; justify-content:space-between; }
  .now h2 { margin:6px 0 2px; font-size:23px; line-height:1.2; } .now .why { color:var(--soft); font-size:14px; margin-bottom:8px; }
  .now ol { margin:0 0 10px 18px; padding:0; font-size:15px; } .now li { margin:5px 0; }
  .now .go { display:inline-block; font-size:14px; font-weight:800; text-decoration:none; color:#fff; background:var(--brand); border-radius:999px; padding:9px 15px; margin-bottom:10px; }
  .btns { display:flex; gap:8px; } .btns button { font:inherit; font-weight:800; font-size:16px; padding:13px; border-radius:14px; border:none; cursor:pointer; }
  .btns .done { flex:1; background:var(--ok); color:#fff; } .btns .skip { background:var(--surface); color:var(--soft); border:1px solid var(--line-strong); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 14px; }
  .row { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14.5px; cursor:pointer; } .row:first-of-type { border-top:none; }
  .row .chk { width:24px; height:24px; border-radius:7px; border:2px solid var(--line-strong); flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .row.done .chk { background:var(--ok); border-color:var(--ok); } .row.done span.t { text-decoration:line-through; color:var(--faint); }
  .row.cur .chk { border-color:var(--now); } .row.cur span.t { color:var(--now); font-weight:800; } .row span.t { flex:1; } .row .m { font-size:12px; color:var(--faint); }
  .win { background:linear-gradient(160deg,#F2B134,var(--now) 55%,var(--brand)); color:#fff; border-radius:22px; padding:22px; text-align:center; margin-bottom:12px; } .win h2 { margin:6px 0; font-size:24px; } .win p { margin:6px 0; opacity:.95; font-size:15px; } .win .habit { background:rgba(255,255,255,.18); border-radius:14px; padding:10px 14px; font-weight:800; margin-top:10px; }
  .win a { display:inline-block; margin-top:12px; font-weight:800; text-decoration:none; color:var(--brand); background:#fff; border-radius:14px; padding:12px 20px; }
  .foot { font-size:12px; color:var(--faint); text-align:center; margin-top:18px; } .foot button,.foot a { font:inherit; font-size:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:8px; padding:4px 9px; cursor:pointer; text-decoration:none; }
  @media (max-width:375px) { body { font-size:15px; } main { padding:6px 10px; } .now { padding:14px; } .now h2 { font-size:20px; } .stage { height:220px; } }
  @media print { .video,.btns,.foot button,.prog { display:none !important; } body { background:#fff; color:#000; } }
</style>
<header><h1>Now & Next <small>First Steps — running in 6 minutes</small></h1><span class="prog" id="prog"></span></header>
<main>
  <div class="bar"><i id="barFill"></i></div>
  <div class="video" id="video"><div class="stage" id="stage" onclick="vnext()"></div><div class="vctrl"><button class="play" id="pp" onclick="vtoggle()">▶ Play</button><button id="snd" onclick="vsound()">🔇 Sound</button><div class="vbar"><i id="vprog"></i></div><button onclick="vskip()">skip ›</button></div></div>
  <div id="nowCard"></div>
  <div class="card" id="list"></div>
  <p class="foot">Now & Next First Steps <b>v1</b> · 2026-08-22 · by Daraja Studio · <a href="./">open the app</a> <button onclick="window.print()">🖨</button> <button onclick="if(confirm('Start over?')){localStorage.removeItem(KEY);location.reload();}">reset</button></p>
</main>
<script>
const CFG={"slug": "nownext", "title": "Now & Next", "app": "./", "video": [{"em": "🌪", "h": "Some brains have <b>17 tabs open</b>.", "p": "To-do lists make it worse — a wall of undone things, shouting.", "v": "Some brains have seventeen tabs open. To-do lists make it worse. A wall of undone things, shouting."}, {"em": "🎯", "h": "Now & Next shows <b>one thing</b>.", "p": "Just the NOW. The rest waits quietly.", "v": "Now and Next shows one thing. Just the now. The rest waits quietly."}, {"em": "⏱", "h": "Start the timer — <b>everything else disappears</b>.", "p": "Finish, and your buddy throws a party.", "v": "Start the timer, and everything else disappears. Finish, and your buddy throws a party."}, {"em": "👨‍👧", "h": "One app, the <b>whole family</b>.", "p": "A profile each. Coins. A grown-up check. A Sunday leaderboard.", "v": "One app, the whole family. A profile each. Coins. A grown-up check. A Sunday leaderboard."}, {"em": "✅", "h": "Seven steps below. <b>Six minutes.</b>", "p": "Do them with the kid if you can — they'll pick the buddy.", "v": "Seven steps below. Six minutes. Do them with the kid if you can. They'll pick the buddy."}], "steps": [{"t": "Make the first profile", "m": 1, "why": "Every person gets their own list, coins, and buddy. Start with the kid (or you).", "how": ["Open the app → 'Who's first?' → type a name → Kid or Grown-up"], "go": "./"}, {"t": "Pick the buddy", "m": 1, "why": "The buddy is the whole reward system. The kid picks, not you.", "how": ["Wins tab → scroll to the buddy row → tap one → name it"], "goLabel": "Open Wins", "go": "./"}, {"t": "Load one routine", "m": 1, "why": "Morning, homework, bedtime — same steps every time so the brain doesn't have to decide.", "how": ["Routines tab → tap Morning (or Bedtime)", "Tap 'Edit mine' later to fit your kid"], "goLabel": "Open Routines", "go": "./"}, {"t": "Start the timer, finish one thing", "m": 1, "why": "This is the moment it clicks: focus mode, countdown, confetti.", "how": ["Now tab → ▶ Start → when it's done, ✓ Done!", "Let the buddy dance. Don't skip it."], "go": "./"}, {"t": "Add one regular", "m": 1, "why": "Soccer Tuesday, bills Friday — it shows up by itself on the day.", "how": ["Routines tab → '+ Add a regular' → what, how long, which day → Save"], "go": "./"}, {"t": "Turn on coins & rewards (grown-up)", "m": 1, "why": "Coins = minutes of earned fun, on a timer. Decide the rewards together.", "how": ["Wins tab → 'Coins & rewards' → on → set 'earn fun after 3 things' → list 3 rewards (best first) → Save"], "go": "./"}, {"t": "Put it on the home screen", "m": 1, "why": "So it's an app, not a tab.", "how": ["iPhone: Share → Add to Home Screen · Android: ⋮ → Install app"], "go": "./"}], "finale": "One thing at a time, a party every time, and the list gets shorter. That's it.", "habit": "The one habit: tomorrow morning, open it before the first 'hurry up.' Load the routine. Press Start."};
const KEY='firststeps_'+CFG.slug; const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
function save(){ localStorage.setItem(KEY,JSON.stringify(db)); }
// ---- video ----
let vi=0, vplaying=false, vtmr=null, vsnd=false;
$('stage').innerHTML=CFG.video.map((s,i)=>`<div class="slide ${i===0?'on':''}"><div class="em">${s.em}</div><h2>${s.h}</h2><p>${esc(s.p)}</p></div>`).join('');
function vshow(){ document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('on',i===vi)); $('vprog').style.width=Math.round((vi+1)/CFG.video.length*100)+'%'; if(vsnd&&'speechSynthesis' in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(CFG.video[vi].v||CFG.video[vi].p); u.rate=.98; speechSynthesis.speak(u); } }
function vtick(){ clearTimeout(vtmr); if(!vplaying) return; vtmr=setTimeout(()=>{ if(vi<CFG.video.length-1){ vi++; vshow(); vtick(); } else { vplaying=false; $('pp').textContent='▶ Replay'; db.watched=1; save(); } },CFG.video[vi].s||5200); }
window.vtoggle=()=>{ vplaying=!vplaying; $('pp').textContent=vplaying?'⏸ Pause':'▶ Play'; if(vplaying){ if(vi===CFG.video.length-1){ vi=0; } vshow(); vtick(); } else { clearTimeout(vtmr); speechSynthesis&&speechSynthesis.cancel(); } };
window.vnext=()=>{ if(vi<CFG.video.length-1){ vi++; vshow(); if(vplaying) vtick(); } };
window.vsound=()=>{ vsnd=!vsnd; $('snd').textContent=vsnd?'🔊 Sound on':'🔇 Sound'; if(vsnd&&!vplaying) vtoggle(); else if(vsnd) vshow(); };
window.vskip=()=>{ vplaying=false; clearTimeout(vtmr); speechSynthesis&&speechSynthesis.cancel(); $('video').classList.add('done'); db.watched=1; save(); };
// ---- steps ----
const ST=CFG.steps; const st=i=>db[i]||'';
function current(){ let i=ST.findIndex((s,i)=>!st(i)); if(i<0) i=ST.findIndex((s,i)=>st(i)==='skip'); return i; }
function render(){ const done=ST.filter((s,i)=>st(i)==='done').length; const left=ST.reduce((a,s,i)=>a+(st(i)==='done'?0:s.m),0);
  $('prog').textContent=done+' / '+ST.length+' · '+left+' min left'; $('barFill').style.width=Math.round(done/ST.length*100)+'%';
  const ci=current(); const c=ST[ci];
  $('nowCard').innerHTML= ci<0? `<div class="win"><div style="font-size:50px">🏁</div><h2>You're running.</h2><p>${esc(CFG.finale)}</p><div class="habit">${esc(CFG.habit)}</div><a href="${CFG.app}">Open ${esc(CFG.title)} →</a></div>`
   : `<div class="now"><div class="lbl"><span>Step ${ci+1} of ${ST.length}</span><span>⏱ ${c.m} min</span></div><h2>${esc(c.t)}</h2><div class="why">${esc(c.why)}</div><ol>${c.how.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${c.go?`<a class="go" href="${c.go}" target="_blank" rel="noopener">${esc(c.goLabel||'Open the app')} →</a><br>`:''}<div class="btns"><button class="done" onclick="mark(${ci},'done')">✓ Did it — next</button><button class="skip" onclick="mark(${ci},'skip')">later</button></div></div>`;
  $('list').innerHTML=ST.map((s,i)=>`<div class="row ${st(i)} ${i===ci?'cur':''}" onclick="jump(${i})"><div class="chk">${st(i)==='done'?'✓':''}</div><span class="t">${esc(s.t)}</span><span class="m">${s.m}m</span></div>`).join('');
}
window.mark=(i,v)=>{ db[i]=v; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
window.jump=i=>{ if(st(i)==='done'){ if(confirm('Un-tick this one?')){ delete db[i]; save(); render(); } return; } delete db[i]; ST.forEach((s,j)=>{ if(j<i&&!st(j)) db[j]='skip'; }); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
if(db.watched) $('video').classList.add('done');
render();
</script>
