<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Day</title>
<style>
  :root{ color-scheme:light dark; --bg:#F7F4EC; --surface:#fff; --ink:#1F2622; --soft:#55605B; --line:#E2DCCF; --brand:#23504F; --ok:#2F6E52; --gold:#C9982A; --accent:#D96C4F; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#14181A; --surface:#1D2224; --ink:#ECEAE3; --soft:#B0B7B1; --line:#2C3336; --brand:#7FB4B1; --ok:#6DC296; --gold:#E0B04A; --accent:#E8886A; } }
  body{ margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap{ max-width:620px; margin:0 auto; padding:18px 14px calc(50px + env(safe-area-inset-bottom)); }
  h1{ font-size:26px; margin:0 0 4px; } .lead{ color:var(--soft); margin:0 0 12px; font-size:16px; }
  .bar{ height:12px; background:var(--line); border-radius:8px; overflow:hidden; margin:10px 0 4px; } .bar i{ display:block; height:100%; background:var(--ok); transition:width .3s; }
  .count{ font-weight:800; margin-bottom:14px; }
  .next{ background:var(--surface); border:2px solid var(--gold); border-radius:16px; padding:16px; margin-bottom:16px; }
  .next h2{ margin:0 0 4px; font-size:21px; } .next p{ margin:0 0 12px; color:var(--soft); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; font:inherit; font-weight:800; min-height:48px; padding:10px 18px; border-radius:12px; border:1px solid var(--line); background:var(--brand); color:#fff; text-decoration:none; cursor:pointer; }
  .btn.ok{ background:var(--ok); border-color:var(--ok); } .btn.ghost{ background:var(--surface); color:var(--ink); }
  h3{ font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--soft); margin:18px 0 6px; }
  ul{ list-style:none; margin:0; padding:0; } li{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:6px; }
  li .em{ font-size:24px; width:34px; text-align:center; } li .nm{ flex:1; font-weight:700; } li .nm small{ display:block; font-weight:400; color:var(--soft); font-size:13px; }
  li button{ font:inherit; font-weight:700; min-height:44px; min-width:44px; padding:6px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  li.done{ opacity:.6; } li.done .nm{ text-decoration:line-through; }
  .foot{ color:var(--soft); font-size:13px; text-align:center; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 Test Day</h1>
  <p class="lead">One app at a time. Tap the big button, test it inside Feedback Studio, build the report, paste it to Claude — then come back here and tick it.</p>
  <div class="bar"><i id="prog" style="width:0"></i></div>
  <div class="count" id="count"></div>
  <div class="next" id="next"></div>
  <div id="shelves"></div>
  <p><button class="btn ghost" onclick="if(confirm('Clear every tick and start the round again?')){localStorage.removeItem(K);render();}">Start a new round</button></p>
  <p class="foot">Test Day v1.0 · 2026-09-10 · Daraja Studio · <a href="../feedback-studio/">Feedback Studio</a> · <a href="../whats-new/">What’s new</a></p>
</div>
<script src="../shop/apps_data.js"></script>
<script>
const K='dj_testday_v1', ORDER=[['home','Your household'],['later','Later life'],['church','Your church'],['work','Your business or nonprofit'],['free','Free']];
const done=()=>{ try{ return JSON.parse(localStorage.getItem(K)||'{}'); }catch(e){ return {}; } };
function studio(u){ return '../feedback-studio/?app='+encodeURIComponent(u); }
function list(){ return Object.entries(APPS).filter(([k,a])=>a.try && a.cat && a.cat!=='off' && !k.startsWith('tpl') && !k.startsWith('nourish')); }
function tick(k,on){ const d=done(); if(on) d[k]=new Date().toISOString().slice(0,10); else delete d[k]; localStorage.setItem(K, JSON.stringify(d)); render(); }
function render(){
  const d=done(), all=list(); const n=all.filter(([k])=>d[k]).length;
  document.getElementById('prog').style.width=Math.round(n/all.length*100)+'%';
  document.getElementById('count').textContent=`${n} of ${all.length} tested`;
  const nx = ORDER.flatMap(([c])=>all.filter(([k,a])=>a.cat===c)).find(([k])=>!d[k]);
  const nb=document.getElementById('next');
  nb.innerHTML = nx ? `<h2>Next up: ${nx[1].em} ${nx[1].name}</h2><p>${nx[1].sub||''}</p><a class="btn" href="${studio(nx[1].try)}">▶ Test ${nx[1].name} in Feedback Studio</a> <button class="btn ok" onclick="tick('${nx[0]}',true)">✓ Done</button>`
                    : `<h2>All ${all.length} tested. 🎉</h2><p>Paste the last report to Claude. Then rest.</p>`;
  const s=document.getElementById('shelves'); s.innerHTML='';
  ORDER.forEach(([c,label])=>{ const rows=all.filter(([k,a])=>a.cat===c); if(!rows.length) return;
    const h=document.createElement('h3'); h.textContent=label+' · '+rows.filter(([k])=>d[k]).length+'/'+rows.length; s.appendChild(h);
    const ul=document.createElement('ul');
    rows.forEach(([k,a])=>{ const li=document.createElement('li'); if(d[k]) li.className='done';
      li.innerHTML=`<span class="em" aria-hidden="true">${a.em||'📱'}</span><span class="nm">${a.name}<small>${d[k]?'tested '+d[k]:(a.sub||'')}</small></span><a class="btn ghost" style="min-height:44px;padding:6px 10px" href="${studio(a.try)}" aria-label="Test ${a.name}">▶</a><button aria-label="${d[k]?'Untick':'Tick'} ${a.name}" onclick="tick('${k}',${d[k]?'false':'true'})">${d[k]?'✓':'○'}</button>`;
      ul.appendChild(li); });
    s.appendChild(ul); });
}
render();
</script>
</body>
</html>
