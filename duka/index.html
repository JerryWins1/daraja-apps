function addMonths(t, m) { const x = new Date(t); x.setMonth(x.getMonth() + m); return x.getTime(); }

/* ---------- lookups and sums ---------- */
const item = (id) => D.items.find((x) => x.id === id);
const cust = (id) => D.custs.find((x) => x.id === id);
const custName = (id) => (cust(id) || {}).name || '';
const saleProfit = (s) => s.lines.reduce((a, l) => a + l.qty * (l.price - (l.cost || 0)), 0);
const salesBetween = (a, b) => D.sales.filter((s) => s.at >= a && s.at < b);
function owed(s) { if (s.pay !== 'Deni') return 0; const paid = D.inn.filter((x) => x.sid === s.id).reduce((a, x) => a + N(x.amt), 0); return Math.max(0, s.total - paid); }
function deniList() { return D.sales.filter((s) => owed(s) > 0).sort((a, b) => a.at - b.at); }
function lastBuy(cid) { const s = D.sales.filter((x) => x.cid === cid).sort((a, b) => b.at - a.at)[0]; return s ? s.at : 0; }
function spent(cid) { return D.sales.filter((x) => x.cid === cid).reduce((a, s) => a + s.total, 0); }
function lowItems() { return D.items.filter((i) => N(i.qty) <= N(i.low)).sort((a, b) => a.qty - b.qty); }
function lastCount() { return D.counts.slice().sort((a, b) => b.at - a.at)[0] || null; }
/* What should be in the drawer, on M-Pesa and in the bank now: the last count plus everything recorded since. */
function expected(until) {
  until = until || Infinity;
  const c = D.counts.filter((x) => x.at < until).sort((a, b) => b.at - a.at)[0] || null;
  const since = c ? c.at : 0; const e = { cash: c ? c.cash : 0, mpesa: c ? c.mpesa : 0, bank: c ? c.bank : 0, since, has: !!c };
  const add = (how, amt) => { if (how === 'Cash') e.cash += amt; else if (how === 'M-Pesa') e.mpesa += amt; else if (how === 'Bank' || how === 'Card') e.bank += amt; };
  D.sales.forEach((s) => { if (s.at > since && s.at < until && s.pay !== 'Deni') add(s.pay, s.total); });
  D.inn.forEach((x) => { if (x.at > since && x.at < until) add(x.to, N(x.amt)); });
  D.out.forEach((x) => { if (x.at > since && x.at < until) add(x.from, -N(x.amt)); });
  return e;
}
function billsFor(m) { return D.bills.filter((b) => b.month === m).sort((a, b) => (a.due || 99) - (b.due || 99)); }
function fill(text, c) {
  const s = D.shop;
  return String(text).replace(/\{name\}/g, (c && c.name === '(their name)') ? '(their name)' : first(c && c.name) || 'there').replace(/\{shop\}/g, s.name || 'our shop').replace(/\{town\}/g, s.town || 'town')

}

function sellMsg(text) { const m = parseMpesa(text); if (!m) { toast('That does not look like an M-Pesa message.'); return; } SELL.ref = m.ref || SELL.ref; SELL.msgAmt = m.amt; if (m.name && !SELL.cname) SELL.cname = titleCase(m.name); const sc = $('sCust'); if (sc) sc.value = SELL.cname; custPicked(); renderPay(); toast('Filled from the message.'); }
function titleCase(s) { return String(s).toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()); }
/* M-Pesa confirmations: received / sent / paid to / buy goods. Returns {ref, amt, name, phone, date, bal, dir}. */
function parseMpesa(t) {
  t = String(t || '').replace(/\s+/g, ' ').trim(); if (!t) return null;
  const ref = (t.match(/\b([A-Z0-9]{10})\b/) || [])[1] || '';
  const am = t.match(/K\s?sh\.?\s?([\d,]+(?:\.\d{1,2})?)/i); if (!am) return null;
  const amt = N(am[1]);
  let dir = '', name = '', phone = '';
  let m = t.match(/received from ([A-Za-z .'&-]+?)(?:\s+(\+?\d[\d*x ]{6,}\d))?\s+on\b/i) || t.match(/from ([A-Za-z .'&-]+?)(?:\s+(\+?\d[\d*x ]{6,}\d))?\s+on\b/i);
  if (m) { dir = 'in'; name = m[1].trim(); phone = (m[2] || '').replace(/\s/g, ''); }
  else if ((m = t.match(/(?:sent to|paid to) ([A-Za-z0-9 .'&-]+?)(?:\s+(?:for account|\+?\d[\d ]{6,}\d)|\s+on\b|\.)/i))) { dir = 'out'; name = m[1].trim(); }
  const dm = t.match(/on (\d{1,2})\/(\d{1,2})\/(\d{2,4})/); let date = '';
  if (dm) { let y = +dm[3]; if (y < 100) y += 2000; date = y + '-' + pad(+dm[2]) + '-' + pad(+dm[1]); }
  const bal = (t.match(/balance is K\s?sh\.?\s?([\d,]+(?:\.\d{1,2})?)/i) || [])[1];
  return { ref, amt, name, phone, date, bal: bal ? N(bal) : null, dir };
}
function saveSale() {

function periodRange(p) {
  const t0 = startOf(Date.now());
  if (p === 'today') return [t0, t0 + DAY, 'Today, ' + fdate(t0)];
  if (p === 'month') { const a = new Date(); a.setDate(1); a.setHours(0, 0, 0, 0); return [a.getTime(), t0 + DAY, new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })]; }
  const dow = (new Date(t0).getDay() + 6) % 7, a = t0 - dow * DAY; return [a, t0 + DAY, 'Week ' + fdate(a) + ' – ' + fdate(t0)];
}

  const top = {}; S.forEach((s) => s.lines.forEach((l) => { top[l.name] = top[l.name] || { q: 0, amt: 0 }; top[l.name].q += l.qty; top[l.name].amt += l.qty * l.price; }));

  const ins = D.inn.filter((x) => x.at >= a && x.at < b), inT = ins.reduce((x, o) => x + N(o.amt), 0), repairT = ins.filter((x) => x.cat === 'Repair fee').reduce((x, o) => x + N(o.amt), 0);

  Object.entries(byCat).filter(([k]) => k !== 'Stock purchase').sort((x, y) => y[1] - x[1]).forEach(([k, v]) => L.push('   ' + k + ' ' + money(v)));

  L.push('');

function exportCsv() {
  const rows = [['Date', 'Time', 'Sale #', 'Item', 'Qty', 'Price each', 'Line total', 'Cost each', 'Profit', 'Paid by', 'Code', 'Customer']];
  D.sales.slice().sort((a, b) => a.at - b.at).forEach((s) => s.lines.forEach((l) => rows.push([dstr(s.at), ftime(s.at), s.no, l.name, l.qty, l.price, l.qty * l.price, l.cost, l.qty * (l.price - l.cost), s.pay, s.ref, custName(s.cid)])));
  download((D.shop.name || 'duka').replace(/\W+/g, '-') + '-sales-' + today() + '.csv', rows.map((r) => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
MONEY.settings = function (b) {
  const s = D.shop;
  const F = [['name', 'Shop name'], ['town', 'Town'], ['owner', 'Your first name'], ['phone', 'Shop phone'], ['whatsapp', 'WhatsApp number'], ['till', 'M-Pesa till number'], ['paybill', 'Paybill (if you use one)'], ['acct', 'Paybill account'], ['kra', 'KRA PIN (shows on receipts)']];
  b.innerHTML = `<div class="card">${F.map(([k, l]) => `<label for="st_${k}">${l}</label><input id="st_${k}" value="${esc(s[k] || '')}" autocomplete="off">`).join('')}
      <label for="stStaff">People who use the shop phone (one per line)</label><textarea id="stStaff">${esc(D.staff.join('\n'))}</textarea>
      <label for="stCats">Stock categories (one per line)</label><textarea id="stCats">${esc(D.cats.join('\n'))}</textarea>
      <label for="stExp">Money-out categories (one per line)</label><textarea id="stExp">${esc(D.expCats.join('\n'))}</textarea>
      <label class="check"><input type="checkbox" id="stStop" ${s.stop ? 'checked' : ''}> Add “Reply STOP if you do not want these messages” to every offer</label>
      <div style="height:10px"></div><button class="btn block" id="stSave" onclick="saveSettings()">Save settings</button></div>
    <h3>Backup</h3>
    <div class="card"><p class="hint" style="margin-top:0">Everything is saved on this phone only. Once a week, download a backup and send it to yourself on WhatsApp or email. If the phone is lost, Restore brings it all back on a new phone.</p>
      <div class="row"><button class="btn sec" id="bkDown" onclick="backup()">⬇ Download backup</button><label class="btn sec" style="margin:0">⬆ Restore<input type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"></label></div></div>
    <h3>Start over</h3>
    <div class="card"><div class="row">${D.example ? '' : '<button class="btn sec" onclick="loadExample()">🧪 Load the example shop</button>'}<button class="btn sec bad" id="startOver" onclick="startOverAsk()">🧹 Start over — clear everything</button></div>
      <p class="hint">Start over removes every sale, item, customer and count on this phone. Download a backup first if you might need it.</p></div>
    <p class="hint">Duka ${VERSION} · Daraja Studio${SBX ? ' · 🧪 test copy' : ''}</p>`;
};
function lines(id) { return $(id).value.split('\n').map((x) => x.trim()).filter(Boolean); }
function saveSettings() {
  ['name', 'town', 'owner', 'phone', 'whatsapp', 'till', 'paybill', 'acct', 'kra'].forEach((k) => (D.shop[k] = $('st_' + k).value.trim()));
  if (!D.shop.name) { toast('The shop needs a name.'); return; }
  D.shop.stop = $('stStop').checked; D.staff = lines('stStaff'); const c = lines('stCats'), e = lines('stExp'); if (c.length) D.cats = c; if (e.length) D.expCats = e;
  save(); route(); toast('Settings saved.');
}
function backup() { download('duka-backup-' + today() + '.json', JSON.stringify(D, null, 1), 'application/json'); toast('Backup downloaded. Send it to yourself.'); }
function restore(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.v || !Array.isArray(d.sales)) throw 0; if (!confirm('Replace everything on this phone with this backup?')) return; D = Object.assign(blank(), d); save(); go('today'); toast('Restored.'); } catch (e) { toast('That file is not a Duka backup.'); } };
  r.readAsText(f);
}
function loadExample() { if (!confirm('Replace your shop with the example shop? Download a backup first if you need your data.')) return; D = example(); save(); go('today'); }
function startOverAsk() {
  if (DEMO) { toast('This is the video copy — nothing to clear.'); return; }
  if (!confirm(D.example ? 'Leave the example shop and set up your own? The example is cleared.' : 'Clear EVERYTHING on this phone and start over? This cannot be undone.')) return;
  try { STORE && STORE.removeItem(SKEY); } catch (e) {}
  D = null; CART = []; sellReset(); try { history.replaceState(null, '', location.pathname + location.search + '#today'); } catch (e) {} TAB = 'today'; welcome(); startFresh();
}

/* ---------- start ---------- */
$('ver').textContent = 'Duka ' + VERSION + ' · Daraja Studio' + (SBX ? ' · 🧪 test copy' : '') + (DEMO ? ' · example (not saved)' : '');
load();
route();
if ('serviceWorker' in navigator && !DEMO && /^https?:/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
