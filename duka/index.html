<!-- Duka · Electronics Shop · v1.0 · 2026-10-16 — Daraja Studio
     The cash-management and marketing parts of Zuri (Cash today, Count the cash, Money out / in with the M-Pesa paste,
     Bills, the Friday report, ready-written WhatsApp / SMS messages), rebuilt for one retail shop that sells phones and
     electronics, plus what a shop needs that Zuri did not have: selling, stock, deni (customers who owe), repairs and offers.
     Everything is saved on this phone only (localStorage dj_duka_v1). Nothing is ever sent by itself: a text or WhatsApp
     opens on the person's own phone and they press Send.
     ?dj_sandbox=1 → a test copy in this tab only (sessionStorage), the real data is never touched.
     ?demo=1, or opened inside the store's video player (shop/watch.html) → the example shop, in memory, never saved. -->
<style>
  :root {
    --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EDF1EF; --ink:#152322; --ink-soft:#3F4F4C; --ink-faint:#56645F;
    --brand:#0F6E5C; --brand-soft:#0F6E5C18; --accent:#F2A93B; --accent-soft:#F2A93B22;
    --ok:#2E8B57; --ok-soft:#2E8B5718; --warn-ink:#8F4C00; --warn-soft:#D9822B1E; --bad:#C0392B; --bad-soft:#C0392B1A;
    --line:#D8DFDC; --line-strong:#B9C4C0; --on-brand:#FFFFFF; --sbx:#6B3FA0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0F1614; --surface:#18221F; --surface-2:#1F2B27; --ink:#E6ECEA; --ink-soft:#B4C2BE; --ink-faint:#93A39F;
      --brand:#3FB79A; --brand-soft:#3FB79A22; --accent:#F2B857; --accent-soft:#F2B85726; --ok:#5DC48A; --ok-soft:#5DC48A22;
      --warn-ink:#F0A05A; --warn-soft:#F0A05A22; --bad:#E76F5F; --bad-soft:#E76F5F22; --line:#2A3733; --line-strong:#3A4A45; --on-brand:#0F1614; --sbx:#B48AE0; }
  }
  :root[data-theme="dark"] { --bg:#0F1614; --surface:#18221F; --surface-2:#1F2B27; --ink:#E6ECEA; --ink-soft:#B4C2BE; --ink-faint:#93A39F;
    --brand:#3FB79A; --brand-soft:#3FB79A22; --accent:#F2B857; --accent-soft:#F2B85726; --ok:#5DC48A; --ok-soft:#5DC48A22;
    --warn-ink:#F0A05A; --warn-soft:#F0A05A22; --bad:#E76F5F; --bad-soft:#E76F5F22; --line:#2A3733; --line-strong:#3A4A45; --on-brand:#0F1614; --sbx:#B48AE0; }

  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric:tabular-nums; }
  a { color:var(--brand); }

  header { background:var(--brand); color:var(--on-brand); position:sticky; top:0; z-index:20; padding:10px 16px; padding-top:max(10px, env(safe-area-inset-top)); }
  header .bar { display:flex; align-items:center; gap:8px; max-width:760px; margin:0 auto; }

  main { max-width:760px; margin:0 auto; padding:14px 16px 110px; }

  nav.tabs button { flex:1; min-width:0; background:none; border:none; font:inherit; font-size:11px; font-weight:700; color:var(--ink-soft); padding:7px 0 8px; cursor:pointer; min-height:56px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  nav.tabs button .ic { display:block; font-size:21px; line-height:1.2; }

  h2 { font-size:21px; margin:4px 0 10px; }

  label { display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin:10px 0 4px; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; padding:10px 12px; }
  input[type=checkbox] { width:24px; height:24px; flex:none; accent-color:var(--brand); margin:0; }
  .check { display:flex; gap:10px; align-items:center; font-weight:600; font-size:15px; color:var(--ink); margin:12px 0 4px; cursor:pointer; }
  textarea { min-height:76px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--brand); outline-offset:1px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font:inherit; font-weight:800; font-size:15px; border:none; border-radius:12px; padding:11px 16px; background:var(--brand); color:var(--on-brand); cursor:pointer; text-decoration:none; min-height:46px; }
  .btn.sec { background:var(--surface-2); color:var(--ink); border:1px solid var(--line); }
  .btn.acc { background:var(--accent); color:#152322; }
  .btn.bad { background:var(--bad); color:#fff; }

  .btn.block { width:100%; }
  .btn.big { font-size:17px; min-height:56px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--ink-faint); }
  .hint { font-size:14px; color:var(--ink-faint); margin:6px 0; }
  .pill { display:inline-block; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); white-space:nowrap; }
  .pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.warn { background:var(--warn-soft); color:var(--warn-ink); }
  .pill.bad { background:var(--bad-soft); color:var(--bad); } .pill.brand { background:var(--brand-soft); color:var(--brand); }
  .list .item { display:flex; gap:10px; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  .list .item:last-child { border-bottom:none; }

  .list .item .m { font-size:14px; color:var(--ink-faint); }

  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .kpi .k { font-size:12px; color:var(--ink-soft); font-weight:700; }
  .kpi .v { font-size:21px; font-weight:800; margin-top:2px; overflow-wrap:anywhere; }
  .kpi .v.ok { color:var(--ok); } .kpi .v.warn { color:var(--warn-ink); } .kpi .v.bad { color:var(--bad); }
  .kpi .f { font-size:12px; color:var(--ink-faint); }
  .subtabs { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
  .subtabs button { flex:none; min-height:44px; padding:8px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); font:inherit; font-weight:700; font-size:14px; cursor:pointer; }
  .subtabs button.on { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg > button { flex:1 1 auto; min-height:46px; padding:9px 10px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font:inherit; font-weight:700; font-size:14px; cursor:pointer; }
  .seg > button.on { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  .chips button { min-height:40px; padding:7px 12px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; cursor:pointer; }
  .chips button.on { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .alert { border-radius:10px; padding:10px 12px; margin:8px 0; font-weight:700; font-size:14px; }
  .alert.ok { background:var(--ok-soft); color:var(--ok); } .alert.warn { background:var(--warn-soft); color:var(--warn-ink); } .alert.bad { background:var(--bad-soft); color:var(--bad); }
  .need { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .need:last-child { border-bottom:none; }
  .need .em { font-size:22px; flex:none; width:30px; text-align:center; }
  .need .grow { flex:1; min-width:0; font-size:15px; }
  .line { display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .line:last-child { border-bottom:none; }
  .line .nm { font-weight:700; }
  .qty { display:flex; align-items:center; gap:6px; }
  .qty button { width:44px; height:44px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-size:20px; font-weight:800; cursor:pointer; }
  .qty b { min-width:26px; text-align:center; font-size:17px; }
  .line input.price { width:120px; padding:8px 10px; text-align:right; }
  .total { display:flex; justify-content:space-between; align-items:baseline; font-size:20px; font-weight:800; padding:10px 0 2px; }
  .pick { display:flex; justify-content:space-between; gap:10px; align-items:center; width:100%; text-align:left; font:inherit; padding:11px 12px; margin:0 0 6px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); cursor:pointer; min-height:48px; }
  .pick small { color:var(--ink-faint); }
  pre.report { white-space:pre-wrap; background:var(--surface-2); border-radius:10px; padding:12px; font-size:14px; line-height:1.5; font-family:ui-monospace,Menlo,Consolas,monospace; margin:0 0 10px; overflow-wrap:anywhere; }
  .empty { text-align:center; padding:22px 10px; color:var(--ink-faint); }
  .big-n { font-size:30px; font-weight:800; }
  .toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-weight:700; font-size:14px; z-index:70; max-width:90vw; opacity:0; transition:opacity .2s; pointer-events:none; text-align:center; }
  .toast.show { opacity:1; }
  .sheet-bg { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--surface); color:var(--ink); width:100%; max-width:560px; max-height:90vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin-top:0; }
  .sheet .x { float:right; background:none; border:none; font-size:26px; line-height:1; color:var(--ink-soft); cursor:pointer; min-width:44px; min-height:44px; }
  @media (min-width: 700px) { .sheet-bg { align-items:center; } .sheet { border-radius:18px; } }
  footer.ver { text-align:center; font-size:11px; color:var(--ink-faint); padding:0 16px 90px; }
  .welcome { position:fixed; inset:0; z-index:60; background:var(--bg); overflow:auto; padding:max(28px, env(safe-area-inset-top)) 18px 30px; }
  .welcome .in { max-width:460px; margin:0 auto; }
  .welcome .logo { font-size:58px; text-align:center; margin-top:4vh; }
  .welcome h2 { text-align:center; font-size:26px; margin:6px 0 4px; }
  .welcome p.lede { text-align:center; color:var(--ink-soft); margin:0 0 18px; }
  .choice { display:flex; gap:12px; align-items:center; width:100%; text-align:left; font:inherit; font-size:17px; font-weight:800; padding:15px 16px; margin-bottom:10px; border-radius:16px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; }
  .choice .em { font-size:26px; } .choice small { display:block; font-weight:500; font-size:13px; color:var(--ink-faint); }
  .tag-ex { display:inline-block; font-size:11px; font-weight:800; color:var(--warn-ink); background:var(--warn-soft); border-radius:6px; padding:1px 6px; margin-left:6px; }
  @media print { nav.tabs, header, .no-print, footer.ver { display:none !important; } body { background:#fff; color:#000; } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1><span id="hdrName">Duka</span> <small id="hdrDate"></small></h1>
    <span class="hpill sbx" id="sbxPill" hidden>🧪 Test copy</span>
    <span class="hpill" id="demoPill" hidden>Example shop</span>
  </div>
</header>

<main id="view"><p class="muted">Loading…</p></main>

<nav class="tabs" id="nav" aria-label="Main">
  <button id="nav-today" data-tab="today" onclick="go('today')"><span class="ic">🏠</span>Today</button>
  <button id="nav-sell" data-tab="sell" onclick="go('sell')"><span class="ic">🛒</span>Sell</button>
  <button id="nav-stock" data-tab="stock" onclick="go('stock')"><span class="ic">📦</span>Stock</button>
  <button id="nav-people" data-tab="people" onclick="go('people')"><span class="ic">👥</span>Customers</button>
  <button id="nav-offers" data-tab="offers" onclick="go('offers')"><span class="ic">📣</span>Offers</button>
  <button id="nav-money" data-tab="money" onclick="go('money')"><span class="ic">💵</span>Money</button>
</nav>

<div id="sheetHost"></div>
<div class="toast" id="toast" role="status"></div>
<footer class="ver" id="ver"></footer>

<script>
'use strict';
const VERSION = 'v1.0 · 2026-10-16';
const KEY = 'dj_duka_v1';
window.DJ_OWNS = { k:['dj_duka_v1'], p:['dj_duka_'] };

/* ---------- where the data lives ---------- */
const QS = new URLSearchParams(location.search);
const SBX = QS.get('dj_sandbox') === '1';
let DEMO = QS.get('demo') === '1';
try { if (window.parent !== window && /\/shop\/watch\.html$/.test(window.parent.location.pathname)) DEMO = true; } catch (e) {}
const STORE = (function () { try { const s = SBX ? sessionStorage : localStorage; s.setItem('__dk', '1'); s.removeItem('__dk'); return s; } catch (e) { return null; } })();
const SKEY = (SBX ? 'sbx:' : '') + KEY;

/* ---------- small helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const N = (v) => { const n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const money = (n) => 'KSh ' + Math.round(N(n)).toLocaleString('en-KE');
const pad = (n) => String(n).padStart(2, '0');
const dstr = (t) => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dstr(Date.now());
const ym = (t) => dstr(t == null ? Date.now() : t).slice(0, 7);
const fdate = (t) => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fday = (t) => new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const ftime = (t) => new Date(t).toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
const DAY = 864e5;
const daysAgo = (t) => Math.floor((startOf(Date.now()) - startOf(t)) / DAY);
function startOf(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function first(name) { return String(name || '').trim().split(/\s+/)[0] || ''; }
function phone254(p) { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('254')) return d; if (d.startsWith('0')) return '254' + d.slice(1); if (d.length === 9) return '254' + d; return d; }
function waHref(phone, text) { return 'https://wa.me/' + phone254(phone) + '?text=' + encodeURIComponent(text); }
function smsHref(phone, text) { return 'sms:' + String(phone || '').replace(/[^\d+]/g, '') + '?&body=' + encodeURIComponent(text); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3000); }
function copyText(text, ok) {
  const done = () => toast(ok || 'Copied.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done);
}
function fallbackCopy(text, done) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text and copy it by hand.'); } ta.remove(); }
function opts(list, sel) { return list.map((o) => { const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(t)}</option>`; }).join(''); }

/* ---------- the data ---------- */
const CATS = ['Phones', 'Accessories', 'TV & Sound', 'Solar & Power', 'Computers & Storage'];
const EXP_CATS = ['Stock purchase', 'Rent', 'Electricity (KPLC)', 'Internet & airtime', 'Salaries & wages', 'Transport', 'Marketing & ads', 'Licences & permits', 'Repair parts', 'Other'];
const IN_CATS = ['Repair fee', 'Deni payment', 'Owner put money in', 'Other'];
const RECEIPTS = ['Paper receipt — kept', 'M-Pesa message', 'No — chase it'];
function blank() {
  return { v: 1, shop: { name: '', town: '', owner: '', phone: '', whatsapp: '', till: '', paybill: '', acct: '', kra: '', stop: true },
    staff: [], cats: CATS.slice(), expCats: EXP_CATS.slice(), items: [], sales: [], inn: [], out: [], counts: [], bills: [], custs: [], repairs: [], offers: [],
    n: { sale: 0, rep: 0 }, example: false, made: Date.now() };
}
let D = null;
function load() {
  if (DEMO) { D = example(); return; }
  let d = null; try { d = JSON.parse((STORE && STORE.getItem(SKEY)) || 'null'); } catch (e) { d = null; }
  D = d && d.v ? Object.assign(blank(), d) : null;
}
function save() {
  if (DEMO || !D) return;
  try { STORE && STORE.setItem(SKEY, JSON.stringify(D)); } catch (e) { toast('Could not save — the phone may be full.'); }
}

/* ---------- the example shop (Baraka Electronics, Nakuru) — dates are counted back from today ---------- */
function example() {
  const d = blank(); d.example = true;
  d.shop = { name: 'Baraka Electronics', town: 'Nakuru', owner: 'Wanjiru', phone: '0712 345 678', whatsapp: '0712 345 678', till: '512734', paybill: '', acct: '', kra: 'P051234567X', stop: true };
  d.staff = ['Wanjiru', 'Brian'];
  const at = (days, h, m) => { const x = new Date(); x.setDate(x.getDate() - days); x.setHours(h, m || 0, 0, 0); return Math.min(x.getTime(), Date.now() - 60e3 * (days === 0 ? 5 : 0)); };
  const I = (name, cat, cost, price, qty, low, wty) => { const it = { id: uid(), name, cat, cost, price, qty, low, wty }; d.items.push(it); return it; };
  const spark = I('Tecno Spark 20', 'Phones', 14500, 16999, 6, 2, 12);
  const a15 = I('Samsung Galaxy A15', 'Phones', 19800, 22500, 3, 2, 12);
  const hot = I('Infinix Hot 40i', 'Phones', 12900, 14999, 1, 2, 12);
  const nokia = I('Nokia 105 (kabambe)', 'Phones', 1900, 2600, 12, 4, 6);
  const charger = I('Fast charger 25W (Type-C)', 'Accessories', 350, 800, 25, 8, 3);
  const cable = I('USB-C cable 1m', 'Accessories', 120, 300, 40, 10, 0);
  const ear = I('Oraimo earphones', 'Accessories', 450, 950, 14, 5, 3);
  const pbank = I('Power bank 10,000mAh', 'Accessories', 1300, 2200, 7, 3, 6);
  const glass = I('Screen protector (glass)', 'Accessories', 60, 300, 60, 15, 0);
  const cover = I('Phone cover', 'Accessories', 100, 400, 3, 10, 0);
  const tv = I('Vitron 32" smart TV', 'TV & Sound', 13500, 16500, 2, 1, 12);
  const spk = I('Bluetooth speaker', 'TV & Sound', 1600, 2800, 5, 2, 6);
  const ext = I('Extension cable 4-way', 'Solar & Power', 450, 900, 9, 3, 0);
  const solar = I('Solar lamp + phone charging', 'Solar & Power', 1500, 2500, 4, 2, 12);
  const flash = I('Flash disk 32GB', 'Computers & Storage', 450, 900, 10, 4, 0);

function cartQty(i, d) { CART[i].qty += d; if (CART[i].qty <= 0) CART.splice(i, 1); renderCart(); renderPay(); }

function renderPay() {
  const box = $('payBox'); if (!box) return;
  const tot = cartTotal(), p = SELL.pay;
  let more = '';

    const m = SELL.msgAmt;
    more = `<label for="sMsg">📲 Paste the M-Pesa message (optional)</label>

      ${m != null ? (Math.round(m) === Math.round(tot) ? `<div class="alert ok">✓ The message says ${money(m)} — it matches.</div>` : `<div class="alert bad">The message says ${money(m)} but the total is ${money(tot)}. Check before you save.</div>`) : ''}`;

    const g = N(SELL.given);
    more = `<label for="sGiven">Cash given (optional)</label><input id="sGiven" inputmode="numeric" placeholder="${tot}" value="${esc(SELL.given)}" oninput="SELL.given=this.value;$('sChange').innerHTML=changeLine()"><div id="sChange">${changeLine()}</div>`;
  } else if (p === 'Card') {
    more = `<label for="sRef">Card slip number (optional)</label><input id="sRef" value="${esc(SELL.ref)}" oninput="SELL.ref=this.value" autocomplete="off">`;
  } else {

  }

}
function changeLine() { const g = N(SELL.given), tot = cartTotal(); if (!SELL.given) return ''; return g >= tot ? `<div class="alert ok">Change to give back: <b>${money(g - tot)}</b></div>` : `<div class="alert bad">That is ${money(tot - g)} short.</div>`; }
function sellMsg(text) { const m = parseMpesa(text); if (!m) { toast('That does not look like an M-Pesa message.'); return; } SELL.ref = m.ref || SELL.ref; SELL.msgAmt = m.amt; if (m.name && !SELL.cname) SELL.cname = titleCase(m.name); const sc = $('sCust'); if (sc) sc.value = SELL.cname; custPicked(); renderPay(); toast('Filled from the message.'); }
function titleCase(s) { return String(s).toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()); }
/* M-Pesa confirmations: received / sent / paid to / buy goods. Returns {ref, amt, name, phone, date, bal, dir}. */
function parseMpesa(t) {
  t = String(t || '').replace(/\s+/g, ' ').trim(); if (!t) return null;
  const ref = (t.match(/\b([A-Z0-9]{10})\b/) || [])[1] || '';
  const am = t.match(/K\s?sh\.?\s?([\d,]+(?:\.\d{1,2})?)/i); if (!am) return null;
  const amt = N(am[1]);
  let dir = '', name = '', phone = '';
  let m = t.match(/received from ([A-Za-z .'&-]+?)(?:\s+(\+?\d[\d*x ]{6,}\d))?\s+on\b/i) || t.match(/from ([A-Za-z .'&-]+?)(?:\s+(\+?\d[\d*x ]{6,}\d))?\s+on\b/i);
  if (m) { dir = 'in'; name = m[1].trim(); phone = (m[2] || '').replace(/\s/g, ''); }
  else if ((m = t.match(/(?:sent to|paid to) ([A-Za-z0-9 .'&-]+?)(?:\s+(?:for account|\+?\d[\d ]{6,}\d)|\s+on\b|\.)/i))) { dir = 'out'; name = m[1].trim(); }
  const dm = t.match(/on (\d{1,2})\/(\d{1,2})\/(\d{2,4})/); let date = '';
  if (dm) { let y = +dm[3]; if (y < 100) y += 2000; date = y + '-' + pad(+dm[2]) + '-' + pad(+dm[1]); }
  const bal = (t.match(/balance is K\s?sh\.?\s?([\d,]+(?:\.\d{1,2})?)/i) || [])[1];
  return { ref, amt, name, phone, date, bal: bal ? N(bal) : null, dir };
}
function saveSale() {
  if (!CART.length) { toast('Add something to the sale first.'); return; }
  const n = SELL.cname.trim(); let c = n ? D.custs.find((x) => x.name.toLowerCase() === n.toLowerCase()) : null;
  if (SELL.pay === 'Deni' && (!n || (!c && !String(SELL.phone).trim()))) { toast('Deni needs the customer’s name and phone.'); const s = $('sCust'); if (s) s.focus(); return; }
  if (SELL.pay === 'M-Pesa' && SELL.msgAmt != null && Math.round(SELL.msgAmt) !== Math.round(cartTotal()) && !confirm('The M-Pesa message amount does not match the total. Save anyway?')) return;
  if (n && !c) { c = { id: uid(), name: n, phone: String(SELL.phone).trim(), ok: !!SELL.ok, notes: '', added: Date.now() }; D.custs.push(c); }
  const t = Date.now();
  const s = { id: uid(), no: ++D.n.sale, at: t, lines: CART.map((l) => { const it = item(l.iid) || {}; return { iid: l.iid, name: l.name, qty: l.qty, price: N(l.price), cost: N(l.cost), wty: it.wty ? addMonths(t, it.wty) : 0 }; }),
    total: cartTotal(), pay: SELL.pay, ref: SELL.pay === 'M-Pesa' || SELL.pay === 'Card' ? SELL.ref.trim() : '', cid: c ? c.id : '', by: D.shop.owner };
  s.lines.forEach((l) => { const it = item(l.iid); if (it) it.qty = Math.max(0, N(it.qty) - l.qty); });
  D.sales.push(s); save(); sellReset();
  if (TAB === 'sell') VIEWS.sell($('view')); else go('sell');
  setTimeout(() => showReceipt(s.id, true), TAB === 'sell' ? 0 : 80);
}
function receiptText(s) {
  const sh = D.shop, c = cust(s.cid);
  const L = [sh.name + (sh.town ? ', ' + sh.town : ''), 'Receipt #' + s.no + ' · ' + fdate(s.at) + ' ' + ftime(s.at), ''];
  s.lines.forEach((l) => L.push(l.qty + ' × ' + l.name + ' — ' + money(l.qty * l.price)));
  L.push('', 'TOTAL ' + money(s.total), 'Paid: ' + (s.pay === 'Deni' ? 'Deni (to pay later)' + (owed(s) ? ' — still owed ' + money(owed(s)) : ' — fully paid') : s.pay + (s.ref ? ' ' + s.ref : '')));
  const w = s.lines.filter((l) => l.wty); if (w.length) { L.push(''); w.forEach((l) => L.push('🛡️ Warranty: ' + l.name + ' until ' + new Date(l.wty).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + '. Keep this message.')); }
  L.push('', 'Asante' + (c ? ' ' + first(c.name) : '') + ' for shopping with us! 🙏' + (payLine() ? ' ' + payLine() : '') + (sh.phone ? ' · ' + sh.phone : ''));
  if (sh.kra) L.push('KRA PIN ' + sh.kra);

}
function showReceipt(id, fresh) {

function periodRange(p) {

      <div style="height:10px"></div><button class="btn block" id="stSave" onclick="saveSettings()">Save settings</button></div>
    <h3>Backup</h3>
    <div class="card"><p class="hint" style="margin-top:0">Everything is saved on this phone only. Once a week, download a backup and send it to yourself on WhatsApp or email. If the phone is lost, Restore brings it all back on a new phone.</p>
      <div class="row"><button class="btn sec" id="bkDown" onclick="backup()">⬇ Download backup</button><label class="btn sec" style="margin:0">⬆ Restore<input type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"></label></div></div>
    <h3>Start over</h3>
    <div class="card"><div class="row">${D.example ? '' : '<button class="btn sec" onclick="loadExample()">🧪 Load the example shop</button>'}<button class="btn sec bad" id="startOver" onclick="startOverAsk()">🧹 Start over — clear everything</button></div>
      <p class="hint">Start over removes every sale, item, customer and count on this phone. Download a backup first if you might need it.</p></div>
    <p class="hint">Duka ${VERSION} · Daraja Studio${SBX ? ' · 🧪 test copy' : ''}</p>`;
};
function lines(id) { return $(id).value.split('\n').map((x) => x.trim()).filter(Boolean); }
function saveSettings() {
  ['name', 'town', 'owner', 'phone', 'whatsapp', 'till', 'paybill', 'acct', 'kra'].forEach((k) => (D.shop[k] = $('st_' + k).value.trim()));
  if (!D.shop.name) { toast('The shop needs a name.'); return; }
  D.shop.stop = $('stStop').checked; D.staff = lines('stStaff'); const c = lines('stCats'), e = lines('stExp'); if (c.length) D.cats = c; if (e.length) D.expCats = e;
  save(); route(); toast('Settings saved.');
}
function backup() { download('duka-backup-' + today() + '.json', JSON.stringify(D, null, 1), 'application/json'); toast('Backup downloaded. Send it to yourself.'); }
function restore(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.v || !Array.isArray(d.sales)) throw 0; if (!confirm('Replace everything on this phone with this backup?')) return; D = Object.assign(blank(), d); save(); go('today'); toast('Restored.'); } catch (e) { toast('That file is not a Duka backup.'); } };
  r.readAsText(f);
}
function loadExample() { if (!confirm('Replace your shop with the example shop? Download a backup first if you need your data.')) return; D = example(); save(); go('today'); }
function startOverAsk() {
  if (DEMO) { toast('This is the video copy — nothing to clear.'); return; }
  if (!confirm(D.example ? 'Leave the example shop and set up your own? The example is cleared.' : 'Clear EVERYTHING on this phone and start over? This cannot be undone.')) return;
  try { STORE && STORE.removeItem(SKEY); } catch (e) {}
  D = null; CART = []; sellReset(); try { history.replaceState(null, '', location.pathname + location.search + '#today'); } catch (e) {} TAB = 'today'; welcome(); startFresh();
}

/* ---------- start ---------- */
$('ver').textContent = 'Duka ' + VERSION + ' · Daraja Studio' + (SBX ? ' · 🧪 test copy' : '') + (DEMO ? ' · example (not saved)' : '');
load();
route();
if ('serviceWorker' in navigator && !DEMO && /^https?:/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
