<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11211b">
<title>Testing board · Daraja</title>
<!--
  testing/board/ — Jerry's control board for the two testing groups. v1, 21 Nov 2026.
  Reads ../groups.json (who is in each group, who manages it) and, if this phone has
  opened Jerry's Kenya page before, the same tally the managers' pages read. Writes nothing.
  Shows work done only. Money is not shown here: the Kenya money page is kenya/lead/jerry/.
-->
<style>
:root{--bg:#11211b;--panel:#17291f;--fg:#eef3ef;--soft:#9fb3a8;--line:#2b3f34;--green:#3f9a74;--gold:#d69634;--red:#c2574b;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0ee;--panel:#fff;--fg:#171c1a;--soft:#5b6561;--line:#d4d9d6;--green:#1f5d44;--gold:#8a5d15;--red:#a33a2e;color-scheme:light}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;line-height:1.45;
 padding:18px max(16px,env(safe-area-inset-right,0px)) 44px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.2rem;margin:0 0 2px} h2{font-size:1rem;margin:0 0 4px}
.note{color:var(--soft);font-size:.82rem;margin:4px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:600;font-size:.72rem;text-transform:uppercase}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--soft);white-space:nowrap}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.warn{color:var(--gold);border-color:var(--gold)}.pill.bad{color:var(--red);border-color:var(--red)}
a{color:var(--green);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.links a{border:1px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none;font-size:.84rem}
footer{color:var(--soft);font-size:.76rem;padding-top:6px}
</style>
<div class="wrap">
<h1>Testing board</h1>
<p class="note" id="sub">Loading…</p>
<div id="groups"></div>
<p class="note" id="fresh"></p>
<footer>Read only. Membership lives in groups.json; to add or remove someone, tell the tester pack chat.
Testing board v1 · 2026-11-21 · Daraja Studio</footer>
</div>
<script>
var TALLYBASE='https://script.google.com/macros/s/AKfycbzHSpqxCITCSjVPZ5glJrmOPVYWsb7RwNazYyTzrgB88eTP_6fmTBGpTapCpfAH73bTyQ/exec';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s||'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()};
var KEY='';try{KEY=localStorage.getItem('dj_hq_k')||''}catch(e){}
function day(v){if(!v)return'';var d=new Date(v);if(isNaN(d))return String(v).slice(0,10);return new Date(d.getTime()+3*3600*1000).toISOString().slice(0,10)}
function since(d){if(!d)return null;return Math.max(0,Math.round((new Date(day(new Date())+'T00:00:00Z')-new Date(d+'T00:00:00Z'))/864e5))}
var G=null,T=null;
function mine(g,t){
  var ms=g.members.filter(function(m){return !m.to}), full={},first={};
  ms.forEach(function(m){full[norm(m.name)]=m.name;var f=norm(m.name).split(' ')[0];first[f]=(first[f]||[]).concat(m.name)});
  var out={};ms.forEach(function(m){out[m.name]={apps:{},steps:0,last:'',reports:0}});
  ((t&&t.tests)||[]).forEach(function(x){
    var n=norm(x.who),w=full[n]||(n.indexOf(' ')<0&&first[n]&&first[n].length===1?first[n][0]:null);
    if(!w)return;var d=day(x.at);if(!d||d<g.start)return;
    var o=out[w];o.reports++;o.apps[String(x.app||'').trim()]=1;if(d>o.last)o.last=d});
  return out}
function draw(){
  var html=Object.keys(G.groups).map(function(k){var g=G.groups[k],f=mine(g,T);
    var ms=g.members.filter(function(m){return !m.to});
    var rows=ms.map(function(m){var o=f[m.name],n=since(o.last),st=!T?['Not read','']:n===null?['Not started yet','warn']:n>=7?['Quiet','warn']:['Active','ok'];
      return '<tr><td>'+esc(m.name)+(m.star?' <span class="pill">'+m.star+'★</span>':'')+'</td><td class="n">'+(T?Object.keys(o.apps).length:'–')+'</td><td class="n">'+(T?o.reports:'–')+'</td><td><span class="pill '+st[1]+'">'+esc(st[0])+'</span></td></tr>'}).join('');
    return '<div class="card"><h2>'+esc(g.title)+' · managed by '+esc(g.manager)+'</h2>'+
      '<p class="note">'+esc(g.about)+'</p>'+
      '<p class="note"><b>Pay:</b> '+esc(g.paid)+'</p>'+
      '<p class="note"><b>Apps:</b> '+(g.apps.length?esc(g.apps.join(', ')):esc(g.appsNote))+'</p>'+
      '<table><tr><th>Tester</th><th class="n">Apps</th><th class="n">Reports</th><th>How they are</th></tr>'+rows+'</table>'+
      '<p class="note">'+ms.length+' testers · counting from '+esc(g.start)+'</p>'+
      '<div class="links"><a href="'+esc(g.testerLink)+'">Testers’ link</a><a href="'+esc(g.managerLink)+'">'+(k==='us'?'This board':'Emmanuel’s page')+'</a>'+
      (k==='kenya-stars'?'<a href="https://jerrywins1.github.io/daraja-apps/kenya/lead/jerry/">Kenya money</a>':'')+'</div></div>'}).join('');
  $('groups').innerHTML=html;
  $('sub').textContent=Object.keys(G.groups).length+' groups · '+Object.keys(G.groups).reduce(function(s,k){return s+G.groups[k].members.filter(function(m){return !m.to}).length},0)+' testers';
  $('fresh').textContent=T?'Counting everything filed since each group’s start date.':(KEY?'The testers’ numbers could not be read just now, so the work columns are empty.':'Work columns are empty until this phone has opened Jerry’s Kenya money page once.')}
fetch('../groups.json?cb='+Date.now()).then(function(r){return r.json()}).then(function(g){G=g;draw();
  if(KEY)return fetch(TALLYBASE+'?key='+encodeURIComponent(KEY)).then(function(r){return r.json()}).then(function(d){if(d&&d.ok){T=d;draw()}}).catch(function(){draw()})})
 .catch(function(e){$('sub').textContent='Something did not load: '+e.message});
</script>
</html>
