<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11211b">
<title>How to test · Daraja</title>
<!--
  kenya/how/ — the testers' video. v1, 8 Nov 2026.

  Thirteen slides and the phone's own voice, the same way the managers' video works.
  It lives here rather than in a Claude page so every tester reaches it from the link
  they already have: no account, no sign-in, nothing to share.

  What it covers, which the older "How to be a tester" video does not: touching every
  box, trying to break the app, what a useful report says, the survey at the end, using
  the apps daily, what the work pays, and who pays them.

  The slides are t01.png to t13.png beside this file, made by testerslides.js.
-->
<style>
:root{
  --bg:#11211b; --panel:#17291f; --fg:#eef3ef; --soft:#9fb3a8; --line:#2b3f34;
  --green:#3f9a74;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef0ee; --panel:#ffffff; --fg:#171c1a; --soft:#5b6561; --line:#d4d9d6;
  --green:#1f5d44; color-scheme:light;
}}
:root[data-theme="dark"]{
  --bg:#11211b; --panel:#17291f; --fg:#eef3ef; --soft:#9fb3a8; --line:#2b3f34;
  --green:#3f9a74; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 22px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:1.05rem;font-weight:700;margin:0;text-align:center}
.sub{font-size:.8rem;color:var(--soft);margin:0;text-align:center;max-width:46ch}
.stage{width:100%;max-width:420px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:14px;
  border:1px solid var(--line);background:var(--panel);display:block}
.bar{width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dot{height:5px;border-radius:3px;background:var(--line);flex:1 1 0;min-width:8px}
.dot.on{background:var(--green)}
.dot.done{background:var(--soft)}
.ctl{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
button.main{background:var(--green);border-color:var(--green);color:#fff;flex:1 1 auto;max-width:220px}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.cap{font-size:.86rem;line-height:1.45;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:3.6em}
.note{font-size:.74rem;color:var(--soft);text-align:center;margin:0}
a.back{color:var(--green);font-size:.82rem;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<h1>How to test</h1>
<p class="sub">Tap Play — your phone reads it aloud. About three minutes.</p>

<div class="stage"><img id="slide" alt="" src="t01.png"></div>

<div class="bar">
  <div class="dots" id="dots"></div>
  <div class="cap" id="cap">Tap Play to begin.</div>
  <div class="ctl">
    <button id="prev" type="button" aria-label="Previous">‹ Back</button>
    <button id="play" class="main" type="button">▶ Play</button>
    <button id="next" type="button" aria-label="Next">Next ›</button>
  </div>
  <p class="note" id="vstat">&nbsp;</p>
  <p class="note"><a class="back" href="../">‹ Back to your apps</a></p>
</div>

<script>
const SLIDES = [
 ["You are not being tested. The app is. If something confuses you, that is the app's fault, and it is exactly what we need to hear.", 8],
 ["One test has four parts. First you watch a short video about the app. Then the steps: do one at a time, and say if it worked. Then the challenge: the app starts empty and you do a few jobs on your own. Then your own words: what is this app for. Then you tap Send my results.", 15],
 ["A step tells you what to do. Do that, and then look around before you move on. Open every tab. Tap every button once. Type something in every box. Scroll right to the bottom. A button nobody pressed is a button nobody tested.", 14],
 ["Now the part people are shy about. Try to break it. Leave a box empty and save anyway. Type a very long name. Put letters where a number goes. Press the same button twice, fast. Go back half way through. Turn the phone sideways. If you broke it, it was already broken. You just found it first.", 18],
 ["When something is wrong, say what happened. Not, it does not work. That tells us nothing. Instead: I tapped Save with the name box empty, and nothing happened, and there was no message. Three things. What you did. What you expected. What happened instead.", 16],
 ["A word you did not understand is a real problem. So is a button you could not find. Tap the shrug, not sure, and say why. Many of our best fixes started there.", 11],
 ["At the end there is a short survey. One minute. Would you use it. Was it easy. What would you pay for it. Who is it for. You can skip it, but please do not. It is the only place you tell us what the app is worth.", 14],
 ["Use the apps every day. One Thing, and Every Day. Do the app's small job, then come back and tap, I used it today. Five days out of seven earns you one hundred shillings. Not five in a row, so a sick day costs you nothing.", 15],
 ["Steps are not enough on their own. Somebody who never lives with an app can tell us whether the buttons work. They cannot tell us whether the app is any good. That is the part we actually need from you.", 13],
 ["What you earn. One hundred shillings for a small app. One hundred and fifty for a normal one. Two hundred and fifty for a big one. Fifty more for a report that finds a real problem. And one hundred for using an app five days out of seven.", 15],
 ["Sending the report is what earns the money. Failing the challenge costs you nothing. A test that shows something is broken is worth as much as one that passes. Nobody is marked down for breaking an app, and nobody is paid more for being quiet.", 15],
 ["Your team leader pays you. Emmanuel Koki for team one, Veronicah Kimani for team two. The week runs Monday to Sunday. On Sunday night it closes and your leader pays you. Ask your leader about your own pay, not Jerry.", 14],
 ["That is the whole job. Use the app like it is yours. Touch everything. Try to break it. Say what happened, in your own words. Send it, and do the survey. Asante sana. Every app that gets better because of you helps a student stay in school.", 16]
];

const el = id => document.getElementById(id);
const img = el('slide'), cap = el('cap'), dots = el('dots');
let at = 0, playing = false, timer = null, spoke = false;

function pad(i){ return 't' + String(i + 1).padStart(2, '0') + '.png'; }
dots.innerHTML = SLIDES.map((_, i) => '<span class="dot" data-i="' + i + '"></span>').join('');
SLIDES.forEach((_, i) => { const im = new Image(); im.src = pad(i); });

function paint(){
  img.src = pad(at);
  img.alt = 'Slide ' + (at + 1) + ' of ' + SLIDES.length;
  cap.textContent = SLIDES[at][0];
  [...dots.children].forEach((d, i) => {
    d.className = 'dot' + (i === at ? ' on' : (i < at ? ' done' : ''));
  });
  el('prev').disabled = at === 0;
  el('next').disabled = at === SLIDES.length - 1;
}

/* The same voices and the same rate as the store's own videos, so they sound alike. */
function pickVoice(){
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  return vs.filter(v => /Samantha|Karen|Moira|Serena|Google US English/i.test(v.name))[0] || vs[0] || null;
}
function speak(text, done){
  clearTimeout(timer);
  const fallback = () => { timer = setTimeout(done, Math.max(2600, SLIDES[at][1] * 1000)); };
  if (!window.speechSynthesis) { el('vstat').textContent = 'This browser has no voice — the words are on screen.'; return fallback(); }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    const v = pickVoice(); if (v) { u.voice = v; el('vstat').textContent = 'Voice: ' + v.name; }
    let fired = false;
    u.onend = () => { if (!fired) { fired = true; clearTimeout(timer); done(); } };
    u.onerror = () => { if (!fired) { fired = true; clearTimeout(timer); done(); } };
    u.onstart = () => { spoke = true; };
    speechSynthesis.speak(u);
    /* Some browsers refuse silently — keep the slides moving anyway. */
    timer = setTimeout(() => { if (!fired) { fired = true; done(); } }, (SLIDES[at][1] + 14) * 1000);
    setTimeout(() => { if (!spoke) el('vstat').textContent = 'No voice on this device — the words are on screen.'; }, 1800);
  } catch (e) { fallback(); }
}

function stepOn(){
  if (!playing) return;
  paint();
  speak(SLIDES[at][0], () => {
    if (!playing) return;
    if (at < SLIDES.length - 1) { at++; stepOn(); } else stop();
  });
}
function start(){ playing = true; el('play').textContent = '❚❚ Pause'; stepOn(); }
function stop(){
  playing = false; el('play').textContent = '▶ Play';
  clearTimeout(timer);
  try { speechSynthesis.cancel(); } catch (e) {}
}
el('play').onclick = () => playing ? stop() : start();
el('prev').onclick = () => { if (at > 0) { at--; playing ? stepOn() : paint(); } };
el('next').onclick = () => { if (at < SLIDES.length - 1) { at++; playing ? stepOn() : paint(); } };
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {
  const v = pickVoice(); if (v && !playing) el('vstat').textContent = 'Voice ready: ' + v.name;
};
paint();
</script>
</html>
