<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenya Student Test Week</title>
<meta name="theme-color" content="#1C2B29">
<meta name="robots" content="noindex">
<!-- Kenya Student Test Week · v1.0 · 2026-10-11
     The page each Kenyan student opens from the personal link Jerry sends: daraja-apps/kenya/?who=<HQ token>&n=<first name>.
     Kickoff → practice app (Break-Even) → "Your next app" queue. Each app: (a) persona + explainer video, (b) the test script
     one step at a time, (c) the final challenge checked against the apps' real saved data (same origin: jerrywins1.github.io),
     (d) own words → "Send my results" = HQ public `report` (first line KENYA|key|steps:…|challenge:…|minutes:…).
     Everything is saved after every tap (localStorage dj_kenya_v1:<token>); unsent reports wait in dj_kenya_outbox.
     Data: ../shop/kenya/<key>.json (persona, explainer, challenge, ownWords) + ../testers/scripts/<key>.json (steps).
     No libraries, no fonts, no inline handlers. -->
<style>
:root{--bg:#F6F3EC;--card:#FFFFFF;--ink:#1C2B29;--mute:#55605E;--line:#DCD6CA;--brand:#1F6B5C;--brand-ink:#FFFFFF;--gold:#B7791F;--ok:#1E7A3C;--okbg:#E3F3E7;--bad:#B3261E;--badbg:#FBE7E5;--warnbg:#FFF4D6;--soft:#EEF5F2}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1C2422;--ink:#ECEFEA;--mute:#A9B3AF;--line:#33403C;--brand:#3FA58C;--brand-ink:#0E1513;--gold:#E0B25A;--ok:#6FD08F;--okbg:#18301F;--bad:#FF8A80;--badbg:#3A1E1C;--warnbg:#3A3218;--soft:#1F2C29}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
header.top .flag{font-size:26px}
header.top b{font-size:17px;display:block;line-height:1.2}
header.top small{color:var(--mute);font-size:13px}
h1{font-size:24px;line-height:1.25;margin:6px 0 10px}
h2{font-size:20px;line-height:1.3;margin:4px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.card.soft{background:var(--soft)}
.card.warn{background:var(--warnbg)}
.card.okc{background:var(--okbg)}
.card.badc{background:var(--badbg)}
.muted{color:var(--mute)}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;margin:8px 0 0;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:600 18px/1.2 inherit;font-family:inherit;text-decoration:none;text-align:center;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.mid{background:var(--gold);border-color:var(--gold);color:#fff}
@media (prefers-color-scheme:dark){.btn.ok,.btn.bad,.btn.mid{color:#111}}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
.stats{display:flex;gap:8px;margin:0 0 12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--brand)}
.parts{display:flex;gap:4px;margin:0 0 12px}
.parts span{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:var(--line);color:var(--mute)}
.parts span.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
.parts span.done{background:var(--okbg);color:var(--ok)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:10px 0 4px}
.do{font-size:19px;line-height:1.45}
.type{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--warnbg);font-weight:700;word-break:break-word}
.tip{font-size:15px;color:var(--mute);margin-top:8px}
textarea,input[type=text]{width:100%;min-height:52px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:17px/1.4 inherit;font-family:inherit}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ul.tasks{list-style:none;padding:0;margin:0}
ul.tasks li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:0}
ul.tasks .m{font-size:22px;line-height:1.2;min-width:28px}
.hint{display:block;margin-top:6px;font-size:15px;background:var(--warnbg);padding:8px 10px;border-radius:10px}
.queue{list-style:none;padding:0;margin:0}
.queue li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.lines p{margin:0 0 8px}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:16px;z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#ver{text-align:center;font-size:12px;color:var(--mute);margin:24px 0 0}
.big{font-size:40px;line-height:1}
.err{color:var(--bad);font-weight:600;margin-top:6px}
details.stuck{margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:0 12px}
details.stuck[open]{padding-bottom:12px}
details.more{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;margin:0 0 12px}
details.more[open]{padding-bottom:14px}
.qa{border-top:1px solid var(--line);padding:10px 0 2px}.qa:first-of-type{border-top:0}
.qa b{display:block}
.news{background:var(--warnbg);border-radius:14px;padding:12px 14px;margin:0 0 12px}
</style>
</head>
<body>
<main>
  <header class="top"><span class="flag" aria-hidden="true">🇰🇪</span><div><b>Daraja Student Test Week</b><small id="hdrName"></small></div></header>
  <div id="view"><p class="muted">Loading…</p></div>
  <div id="ver">Kenya Student Test Week v1.0 · 2026-10-11</div>
</main>
<script>
(function(){
'use strict';
var VERSION = 'v1.0 · 2026-10-11';
var BASE = 'https://jerrywins1.github.io/daraja-apps/';
var MAILBOX_FALLBACK = 'https://script.google.com/macros/s/AKfycbw1hgXVj5E8x8Ampm1fYK9po07pmSh9zrHfyVn3RvEYOR15_xb2jNPdlgzUuariPPrp/exec';
var KENYA_DIRS = ['../shop/kenya/', './'];            /* persona · explainer · challenge · ownWords (watch.html reads shop/kenya/ too) */
var SCRIPT_DIRS = ['../testers/scripts/', './scripts/']; /* the test scripts */
var EXPLAIN_VOICE = ['breakeven', 'safety'];           /* apps with a recorded voice/<key>-explain.m4a; others play mode=firsttime */
var PAY_APP = 120, PAY_PROBLEM = 50;
var PRACTICE = 'breakeven';
var UNSTUCK = 'How to get unstuck: 1) Go to the app tab and reload it (pull the page down). 2) Tap ‹ Back here and do the step before again. 3) Check you are on the right screen — compare with “You should see”. 4) If a box or card covers a button, scroll a little or close the box. Still stuck? Skip it below and keep going — that is useful information too.';
var FAQ = [
  ['What do “practice”, “examples” and “Start fresh” mean?', 'Practice: Break-Even is the first app for everyone, to learn how a test works. Examples: many apps start with made-up example data so you can play. Start fresh: removes the examples so the app is empty — the challenge always starts this way.'],
  ['The app looks different from the steps. What do I do?', 'Tap ❌ It didn’t and write what you see instead. Apps change while we fix them. A difference is useful to us — it is not your mistake.'],
  ['A button is hidden or covered.', 'Scroll a little, close any card or box on top, or turn the phone sideways. If you still cannot reach it, tap ❌ It didn’t and say which button was hidden. That is a real problem.'],
  ['How and when am I paid?', PAY_APP+' KES for each app you finish with the challenge passed, and '+PAY_PROBLEM+' KES for each real problem Jerry confirms. Jerry checks every report first (he is 8 hours behind Kenya), then pays by M-Pesa. Your total on this page is “pending” until then.'],
  ['What counts as a real problem?', 'Something that does not work, a button you cannot find, words that confuse you, a wrong number, or the app not keeping what you typed. A fast tick with no testing is not useful — honesty beats speed.'],
  ['How do I save data (bundles)?', 'Watch videos on Wi-Fi when you can, or tap “Read it instead”. The apps themselves are small. Your answers are saved on your phone and send when you have internet.'],
  ['The page will not load or looks broken.', 'Open it in Chrome (if it opened inside WhatsApp, tap ⋮ → Open in Chrome). Pull down to refresh. Your progress is saved on the phone, so nothing is lost. Always use the same phone and the same link.'],
  ['I am waiting for an answer from Jerry.', 'Do not wait — keep going with the next step or the next app. If you cannot do a step, use 😕 I’m stuck → Skip. Answers appear on this page under “Answers to your questions”, usually within a day.']
];
/* Every app in the week (My Scores, Pit Wall and Porchlight are left out). Order mixes the three lines; each student starts
   at a different place in this list (from their token), so six students spread across the shelf without a server.
   My Safety Plan always comes last (it needs a calm moment, never someone's first app). */
var APPS = {
  breakeven:['Break-Even','🧮',15], everyday:['Every Day','🌱',22], drumbeat:['Message Assistant','📣',17], church:['The Church App','⛪',26],
  ourtable:['Our Table','🍽',25], compass:['Daraja Compass','🗺️',17], churchserve:['Serve Board','🙋',26], whoscoming:['Who’s Coming','🙋',22],
  nextstep:['Next Step Board','🗂',16], churchclubhouse:['The Clubhouse','🏠',22], storykeeper:['In My Own Words','📖',26], ahead:['Ahead of It','🧾',26],
  churchgameday:['GameDay','🏀',20], rafiki:['Rafiki','💛',25], feedback:['Feedback Studio','🎙',16], churchkey:['The Key · Church Edition','🔑',22],
  thekey:['The Key','🔑',24], npreceipts:['Receipt Maker','💌',26], churchdrive:['Operation Christmas Child Assistant','📦',24], academy:['Daraja Academy','🎓',30],
  npgoodstanding:['Ahead of It · Nonprofit','🕊',28], advent:['Advent Together','🕯️',18], nownext:['One Thing','🧭',28], churchsteward:['Ahead of It · Church','📋',28],
  safety:['My Safety Plan','🫶',18]
};
var ROTATE = ['everyday','drumbeat','church','ourtable','compass','churchserve','whoscoming','nextstep','churchclubhouse','storykeeper','ahead','churchgameday',
  'rafiki','feedback','churchkey','thekey','npreceipts','churchdrive','academy','npgoodstanding','advent','nownext','churchsteward'];
var LAST = ['safety'];

/* ---------- storage (every read/write guarded) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function jget(k,d){ try{ var v=JSON.parse(lsGet(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
function jset(k,v){ return lsSet(k, JSON.stringify(v)); }

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(t){ var d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }

/* ---------- who ---------- */
var qs = new URLSearchParams(location.search);
var okTok = function(t){ return /^[A-Za-z0-9_-]{6,40}$/.test(String(t||'')); };
var WHO = qs.get('who'), NAME = (qs.get('n') || qs.get('name') || '').trim().slice(0,40);
if (okTok(WHO)) { lsSet('dj_kenya_who', WHO); lsSet('dj_who', WHO); } else WHO = lsGet('dj_kenya_who');
if (!okTok(WHO)) WHO = null;
var SKEY = WHO ? 'dj_kenya_v1:' + WHO : null;
var S = WHO ? jget(SKEY, null) : null;
if (WHO && !S) S = { v:1, who:WHO, name:'', kick:false, cur:null, apps:{}, born:Date.now() };
if (S && NAME) S.name = NAME;
if (S && S.name && !lsGet('dj_name')) lsSet('dj_name', S.name);
if (WHO && (qs.get('who') || qs.get('n'))) { try{ history.replaceState(null,'',location.pathname); }catch(e){} }  /* keep the token out of screenshots */
function save(){ if (S) jset(SKEY, S); }

/* ---------- the order of apps for this student ---------- */
function hash(s){ var h=2166136261; for (var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function order(){
  var off = hash(WHO||'x') % ROTATE.length;
  return [PRACTICE].concat(ROTATE.slice(off), ROTATE.slice(0,off), LAST);
}
function A(k){ if (!S.apps[k]) S.apps[k] = { stage:'watch', step:0, ans:{}, ms:0 }; return S.apps[k]; }
function finished(k){ var a=S.apps[k]; return !!(a && a.stage==='done'); }
function paused(k){ return (NEWS.paused||[]).indexOf(k)>=0; }
function nextApp(){ var o=order(), later=null; for (var i=0;i<o.length;i++){ var k=o[i]; if (finished(k) || paused(k)) continue; if (S.skip && S.skip[k]) { later=later||k; continue; } return k; } return later; }
function totals(){
  var done=0, paid=0, probs=0;
  Object.keys(S.apps).forEach(function(k){ var a=S.apps[k]; if (a.stage!=='done') return; done++; if (a.ch && a.ch.pass) paid++; probs += a.fails||0; });
  return { done:done, paid:paid, kes:paid*PAY_APP, probs:probs };
}

/* ---------- HQ: outbox that survives no-data days ---------- */
var OUTK = 'dj_kenya_outbox';
var MAILBOX = lsGet('dj_kenya_mailbox') || '';
function mailbox(){
  if (MAILBOX) return Promise.resolve(MAILBOX);
  return fetch('../testers/config.json?cb=' + Date.now()).then(function(r){ return r.json(); }).then(function(c){
    MAILBOX = (c && c.mailbox) || MAILBOX_FALLBACK; lsSet('dj_kenya_mailbox', MAILBOX); return MAILBOX;
  }).catch(function(){ return MAILBOX_FALLBACK; });
}
function queue(body){ var q=jget(OUTK,[]); body.qid = Date.now().toString(36)+Math.random().toString(36).slice(2,6); q.push(body); jset(OUTK,q); return body.qid; }
var flushing = false;
function flush(){
  if (flushing) return Promise.resolve(); var q=jget(OUTK,[]); if (!q.length) return Promise.resolve();
  flushing = true;
  return mailbox().then(function(url){
    var chain = Promise.resolve();
    q.forEach(function(b){ chain = chain.then(function(){
      var send = {}; for (var k in b) if (k!=='qid') send[k]=b[k];
      return fetch(url, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(send) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.ok===false && !/empty/i.test(j.error||'')) throw new Error(j.error||'not ok');
          var left=jget(OUTK,[]).filter(function(x){ return x.qid!==b.qid; }); jset(OUTK,left);
          if (b.action==='report' && S && S.apps[b.app]) { S.apps[b.app].sent = Date.now(); save(); } });
    }); });
    return chain;
  }).catch(function(){}).then(function(){ flushing=false; if (S && (VIEW==='home' || (S.cur && A(S.cur).stage==='done'))) render(); });
}
function pending(){ return jget(OUTK,[]).filter(function(b){ return b.action==='report'; }).length; }
window.addEventListener('online', function(){ flush(); });
setInterval(function(){ if (!document.hidden) flush(); }, 60000);

/* ---------- news.json: Jerry's notes, paused apps, answers (fails silently, cached for no-data days) ---------- */
var NEWS = jget('dj_kenya_news', {}) || {};
function loadNews(){
  return fetch('news.json?cb='+Date.now()).then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(n){ if (n && typeof n==='object'){ NEWS=n; jset('dj_kenya_news', n); if (VIEW==='home' || !S || !S.kick) render(); } }).catch(function(){});
}
function newsHTML(){
  var h='', items=(NEWS.news||[]).slice(-2).reverse();
  if (items.length) h+='<div class="news"><div class="lbl" style="margin-top:0">📣 News from Jerry</div>'+items.map(function(x){ return '<p style="margin:0 0 6px">'+esc(x.text)+(x.date?' <span class="small muted">· '+esc(x.date)+'</span>':'')+'</p>'; }).join('')+'</div>';
  return h;
}
function footHTML(where){
  var ans=(NEWS.answers||[]).slice().reverse(), h='';
  h+='<details class="more" id="askBox"><summary>✋ Ask Jerry a question</summary><p class="small">Jerry is 8 hours behind Kenya. His answer will appear on this page under “Answers to your questions”, usually within a day. <b>Do not wait</b> — keep going with the next step or the next app.</p>'+
     '<label class="lbl" for="askT">Your question</label><textarea id="askT" maxlength="800"></textarea><div class="err" id="askErr"></div><button class="btn" data-a="ask">Send my question</button></details>';
  h+='<details class="more"'+(ans.length&&where==='home'?' open':'')+'><summary>💬 Answers to your questions'+(ans.length?' ('+ans.length+')':'')+'</summary>'+
     (ans.length?ans.map(function(x){ return '<div class="qa"><b>'+esc(x.q)+'</b><p>'+esc(x.a)+(x.date?' <span class="small muted">· '+esc(x.date)+'</span>':'')+'</p></div>'; }).join(''):'<p class="small muted">No answers yet. When Jerry answers a question, it shows here for everyone.</p>')+'</details>';
  h+='<details class="more"><summary>❓ Common questions</summary>'+FAQ.map(function(x){ return '<div class="qa"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>'; }).join('')+'</details>';
  return h;
}

/* ---------- app data (cached so a reload with no data still works) ---------- */
function getFirst(dirs, file){
  var i=0;
  function next(){ if (i>=dirs.length) return Promise.reject(new Error('missing '+file));
    var u=dirs[i++]+file+'?v='+VERSION.slice(1,4);
    return fetch(u).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).catch(next); }
  return next();
}
var DATA = {};
function loadApp(k){
  if (DATA[k]) return Promise.resolve(DATA[k]);
  var ck='dj_kenya_data_'+k, cached=jget(ck,null);
  return Promise.all([getFirst(KENYA_DIRS, k+'.json'), getFirst(SCRIPT_DIRS, k+'.json')]).then(function(r){
    var d={ k:r[0], s:r[1] }; jset(ck,d); DATA[k]=d; return d;
  }).catch(function(e){ if (cached){ DATA[k]=cached; return cached; } throw e; });
}

/* ---------- time spent (gaps capped, so a night away doesn't count) ---------- */
function tick(a){ var n=Date.now(); if (a.last) a.ms += Math.min(n-a.last, 20*60000); a.last=n; if (!a.t0) a.t0=n; }

/* ---------- views ---------- */
var VIEW = 'home';
function render(){
  var v=$('view');
  $('hdrName').textContent = S && S.name ? 'Habari, '+S.name+'!' : '';
  if (!S) { v.innerHTML = noLink(); return; }
  if (!S.name) { v.innerHTML = askName(); return; }
  if (!S.kick) { v.innerHTML = kickoff(); return; }
  if (VIEW==='app' && S.cur) { appView(S.cur); return; }
  v.innerHTML = home();
}

function noLink(){
  return '<div class="card"><div class="big">🔗</div><h1>Please use the link Jerry sent you</h1>'+
    '<p>Every student has a personal link. It looks like <b>jerrywins1.github.io/daraja-apps/kenya/?who=…</b></p>'+
    '<p>Find it in your WhatsApp chat with Jerry and tap it. If you cannot find it, ask Jerry or your group leader to send it again.</p></div>';
}
function askName(){
  return '<div class="card"><h1>Karibu! What is your first name?</h1><p class="muted">So Jerry knows whose results these are.</p>'+
    '<input type="text" id="nm" autocomplete="given-name" maxlength="40" aria-label="Your first name">'+
    '<button class="btn" data-a="name">Save my name ›</button><div class="err" id="nmErr"></div></div>';
}

function kickoff(){
  var vid = BASE+'shop/watch.html?app=tester&mode=explain';
  return '<h1>Karibu to the Daraja Student Test Week!</h1>'+
  '<div class="card"><h2>🌉 What is Daraja?</h2><p><b>Daraja</b> means bridge. Daraja Studio is a small family business in America. It makes simple apps that open in the browser on your phone — nothing to install.</p>'+
  '<p>The profits help students in Kenya stay in school. Many apps were made for American families and churches, so some words are American. The videos explain them.</p></div>'+
  '<div class="card"><h2>🧪 How one test works</h2><p>Every app has four parts, always in this order:</p>'+
  '<p><b>1. Watch</b> a short video about the app.<br><b>2. Steps</b> — do one step at a time and say if it worked.<br><b>3. Challenge</b> — the app starts empty, you do a few jobs on your own, then tap <b>Check my work</b>.<br><b>4. Your own words</b> — what is this app for?</p>'+
  '<p>Then you tap <b>Send my results</b>. Your phone saves everything as you go, so you can stop and come back later.</p></div>'+
  '<div class="card okc"><h2>💵 What you earn</h2><p><b>'+PAY_APP+' KES</b> for every app you finish with the challenge passed.<br><b>'+PAY_PROBLEM+' KES</b> for every real problem you report that Jerry confirms.</p>'+
  '<p class="small muted">The video talks about “coins”. This week you are paid in shillings, as above. Jerry checks every report before paying.</p></div>'+
  '<div class="card warn"><h2>⭐ Honesty beats speed</h2><p>Do each step for real. If something did not work, tap <b>❌ It didn’t</b> and say what happened. A real problem you explain is worth more than a fast tick. If a word confused you, that is a problem too — say so.</p></div>'+
  '<div class="card"><h2>📱 Good to know</h2><p>• Use <b>Chrome</b>. If this opened inside WhatsApp, tap ⋮ and choose <b>Open in Chrome</b>.<br>• Videos use data. Watch on Wi-Fi when you can, or tap <b>Read it instead</b>.<br>• Type only the made-up names and numbers in the test — never your real passwords, money details or family secrets.</p></div>'+

/* ---------- the report ---------- */
function summary(k,d){
  var a=A(k), steps=(d.s.steps||[]), ok=0, fail=0, un=0, fast=0;
  steps.forEach(function(st){ var r=a.ans[st.id]; if (!r) return; if (r.r==='ok') ok++; else if (r.r==='fail') fail++; else un++; if (r.fast) fast++; });
  var c=d.k.challenge||{tasks:[]}, ch=a.ch||{tries:[]}, last=ch.tries[ch.tries.length-1]||{}, n=c.tasks.filter(function(t){ return last[t.id]; }).length;
  var mins=Math.max(1, Math.round((a.ms||0)/60000)), fl=[], sk=[];
  steps.forEach(function(st,i){ var r=a.ans[st.id]; if (!r) return; if (r.r==='fail') fl.push(i+1); if (r.skip) sk.push(i+1); });
  var head='KENYA|'+k+'|steps:'+ok+'/'+steps.length+' ok,'+fail+' fail,'+un+' unsure|challenge:'+n+'/'+c.tasks.length+' '+(n>=c.passMark?'PASS':'FAIL')+'|minutes:'+mins+'|fails:'+(fl.join(',')||'-')+'|skipped:'+(sk.join(',')||'-')+'|fast:'+fast+'|tries:'+ch.tries.length+'|start:'+(ch.dirty?'not-empty':'empty')+'|'+VERSION.split(' ')[0];
  var line='Steps: '+ok+' worked, '+fail+' didn’t, '+un+' not sure · Challenge: '+n+' of '+c.tasks.length+' '+(n>=c.passMark?'(passed)':'(not passed)')+' · '+mins+' min';
  return { head:head, line:line, ok:ok, fail:fail, un:un, n:n, pass:n>=c.passMark, last:last };
}
function reportText(k,d){
  var a=A(k), s=summary(k,d), steps=d.s.steps||[], c=d.k.challenge||{tasks:[]}, L=[];
  L.push(s.head);
  L.push('Kenya Student Test Week — '+(d.k.name||APPS[k][0])+' — '+S.name);
  L.push(s.line);
  L.push('');
  L.push('Explainer: '+(a.watched?'watched/read':'not marked'));
  var probs=steps.filter(function(st){ var r=a.ans[st.id]; return r && r.r!=='ok'; });
  L.push(probs.length?'Problems and unsure steps ('+probs.length+'):':'Problems and unsure steps: none');
  probs.forEach(function(st,i){ var r=a.ans[st.id], n=steps.indexOf(st)+1;
    L.push((r.r==='fail'?'❌':r.skip?'🤷 SKIPPED':'🤷')+' Step '+n+' ('+st.id+'): '+String(st['do']).slice(0,140));
    L.push('   Should see: '+String(st.see).slice(0,140));
    L.push('   What happened: '+(r.note||'(no note)')); });
  if (s.fail+s.un===0 && Object.keys(a.ans).length) {}
  L.push('');
  L.push('Challenge ('+(s.pass?'PASS':'FAIL')+', '+(a.ch?a.ch.tries.length:0)+' check'+((a.ch&&a.ch.tries.length===1)?'':'s')+(a.ch&&a.ch.dirty?', app was NOT empty at the start':'')+(a.ch&&a.ch.startStuck?', could not make it empty':'')+'):');
  c.tasks.forEach(function(t){ var first=(a.ch&&a.ch.tries[0])||{}; L.push((s.last[t.id]?'✅ ':'❌ ')+t.id+(s.last[t.id]&&!first[t.id]?' (after hint)':'')+' — '+String(t.text).slice(0,120)+((a.ch&&a.ch.skip&&a.ch.skip[t.id])?' · skipped: '+a.ch.skip[t.id]:'')); });
  L.push('');
  L.push('In their own words: '+(a.words||''));
  L.push('');
  L.push('Page '+VERSION+' · '+navigator.userAgent.replace(/^Mozilla\/5\.0 \(/,'').slice(0,90));
  return L.join('\n');
}

/* ---------- running the challenge checks against the apps' real saved data ---------- */
function runChecks(tasks){
  var r={};
  tasks.forEach(function(t){ var v=false; try{ v = !!(new Function('return ('+t.check+');'))(); }catch(e){ v=false; } r[t.id]=v; });
  return r;
}

    case 'skipapp': S.skip=S.skip||{}; S.skip[k]=1; save(); var nk=nextApp(); if (nk && nk!==k) startApp(nk); else { VIEW='home'; render(); } break;
    case 'ask': { var q=($('askT').value||'').trim(); if (q.length<3){ $('askErr').textContent='Please type your question first.'; return; }
      var where=''; if (VIEW==='app' && k && d){ where=' — on '+(d.k.name||k)+', '+({watch:'watching the video',steps:'step '+(a.step+1),challenge:'the challenge',words:'own words',send:'sending'})[a.stage]; }
      queue({ action:'help', who:WHO, name:S.name, app:'kenya-q', contact:'', text:(q.slice(0,800)+where).slice(0,1000) });
      $('askT').value=''; $('askBox').open=false; toast('Saved ✓ — it sends now, or when you have internet. Keep going meanwhile!'); flush(); break; }
    case 'check': {
      tick(a); var c=d.k.challenge, res2=runChecks(c.tasks); a.ch.tries.push(res2);
      var n=c.tasks.filter(function(t){ return res2[t.id]; }).length;
      if (n>=c.passMark || a.ch.tries.length>=2) { a.ch.final=true; a.ch.pass = n>=c.passMark; }
      save(); render(); break; }
    case 'towords': tick(a); a.stage='words'; save(); render(); break;
    case 'words': { var w=($('words').value||'').trim(); if (w.split(/\s+/).filter(Boolean).length<3){ $('wErr').textContent='Please write at least one sentence.'; return; }
      tick(a); a.words=w.slice(0,2000); a.stage='send'; save(); render(); break; }
    case 'send': {
      tick(a); var s=summary(k,d); a.fails=s.fail+s.un; a.ch=a.ch||{tries:[]}; a.ch.pass=s.pass;
      queue({ action:'report', who:WHO, name:S.name, app:k, contact:'', text:reportText(k,d) });
      a.stage='done'; a.doneAt=Date.now(); save(); render();
      flush(); break; }
  }
});
/* keep half-typed notes through a reload */
document.addEventListener('input', function(e){
  if (!S || !S.cur) return; var a=A(S.cur);
  if (e.target.id==='note') { a.draft=e.target.value; save(); }
  else if (e.target.id==='words') { a.words=e.target.value; save(); }
});
function advance(a,d){ var steps=d.s.steps; var i=a.step; while (i<steps.length && a.ans[steps[i].id]) i++;
  if (i>=steps.length) { a.stage='challenge'; } else a.step=i; save(); render(); }
function startApp(k){
  if (!APPS[k]) return; S.cur=k; VIEW='app'; var a=A(k); if (S.skip && S.skip[k] && nextApp()===k) delete S.skip[k];
  if (!a.tried){ a.tried=true; a.t0=a.t0||Date.now(); queue({ action:'tried', who:WHO, name:S.name, app:k }); flush(); }
  a.last=Date.now(); save(); render();
}

/* ---------- go ---------- */
if (S) {
  save();
  if (S.cur && S.apps[S.cur] && S.apps[S.cur].stage!=='done') VIEW='app';
  flush();
  /* quiet "opened today" for HQ's last-seen (HQ ignores unknown tokens and repeats) */
  mailbox().then(function(u){ return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping',who:WHO,app:'kenya',v:VERSION.split(' ')[0]})}); }).catch(function(){});
}
render();
loadNews();
})();
</script>
