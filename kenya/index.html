<!-- Daraja Test Week (shared page) · v1.9 · 2026-10-16 — ONE file, two editions, picked by the address:
       daraja-apps/kenya/   → EDITION kenya   (Kenya Student Test Week: KES pay, Swahili greetings, shop/kenya/<key>.json, KENYA| lines)
       daraja-apps/friends/ → EDITION friends (Jerry's friends in the US: no pay, Founding-Tester thank-you, shop/friends/<key>.json, FRIEND| lines,
                                               videos mode=firsttime, bigger text + Aa button, "choose any app")
     Ship the SAME file to kenya/index.html and friends/index.html, so a fix lands in both. Edition text lives in EDITIONS below.
     v1.9.1 = 17 Oct (Jerry: “put them on the site”): a 🎬 Short videos card on home (Kenya edition only) → kenya/videos/; News shows the 2 NEWEST items
           (it showed the last two, so nothing added since 13 Oct was visible),
           the new one-minute how-to shorts (real screens, English + Swahili). Nothing else changed.
     v1.9 + 16 Oct (Duka): app sets work in BOTH editions now (a set may name its edition: ed:'kenya'). Kenya ?set=duka → only Duka
           (the electronics-shop app), with its own welcome card; normal Kenya pay rules. ?set=all goes back to the full week.
     v1.9 = STORE TESTING IMPROVEMENTS (Jerry, 16 Oct: “Let's do the store” — the Zuri Business Week testing improvements on every
           store app, both editions; Jerry asked “do we know the size of phone the testers have?”). All ADDITIVE; old fields unchanged.
           New fields go at the END of the first line (KENYA|/FRIEND| …|v1.9|device:…|appv:…|ease:…|stuck:n|stucksteps:2,5|fs:1|run:2):
           · device:<Android|iPhone|iPad|Mac|Windows|Other> <os>·<browser>·<CSS w>x<h>@<dpr> (devLine) — also on DAILY|, EXPLORE| and
             survey-only SURVEY| first lines. Shown to the tester once, on the “Ready to send” card (dj_*_devshown).
           · appv:vX.Y — read same-origin from the app page itself (fetch appURL, newest “vX.Y · YYYY-MM-DD” in its text; every app
             has one). Read when the test opens; kept as a.appv when the app is finished. Omitted if it could not be read.
           · ease:1-5 (or -) — “How easy was this app?” five faces on the Ready-to-send card, one tap, optional.
           · stuck:n + stucksteps — taps on the per-step “🆘 I’m stuck” (help = the step's how/hint/tip, else “tell us below”).
           · fs:1 — they opened the app through 🎙 Feedback Studio (feedback-studio/?app=<app url>), offered under the usual Open
             button (“Best: talk while you test”). Not offered for Feedback Studio itself.
           · 🔁 re-test: a finished app whose page now shows a newer version than a.appv is listed at the top of home (“was updated —
             please run it again”); “Run it again” keeps the old result in a.runs and restarts at the steps (no video, no survey);
             its next report carries run:<n>. Only apps finished on v1.9+ (older ones have no recorded version). Pay rules unchanged.
     v1.8 = 🔍 EXPLORE EVERY SCREEN + ✨ TRY SOMETHING NEW (Jerry, 14 Oct: “Encourage them to use the apps that they haven't used
           before. Make sure they test everything, every screen, every field, every thing.”). Each content file has an `explore`
           array (make_explore.py: screens from tours/<slug>.json, or explore_notour.json). After an app is finished (done screen,
           home “🔍 Explore every screen” card) the tester goes screen by screen, tries every button and box + odd input (empty,
           very long, letters in numbers, emoji, back half-way, sideways) and marks ✅ works / ❌ problem (note needed) / 🤷 confusing.
           Kept in S.apps[k].ex = {m:{x1:{r:'ok'|'bad'|'conf',note}}, cur, tot, sent:{sig,n,p,at}}. “Send what I found” = one small
           report (kind explore, outbox, offline-safe), FIRST line EXPLORE|key|screens:n/m|problems:k|v1.8, then one readable line
           per ❌/🤷 (“❌ <screen>: <note>”). Can be sent again after more screens (tally keeps the latest). Explore does not touch
           streaks or pay rates; Kenya ❌ problems Jerry confirms count like any problem. “✨ Try something new” card on home: apps
           this tester hasn't started, least-tested first, from coverage.json next to the page (written by tally.py; fails silently).
     v1.7 = DAILY USE + STREAKS (+ Kenya weekly competition). A finished app joins “📅 Today’s uses” on the home screen; from the next day
           the tester does its small daily job (shop/<edition>/<key>.json → daily.task) and taps “✅ I used it today”. The page reads the
           app's own saved data (same origin; OWN below) and hashes it: the day counts only if the hash differs from the last counted one.
           GameDay (no saved data) asks a short answer instead (daily.ask; must differ from yesterday's). Streaks per app + an overall
           testing streak (any finished app / survey / daily use); one rest day per 7 days in each streak. Kenya: +150 KES per app at 7
           days in a row (once), overall +50 at 3 days and +150 at 7 (once each), shown as earned. Each counted use = one small report,
           first line DAILY|key|day:YYYY-MM-DD|streak:n|v1.7 (+ STREAK|days:n when the overall streak changed; STREAK| is also added as
           the LAST line of a finished-app or survey report when it changes). Kenya only: “🏆 This week” card from kenya/leaderboard.json
           (written by Kenya Test Week/tally.py), viewer matched by 't:'+fnv('dj|'+who) or 'n:'+fnv('dj|'+full name, lowercased).
     v1.6 = Part 5 “Quick survey” after Own words (like/use/easy/videos/NPS/buy+fair price/who for + 4 short texts; first two needed,
           “Skip the survey” still sends). ONCE per app per tester: at the end, or when they leave the app unfinished for another
           (then sent as its own small report whose FIRST line is SURVEY|…, so HQ never counts it as a finished app). Never asked twice
           (a.svDone). Report line 2 = SURVEY|key|like:|use:|easy:|videos:|nps:|buy:|fair:|for:|v1.6 (+ PROFILE|social:|find:|age:|phone:
           once, after the one-time “About you” questions, which can be changed on the home screen).
     v1.5 = Kenya v1.4 (One Thing first, fixed sales order, iPhone-only step note, $ note on Kenya challenges) + the friends edition.
     v1.3: self-report challenge jobs (check:null + selfReport, e.g. GameDay, The Clubhouse) get an answer box and count when answered
           (before v1.3 they could never pass). Earlier notes (Kenya v1.2):
     The page each Kenyan student opens from the personal link Jerry sends: daraja-apps/kenya/?who=<HQ token>&n=<first name>.
     Kickoff → first app (One Thing, v1.4+) → "Your next app" queue. Each app: (a) persona + explainer video, (b) the test script
     one step at a time, (c) the final challenge checked against the apps' real saved data (same origin: jerrywins1.github.io),
     (d) own words → "Send my results" = HQ public `report` (first line KENYA|key|steps:…|challenge:…|minutes:…).
     Everything is saved after every tap (localStorage dj_kenya_v1:<token>); unsent reports wait in dj_kenya_outbox.
     Data: ../shop/kenya/<key>.json (persona, explainer, challenge, ownWords) + ../testers/scripts/<key>.json (steps).
     No libraries, no fonts, no inline handlers. -->
<style>

<script>

  kenya: {

  return D.apps[k];
}
/* consecutive counted days ending today or yesterday; one missing day (a rest day) may be bridged once in any 7 days */
function streakOf(days, td){
  var t=dnum(td), seen={}, nums=[];
  (days||[]).forEach(function(d){ var n=dnum(d); if (n<=t && !seen[n]) { seen[n]=1; nums.push(n); } });
  nums.sort(function(a,b){ return b-a; });
  if (!nums.length) return { n:0, rests:[], ever:false };
  var g=t-nums[0], rests=[], n=1;
  if (g>2) return { n:0, rests:[], ever:true };
  if (g===2) rests.push(t-1);
  for (var i=1;i<nums.length;i++){ var gap=nums[i-1]-nums[i];
    if (gap===1) { n++; continue; }
    if (gap===2) { var r=nums[i-1]-1; if (rests.length && rests[rests.length-1]-r<7) break; rests.push(r); n++; continue; }
    break; }
  return { n:n, rests:rests, today:g===0, ever:true, restNow:g===2 };
}
function actDays(){
  var D=DS(), out=D.act.slice();
  Object.keys(S.apps).forEach(function(k){ var a=S.apps[k]; if (a.stage==='done' && a.doneAt) out.push(dayOf(a.doneAt)); if (a.svAt && a.svDone) out.push(dayOf(a.svAt)); });
  Object.keys(D.apps).forEach(function(k){ out=out.concat(D.apps[k].days||[]); });
  return out;
}
function overall(){ return streakOf(actDays(), today()); }
/* a day with activity: returns the STREAK| line when the overall streak changed (and books the overall bonuses, Kenya) */

  var D=DS(), td=today(); if (D.act.indexOf(td)<0) D.act.push(td);
  var n=overall().n, note='';
  if (R_O3 && n>=3 && !D.bonus.o3) { D.bonus.o3=td; note='🔥 3-day testing streak: +'+R_O3+' KES!'; }
  if (R_O7 && n>=7 && !D.bonus.o7) { D.bonus.o7=td; note='🔥 7-day testing streak: +'+R_O7+' KES!'; }
  if (note) setTimeout(function(){ toast(note); }, 900);
  save();
  if (n!==D.streakSent) { D.streakSent=n; save(); return 'STREAK|days:'+n; }
  return '';
}
function streakKES(){ var D=S.daily; if (!D || !E.pay) return 0; return Object.keys(D.bonus.apps||{}).length*R_APP7 + (D.bonus.o3?R_O3:0) + (D.bonus.o7?R_O7:0); }

function dailyTask(k){ var d=DATA[k]; return (d && d.k && d.k.daily) || null; }

  var st=streakOf(e.days, td), D=DS(), bonus='';
  if (R_APP7 && st.n>=7 && !D.bonus.apps[k]) { D.bonus.apps[k]=td; bonus='+'+R_APP7+' KES for 7 days in a row with '+APPS[k][0]+'!'; }

  L.push('Counted '+td+' · 🔥 '+st.n+' day'+(st.n>1?'s':'')+' in a row'+(st.rests.length?' (with '+st.rests.length+' rest day'+(st.rests.length>1?'s':'')+')':'')+(bonus&&E.pay?' · 7-day bonus earned':'')+' · testing streak '+overall().n+' days');

}

function exploreCard(){
  var fin=order().filter(function(k){ return finished(k) && APPS[k]; });
  if (!fin.length) return '';
  var rows=fin.map(function(k){ var c=exCount(k), ce=covOf(k); return { k:k, c:c, full:c.m && c.n>=c.m, ex:ce?Number(ce.explored)||0:null }; });
  rows.sort(function(a,b){ return (a.full-b.full) || ((a.ex==null?0:a.ex)-(b.ex==null?0:b.ex)); });
  var left=rows.filter(function(r){ return !r.full; }).length;
  return '<div class="card" id="exCard"><h2>🔍 Explore every screen</h2><p class="small" style="margin:0 0 6px">'+(left?'For the apps you finished: try every screen, every button, every box — and mark what works.':'You explored every screen of every app you finished. Thank you!')+'</p>'+
    rows.map(function(r){ var k=r.k, c=r.c, sub=r.full?'✓ every screen checked':c.n?c.n+' of '+(c.m||'?')+' screens checked':(r.ex===0?'Nobody has explored it yet':'Not explored yet');
      return '<div class="rowx"><span class="t"><b>'+APPS[k][1]+' '+esc(APPS[k][0])+'</b><small>'+esc(sub)+'</small></span><button class="btn'+(r.full?' ghost':'')+'" data-a="explore" data-k="'+k+'">'+(r.full?'Look':c.n?'Continue':'Explore')+' ›</button></div>'; }).join('')+'</div>';
}

/* ---------- HQ: outbox that survives no-data days ---------- */
var OUTK = PRE+'_outbox';
var MAILBOX = lsGet(PRE+'_mailbox') || '';
function mailbox(){
  if (MAILBOX) return Promise.resolve(MAILBOX);
  return fetch('../testers/config.json?cb=' + Date.now()).then(function(r){ return r.json(); }).then(function(c){
    MAILBOX = (c && c.mailbox) || MAILBOX_FALLBACK; lsSet(PRE+'_mailbox', MAILBOX); return MAILBOX;
  }).catch(function(){ return MAILBOX_FALLBACK; });
}
function queue(body){ var q=jget(OUTK,[]); body.qid = Date.now().toString(36)+Math.random().toString(36).slice(2,6); q.push(body); jset(OUTK,q); return body.qid; }
var flushing = false, flushAgain = false;
function flush(){
  if (flushing) { flushAgain = true; return Promise.resolve(); } var q=jget(OUTK,[]); if (!q.length) return Promise.resolve();
  flushAgain = false;
  flushing = true;
  return mailbox().then(function(url){
    var chain = Promise.resolve();
    q.forEach(function(b){ chain = chain.then(function(){
      var send = {}; for (var k in b) if (k!=='qid' && k!=='kind') send[k]=b[k];
      return fetch(url, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(send) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.ok===false && !/empty/i.test(j.error||'')) throw new Error(j.error||'not ok');
          var left=jget(OUTK,[]).filter(function(x){ return x.qid!==b.qid; }); jset(OUTK,left);
          if (b.action==='report' && !b.kind && S && S.apps[b.app]) { S.apps[b.app].sent = Date.now(); save(); } });
    }); });
    return chain;
  }).catch(function(){}).then(function(){ flushing=false; if (S && (VIEW==='home' || VIEW==='explore' || (S.cur && A(S.cur).stage==='done')) && !(document.activeElement && document.activeElement.tagName==='TEXTAREA' && VIEW!=='home')) render(); if (flushAgain) { flushAgain=false; return flush(); } });   /* v1.6: something queued mid-send goes now too */
}
function pending(){ return jget(OUTK,[]).filter(function(b){ return b.action==='report'; }).length; }
window.addEventListener('online', function(){ flush(); });
setInterval(function(){ if (!document.hidden) flush(); }, 60000);

/* ---------- app data (cached so a reload with no data still works) ---------- */
function getFirst(dirs, file){
  var i=0;
  function next(){ if (i>=dirs.length) return Promise.reject(new Error('missing '+file));
    var u=dirs[i++]+file+'?v='+VERSION.slice(1,4);
    return fetch(u).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).catch(next); }
  return next();
}
var DATA = {};
function loadApp(k){
  if (DATA[k]) return Promise.resolve(DATA[k]);
  var ck=PRE+'_data_'+k, cached=jget(ck,null);
  return Promise.all([getFirst(KENYA_DIRS, k+'.json'), getFirst(SCRIPT_DIRS, k+'.json')]).then(function(r){
    var d={ k:r[0], s:r[1] }; jset(ck,d); DATA[k]=d; return d;
  }).catch(function(e){ if (cached){ DATA[k]=cached; return cached; } throw e; });
}

/* ---------- time spent (gaps capped, so a night away doesn't count) ---------- */
function tick(a){ var n=Date.now(); if (a.last) a.ms += Math.min(n-a.last, 20*60000); a.last=n; if (!a.t0) a.t0=n; }

    case 'startstuck': { tick(a); a.ch=a.ch||{tries:[]}; var r0=runChecks(d.k.challenge.tasks, a.ch); a.ch.dirty=Object.keys(r0).filter(function(x){ return r0[x]; }).length; a.ch.startStuck=true; a.ch.ready=true; save(); render(); break; }
    case 'skiptask': { var tid=b.getAttribute('data-t'), ta=document.getElementById('sk_'+tid), tn=(ta&&ta.value||'').trim();
      if (tn.length<3){ var te=document.getElementById('ske_'+tid); if (te) te.textContent='Please write a few words first.'; return; }
      tick(a); a.ch.skip=a.ch.skip||{}; a.ch.skip[tid]=tn.slice(0,500); save(); render(); break; }
    case 'skipapp': S.skip=S.skip||{}; S.skip[k]=1; save(); var nk=nextApp(); if (nk && nk!==k) startApp(nk); else if (needMidSurvey(k)) { a.svMid={then:null}; save(); render(); } else { VIEW='home'; render(); } break;
    case 'ask': { var q=($('askT').value||'').trim(); if (q.length<3){ $('askErr').textContent='Please type your question first.'; return; }
      var where=''; if (VIEW==='app' && k && d){ where=' — on '+(d.k.name||k)+', '+({watch:'watching the video',steps:'step '+(a.step+1),challenge:'the challenge',words:'own words',send:'sending'})[a.stage]; }
      queue({ action:'help', who:WHO, name:(FULL||S.name), app:E.qApp, contact:'', text:(q.slice(0,800)+where).slice(0,1000) });
      $('askT').value=''; $('askBox').open=false; toast('Saved ✓ — it sends now, or when you have internet. Keep going meanwhile!'); flush(); break; }
    case 'check': {
      tick(a); var c=d.k.challenge, res2=runChecks(c.tasks, a.ch); a.ch.tries.push(res2);
      var n=c.tasks.filter(function(t){ return res2[t.id]; }).length;
      if (n>=c.passMark || a.ch.tries.length>=2) { a.ch.final=true; a.ch.pass = n>=c.passMark; }
      save(); render(); break; }
    case 'towords': tick(a); a.stage='words'; save(); render(); break;
    case 'words': { var w=($('words').value||'').trim(); if (w.split(/\s+/).filter(Boolean).length<3){ $('wErr').textContent='Please write at least one sentence.'; return; }
      tick(a); a.words=w.slice(0,2000); a.stage=a.svDone?'send':'survey'; save(); render(); window.scrollTo(0,0); break; }
    case 'sv': {
      var sc=b.getAttribute('data-s'), sq=b.getAttribute('data-q'), sval=b.getAttribute('data-v'), multi=b.getAttribute('data-m')==='1', obj;
      if (sc==='p') obj=prof(); else { if (!a) return; obj=a.sv=a.sv||{'for':[]}; }
      if (multi){ var arr=(obj[sq]||[]).slice(), ix=arr.indexOf(sval); if (ix>=0) arr.splice(ix,1); else { arr.push(sval); arr = sval==='none' ? ['none'] : arr.filter(function(x){ return x!=='none'; }); } obj[sq]=arr; }
      else obj[sq] = obj[sq]===sval ? '' : sval;    /* tap again to clear */
      if (sc==='p'){ obj.sent=false; obj.at=Date.now(); setProf(obj); } else { tick(a); save(); }
      paint(sc, sq, obj[sq], multi); if (sc==='s' && $('svErr')) $('svErr').textContent='';
      break; }
    case 'svnext': {
      var sv=a.sv||{};
      if (!sv.like || !sv.use){ $('svErr').textContent='Please answer the first two questions — or tap “Skip the survey” below.';
        var g=document.querySelector('[data-g="s:'+(!sv.like?'like':'use')+'"]'); if (g) g.scrollIntoView({block:'center'}); return; }
      tick(a); a.svDone='answered'; a.svAt=Date.now(); a.svWhen=a.svMid?'mid':'end'; finishSurvey(k); break; }
    case 'svskip': tick(a); a.svDone='skipped'; a.svAt=Date.now(); a.svWhen=a.svMid?'mid':'end'; afterSurvey(k); break;
    case 'pfdone': case 'pfskip': { var PP=prof(); PP.asked=true; if (act==='pfskip') PP.skipped=true; setProf(PP); afterSurvey(k); break; }
    case 'send': {
      tick(a); var s=summary(k,d); a.fails=s.fail+s.un; a.ch=a.ch||{tries:[]}; a.ch.pass=s.pass;
      a.appv = VNOW[k] || a.appv || ''; lsSet(PRE+'_devshown','1');
      a.stage='done'; a.doneAt=Date.now(); var rtxt=reportText(k,d), sl=noteActivity(); if (sl) rtxt+='\n'+sl;
      queue({ action:'report', who:WHO, name:(FULL||S.name), app:k, contact:'', text:rtxt });
      if (rtxt.indexOf('\nPROFILE|')>=0){ var P2=prof(); P2.sent=true; setProf(P2); }
      ensureDaily(k); save(); render();
      flush(); break; }
  }
});
/* keep half-typed notes through a reload */
document.addEventListener('input', function(e){
  if (e.target.getAttribute && e.target.getAttribute('data-exn') && S && S.exk) { var Xn=exState(S.exk), nid=e.target.getAttribute('data-exn'); if (Xn.m[nid]) { Xn.m[nid].note=e.target.value.slice(0,500); save(); } return; }
  if (e.target.getAttribute && e.target.getAttribute('data-da')) { DDRAFT[e.target.getAttribute('data-da')]=e.target.value.slice(0,300); return; }
  if (!S || !S.cur) return; var a=A(S.cur);
  if (e.target.id==='note') { a.draft=e.target.value; save(); }
  else if (e.target.id==='words') { a.words=e.target.value; save(); }
  else if (e.target.getAttribute && e.target.getAttribute('data-sv')) { a.sv=a.sv||{'for':[]}; a.sv[e.target.getAttribute('data-sv')]=e.target.value.slice(0,300); save(); }
  else if (e.target.getAttribute && e.target.getAttribute('data-sr')) { a.ch=a.ch||{tries:[]}; a.ch.sr=a.ch.sr||{}; a.ch.sr[e.target.getAttribute('data-sr')]=e.target.value.slice(0,500); save(); }
});
function advance(a,d){ var steps=d.s.steps; var i=a.step; while (i<steps.length && a.ans[steps[i].id]) i++;
  if (i>=steps.length) { a.stage='challenge'; } else a.step=i; save(); render(); }
function startApp(k, noSv){
  if (!APPS[k]) return;
  var prev=S.cur;
  if (!noSv && prev && prev!==k && needMidSurvey(prev)) { S.apps[prev].svMid={ then:k }; VIEW='app'; save(); render(); window.scrollTo(0,0); return; }
  if (prev===k && S.apps[k] && S.apps[k].svMid) delete S.apps[k].svMid;   /* they chose to carry on with it after all */
  S.cur=k; VIEW='app'; var a=A(k); if (S.skip && S.skip[k] && nextApp()===k) delete S.skip[k];
  if (!a.tried){ a.tried=true; a.t0=a.t0||Date.now(); queue({ action:'tried', who:WHO, name:(FULL||S.name), app:k }); flush(); }
  a.last=Date.now(); save(); render();
}

function applyZoom(){ if (EDITION!=='friends') return; var z=Number(lsGet('dj_friends_zoom')||'1')||1; try{ if (z===1) document.querySelector('main').style.removeProperty('zoom'); else document.querySelector('main').style.zoom=String(z); }catch(e){} }
applyZoom();

/* ---------- go ---------- */
if (S) {
  save();
  if (S.cur && S.apps[S.cur] && S.apps[S.cur].stage!=='done') VIEW='app';
  flush();
  /* quiet "opened today" for HQ's last-seen (HQ ignores unknown tokens and repeats) */
  mailbox().then(function(u){ return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping',who:WHO,app:E.ping,v:VERSION.split(' ')[0]})}); }).catch(function(){});
}
render();
loadNews();
loadLB();
loadCov();
})();
</script>
