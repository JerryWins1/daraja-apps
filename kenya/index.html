<head>

<meta name="theme-color" content="#1C2B29">

<!-- Daraja Test Week (shared page) · v1.5 · 2026-10-11 — ONE file, two editions, picked by the address:
       daraja-apps/kenya/   → EDITION kenya   (Kenya Student Test Week: KES pay, Swahili greetings, shop/kenya/<key>.json, KENYA| lines)
       daraja-apps/friends/ → EDITION friends (Jerry's friends in the US: no pay, Founding-Tester thank-you, shop/friends/<key>.json, FRIEND| lines,
                                               videos mode=firsttime, bigger text + Aa button, "choose any app")
     Ship the SAME file to kenya/index.html and friends/index.html, so a fix lands in both. Edition text lives in EDITIONS below.
     v1.5 = Kenya v1.4 (One Thing first, fixed sales order, iPhone-only step note, $ note on Kenya challenges) + the friends edition.
     v1.3: self-report challenge jobs (check:null + selfReport, e.g. GameDay, The Clubhouse) get an answer box and count when answered
           (before v1.3 they could never pass). Earlier notes (Kenya v1.2):
     The page each Kenyan student opens from the personal link Jerry sends: daraja-apps/kenya/?who=<HQ token>&n=<first name>.
     Kickoff → first app (One Thing, v1.4+) → "Your next app" queue. Each app: (a) persona + explainer video, (b) the test script
     one step at a time, (c) the final challenge checked against the apps' real saved data (same origin: jerrywins1.github.io),
     (d) own words → "Send my results" = HQ public `report` (first line KENYA|key|steps:…|challenge:…|minutes:…).
     Everything is saved after every tap (localStorage dj_kenya_v1:<token>); unsent reports wait in dj_kenya_outbox.
     Data: ../shop/kenya/<key>.json (persona, explainer, challenge, ownWords) + ../testers/scripts/<key>.json (steps).
     No libraries, no fonts, no inline handlers. -->
<style>
:root{--bg:#F6F3EC;--card:#FFFFFF;--ink:#1C2B29;--mute:#55605E;--line:#DCD6CA;--brand:#1F6B5C;--brand-ink:#FFFFFF;--gold:#B7791F;--ok:#1E7A3C;--okbg:#E3F3E7;--bad:#B3261E;--badbg:#FBE7E5;--warnbg:#FFF4D6;--soft:#EEF5F2}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1C2422;--ink:#ECEFEA;--mute:#A9B3AF;--line:#33403C;--brand:#3FA58C;--brand-ink:#0E1513;--gold:#E0B25A;--ok:#6FD08F;--okbg:#18301F;--bad:#FF8A80;--badbg:#3A1E1C;--warnbg:#3A3218;--soft:#1F2C29}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
header.top .flag{font-size:26px}
header.top b{font-size:17px;display:block;line-height:1.2}
header.top small{color:var(--mute);font-size:13px}
h1{font-size:24px;line-height:1.25;margin:6px 0 10px}
h2{font-size:20px;line-height:1.3;margin:4px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.card.soft{background:var(--soft)}
.card.warn{background:var(--warnbg)}
.card.okc{background:var(--okbg)}
.card.badc{background:var(--badbg)}
.muted{color:var(--mute)}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;margin:8px 0 0;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:600 18px/1.2 inherit;font-family:inherit;text-decoration:none;text-align:center;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.mid{background:var(--gold);border-color:var(--gold);color:#fff}
@media (prefers-color-scheme:dark){.btn.ok,.btn.bad,.btn.mid{color:#111}}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
.stats{display:flex;gap:8px;margin:0 0 12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--brand)}
.parts{display:flex;gap:4px;margin:0 0 12px}
.parts span{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:var(--line);color:var(--mute)}
.parts span.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
.parts span.done{background:var(--okbg);color:var(--ok)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:10px 0 4px}
.do{font-size:19px;line-height:1.45}
.type{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--warnbg);font-weight:700;word-break:break-word}
.tip{font-size:15px;color:var(--mute);margin-top:8px}
textarea,input[type=text]{width:100%;min-height:52px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:17px/1.4 inherit;font-family:inherit}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ul.tasks{list-style:none;padding:0;margin:0}
ul.tasks li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:0}
ul.tasks .m{font-size:22px;line-height:1.2;min-width:28px}
.hint{display:block;margin-top:6px;font-size:15px;background:var(--warnbg);padding:8px 10px;border-radius:10px}
.queue{list-style:none;padding:0;margin:0}
.queue li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.lines p{margin:0 0 8px}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:16px;z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#ver{text-align:center;font-size:12px;color:var(--mute);margin:24px 0 0}
.big{font-size:40px;line-height:1}
.err{color:var(--bad);font-weight:600;margin-top:6px}
details.stuck{margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:0 12px}
details.stuck[open]{padding-bottom:12px}
details.more{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;margin:0 0 12px}
details.more[open]{padding-bottom:14px}
.qa{border-top:1px solid var(--line);padding:10px 0 2px}.qa:first-of-type{border-top:0}
.qa b{display:block}
.news{background:var(--warnbg);border-radius:14px;padding:12px 14px;margin:0 0 12px}
#tsz{display:none;margin-left:auto;min-width:56px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 18px/1 inherit;font-family:inherit;cursor:pointer}
.sr{margin-top:8px}.sr textarea{min-height:64px}
.pick{list-style:none;padding:0;margin:0}.pick li{border-top:1px solid var(--line)}.pick li:first-child{border-top:0}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px 2px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pick button span:last-child{color:var(--brand);font-weight:700;white-space:nowrap}
/* friends edition: older eyes and thumbs — bigger by default, Aa makes it bigger still */
html.ed-friends body{font-size:19px}
html.ed-friends #tsz{display:inline-block}
html.ed-friends h1{font-size:27px}html.ed-friends h2{font-size:22px}html.ed-friends h3{font-size:19px}
html.ed-friends .btn{min-height:60px;font-size:20px;border-radius:16px}
html.ed-friends .do{font-size:21px}
html.ed-friends .small{font-size:16px}html.ed-friends .tip{font-size:17px}html.ed-friends .hint{font-size:17px}
html.ed-friends .lbl{font-size:14px}html.ed-friends .parts span{font-size:14px;padding:8px 2px}
html.ed-friends textarea,html.ed-friends input[type=text]{font-size:19px}
html.ed-friends details summary{min-height:56px;font-size:19px}
html.ed-friends .stat span{font-size:15px}
html.ed-friends #ver{font-size:14px}
</style>
</head>
<body>
<main>
  <header class="top"><span class="flag" id="hdrFlag" aria-hidden="true">🇰🇪</span><div><b id="hdrTitle">Daraja Test Week</b><small id="hdrName"></small></div><button id="tsz" type="button" data-a="tsz" aria-label="Make the words bigger">Aa+</button></header>
  <div id="view"><p class="muted">Loading…</p></div>

</main>
<script>
(function(){
'use strict';
var VERSION = 'v1.5 · 2026-10-11';
var BASE = 'https://jerrywins1.github.io/daraja-apps/';
var MAILBOX_FALLBACK = 'https://script.google.com/macros/s/AKfycbw1hgXVj5E8x8Ampm1fYK9po07pmSh9zrHfyVn3RvEYOR15_xb2jNPdlgzUuariPPrp/exec';
var PRACTICE = 'nownext';   /* 11 Oct (Jerry): everyone tests One Thing first and most */
var UNSTUCK = 'How to get unstuck: 1) Go to the app tab and reload it (pull the page down). 2) Tap ‹ Back here and do the step before again. 3) Check you are on the right screen — compare with “You should see”. 4) If a box or card covers a button, scroll a little or close the box. Still stuck? Skip it below and keep going — that is useful information too.';
/* Every app in the week. Order mixes the three lines; each tester starts at a different place in ROTATE (from their id),
   so testers spread across the shelf without a server. My Safety Plan always comes last (it needs a calm moment). */
var APPS_BASE = {
  breakeven:['Break-Even','🧮',15], everyday:['Every Day','🌱',22], drumbeat:['Message Assistant','📣',17], church:['The Church App','⛪',26],
  ourtable:['Our Table','🍽',25], compass:['Daraja Compass','🗺️',17], churchserve:['Serve Board','🙋',26], whoscoming:['Who’s Coming','🙋',22],
  nextstep:['Next Step Board','🗂',16], churchclubhouse:['The Clubhouse','🏠',22], storykeeper:['In My Own Words','📖',26], ahead:['Ahead of It','🧾',26],
  churchgameday:['GameDay','🏀',20], rafiki:['Rafiki','💛',25], feedback:['Feedback Studio','🎙',16], churchkey:['The Key · Church Edition','🔑',22],
  thekey:['The Key','🔑',24], npreceipts:['Receipt Maker','💌',26], churchdrive:['Operation Christmas Child Assistant','📦',24], academy:['Daraja Academy','🎓',30],
  npgoodstanding:['Ahead of It · Nonprofit','🕊',28], advent:['Advent Together','🕯️',18], nownext:['One Thing','🧭',28], churchsteward:['Ahead of It · Church','📋',28],
  safety:['My Safety Plan','🫶',18]
};
/* 11 Oct (Jerry): after One Thing, the apps in the order we expect them to sell. No rotation. */
var ROTATE_BASE = ['ourtable','everyday','church','storykeeper','ahead','thekey','whoscoming','rafiki','advent','churchserve','npreceipts','churchdrive','churchsteward',
  'npgoodstanding','churchclubhouse','churchgameday','churchkey','nextstep','drumbeat','feedback','academy','compass','breakeven'];

/* ---------- the two editions (everything that differs lives here) ---------- */
var EDITIONS = {
  kenya: {
    pre:'dj_kenya', dir:'kenya', tag:'KENYA', qApp:'kenya-q', ping:'kenya', title:'Kenya Test Week', flag:'🇰🇪', head:'Daraja Test Week',
    hi:'Habari, ', welcome:'Karibu! What is your first name?', thanks:'Asante sana.', wordsHint:'There is no wrong answer. Two or three sentences is perfect. Swahili or English is fine.',
    pay:true, PAY_APP:120, PAY_PROBLEM:50, pick:false, explainVoice:['breakeven','safety'],
    apps:{}, rotate:ROTATE_BASE, last:['safety'],
    behind:'Jerry is 8 hours behind Kenya. His answer will appear on this page under “Answers to your questions”, usually within a day.',
    faq:[
      ['What do “practice”, “examples” and “Start fresh” mean?', 'First app: One Thing is the first app for everyone. Take your time with it — it is the one we care about most. Examples: many apps start with made-up example data so you can play. Start fresh: removes the examples so the app is empty — the challenge always starts this way.'],
      ['The app looks different from the steps. What do I do?', 'Tap ❌ It didn’t and write what you see instead. Apps change while we fix them. A difference is useful to us — it is not your mistake.'],
      ['A button is hidden or covered.', 'Scroll a little, close any card or box on top, or turn the phone sideways. If you still cannot reach it, tap ❌ It didn’t and say which button was hidden. That is a real problem.'],
      ['How and when am I paid?', '120 KES for each app you finish with the challenge passed, and 50 KES for each real problem Jerry confirms. Jerry checks every report first (he is 8 hours behind Kenya), then pays by M-Pesa. Your total on this page is “pending” until then.'],
      ['What counts as a real problem?', 'Something that does not work, a button you cannot find, words that confuse you, a wrong number, or the app not keeping what you typed. A fast tick with no testing is not useful — honesty beats speed.'],
      ['How do I save data (bundles)?', 'Watch videos on Wi-Fi when you can, or tap “Read it instead”. The apps themselves are small. Your answers are saved on your phone and send when you have internet.'],
      ['The page will not load or looks broken.', 'Open it in Chrome (if it opened inside WhatsApp, tap ⋮ → Open in Chrome). Pull down to refresh. Your progress is saved on the phone, so nothing is lost. Always use the same phone and the same link.'],
      ['I am waiting for an answer from Jerry.', 'Do not wait — keep going with the next step or the next app. If you cannot do a step, use 😕 I’m stuck → Skip. Answers appear on this page under “Answers to your questions”, usually within a day.']
    ]
  },
  friends: {
    pre:'dj_friends', dir:'friends', tag:'FRIEND', qApp:'friends-q', ping:'friends', title:'Daraja Friends Test', flag:'🌉', head:'Daraja Friends Test',
    hi:'Hi, ', welcome:'Welcome! What is your first name?', thanks:'Thank you so much!', wordsHint:'There is no wrong answer. Two or three sentences is perfect.',
    pay:false, pick:false, explainVoice:[],   /* pick:true would offer “choose any app” after the first one; off: Jerry wants the fixed order */
    apps:{ porchlight:['Porchlight','🏮',15], ff:['My Scores','🏈',12], pitwall:['Pit Wall','🏁',15], bizmgr:['Business Manager','🧰',25] },
    /* same order as Kenya, plus Porchlight (Family membership) after The Key, My Scores and Pit Wall near the end */
    rotate:['ourtable','everyday','bizmgr','church','storykeeper','ahead','thekey','porchlight','whoscoming','rafiki','advent','churchserve','npreceipts','churchdrive','churchsteward',
      'npgoodstanding','churchclubhouse','churchgameday','churchkey','nextstep','drumbeat','feedback','academy','ff','pitwall','compass','breakeven'],
    last:['safety'],
    reward:'No money changes hands, and you never pay anything. As a thank-you, Founding Testers get their first year of the Family & Later-life membership free, then half price for life.',
    behind:'Jerry reads every question. His answer will appear on this page under “Answers to your questions”, usually within a day.',
    faq:[
      ['What do “practice”, “examples” and “Start fresh” mean?', 'First app: One Thing is the first app for everyone. Take your time with it — it is the one we care about most. Examples: many apps start with made-up example data so you can play. Start fresh: removes the examples so the app is empty — the challenge always starts this way.'],
      ['iPhone or Android — which browser do I use?', 'iPhone or iPad: Safari. Android: Chrome. If the link opened inside Facebook, Messages or your email, look for “Open in Safari” or “Open in Chrome” (often under ••• or ⋮). Always use the same phone and the same link — your progress is saved on that phone.'],
      ['The words are too small.', 'Tap the Aa+ button at the top of this page (tap it again for even bigger). Inside the apps: on iPhone, tap “AA” in Safari’s address bar and choose a bigger size; on Android, Chrome ⋮ → Settings → Accessibility → Text scaling.'],
      ['The app looks different from the steps. What do I do?', 'Tap ❌ It didn’t and write what you see instead. Apps change while we fix them. A difference is useful to us — it is not your mistake.'],
      ['A button is hidden or covered.', 'Scroll a little, close any card or box on top, or turn the phone sideways. If you still cannot reach it, tap ❌ It didn’t and say which button was hidden. That is a real problem.'],
      ['I can’t hear the video.', 'Turn the volume up, check the silent switch on the side of an iPhone, and tap 🔊 inside the video if you see it. Or tap “Read it instead” under the video button.'],
      ['Does this cost anything? Am I paid?', 'It costs nothing, and you will never be asked for a card. There is no payment for testing. As a thank-you, Founding Testers get their first year of the Family & Later-life membership free, then half price for life.'],
      ['What counts as a real problem?', 'Something that does not work, a button you cannot find, words that confuse you, a wrong number, or the app not keeping what you typed. You are not being tested — the app is. Honesty beats speed.'],
      ['Is what I type private?', 'The apps keep what you type on your own phone. This page sends Jerry only your answers, your notes, your first name and full name. Please type only the made-up examples the test gives you — never real passwords, bank details or private family information.'],
      ['I am waiting for an answer from Jerry.', 'Do not wait — keep going with the next step or the next app. If you cannot do a step, use 😕 I’m stuck → Skip. Answers appear on this page under “Answers to your questions”, usually within a day.']
    ]
  }
};
var EDITION = /\/friends(\/|$)/.test(location.pathname) ? 'friends' : 'kenya';
var E = EDITIONS[EDITION];
var PRE = E.pre;
var PAY_APP = E.PAY_APP||0, PAY_PROBLEM = E.PAY_PROBLEM||0;
var KENYA_DIRS = ['../shop/'+E.dir+'/', './'];         /* persona · explainer · challenge · ownWords (watch.html reads shop/kenya/ too) */
var SCRIPT_DIRS = ['../testers/scripts/', './scripts/']; /* the test scripts (same for both editions) */
var EXPLAIN_VOICE = E.explainVoice;                     /* apps with a recorded voice/<key>-explain.m4a (Kenya only); others play mode=firsttime */
var FAQ = E.faq;
var APPS = {}; Object.keys(APPS_BASE).forEach(function(k){ APPS[k]=APPS_BASE[k]; }); Object.keys(E.apps).forEach(function(k){ APPS[k]=E.apps[k]; });
var ROTATE = E.rotate;
var LAST = E.last;
/* v1.5 · app sets (friends edition only): ?set=church → only the church line, in this order; ?set=business → only Business Manager.
   The set is kept on the phone (dj_friends_set), so the join pages' "Start testing now" link and later visits keep it; ?set=all resets. */
var SETS = {
  church:{ title:'Daraja Church Test', head:'Daraja Church Test', flag:'⛪', apps:['church','churchserve','churchgameday','churchclubhouse','churchkey','churchsteward','npreceipts','churchdrive','advent','npgoodstanding'],
    reward:'No money changes hands, and you never pay anything. As a thank-you, Founding Testers get your church’s first year of the Church membership free, then half price for life.',
    about:'It makes simple apps that help churches stay organized — sermon notes, volunteer schedules, kids’ pages, giving receipts, building dates and more.' },
  business:{ title:'Daraja Business Test', head:'Daraja Business Test', flag:'🧰', apps:['bizmgr'],
    reward:'No money changes hands, and you never pay anything. As a thank-you, Founding Testers get their first year of the Business Manager membership free, then half price for life.',
    about:'This test is Business Manager: the office for a small trade business — quotes your customer signs, invoices, receipts by job, your real profit, to-dos and tax dates.' }
};
var SET = null;
if (EDITION==='friends') {
  var qset = (new URLSearchParams(location.search).get('set')||'').toLowerCase();
  try{ if (qset==='all') localStorage.removeItem('dj_friends_set'); else if (SETS[qset]) localStorage.setItem('dj_friends_set', qset); SET = SETS[qset] ? qset : (qset==='all' ? null : localStorage.getItem('dj_friends_set')); }catch(e){ SET = SETS[qset] ? qset : null; }
  if (!SETS[SET]) SET = null;
  if (SET) { var SS=SETS[SET]; E.title=SS.title; E.head=SS.head; E.flag=SS.flag; E.reward=SS.reward; PRACTICE=SS.apps[0]; ROTATE=SS.apps.slice(1); LAST=[]; }
}
try{ document.title = E.title; document.documentElement.classList.add('ed-'+EDITION);
  document.getElementById('hdrFlag').textContent = E.flag; document.getElementById('hdrTitle').textContent = E.head;
  document.getElementById('ver').textContent = E.title+' · Daraja Test Week '+VERSION; }catch(e){}

/* ---------- storage (every read/write guarded) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function jget(k,d){ try{ var v=JSON.parse(lsGet(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
function jset(k,v){ return lsSet(k, JSON.stringify(v)); }

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(t){ var d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }

/* ---------- who ---------- */
var qs = new URLSearchParams(location.search);
var okTok = function(t){ return /^[A-Za-z0-9_-]{6,40}$/.test(String(t||'')); };
var WHO = qs.get('who'), NAME = (qs.get('n') || qs.get('name') || '').trim().slice(0,40);
if (okTok(WHO)) { lsSet(PRE+'_who', WHO); lsSet('dj_who', WHO); } else WHO = lsGet(PRE+'_who');
if (!okTok(WHO)) WHO = null;
/* 11 Oct: students who just joined come from the join page with ?n=First&full=Full Name and no HQ token yet.
   Give this phone its own id; HQ files their results by the full name they joined with (personFor_ name match). */
var FULL = (qs.get('full') || '').trim().replace(/\s+/g,' ').slice(0,40);
if (FULL) lsSet(PRE+'_full', FULL); else FULL = lsGet(PRE+'_full') || '';
if (!WHO && FULL) { WHO = 'jn' + Math.random().toString(36).slice(2,12) + Date.now().toString(36); lsSet(PRE+'_who', WHO); }
var SKEY = WHO ? PRE+'_v1:' + WHO : null;
var S = WHO ? jget(SKEY, null) : null;
if (WHO && !S) S = { v:1, who:WHO, name:'', kick:false, cur:null, apps:{}, born:Date.now() };
if (S && NAME) S.name = NAME;
if (S && S.name && !lsGet('dj_name')) lsSet('dj_name', S.name);
if (WHO && (qs.get('who') || qs.get('n') || qs.get('full'))) { try{ history.replaceState(null,'',location.pathname); }catch(e){} }  /* keep the token out of screenshots */
function save(){ if (S) jset(SKEY, S); }

/* ---------- the order of apps for this student ---------- */
function hash(s){ var h=2166136261; for (var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function order(){
  return [PRACTICE].concat(ROTATE, LAST).filter(function(k){ return !!APPS[k]; });
}
function A(k){ if (!S.apps[k]) S.apps[k] = { stage:'watch', step:0, ans:{}, ms:0 }; return S.apps[k]; }
function finished(k){ var a=S.apps[k]; return !!(a && a.stage==='done'); }
function paused(k){ return (NEWS.paused||[]).indexOf(k)>=0; }
function nextApp(){ var o=order(), later=null; for (var i=0;i<o.length;i++){ var k=o[i]; if (finished(k) || paused(k)) continue; if (S.skip && S.skip[k]) { later=later||k; continue; } return k; } return later; }
function totals(){
  var done=0, paid=0, probs=0, steps=0;
  Object.keys(S.apps).forEach(function(k){ var a=S.apps[k]; steps += Object.keys(a.ans||{}).length; if (a.stage!=='done') return; done++; if (a.ch && a.ch.pass) paid++; probs += a.fails||0; });
  return { done:done, paid:paid, kes:paid*PAY_APP, probs:probs, steps:steps };
}

/* ---------- HQ: outbox that survives no-data days ---------- */
var OUTK = PRE+'_outbox';
var MAILBOX = lsGet(PRE+'_mailbox') || '';
function mailbox(){
  if (MAILBOX) return Promise.resolve(MAILBOX);
  return fetch('../testers/config.json?cb=' + Date.now()).then(function(r){ return r.json(); }).then(function(c){
    MAILBOX = (c && c.mailbox) || MAILBOX_FALLBACK; lsSet(PRE+'_mailbox', MAILBOX); return MAILBOX;
  }).catch(function(){ return MAILBOX_FALLBACK; });
}
function queue(body){ var q=jget(OUTK,[]); body.qid = Date.now().toString(36)+Math.random().toString(36).slice(2,6); q.push(body); jset(OUTK,q); return body.qid; }
var flushing = false;
function flush(){
  if (flushing) return Promise.resolve(); var q=jget(OUTK,[]); if (!q.length) return Promise.resolve();
  flushing = true;
  return mailbox().then(function(url){
    var chain = Promise.resolve();
    q.forEach(function(b){ chain = chain.then(function(){
      var send = {}; for (var k in b) if (k!=='qid') send[k]=b[k];
      return fetch(url, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(send) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.ok===false && !/empty/i.test(j.error||'')) throw new Error(j.error||'not ok');
          var left=jget(OUTK,[]).filter(function(x){ return x.qid!==b.qid; }); jset(OUTK,left);
          if (b.action==='report' && S && S.apps[b.app]) { S.apps[b.app].sent = Date.now(); save(); } });
    }); });
    return chain;
  }).catch(function(){}).then(function(){ flushing=false; if (S && (VIEW==='home' || (S.cur && A(S.cur).stage==='done'))) render(); });
}
function pending(){ return jget(OUTK,[]).filter(function(b){ return b.action==='report'; }).length; }
window.addEventListener('online', function(){ flush(); });
setInterval(function(){ if (!document.hidden) flush(); }, 60000);

/* ---------- app data (cached so a reload with no data still works) ---------- */
function getFirst(dirs, file){
  var i=0;
  function next(){ if (i>=dirs.length) return Promise.reject(new Error('missing '+file));
    var u=dirs[i++]+file+'?v='+VERSION.slice(1,4);
    return fetch(u).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).catch(next); }
  return next();
}
var DATA = {};
function loadApp(k){
  if (DATA[k]) return Promise.resolve(DATA[k]);
  var ck=PRE+'_data_'+k, cached=jget(ck,null);
  return Promise.all([getFirst(KENYA_DIRS, k+'.json'), getFirst(SCRIPT_DIRS, k+'.json')]).then(function(r){
    var d={ k:r[0], s:r[1] }; jset(ck,d); DATA[k]=d; return d;
  }).catch(function(e){ if (cached){ DATA[k]=cached; return cached; } throw e; });
}

/* ---------- time spent (gaps capped, so a night away doesn't count) ---------- */
function tick(a){ var n=Date.now(); if (a.last) a.ms += Math.min(n-a.last, 20*60000); a.last=n; if (!a.t0) a.t0=n; }

}

      '<button class="btn mid" data-a="ans" data-r="unsure"'+(pick==='unsure'?' aria-pressed="true"':'')+'>🤷 Not sure</button>';
    h+='<details class="stuck"'+(pick==='skip'?' open':'')+'><summary>😕 I’m stuck</summary>'+(st.tip?'<p>💡 '+esc(st.tip)+'</p>':'')+'<p class="small">'+esc(UNSTUCK)+'</p><button class="btn ghost" data-a="ans" data-r="skip">Skip this step — I couldn’t do it</button></details>';
    if (pick==='fail' || pick==='unsure' || pick==='skip') h+='<div style="margin-top:12px"><label class="lbl" for="note">'+(pick==='skip'?'What stopped you? (a few words)':'What happened? (in your own words)')+'</label><textarea id="note" data-focus maxlength="1000">'+esc((an&&an.r===pick&&an.note)||a.draft||'')+'</textarea><div class="err" id="noteErr"></div><button class="btn" data-a="note">Save and go to the next step ›</button></div>';
    if (an && an.r) h+='<p class="small muted" style="margin-top:8px">Your answer was: '+(an.skip?'🤷 Skipped':({ok:'✅ It worked',fail:'❌ It didn’t',unsure:'🤷 Not sure'})[an.r])+(an.note?' — “'+esc(an.note)+'”':'')+'</p>';
    h+='<div class="row">'+(i>0?'<button class="btn ghost" data-a="back">‹ Back</button>':'')+(an && an.r && i<steps.length-1?'<button class="btn ghost" data-a="fwd">Next ›</button>':'')+'</div></div>';
  }
  else if (a.stage==='challenge'){
    var c=kd.challenge, ch=a.ch||(a.ch={ready:false,tries:[]}), tasks=c.tasks||[];
    h+='<div class="card soft"><div class="lbl">'+esc((kd.persona&&kd.persona.title)||'Pretend you are…')+'</div><p>'+esc(kd.persona&&kd.persona.text)+'</p></div>';
    h+='<div class="card"><h2>Part 3 · The final challenge</h2><p>'+esc(c.intro||'')+'</p>'+(E.pay?'<p class="tip">💱 Money: if the app shows a $ sign, don\u2019t worry — you can\u2019t and don\u2019t need to change it. Just type the numbers as they are written here (shillings work exactly the same).</p>':'');
    if (!ch.ready){
      h+='<h3>First, make the app empty</h3><p>'+esc(c.start||'')+'</p>'+openApp(d)+
        (ch.dirty?'<div class="card warn" style="margin-top:12px"><b>Some earlier work is still in the app.</b> '+ch.dirty+' job'+(ch.dirty>1?'s':'')+' already look done. Please follow the steps above again, then tap the button again.<button class="btn ghost" data-a="dirtyok">Continue anyway</button></div>':'')+
        '<button class="btn" data-a="empty">My app is empty — show the jobs ›</button>'+
        '<details class="stuck"><summary>😕 I’m stuck</summary><p class="small">'+esc(UNSTUCK)+'</p><button class="btn ghost" data-a="startstuck">I couldn’t make it empty — show the jobs anyway</button></details>';
    } else {
      var last=ch.tries[ch.tries.length-1], tries=ch.tries.length, final=ch.final;
      var hasSR=tasks.some(isSR);
      h+='<h3>Your jobs</h3><p class="small muted">Nobody tells you which buttons to press — use what you learned. Do the jobs in the app, then come back here and tap Check my work.'+(hasSR?' Jobs with an answer box: find the answer in the app and write it in the box.':'')+'</p><ul class="tasks">'+
        tasks.map(function(t){ var r=last?last[t.id]:null, sk=(ch.skip||{})[t.id], srv=(ch.sr||{})[t.id]||'';
          return '<li><span class="m">'+(r===true?'✅':sk?'🤷':r===false?'❌':'▫️')+'</span><span>'+esc(t.text)+(r===false&&last&&!final?'<span class="hint">💡 '+esc(t.hint||'')+'</span>':'')+
            (isSR(t)?(final?'<span class="small" style="display:block">Your answer: “'+esc(srv)+'”</span>':'<span class="sr" style="display:block"><label class="lbl" for="sr_'+esc(t.id)+'">Your answer</label><textarea id="sr_'+esc(t.id)+'" data-sr="'+esc(t.id)+'" maxlength="500" placeholder="'+esc(t.selfReport||'Write your answer here')+'">'+esc(srv)+'</textarea></span>'):'')+
            (final||r===true?'':sk?'<span class="small muted" style="display:block">Skipped: “'+esc(sk)+'”</span>':'<details class="stuck"><summary>😕 I’m stuck</summary><p>💡 '+esc(t.hint||UNSTUCK)+'</p><label class="lbl" for="sk_'+esc(t.id)+'">Couldn’t do it? Say what stopped you, then skip</label><textarea id="sk_'+esc(t.id)+'" maxlength="500" style="min-height:70px"></textarea><div class="err" id="ske_'+esc(t.id)+'"></div><button class="btn ghost" data-a="skiptask" data-t="'+esc(t.id)+'">Skip this job — I couldn’t do it</button></details>')+'</span></li>'; }).join('')+'</ul>'+openApp(d);
      if (last){
        var n=tasks.filter(function(t){ return last[t.id]; }).length;
        h+='<div class="card '+(n>=c.passMark?'okc':'warn')+'" style="margin-top:12px"><b>'+n+' of '+tasks.length+' jobs done.</b> '+
          (n>=c.passMark?'You passed! 🎉':final?'Not passed this time — that is OK. Honest results help us most.':'You need '+c.passMark+' to pass. Read the 💡 hints, fix it in the app, then check again. You have one more try.')+'</div>';
      }
      if (!final) h+='<button class="btn" data-a="check">✔ '+(tries?'Check again (last try)':'Check my work')+'</button>';
      else h+='<button class="btn" data-a="towords">Next: your own words ›</button>';
    }
    h+='</div>';
  }
  else if (a.stage==='words'){
    h+='<div class="card"><h2>Part 4 · In your own words</h2><label for="words" class="do" style="display:block;margin-bottom:8px">'+esc((kd.ownWords&&kd.ownWords.question)||'In your own words, what is this app for?')+'</label>'+
      '<p class="small muted">'+esc(E.wordsHint)+'</p>'+
      '<textarea id="words" data-focus maxlength="2000">'+esc(a.words||'')+'</textarea><div class="err" id="wErr"></div><button class="btn" data-a="words">Next ›</button></div>';
  }
  else if (a.stage==='send' || a.stage==='done'){
    var sum=summary(k,d);
    if (a.stage==='send') h+='<div class="card"><h2>Ready to send</h2><p>'+esc(sum.line)+'</p><p class="small muted">Jerry gets your step answers, your notes, your challenge result and your own words.</p><button class="btn" data-a="send">📨 Send my results</button></div>';
    else {
      var waiting = jget(OUTK,[]).some(function(b){ return b.action==='report' && b.app===k; });
      h+='<div class="card '+(waiting?'warn':'okc')+'"><div class="big">'+(waiting?'📮':'✅')+'</div><h2>'+(waiting?'Saved — will send when you have internet':'Sent! '+E.thanks)+'</h2><p>'+esc(sum.line)+'</p>'+
        (!E.pay?'<p>Jerry reads every report. Thank you for your honest eyes.</p>':a.ch&&a.ch.pass?'<p><b>+'+PAY_APP+' KES</b> (pending Jerry’s check)'+(a.fails?' and up to '+(a.fails*PAY_PROBLEM)+' KES more if Jerry confirms your '+a.fails+' problem'+(a.fails>1?'s':''):'')+'.</p>':(a.fails?'<p>Up to '+(a.fails*PAY_PROBLEM)+' KES if Jerry confirms your '+a.fails+' problem'+(a.fails>1?'s':'')+'.</p>':''))+
        (waiting?'<button class="btn ghost" data-a="flush">Try sending now</button>':'')+'</div>';
      var nx=nextApp();
      h+=nx?'<button class="btn" data-a="start" data-k="'+nx+'">Next app: '+APPS[nx][1]+' '+esc(APPS[nx][0])+' ›</button>':'';
      h+='<button class="btn ghost" data-a="home">‹ Back to my apps</button>';
    }
  }
  if (a.stage!=='done') h+='<div style="margin-top:18px">'+footHTML('app')+'</div>';
  return h;
}

/* ---------- the report ---------- */
function summary(k,d){
  var a=A(k), steps=(d.s.steps||[]), ok=0, fail=0, un=0, fast=0;
  steps.forEach(function(st){ var r=a.ans[st.id]; if (!r) return; if (r.r==='ok') ok++; else if (r.r==='fail') fail++; else un++; if (r.fast) fast++; });
  var c=d.k.challenge||{tasks:[]}, ch=a.ch||{tries:[]}, last=ch.tries[ch.tries.length-1]||{}, n=c.tasks.filter(function(t){ return last[t.id]; }).length;
  var mins=Math.max(1, Math.round((a.ms||0)/60000)), fl=[], sk=[];
  steps.forEach(function(st,i){ var r=a.ans[st.id]; if (!r) return; if (r.r==='fail') fl.push(i+1); if (r.skip) sk.push(i+1); });
  var head=E.tag+'|'+k+'|steps:'+ok+'/'+steps.length+' ok,'+fail+' fail,'+un+' unsure|challenge:'+n+'/'+c.tasks.length+' '+(n>=c.passMark?'PASS':'FAIL')+'|minutes:'+mins+'|fails:'+(fl.join(',')||'-')+'|skipped:'+(sk.join(',')||'-')+'|fast:'+fast+'|tries:'+ch.tries.length+'|start:'+(ch.dirty?'not-empty':'empty')+(SET?'|set:'+SET:'')+'|'+VERSION.split(' ')[0];
  var line='Steps: '+ok+' worked, '+fail+' didn’t, '+un+' not sure · Challenge: '+n+' of '+c.tasks.length+' '+(n>=c.passMark?'(passed)':'(not passed)')+' · '+mins+' min';
  return { head:head, line:line, ok:ok, fail:fail, un:un, n:n, pass:n>=c.passMark, last:last };
}
function reportText(k,d){
  var a=A(k), s=summary(k,d), steps=d.s.steps||[], c=d.k.challenge||{tasks:[]}, L=[];
  L.push(s.head);
  L.push(E.title+' — '+(d.k.name||APPS[k][0])+' — '+S.name);
  L.push(s.line);
  L.push('');
  L.push('Explainer: '+(a.watched?'watched/read':'not marked'));
  var probs=steps.filter(function(st){ var r=a.ans[st.id]; return r && r.r!=='ok'; });
  L.push(probs.length?'Problems and unsure steps ('+probs.length+'):':'Problems and unsure steps: none');
  probs.forEach(function(st,i){ var r=a.ans[st.id], n=steps.indexOf(st)+1;
    L.push((r.r==='fail'?'❌':r.skip?'🤷 SKIPPED':'🤷')+' Step '+n+' ('+st.id+'): '+String(st['do']).slice(0,140));
    L.push('   Should see: '+String(st.see).slice(0,140));
    L.push('   What happened: '+(r.note||'(no note)')); });
  if (s.fail+s.un===0 && Object.keys(a.ans).length) {}
  L.push('');
  L.push('Challenge ('+(s.pass?'PASS':'FAIL')+', '+(a.ch?a.ch.tries.length:0)+' check'+((a.ch&&a.ch.tries.length===1)?'':'s')+(a.ch&&a.ch.dirty?', app was NOT empty at the start':'')+(a.ch&&a.ch.startStuck?', could not make it empty':'')+'):');
  c.tasks.forEach(function(t){ var first=(a.ch&&a.ch.tries[0])||{}; L.push((s.last[t.id]?'✅ ':'❌ ')+t.id+(s.last[t.id]&&!first[t.id]?' (after hint)':'')+' — '+String(t.text).slice(0,120)+((a.ch&&a.ch.skip&&a.ch.skip[t.id])?' · skipped: '+a.ch.skip[t.id]:''));
    if (isSR(t)) L.push('   Their answer: “'+String(((a.ch&&a.ch.sr)||{})[t.id]||'').trim().slice(0,300)+'”'+(t.answer?' · expected: '+t.answer:'')); });
  L.push('');
  L.push('In their own words: '+(a.words||''));
  L.push('');
  L.push('Page '+VERSION+' · '+navigator.userAgent.replace(/^Mozilla\/5\.0 \(/,'').slice(0,90));
  return L.join('\n');
}

/* ---------- running the challenge checks against the apps' real saved data ---------- */
/* v1.3: a job with check:null is a self-report ("find it and write it", e.g. GameDay): it counts once the tester has written
   an answer of two words or more in its box; Jerry compares it with t.answer in the report. */
function isSR(t){ return t && (t.check==null || t.check===''); }
function srOK(ch, t){ var v=String(((ch&&ch.sr)||{})[t.id]||'').trim(); return v.split(/\s+/).filter(Boolean).length>=2; }
function runChecks(tasks, ch){
  var r={};
  tasks.forEach(function(t){ var v=false; if (isSR(t)) { r[t.id]=srOK(ch,t); return; } try{ v = !!(new Function('return ('+t.check+');'))(); }catch(e){ v=false; } r[t.id]=v; });
  return r;
}

/* ---------- taps ---------- */
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var act=b.getAttribute('data-a'), k=S && S.cur, a=k?A(k):null, d=k?DATA[k]:null;
  switch(act){
    case 'tsz': { var z=Number(lsGet('dj_friends_zoom')||'1'); z = z>=1.3 ? 1 : (z>=1.15 ? 1.3 : 1.15); lsSet('dj_friends_zoom', String(z)); applyZoom(); toast(z===1?'Normal size':'Bigger words ✓'); break; }
    case 'name': var nm=($('nm').value||'').trim().slice(0,40); if (!nm){ $('nmErr').textContent='Please type your first name.'; return; } S.name=nm; if (!lsGet('dj_name')) lsSet('dj_name',nm); save(); render(); break;
    case 'kickdone': S.kick=true; save(); startApp(PRACTICE); break;
    case 'rekick': S.kick=false; render(); window.scrollTo(0,0); break;
    case 'home': VIEW='home'; render(); window.scrollTo(0,0); flush(); break;
    case 'start': startApp(b.getAttribute('data-k')); break;
    case 'retryload': appView(k); break;
    case 'flush': toast('Sending…'); flush().then(function(){ toast(pending()?'Still no internet — saved on this phone.':'All sent ✓'); render(); }); break;
    case 'watched': tick(a); a.watched=true; a.stage='steps'; a.step=0; save(); render(); break;
    case 'ans': {
      var st=d.s.steps[a.step], r=b.getAttribute('data-r');
      tick(a);
      if (r==='ok'){ var fast=a.shown && a.shown.id===st.id && (Date.now()-a.shown.at)<6000;
        a.ans[st.id]={ r:'ok', at:Date.now(), fast:!!fast }; a.pick=''; a.draft=''; advance(a,d); }
      else { a.pick=r; save(); render(); }
      break; }
    case 'note': {
      var st2=d.s.steps[a.step], note=($('note').value||'').trim();
      if (note.length<3){ $('noteErr').textContent='Please write a few words about what happened (or what confused you).'; return; }
      tick(a); a.ans[st2.id]={ r:a.pick==='skip'?'unsure':a.pick, skip:a.pick==='skip', note:note.slice(0,1000), at:Date.now() }; a.pick=''; a.draft=''; advance(a,d); break; }
    case 'back': a.pick=''; a.draft=''; a.step=Math.max(0,a.step-1); save(); render(); break;
    case 'fwd': a.pick=''; a.draft=''; var cur=d.s.steps[a.step]; if (a.ans[cur.id]) { a.step=Math.min(a.step+1, d.s.steps.length-1); } save(); render(); break;
    case 'empty': {
      tick(a); var res=runChecks(d.k.challenge.tasks, a.ch), on=Object.keys(res).filter(function(x){ return res[x]; }).length;
      a.ch=a.ch||{tries:[]}; if (on){ a.ch.dirty=on; save(); render(); setTimeout(function(){ var w=document.querySelector('.card.warn'); if (w) w.scrollIntoView({block:'center'}); },50); }
      else { a.ch.dirty=0; a.ch.ready=true; save(); render(); }
      break; }
    case 'dirtyok': tick(a); a.ch.ready=true; save(); render(); break;
    case 'startstuck': { tick(a); a.ch=a.ch||{tries:[]}; var r0=runChecks(d.k.challenge.tasks, a.ch); a.ch.dirty=Object.keys(r0).filter(function(x){ return r0[x]; }).length; a.ch.startStuck=true; a.ch.ready=true; save(); render(); break; }
    case 'skiptask': { var tid=b.getAttribute('data-t'), ta=document.getElementById('sk_'+tid), tn=(ta&&ta.value||'').trim();
      if (tn.length<3){ var te=document.getElementById('ske_'+tid); if (te) te.textContent='Please write a few words first.'; return; }
      tick(a); a.ch.skip=a.ch.skip||{}; a.ch.skip[tid]=tn.slice(0,500); save(); render(); break; }
    case 'skipapp': S.skip=S.skip||{}; S.skip[k]=1; save(); var nk=nextApp(); if (nk && nk!==k) startApp(nk); else { VIEW='home'; render(); } break;
    case 'ask': { var q=($('askT').value||'').trim(); if (q.length<3){ $('askErr').textContent='Please type your question first.'; return; }
      var where=''; if (VIEW==='app' && k && d){ where=' — on '+(d.k.name||k)+', '+({watch:'watching the video',steps:'step '+(a.step+1),challenge:'the challenge',words:'own words',send:'sending'})[a.stage]; }
      queue({ action:'help', who:WHO, name:(FULL||S.name), app:E.qApp, contact:'', text:(q.slice(0,800)+where).slice(0,1000) });
      $('askT').value=''; $('askBox').open=false; toast('Saved ✓ — it sends now, or when you have internet. Keep going meanwhile!'); flush(); break; }
    case 'check': {
      tick(a); var c=d.k.challenge, res2=runChecks(c.tasks, a.ch); a.ch.tries.push(res2);
      var n=c.tasks.filter(function(t){ return res2[t.id]; }).length;
      if (n>=c.passMark || a.ch.tries.length>=2) { a.ch.final=true; a.ch.pass = n>=c.passMark; }
      save(); render(); break; }
    case 'towords': tick(a); a.stage='words'; save(); render(); break;
    case 'words': { var w=($('words').value||'').trim(); if (w.split(/\s+/).filter(Boolean).length<3){ $('wErr').textContent='Please write at least one sentence.'; return; }
      tick(a); a.words=w.slice(0,2000); a.stage='send'; save(); render(); break; }
    case 'send': {
      tick(a); var s=summary(k,d); a.fails=s.fail+s.un; a.ch=a.ch||{tries:[]}; a.ch.pass=s.pass;
      queue({ action:'report', who:WHO, name:(FULL||S.name), app:k, contact:'', text:reportText(k,d) });
      a.stage='done'; a.doneAt=Date.now(); save(); render();
      flush(); break; }
  }
});
/* keep half-typed notes through a reload */
document.addEventListener('input', function(e){
  if (!S || !S.cur) return; var a=A(S.cur);
  if (e.target.id==='note') { a.draft=e.target.value; save(); }
  else if (e.target.id==='words') { a.words=e.target.value; save(); }
  else if (e.target.getAttribute && e.target.getAttribute('data-sr')) { a.ch=a.ch||{tries:[]}; a.ch.sr=a.ch.sr||{}; a.ch.sr[e.target.getAttribute('data-sr')]=e.target.value.slice(0,500); save(); }
});
function advance(a,d){ var steps=d.s.steps; var i=a.step; while (i<steps.length && a.ans[steps[i].id]) i++;
  if (i>=steps.length) { a.stage='challenge'; } else a.step=i; save(); render(); }
function startApp(k){
  if (!APPS[k]) return; S.cur=k; VIEW='app'; var a=A(k); if (S.skip && S.skip[k] && nextApp()===k) delete S.skip[k];
  if (!a.tried){ a.tried=true; a.t0=a.t0||Date.now(); queue({ action:'tried', who:WHO, name:(FULL||S.name), app:k }); flush(); }
  a.last=Date.now(); save(); render();
}

function applyZoom(){ if (EDITION!=='friends') return; var z=Number(lsGet('dj_friends_zoom')||'1')||1; try{ if (z===1) document.querySelector('main').style.removeProperty('zoom'); else document.querySelector('main').style.zoom=String(z); }catch(e){} }
applyZoom();

/* ---------- go ---------- */
if (S) {
  save();
  if (S.cur && S.apps[S.cur] && S.apps[S.cur].stage!=='done') VIEW='app';
  flush();
  /* quiet "opened today" for HQ's last-seen (HQ ignores unknown tokens and repeats) */
  mailbox().then(function(u){ return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping',who:WHO,app:E.ping,v:VERSION.split(' ')[0]})}); }).catch(function(){});
}
render();
loadNews();
})();
</script>
