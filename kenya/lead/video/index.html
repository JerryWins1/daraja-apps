<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11211b">
<title>Testing, from Monday</title>
<!--
  kenya/lead/video/ — the managers' video. v1, 8 Nov 2026.

  Thirteen slides and the phone's own voice, about two and a half minutes, for
  Emmanuel Koki and Veronicah Kimani.

  It lives here rather than in a Claude page because neither of them has a Claude
  account and neither has an email address on file, so a Claude page is a wall they
  cannot get past. This is the same page the testers' video uses — a plain link,
  no account, no sign-in.

  The slides are m01.png to m13.png beside this file. They were made by a makeslides.js
  that was never committed, so it is not in this repo and cannot be run. Slide 11 was
  rebuilt by hand on 10 November and its source is m11.html beside this file; rebuild
  it with a 720x1280 screenshot. If the pay, the teams or the week ever change, the
  slides have to be rebuilt and the lines below have to change with them.
-->
<style>
:root{
  --bg:#11211b; --panel:#17291f; --fg:#eef3ef; --soft:#9fb3a8; --line:#2b3f34;
  --green:#3f9a74;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef0ee; --panel:#ffffff; --fg:#171c1a; --soft:#5b6561; --line:#d4d9d6;
  --green:#1f5d44; color-scheme:light;
}}
:root[data-theme="dark"]{
  --bg:#11211b; --panel:#17291f; --fg:#eef3ef; --soft:#9fb3a8; --line:#2b3f34;
  --green:#3f9a74; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 22px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:1.05rem;font-weight:700;margin:0;text-align:center}
.sub{font-size:.8rem;color:var(--soft);margin:0;text-align:center;max-width:46ch}
.stage{width:100%;max-width:420px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:14px;
  border:1px solid var(--line);background:var(--panel);display:block}
.bar{width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dot{height:5px;border-radius:3px;background:var(--line);flex:1 1 0;min-width:8px}
.dot.on{background:var(--green)}
.dot.done{background:var(--soft)}
.ctl{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
button.main{background:var(--green);border-color:var(--green);color:#fff;flex:1 1 auto;max-width:220px}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.cap{font-size:.86rem;line-height:1.45;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:3.6em}
.note{font-size:.74rem;color:var(--soft);text-align:center;margin:0}
a.back{color:var(--green);font-size:.82rem;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<h1>Testing, from Monday</h1>
<p class="sub">For Emmanuel and Veronicah. Tap Play — your phone reads it aloud. About two and a half minutes.</p>

<div class="stage"><img id="slide" alt="" src="m01.png"></div>

<div class="bar">
  <div class="dots" id="dots"></div>
  <div class="cap" id="cap">Tap Play to begin.</div>
  <div class="ctl">
    <button id="prev" type="button" aria-label="Previous">&lsaquo; Back</button>
    <button id="play" class="main" type="button">&#9654; Play</button>
    <button id="next" type="button" aria-label="Next">Next &rsaquo;</button>
  </div>
  <p class="note" id="vstat">&nbsp;</p>
  <p class="note"><a class="back" href="../">&lsaquo; Back to my team page</a></p>
</div>

<script>
const SLIDES = [
 ["Testing, from Monday. This is for Emmanuel and Veronicah. Everything you need to run your team, in two minutes. The pay is settled, so nothing here is waiting on a decision.", 7],
 ["Team 1. Emmanuel Koki leads, and there are thirteen testers. Jackline joins you this week. Every name is already in your page.", 8],
 ["Team 2. Veronicah Kimani leads, and there are twelve testers. Shamsuddin joins you this week. He tested twenty eight apps in October, more than anyone.", 9],
 ["What a tester earns. One hundred shillings for a small app. One hundred and fifty for a normal one. Two hundred and fifty for a big one. Fifty more for every report that finds a real problem. And one hundred for using an app five days out of seven.", 11],
 ["Here is how it adds up, for one tester in one week. Rafiki, a normal app, one hundred and fifty. Duka, a big one, two hundred and fifty. The Key, a small one, one hundred. She found a real problem, fifty more. And she used an app five days, one hundred. Her week is six hundred and fifty shillings. Nothing is per hour and nothing is per day. It is per app.", 15],
 ["The week runs Monday to Sunday, Kenya time. On Sunday night the week closes. Jerry sees the pay first, then you do. You pay your team, and on Monday it starts again from zero. Anyone can start early. It all counts.", 11],
 ["When you open your page you see four numbers. What is in your pay account. What your team is owed. What you have paid so far. And how many of your testers have gone quiet. Everyone starts on zero on Monday.", 10],
 ["Your team list shows who is doing what. How many apps they tested, how many problems they found, and what they are owed. Quiet means they have filed nothing for seven days. Gone quiet means fourteen. Ring them.", 11],
 ["To pay someone, send the money first, by M-Pesa, the way you always do. Then tap Paid. What they are owed goes to zero. Their total ever paid goes up. Your pay account drops. And Jerry sees the same thing.", 11],
 ["Jerry sends each of you twenty five thousand shillings to start. You pay your team out of it. The balance counts down as you pay, and when it gets low, the page tells Jerry to top it up.", 10],
 ["To tell your team something, write it once on your page. Then choose how it goes. Put it on their page shows it inside the testing app, at the top of every tester’s home screen — that one goes up at the next update, so within a few hours. Open WhatsApp puts the same words in a chat you choose, and you press send yourself. Either way the page keeps a record, and that record is how Jerry knows your team was told.", 17],
 ["All thirty one apps are open to both teams. Nobody is locked out. You decide the order. Each week, tell your team where to start. Two or three apps is enough.", 10],
 ["We start Monday. The pay is settled, so there is nothing to choose. Tell your team today, and when you are ready, say so and Jerry sends your twenty five thousand. One last thing. If a WhatsApp message ever disagrees with your page, the page is right.", 13]
];

const el = id => document.getElementById(id);
const img = el('slide'), cap = el('cap'), dots = el('dots');
let at = 0, playing = false, timer = null, spoke = false;

function pad(i){ return 'm' + String(i + 1).padStart(2, '0') + '.png'; }
dots.innerHTML = SLIDES.map((_, i) => '<span class="dot" data-i="' + i + '"></span>').join('');
SLIDES.forEach((_, i) => { const im = new Image(); im.src = pad(i); });

function paint(){
  img.src = pad(at);
  img.alt = 'Slide ' + (at + 1) + ' of ' + SLIDES.length;
  cap.textContent = SLIDES[at][0];
  [...dots.children].forEach((d, i) => {
    d.className = 'dot' + (i === at ? ' on' : (i < at ? ' done' : ''));
  });
  el('prev').disabled = at === 0;
  el('next').disabled = at === SLIDES.length - 1;
}

/* The same voices and the same rate as the store's own videos, so they sound alike. */
function pickVoice(){
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  return vs.filter(v => /Samantha|Karen|Moira|Serena|Google US English/i.test(v.name))[0] || vs[0] || null;
}
function speak(text, done){
  clearTimeout(timer);
  let fired = false;
  const secs = Math.max(2.6, SLIDES[at][1]);
  const finish = () => { if (fired) return; fired = true; clearTimeout(timer); done(); };
  /* No voice: hold each slide for as long as reading it aloud would have taken. */
  const byClock = () => { clearTimeout(timer); timer = setTimeout(finish, secs * 1000); };
  if (!window.speechSynthesis) { el('vstat').textContent = 'This browser has no voice — the words are on screen.'; return byClock(); }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    const v = pickVoice(); if (v) { u.voice = v; el('vstat').textContent = 'Voice: ' + v.name; }
    let started = false;
    u.onstart = () => { started = true; spoke = true; };
    /* Some phones and tablets end the utterance at once without making a sound. If it
       never started, go by the clock — otherwise all thirteen slides flash past. */
    u.onend = () => { started ? finish() : byClock(); };
    u.onerror = () => { started ? finish() : byClock(); };
    speechSynthesis.speak(u);
    timer = setTimeout(finish, (secs + 14) * 1000);
    setTimeout(() => { if (!spoke) el('vstat').textContent = 'No voice on this device — the words are on screen.'; }, 1800);
  } catch (e) { byClock(); }
}

function stepOn(){
  if (!playing) return;
  paint();
  speak(SLIDES[at][0], () => {
    if (!playing) return;
    if (at < SLIDES.length - 1) { at++; stepOn(); } else stop();
  });
}
function start(){ playing = true; el('play').textContent = '❚❚ Pause'; stepOn(); }
function stop(){
  playing = false; el('play').textContent = '▶ Play';
  clearTimeout(timer);
  try { speechSynthesis.cancel(); } catch (e) {}
}
el('play').onclick = () => playing ? stop() : start();
el('prev').onclick = () => { if (at > 0) { at--; playing ? stepOn() : paint(); } };
el('next').onclick = () => { if (at < SLIDES.length - 1) { at++; playing ? stepOn() : paint(); } };
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {
  const v = pickVoice(); if (v && !playing) el('vstat').textContent = 'Voice ready: ' + v.name;
};
paint();
</script>
</html>
