<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11211b">
<title>What changed overnight</title>
<!--
  kenya/lead/video/ — the managers' video. v1, 8 Nov 2026.

  Thirteen slides and the phone's own voice, about two and a half minutes, for
  Emmanuel Koki and Veronicah Kimani.

  It lives here rather than in a Claude page because neither of them has a Claude
  account and neither has an email address on file, so a Claude page is a wall they
  cannot get past. This is the same page the testers' video uses — a plain link,
  no account, no sign-in.

  The slides are m01.png to m13.png beside this file. They were made by a makeslides.js
  that was never committed, so it is not in this repo and cannot be run. Slide 11 was
  rebuilt by hand on 10 November and its source is m11.html beside this file; rebuild
  it with a 720x1280 screenshot. If the pay, the teams or the week ever change, the
  slides have to be rebuilt and the lines below have to change with them.
-->
<style>
:root{
  --bg:#11211b; --panel:#17291f; --fg:#eef3ef; --soft:#9fb3a8; --line:#2b3f34;
  --green:#3f9a74;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef0ee; --panel:#ffffff; --fg:#171c1a; --soft:#5b6561; --line:#d4d9d6;
  --green:#1f5d44; color-scheme:light;
}}
:root[data-theme="dark"]{
  --bg:#11211b; --panel:#17291f; --fg:#eef3ef; --soft:#9fb3a8; --line:#2b3f34;
  --green:#3f9a74; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 22px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:1.05rem;font-weight:700;margin:0;text-align:center}
.sub{font-size:.8rem;color:var(--soft);margin:0;text-align:center;max-width:46ch}
.stage{width:100%;max-width:420px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:14px;
  border:1px solid var(--line);background:var(--panel);display:block}
.bar{width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dot{height:5px;border-radius:3px;background:var(--line);flex:1 1 0;min-width:8px}
.dot.on{background:var(--green)}
.dot.done{background:var(--soft)}
.ctl{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
button.main{background:var(--green);border-color:var(--green);color:#fff;flex:1 1 auto;max-width:220px}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.cap{font-size:.86rem;line-height:1.45;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:3.6em}
.note{font-size:.74rem;color:var(--soft);text-align:center;margin:0}
a.back{color:var(--green);font-size:.82rem;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<h1>What changed overnight</h1>
<p class="sub">Monday 10 November. For both teams and their leaders. Tap Play — your phone reads it aloud. About two minutes.</p>

<div class="stage"><img id="slide" alt="" src="c01.png"></div>

<div class="bar">
  <div class="dots" id="dots"></div>
  <div class="cap" id="cap">Tap Play to begin.</div>
  <div class="ctl">
    <button id="prev" type="button" aria-label="Previous">&lsaquo; Back</button>
    <button id="play" class="main" type="button">&#9654; Play</button>
    <button id="next" type="button" aria-label="Next">Next &rsaquo;</button>
  </div>
  <p class="note" id="vstat">&nbsp;</p>
  <p class="note"><a class="back" id="bk" href="../">&lsaquo; Back</a></p>
</div>

<script>
const SLIDES = [
 ["Habari. This is what changed overnight, Monday the tenth of November. Three problems you found yesterday are fixed. Ahead of It is one app now instead of three. And your team leader can write to you inside the app. Nothing you did yesterday was lost.", 13],
 ["Ahead of It is one app. The three you were asked to skip — Ahead of It, Church and Nonprofit — are a single app now, with three lists you can switch on and off. There is a new twenty seven step script, walked through screen by screen before it was sent to you. Only Ahead of It is on your list. And the challenge works again. Before, it could not be passed at all.", 18],
 ["Three things you found yesterday are fixed. Brian found that the WhatsApp button in Operation Christmas Child was dead. Brian also found that Our Table’s step twenty one sent you looking for buttons that only appear at Level three. And Frank found that Business Manager asked him to change a price that was not on his list. Two of them pay again if you run them again.", 18],
 ["Links are links now. If a step shows you a video address, tap it and it opens. The same for a link your team leader sends you. Nobody has to type a long address by hand any more.", 10],
 ["In the videos there is now a Back button. If you missed a sentence, tap it and that sentence is read again. There is no skip forward, and that is on purpose. Watching the video is part of the test, not a door to get past.", 12],
 ["Your team leader can write to you inside the app. Emmanuel and Veronicah each write to their own team, and it shows at the top of your page, above the news from Jerry. Everyone on the team sees the same words. It only goes one way for now, so to reply, use Ask Jerry a question, or WhatsApp your leader the way you do today.", 16],
 ["Emmanuel, Veronicah — this part is for you. There is a new tab on your page called Tell my team. Write it once. Put it on their page shows it to your whole team inside the app, within a few hours. Open WhatsApp puts the same words into a chat you choose. The page keeps a record either way. Your own video is updated too. Slide eleven now shows both buttons.", 18],
 ["So this morning. Open your page and read the card at the top. Your team leader will say where to start. And if something is broken, say so. A real problem you explain is worth as much as a test that passes. Asante sana.", 12],
];

const el = id => document.getElementById(id);
const img = el('slide'), cap = el('cap'), dots = el('dots');
let at = 0, playing = false, timer = null, spoke = false;

function pad(i){ return 'c' + String(i + 1).padStart(2, '0') + '.png'; }
dots.innerHTML = SLIDES.map((_, i) => '<span class="dot" data-i="' + i + '"></span>').join('');
SLIDES.forEach((_, i) => { const im = new Image(); im.src = pad(i); });

function paint(){
  img.src = pad(at);
  img.alt = 'Slide ' + (at + 1) + ' of ' + SLIDES.length;
  cap.textContent = SLIDES[at][0];
  [...dots.children].forEach((d, i) => {
    d.className = 'dot' + (i === at ? ' on' : (i < at ? ' done' : ''));
  });
  el('prev').disabled = at === 0;
  el('next').disabled = at === SLIDES.length - 1;
}

/* The same voices and the same rate as the store's own videos, so they sound alike. */
function pickVoice(){
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  return vs.filter(v => /Samantha|Karen|Moira|Serena|Google US English/i.test(v.name))[0] || vs[0] || null;
}
function speak(text, done){
  clearTimeout(timer);
  let fired = false;
  const secs = Math.max(2.6, SLIDES[at][1]);
  const finish = () => { if (fired) return; fired = true; clearTimeout(timer); done(); };
  /* No voice: hold each slide for as long as reading it aloud would have taken. */
  const byClock = () => { clearTimeout(timer); timer = setTimeout(finish, secs * 1000); };
  if (!window.speechSynthesis) { el('vstat').textContent = 'This browser has no voice — the words are on screen.'; return byClock(); }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    const v = pickVoice(); if (v) { u.voice = v; el('vstat').textContent = 'Voice: ' + v.name; }
    let started = false;
    u.onstart = () => { started = true; spoke = true; };
    /* Some phones and tablets end the utterance at once without making a sound. If it
       never started, go by the clock — otherwise all thirteen slides flash past. */
    u.onend = () => { started ? finish() : byClock(); };
    u.onerror = () => { started ? finish() : byClock(); };
    speechSynthesis.speak(u);
    timer = setTimeout(finish, (secs + 14) * 1000);
    setTimeout(() => { if (!spoke) el('vstat').textContent = 'No voice on this device — the words are on screen.'; }, 1800);
  } catch (e) { byClock(); }
}

/* The recording comes first. The phone's own voice is only the fallback, because on
   many phones and in-app browsers it makes no sound at all. One Audio element, started
   by the Play tap, so the phone lets every later slide play without another tap. */
const AUD = new Audio();
let VOICE = {};
function fp(t){ let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) + t.charCodeAt(i)) >>> 0; return String(h); }
fetch('voice.json').then(r => r.ok ? r.json() : {}).then(j => { VOICE = j || {}; }).catch(() => {});
function vname(i){ return 'v' + String(i + 1).padStart(2, '0') + '.m4a'; }

function play(done){
  const i = at, name = vname(i);
  if (VOICE[name] !== fp(SLIDES[i][0])) return false;      /* no recording of THESE words */
  let fired = false;
  const next = () => { if (fired) return; fired = true; clearTimeout(timer); done(); };
  const fallBack = () => { if (fired) return; fired = true; clearTimeout(timer); speak(SLIDES[i][0], done); };
  AUD.onended = next;
  AUD.onerror = fallBack;
  AUD.src = name;
  const pr = AUD.play();
  if (pr && pr.catch) pr.catch(fallBack);
  el('vstat').textContent = 'Recorded voice';
  /* a recording that never starts must not freeze the slide */
  timer = setTimeout(() => { if (AUD.currentTime === 0) fallBack(); }, 6000);
  return true;
}

function stepOn(){
  if (!playing) return;
  paint();
  const go = () => {
    if (!playing) return;
    if (at < SLIDES.length - 1) { at++; stepOn(); } else stop();
  };
  try { AUD.pause(); } catch (e) {}
  if (!play(go)) speak(SLIDES[at][0], go);
}
function start(){ playing = true; el('play').textContent = '❚❚ Pause'; stepOn(); }
function stop(){
  playing = false; el('play').textContent = '▶ Play';
  clearTimeout(timer);
  try { AUD.pause(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
}
el('play').onclick = () => playing ? stop() : start();
el('prev').onclick = () => { if (at > 0) { at--; playing ? stepOn() : paint(); } };
el('next').onclick = () => { if (at < SLIDES.length - 1) { at++; playing ? stepOn() : paint(); } };
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {
  const v = pickVoice(); if (v && !playing) el('vstat').textContent = 'Voice ready: ' + v.name;
};
document.getElementById('bk').onclick = e => {
  /* came from somewhere on this site: go back there, so leaders land on their own page */
  if (document.referrer && document.referrer.indexOf(location.origin) === 0) { e.preventDefault(); history.back(); }
};
paint();
</script>
</html>
