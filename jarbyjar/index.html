    .printable table{ width:100%; border-collapse:collapse; } .printable td,.printable th{ border-bottom:1px solid #999; padding:6px 4px; text-align:left; } .printable td.n,.printable th.n{ text-align:right; } }

<script>
/* Jar by Jar v1.0 — a family budget in jars. Everything lives in localStorage under one key.
   v1.0 · 13 Nov 2026: built out for the store — the welcome tour, a way out of the example family,
   an honest line before anything is planned, and videoReady() for the store's videos. */
var KEY = 'dj_jarbyjar_v1'; window.DJ_OWNS = { k:[KEY], p:['dj_jarbyjar_'] };   /* every name this app writes, so the house Start fresh finds them */
var db = load();
function blank(){ return { v:1, cur:'$', fill:'came', month:monthKey(new Date()), income:0, jars:[], ins:[], outs:[], moves:[], past:[] }; }
function load(){ try{ var s = localStorage.getItem(KEY); if(s){ var d = JSON.parse(s); if(d && d.jars) return d; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ alert('This phone would not save that. Nothing was lost on screen — try again in a moment.'); } }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthName(k){ var p = k.split('-'); return new Date(+p[0], +p[1]-1, 1).toLocaleDateString('en-US',{ month:'long', year:'numeric' }); }
function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function r2(n){ return Math.round(n*100)/100; }
function money(n, round){ var neg = n < 0; n = Math.abs(r2(n)); if(round) n = Math.round(n); var whole = Math.round(n) === n;
  var s = n.toLocaleString('en-US',{ minimumFractionDigits: whole?0:2, maximumFractionDigits:2 });
  var c = db ? db.cur : '$'; s = (c === 'KSh' ? 'KSh ' : c) + s; return (neg ? '−' : '') + s; }
function shortDate(d){ var p = d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('en-US',{ month:'short', day:'numeric' }); }
function jar(id){ for(var i=0;i<db.jars.length;i++) if(db.jars[i].id===id) return db.jars[i]; return null; }
function spentIn(id){ return db.outs.filter(function(o){ return o.jar===id; }).reduce(function(a,o){ return a+o.amt; },0); }
function movedIn(id){ return db.moves.reduce(function(a,m){ return a + (m.to===id?m.amt:0) - (m.from===id?m.amt:0); },0); }
/* Jerry, 26 Nov 2026 (Goodbudget's rule — you only spend money you really have): jars fill from the money that has come in,
   in jar order (Give first), each up to its plan. New months start this way; a month begun before keeps filling to plan
   until the person switches in Settings. The example family stays as it was, so the videos still match. */
function filledMap(){ var m = {}; if(db.fill !== 'came'){ db.jars.forEach(function(j){ m[j.id] = j.plan; }); return m; }
  var pot = cameIn(); db.jars.forEach(function(j){ var f = Math.max(0, Math.min(j.plan, pot)); m[j.id] = r2(f); pot = r2(pot - f); }); return m; }
function waitingIn(){ return db.fill === 'came' ? Math.max(0, r2(planned() - cameIn())) : 0; }
function inJar(id){ var j = jar(id); return r2(filledMap()[id] + (j.carry||0) + movedIn(id)); }
function leftIn(id){ return r2(inJar(id) - spentIn(id)); }
function planned(){ return r2(db.jars.reduce(function(a,j){ return a + j.plan; },0)); }
function cameIn(){ return r2(db.ins.reduce(function(a,i){ return a+i.amt; },0)); }
function spentAll(){ return r2(db.outs.reduce(function(a,o){ return a+o.amt; },0)); }
function giveJar(){ return db.jars[0]; }
function givenThisYear(){ var y = db.month.slice(0,4), g = giveJar(); var t = g ? spentIn(g.id) : 0;
  db.past.forEach(function(p){ if(p.month.slice(0,4)===y) t += p.given||0; }); return r2(t); }

/* ── the jar picture: glass, a lid, and the money level ── */
function jarSVG(fill, color, over){
  fill = Math.max(0, Math.min(1, fill)); var top = 30, bot = 92, h = (bot-top) * fill, y = bot - h;
  var cid = 'c' + uid();
  return '<svg viewBox="0 0 86 100" aria-hidden="true"><defs><clipPath id="'+cid+'"><path d="M16 26h54c4 0 6 3 6 6v54c0 6-4 10-10 10H20c-6 0-10-4-10-10V32c0-3 2-6 6-6z"/></clipPath></defs>'
    + '<rect x="24" y="8" width="38" height="13" rx="4" fill="#23504F"/>'
    + '<g clip-path="url(#'+cid+')"><rect x="0" y="'+y+'" width="86" height="'+(h+12)+'" fill="'+color+'"/>'
    + (fill>0.02 ? '<path d="M0 '+y+' q 11 -4 21 0 t 22 0 t 22 0 t 21 0 v6 H0z" fill="rgba(255,255,255,.35)"/>' : '') + '</g>'
    + '<path d="M16 26h54c4 0 6 3 6 6v54c0 6-4 10-10 10H20c-6 0-10-4-10-10V32c0-3 2-6 6-6z" fill="none" stroke="'+(over?'#B8432F':'#23504F')+'" stroke-width="3"/>'
    + '<path d="M20 36v40" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round"/></svg>';
}
var COLORS = ['#7FB89A','#9CC3D9','#E0B04A','#E79A7E','#B9A6D6','#A7C77E','#F0C27B','#8FB3B0','#D9A3B8','#C9B48A','#9FB6E0','#E3C565'];

/* ── the main screen ── */
function render(){
  document.getElementById('monthName').textContent = db ? monthName(db.month) : '';
  var main = document.getElementById('main'), bar = document.getElementById('bar');
  if(!db){ bar.style.display = 'none'; main.innerHTML = welcomeHTML(); return; }
  bar.style.display = '';
  var inc = db.income, pl = planned(), toPlace = r2(inc - pl), sp = spentAll(), left = r2(db.jars.reduce(function(a,j){ return a + leftIn(j.id); },0));
  var none = !inc && !pl, pc = none ? 'left' : toPlace === 0 ? 'zero' : (toPlace > 0 ? 'left' : 'over');
  var pt = none ? 'Start with the plan: what comes in this month?' : toPlace === 0 ? '✓ Every dollar has a jar.' : (toPlace > 0 ? money(toPlace) + ' still needs a jar.' : money(-toPlace) + ' more planned than comes in.');
  var h = (db.ex ? '<div class="card exnote" id="exNote"><span>👀 This is an example family, the Walkers. Try anything — it’s pretend money.</span><button class="b primary" id="ownBtn" onclick="leaveExample()">Start my own month</button></div>' : '')
    + '<div class="card"><div class="sum">'
    + '<div><b>' + money(cameIn(),1) + '</b><span>came in<br>of ' + money(inc,1) + '</span></div>'
    + '<div><b>' + money(sp,1) + '</b><span>out of<br>the jars</span></div>'
    + '<div><b style="color:var(--ok)">' + money(left,1) + '</b><span>left in<br>the jars</span></div></div>'
    + (waitingIn() > 0 ? '<div class="small" id="waitLine" style="margin:6px 0 0">⏳ ' + money(waitingIn()) + ' of the plan hasn’t come in yet. The jars fill as it arrives, Give first.</div>' : '')
    + '<div class="place ' + pc + '" id="placeLine"><span>' + pt + '</span>' + (toPlace !== 0 || none ? '<button class="b small primary" onclick="openPlan()">' + (none ? 'Plan the month' : 'Fix the plan') + '</button>' : '') + '</div></div>';
  h += '<div class="jars" id="jars">';
  db.jars.forEach(function(j, i){
    var inj = inJar(j.id), l = leftIn(j.id), f = inj > 0 ? l / inj : 0;
    var cls = l < 0 ? 'over' : (l === 0 && inj > 0 ? 'used' : (f < 0.15 ? 'low' : ''));
    if(i === 0) cls += ' first';
    var tag = l < 0 ? 'over by ' + money(-l) : (i === 0 ? 'first jar' : (cls.indexOf('low') > -1 ? 'running low' : ''));
    h += '<button class="jar ' + cls + '" data-jar="' + j.id + '" onclick="openJar(\'' + j.id + '\')">'
      + (tag ? '<span class="tag">' + tag + '</span>' : '')
      + jarSVG(l < 0 ? 0 : f, j.color, l < 0)
      + '<div class="nm">' + esc(j.em + ' ' + j.name) + '</div>'
      + '<div class="left">' + (l === 0 && inj > 0 ? (j.id===giveJar().id ? 'all given ✓' : /sav/i.test(j.name) ? 'put away ✓' : 'all used') : money(l)) + '</div>'
      + '<div class="of">' + (l < 0 ? 'planned ' + money(inj) : 'left of ' + money(inj)) + '</div></button>';
  });
  h += '</div><div class="tools">'
    + '<button class="tool" onclick="openPlan()">📝 Plan the month</button>'
    + '<button class="tool" onclick="openMove()">🔁 Move money between jars</button>'
    + '<button class="tool" onclick="openTalk()">💬 Talk it over</button>'
    + '<button class="tool" onclick="openNewMonth()">🗓 Start next month</button>'
    + '<button class="tool" onclick="openGiving()">🙏 Giving this year</button>'
    + '<button class="tool" onclick="openSettings()">⚙️ Settings</button></div>';
  main.innerHTML = h;
}
function welcomeHTML(){
  return '<div class="card welcome">' + jarSVG(.62,'#E0B04A') + '<h2>Every dollar, a jar.</h2>'
    + '<p>Plan the month at the kitchen table. Give first. Put the rest in jars — groceries, house, gas. When you spend, tap the jar. You always know what’s left.</p>'
    + '<p style="font-size:15px">No account. No bank login. Nothing leaves this phone unless you tap Ask.</p>'
    + '<button class="b primary" id="tryEx" onclick="startExample()">See it with an example family</button>'
    + '<button class="b" id="startOwn" onclick="startOwn()">Start my own month</button></div>';
}

/* ── sheets ── */
/* v1.2 · 20 Nov: ← Back between sheets (house v68 window.djBack). Jerry: "If you go one screen too far
   or something, you can't go back to the previous one." A sheet that leads on to another (a jar's own
   sheet, the over-budget sheet) says what it is with `here`; when the next sheet replaces it, it goes on
   the back-stack, and the Back chip at the top of the next sheet reopens it. Closing the sheet ends the trail. */
var SHOWING = null, BACKING = 0;
function openSheet(html, here){ var s = document.getElementById('sheet');
  if(s.classList.contains('on') && SHOWING && !BACKING && (!here || here.k !== SHOWING.k) && window.djBack) djBack.push(SHOWING.fn);
  SHOWING = here || null;
  document.getElementById('sheetIn').innerHTML = (window.djBack ? djBack.button() : '') + html; s.classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); SHOWING = null; if(window.djBack) djBack.clear(); }
document.addEventListener('click', function(e){ var b = e.target.closest ? e.target.closest('#sheetIn .djBackB') : null; if(!b || !window.djBack) return;
  BACKING = 1; try{ djBack.go(); }finally{ BACKING = 0; } });
function toast(t){ var e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove('on'); }, 2600); }
function flashJar(id){ var e = document.querySelector('.jar[data-jar="' + id + '"]'); if(e){ e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); e.scrollIntoView({ block:'nearest', behavior:'smooth' }); } }

/* the number pad: big keys, no tiny keyboard */
var pad = '';
function padHTML(){ var k = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  return '<div class="display" id="disp">' + money(0) + '</div><div class="keys">' + k.map(function(x){ return '<button type="button" data-k="' + x + '" onclick="key(\'' + x + '\')">' + x + '</button>'; }).join('') + '</div>'; }
function key(x){ if(x === '⌫') pad = pad.slice(0,-1); else if(x === '.'){ if(pad.indexOf('.') < 0) pad += (pad ? '.' : '0.'); }
  else if(x){ if(/\.\d\d$/.test(pad) || pad.replace('.','').length >= 8) return; pad = (pad === '0' ? '' : pad) + x; }
  showPad(); }
function showPad(){ var d = document.getElementById('disp'); if(!d) return; var p = (pad || '0').split('.');
  d.textContent = (db.cur==='KSh'?'KSh ':db.cur) + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p.length > 1 ? '.' + p[1] : ''); }
function padVal(){ return r2(parseFloat(pad || '0')); }

var pickJar = null;
function openSpend(pre){
  pad = ''; pickJar = pre || null;
  openSheet('<h3>I spent money</h3><p class="sub">How much, and from which jar?</p>' + padHTML()
    + '<label>From which jar?</label><div class="pick" id="pick">' + db.jars.map(function(j){ var l = leftIn(j.id);
      return '<button type="button" data-pick="' + j.id + '" class="' + (pickJar===j.id?'on':'') + '" onclick="choose(\'' + j.id + '\')">' + esc(j.em + ' ' + j.name) + '<small>' + money(l) + ' left</small></button>'; }).join('') + '</div>'
    + '<label for="spNote">What for? (if you like)</label><input id="spNote" placeholder="Kroger · gas · school shoes">'
    + '<div class="row" style="margin-top:14px"><button class="b warm" id="spSave" onclick="saveSpend()">Take it out of the jar</button><button class="b ghost" onclick="closeSheet()">Cancel</button></div>');
}
function choose(id){ pickJar = id; document.querySelectorAll('#pick button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-pick') === id); }); }
function saveSpend(){
  var a = padVal(); if(!a){ toast('Type how much first.'); return; } if(!pickJar){ toast('Tap the jar it came from.'); return; }
  var note = (document.getElementById('spNote').value || '').trim();
  db.outs.push({ id:uid(), d:today(), amt:a, jar:pickJar, note:note }); save(); closeSheet(); render(); flashJar(pickJar);
  var l = leftIn(pickJar), j = jar(pickJar);
  if(l < 0) setTimeout(function(){ overSheet(pickJar); }, 900);
  else toast(money(a) + ' out of ' + j.name + ' · ' + money(l) + ' left');
}
function overSheet(id){
  var j = jar(id), need = -leftIn(id), ok = db.jars.filter(function(x){ return x.id !== id && x.id !== giveJar().id && !/sav/i.test(x.name) && leftIn(x.id) >= need; });
  var best = ok.filter(function(x){ return /pocket|fun|spend|extra/i.test(x.name); })[0] || ok.sort(function(a,b){ return leftIn(b.id) - leftIn(a.id); })[0];
  openSheet('<h3>' + esc(j.em + ' ' + j.name) + ' is over by ' + money(need) + '</h3><p class="sub">That’s all right — it happens. Cover it from a jar that has room, so the month still adds up.</p>'
    + (best ? '<button class="b primary" style="width:100%;min-height:58px" id="coverBtn" onclick="doMove(\'' + best.id + '\',\'' + id + '\',' + need + ')">Cover it from ' + esc(best.em + ' ' + best.name) + ' (' + money(leftIn(best.id)) + ' left)</button>' : '')
    + '<div class="row" style="margin-top:10px"><button class="b" onclick="openMove(null,\'' + id + '\',' + need + ')">Pick another jar</button><button class="b ghost" onclick="closeSheet()">Leave it for now</button></div>', { k:'over:' + id, fn:function(){ overSheet(id); } });
}

function openIn(){ pad = '';
  openSheet('<h3>Money came in</h3><p class="sub">A paycheck, a side job, a gift.</p>' + padHTML()
    + '<label for="inNote">What was it?</label><input id="inNote" placeholder="Paycheck">'
    + '<div class="row" style="margin-top:14px"><button class="b primary" id="inSave" onclick="saveIn()">Add it</button><button class="b ghost" onclick="closeSheet()">Cancel</button></div>'); }
function saveIn(){ var a = padVal(); if(!a){ toast('Type how much first.'); return; }
  db.ins.push({ id:uid(), d:today(), amt:a, note:(document.getElementById('inNote').value||'Money in').trim() });
  var c = cameIn(); if(c > db.income){ db.income = c; }
  save(); closeSheet(); render(); toast(money(a) + ' came in' + (planned() < db.income ? ' · give it a jar in the plan' : '')); }

function openJar(id){
  var j = jar(id), l = leftIn(id), list = db.outs.filter(function(o){ return o.jar === id; }).slice().reverse();
  var mv = db.moves.filter(function(m){ return m.to === id || m.from === id; });
  openSheet('<h3>' + esc(j.em + ' ' + j.name) + '</h3>'
    + '<p class="sub">Planned ' + money(j.plan) + (j.carry ? ' + ' + money(j.carry) + ' carried over' : '') + (movedIn(id) ? ' · moved ' + (movedIn(id) > 0 ? 'in ' : 'out ') + money(Math.abs(movedIn(id))) : '') + '</p>'
    + '<div class="display" style="font-size:40px;color:' + (l < 0 ? 'var(--red)' : 'var(--ok)') + '">' + money(l) + '<div style="font-size:14px;color:var(--soft);font-weight:800">' + (l < 0 ? 'over' : 'left in this jar') + '</div></div>'
    + (id === giveJar().id ? '<p class="note" style="text-align:center">🙏 Given this year: <b>' + money(givenThisYear()) + '</b></p>' : '')
    + '<div class="row" style="margin:10px 0"><button class="b warm" onclick="openSpend(\'' + id + '\')">Spend from it</button><button class="b" onclick="openMove(null,\'' + id + '\')">Move money in</button></div>'
    + '<ul class="list">' + (list.length ? list.map(function(o){ return '<li><span class="d">' + shortDate(o.d) + '</span><span>' + esc(o.note || 'Spent') + '</span><span class="amt">' + money(o.amt) + '</span><button aria-label="Remove this spending" title="Remove this spending" onclick="delOut(\'' + o.id + '\',\'' + id + '\')">✕</button></li>'; }).join('') : '<li style="color:var(--soft)">Nothing spent from this jar yet this month.</li>')
    + mv.map(function(m){ var o = m.to === id; return '<li><span class="d">' + shortDate(m.d) + '</span><span>🔁 ' + (o ? 'From ' + esc(jar(m.from).name) : 'To ' + esc(jar(m.to).name)) + '</span><span class="amt">' + (o ? '+' : '−') + money(m.amt) + '</span><span style="width:40px"></span></li>'; }).join('') + '</ul>'
    + '<div class="row" style="margin-top:12px"><button class="b ghost" onclick="closeSheet()">Close</button></div>', { k:'jar:' + id, fn:function(){ openJar(id); } });
}
function delOut(oid, jid){ if(!confirm('Take this out of the list? The money goes back in the jar.')) return; db.outs = db.outs.filter(function(o){ return o.id !== oid; }); save(); render(); openJar(jid); }

function openMove(from, to, amt){
  pad = amt ? String(r2(amt)) : '';
  var opts = function(sel){ return db.jars.map(function(j){ return '<option value="' + j.id + '"' + (j.id===sel?' selected':'') + '>' + esc(j.em + ' ' + j.name) + ' — ' + money(leftIn(j.id)) + ' left</option>'; }).join(''); };
  openSheet('<h3>Move money between jars</h3><p class="sub">The total stays the same. It just changes jars.</p>' + padHTML()
    + '<label for="mvFrom">Take it from</label><select id="mvFrom">' + opts(from || (db.jars[db.jars.length-1]||{}).id) + '</select>'
    + '<label for="mvTo">Put it in</label><select id="mvTo">' + opts(to || (db.jars[1]||{}).id) + '</select>'
    + '<div class="row" style="margin-top:14px"><button class="b primary" id="mvSave" onclick="saveMove()">Move it</button><button class="b ghost" onclick="closeSheet()">Cancel</button></div>');
  showPad();
}
function saveMove(){ var a = padVal(), f = document.getElementById('mvFrom').value, t = document.getElementById('mvTo').value;
  if(!a){ toast('Type how much first.'); return; } if(f === t){ toast('Pick two different jars.'); return; } doMove(f, t, a); }
function doMove(f, t, a){ db.moves.push({ id:uid(), d:today(), from:f, to:t, amt:r2(a) }); save(); closeSheet(); render(); flashJar(t);
  toast('Moved ' + money(a) + ' from ' + jar(f).name + ' to ' + jar(t).name); }

/* the plan: income at the top, every jar's amount, and what still needs a jar */
function openPlan(){
  var rows = db.jars.map(function(j, i){ return '<div class="planrow"><span class="e">' + j.em + '</span><input aria-label="Jar name" data-name="' + j.id + '" value="' + esc(j.name) + '"><input class="amt" inputmode="decimal" data-nomic aria-label="Amount for ' + esc(j.name) + '" data-plan="' + j.id + '" value="' + j.plan + '" oninput="planTotals()"></div>'; }).join('');
  openSheet('<h3>Plan the month</h3><p class="sub">Start with what comes in. Give first. Then give every dollar a place.</p>'
    + '<label for="plInc">What comes in this month</label><input id="plInc" class="amt" inputmode="decimal" data-nomic value="' + db.income + '" oninput="planTotals()" style="font-weight:900;font-size:20px">'
    + '<div class="stick"><div class="place" id="plLine"></div></div>'
    + rows + '<div class="row" style="margin:8px 0"><button class="b small" onclick="tithe()">🙏 Give = 10% of what comes in</button><button class="b small" onclick="addJar()">＋ Add a jar</button></div>'
    + '<div class="row" style="margin-top:10px"><button class="b primary" id="plSave" onclick="savePlan()">Save the plan</button><button class="b ghost" onclick="closeSheet()">Cancel</button></div>');
  planTotals();
}
function num(v){ v = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(v) ? 0 : v; }
function planTotals(){ var inc = num(document.getElementById('plInc').value), t = 0;
  document.querySelectorAll('[data-plan]').forEach(function(e){ t += num(e.value); }); var d = r2(inc - t), e = document.getElementById('plLine');
  e.className = 'place ' + (!inc && !t ? 'left' : d === 0 ? 'zero' : d > 0 ? 'left' : 'over');
  e.textContent = !inc && !t ? 'Type what comes in this month first.' : d === 0 ? '✓ Every dollar has a jar.' : d > 0 ? money(d) + ' still needs a jar.' : money(-d) + ' too much — take some out.'; }
function tithe(){ var inc = num(document.getElementById('plInc').value); var e = document.querySelector('[data-plan="' + giveJar().id + '"]'); e.value = r2(inc * 0.1); planTotals(); }
function addJar(){ var name = prompt('Name the new jar (for example: Vacation, Doctor, Dog)'); if(!name) return; keepPlanEdits();
  var em = ['🫙','🐶','🏖','🩺','🎓','🛠','🎁','📚'][db.jars.length % 8];
  db.jars.push({ id:uid(), name:name.trim(), em:em, plan:0, color:COLORS[db.jars.length % COLORS.length] }); save(); openPlan(); }
function keepPlanEdits(){ db.income = r2(num(document.getElementById('plInc').value));
  document.querySelectorAll('[data-plan]').forEach(function(e){ jar(e.getAttribute('data-plan')).plan = r2(num(e.value)); });
  document.querySelectorAll('[data-name]').forEach(function(e){ var v = e.value.trim(); if(v) jar(e.getAttribute('data-name')).name = v; }); }
function savePlan(){ keepPlanEdits(); save(); closeSheet(); render(); var d = r2(db.income - planned()); toast(d === 0 ? 'Plan saved · every dollar has a jar' : 'Plan saved'); }

/* talk it over: a plain summary to text a husband or wife, or print for the kitchen table */
function summary(){ var L = ['Our jars — ' + monthName(db.month), ''];
  db.jars.forEach(function(j){ var l = leftIn(j.id); L.push(j.em + ' ' + j.name + ': ' + (l < 0 ? 'over by ' + money(-l) : money(l) + ' left of ' + money(inJar(j.id)))); });
  L.push(''); L.push('Came in ' + money(cameIn()) + ' of ' + money(db.income) + ' · spent ' + money(spentAll()));
  L.push('Given this year: ' + money(givenThisYear())); L.push(''); L.push('— from Jar by Jar'); return L.join('\n'); }
function openTalk(){ openSheet('<h3>Talk it over</h3><p class="sub">Send this to your husband or wife, or print it for the kitchen table. Nothing is sent unless you send it.</p>'
  + '<div class="note" id="talkNote">' + esc(summary()) + '</div>'
  + '<div class="row" style="margin-top:12px"><button class="b primary" onclick="shareIt()">Send it</button><button class="b" onclick="printIt()">🖨 Print</button><button class="b ghost" onclick="closeSheet()">Close</button></div>'); }
function shareIt(){ var t = summary(); if(navigator.share){ navigator.share({ text:t }).catch(function(){}); } else { location.href = 'sms:?&body=' + encodeURIComponent(t); } }
function printIt(){ var h = '<h2>Jar by Jar — ' + esc(monthName(db.month)) + '</h2><table><tr><th>Jar</th><th class="n">Planned</th><th class="n">Spent</th><th class="n">Left</th></tr>'
  + db.jars.map(function(j){ return '<tr><td>' + esc(j.em + ' ' + j.name) + '</td><td class="n">' + money(inJar(j.id)) + '</td><td class="n">' + money(spentIn(j.id)) + '</td><td class="n">' + money(leftIn(j.id)) + '</td></tr>'; }).join('')
  + '</table><p>Came in ' + money(cameIn()) + ' of ' + money(db.income) + '. Given this year: ' + money(givenThisYear()) + '.</p>';
  document.getElementById('printable').innerHTML = h; window.print(); }

function openGiving(){ var y = db.month.slice(0,4), rows = db.past.filter(function(p){ return p.month.slice(0,4) === y; });
  openSheet('<h3>🙏 Giving this year</h3><p class="sub">Everything that came out of the ' + esc(giveJar().name) + ' jar in ' + y + '. Handy at tax time.</p>'
    + '<div class="display" style="color:var(--ok)">' + money(givenThisYear()) + '</div>'
    + '<ul class="list">' + rows.map(function(p){ return '<li><span>' + monthName(p.month) + '</span><span class="amt">' + money(p.given) + '</span></li>' + (p.gifts || []).map(function(g){ return '<li style="font-size:15px;opacity:.85"><span>&nbsp;&nbsp;' + esc(shortDate ? shortDate(g.d) : g.d) + (g.note ? ' · ' + esc(g.note) : '') + '</span><span class="amt">' + money(g.amt) + '</span></li>'; }).join(''); }).join('')
    + '<li><span><b>' + monthName(db.month) + '</b> (so far)</span><span class="amt">' + money(spentIn(giveJar().id)) + '</span></li></ul>'
    + '<div class="row" style="margin-top:12px"><button class="b ghost" onclick="closeSheet()">Close</button></div>'); }

/* a new month: leftovers stay in their jars, or sweep into savings */
function openNewMonth(){ var left = r2(db.jars.slice(1).reduce(function(a,j){ return a + Math.max(0, leftIn(j.id)); },0));
  var sv = db.jars.filter(function(j){ return /sav/i.test(j.name); })[0];
  openSheet('<h3>Start next month</h3><p class="sub">Your plan carries over. ' + (db.fill==='came' ? 'The jars fill again as money comes in.' : 'The jars fill back up to plan.') + ' What’s left this month: <b>' + money(left) + '</b>.</p>'
    + '<button class="b primary" style="width:100%;min-height:56px" onclick="newMonth(\'keep\')">Keep leftovers in their jars</button>'
    + (sv ? '<button class="b" style="width:100%;min-height:56px;margin-top:8px" onclick="newMonth(\'sweep\')">Put all leftovers in ' + esc(sv.em + ' ' + sv.name) + '</button>' : '')
    + '<div class="row" style="margin-top:10px"><button class="b ghost" onclick="closeSheet()">Not yet</button></div>'); }
function newMonth(how){ var sv = db.jars.filter(function(j){ return /sav/i.test(j.name); })[0], sweep = 0;
  /* Overnight B, 26 Nov 2026 (envelope apps carry every envelope forward): giving set aside but not yet given used to vanish
     at month end, and each gift's date and note were wiped. Now the Give jar keeps what is left for giving (never swept into
     savings), and every gift is kept by month, so the year's giving list is there at tax time. */
  var gj = giveJar(); db.past.push({ month:db.month, given:spentIn(gj.id), spent:spentAll(), came:cameIn(), gifts:db.outs.filter(function(o){ return o.jar === gj.id; }).map(function(o){ return { d:o.d, amt:o.amt, note:o.note || '' }; }) });
  var carry = {}; db.jars.forEach(function(j, i){ var l = leftIn(j.id); if(i === 0){ carry[j.id] = l; return; }
    if(how === 'sweep' && sv && j.id !== sv.id){ sweep += Math.max(0, l); carry[j.id] = Math.min(0, l); } else carry[j.id] = l; });
  if(sv && how === 'sweep') carry[sv.id] = r2((carry[sv.id]||0) + sweep);
  db.jars.forEach(function(j){ j.carry = r2(carry[j.id] || 0); });
  var p = db.month.split('-'), d = new Date(+p[0], +p[1], 1); db.month = monthKey(d); db.ins = []; db.outs = []; db.moves = [];
  save(); closeSheet(); render(); toast('Welcome to ' + monthName(db.month)); }

function openSettings(){ openSheet('<h3>Settings</h3>'
  + '<label for="curSel">Money</label><select id="curSel" onchange="db.cur=this.value;save();render()">' + ['$','KSh','£','€'].map(function(c){ return '<option' + (db.cur===c?' selected':'') + '>' + c + '</option>'; }).join('') + '</select>'
  + '<label for="fillSel" style="margin-top:12px">How the jars fill</label><select id="fillSel" onchange="db.fill=this.value;save();render()"><option value="came"' + (db.fill==='came'?' selected':'') + '>As money comes in (only spend what you have)</option><option value="plan"' + (db.fill!=='came'?' selected':'') + '>Straight to the plan</option></select>'
  + '<p class="small" style="color:var(--soft);font-size:14px">Everything you put in Jar by Jar stays on this phone. There is no account and no bank login, so nobody else can see it — not even us.</p>'
  + '<div class="row" style="margin-top:10px"><button class="b" onclick="if(confirm(\'Clear every jar and start again?\')){ localStorage.removeItem(KEY); db=null; closeSheet(); render(); }">Start over</button><button class="b ghost" onclick="closeSheet()">Close</button></div>'); }

/* ── first open ── */
function startOwn(){ db = blank(); var J = [['Give','🙏'],['Save','🏦'],['House','🏠'],['Groceries','🛒'],['Bills','💡'],['Car & gas','⛽'],['Pocket money','👛']];
  db.jars = J.map(function(x, i){ return { id:uid(), name:x[0], em:x[1], plan:0, color:COLORS[i] }; }); save(); render(); openPlan(); }
function exampleData(){ var db = blank(); db.ex = true; db.fill = 'plan'; var now = new Date(), tday = now.getDate();
  var J = [['Give','🙏',485],['Save','🏦',300],['House','🏠',1450],['Groceries','🛒',760],['Bills','💡',640],['Car & gas','⛽',420],['Christmas','🎄',250],['Kids','🧒',200],['Eating out','🍔',120],['Pocket money','👛',225]];
  db.jars = J.map(function(x, i){ return { id:'j' + i, name:x[0], em:x[1], plan:x[2], color:COLORS[i] }; });
  db.income = 4850;
  function dd(n){ n = Math.min(n, tday); return monthKey(now) + '-' + String(n).padStart(2,'0'); }
  db.ins = [{ id:uid(), d:dd(1), amt:2425, note:'Paycheck' }];
  var S = [[0,2,120,'Sunday offering'],[0,5,25,'Shoebox for a child'],[0,9,120,'Sunday offering'],[1,1,300,'To the savings account'],[2,1,1450,'House payment'],
    [3,2,142.18,'Kroger'],[3,6,88.40,'Aldi'],[3,9,131.75,'Kroger'],[3,12,164.30,'Costco'],[4,3,138.22,'Electric'],[4,5,95,'Phones'],[4,10,162,'Car insurance'],
    [5,4,48.10,'Gas'],[5,8,64.99,'Oil change'],[5,11,51.36,'Gas'],[6,7,86.50,'Grandkids’ gifts'],[7,3,15,'Field trip'],[7,8,54.99,'School shoes'],
    [8,1,32.40,'Pizza night'],[8,8,58.75,'Lunch after church'],[8,12,9.80,'Coffee with Mom'],[9,6,25,'Haircut'],[9,10,37.80,'Hardware store']];
  db.outs = S.map(function(s){ return { id:uid(), d:dd(s[1]), amt:s[2], jar:'j' + s[0], note:s[3] }; }).sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  var y = now.getFullYear(), G = [470,470,495,495,495,495,520,495,495,495];
  for(var m = 0; m < now.getMonth(); m++) db.past.push({ month:y + '-' + String(m+1).padStart(2,'0'), given:G[m % G.length], spent:4700, came:4850 });
  return db; }
function startExample(){ db = exampleData(); save(); render(); toast('This is the Walker family’s month. Tap any jar.'); }
function leaveExample(){ if(!confirm('Put the example family away and start your own month?')) return; try{ localStorage.removeItem(KEY); }catch(e){} db = null; startOwn(); }

/* For the store's videos (shop/watch.html): show the example family without touching anyone's
   real month. The player's tourSet() keeps the example in a layer over this window's storage,
   so nothing the video does is ever saved to the phone. */
function videoReady(){
  ['djTour','djHello','djMenu','djA2HS'].forEach(function(i){ var e = document.getElementById(i); if(e) e.remove(); });
  if(!db || !db.ex){ var d = exampleData(); try{ if(parent !== window && parent.tourSet) parent.tourSet(KEY, JSON.stringify(d)); }catch(e){} db = load(); if(!db || !db.ex) db = d; }
  closeSheet(); render(); window.scrollTo(0,0);
}

render();
