<script>
/* Trip Tab v0.1 — one phone keeps the tab for a group trip. No server, no account, no shared room.
   Everything lives in localStorage under one key. Money is kept in whole cents so balances always sum to zero.
   The name lives in APP_NAME (and in manifest.webmanifest) — change it there.
   v0.2 · 20 Nov: ← Back from Start a new trip to All my trips (house v68 djBack). */
var APP_NAME = 'Trip Tab', VERSION = 'v0.2', VDATE = '2026-11-20';
var KEY = 'dj_triptab_v1'; window.DJ_OWNS = { k:[KEY], p:['dj_triptab_'] };   /* every name this app writes, so the house Start fresh finds them */
var TOUR = /[?&]tour=1(&|$)/.test(location.search);   /* the store's camera: an invented example, in memory only */
var EX = false;   /* true while an example trip is on screen: nothing is saved */
var db = TOUR ? exampleDB() : (load() || blank());
if(TOUR) EX = true;

(function nameIt(){ document.title = APP_NAME;
  document.getElementById('appName').textContent = APP_NAME;
  document.querySelectorAll('.nameHere').forEach(function(e){ e.textContent = APP_NAME; });
  document.getElementById('ver').textContent = APP_NAME + ' ' + VERSION + ' · ' + VDATE + ' · Daraja Studio · Free. No account. Everything stays on this phone.';
  var m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(m) m.content = APP_NAME; })();

function blank(){ return { v:1, open:null, trips:[] }; }
function load(){ try{ var s = localStorage.getItem(KEY); if(s){ var d = JSON.parse(s); if(d && d.trips) return d; } }catch(e){} return null; }
function save(){ if(EX) return; try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ alert('This phone would not save that. Nothing was lost on screen — try again in a moment.'); } }
function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shortDate(d){ var p = d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('en-US',{ month:'short', day:'numeric' }); }
function toCents(v){ v = parseFloat(String(v == null ? '' : v).replace(/[^0-9.]/g,'')); return isNaN(v) ? 0 : Math.round(v * 100); }
function money(c, t){ t = t || trip(); var cur = t ? t.cur : '$'; var neg = c < 0; c = Math.abs(c);
  var whole = c % 100 === 0, s = (c/100).toLocaleString('en-US',{ minimumFractionDigits: whole?0:2, maximumFractionDigits:2 });
  return (neg ? '−' : '') + (cur === 'KSh' ? 'KSh ' : cur) + s; }
function plain(c){ return (c % 100 === 0) ? String(c/100) : (c/100).toFixed(2); }
var AV = ['#9CC3D9','#E0B04A','#E79A7E','#A7C77E','#B9A6D6','#F0C27B','#8FB3B0','#D9A3B8','#C9B48A','#9FB6E0'];

function trip(){ if(!db || !db.open) return null; for(var i=0;i<db.trips.length;i++) if(db.trips[i].id===db.open) return db.trips[i]; return null; }
function person(t, id){ for(var i=0;i<t.people.length;i++) if(t.people[i].id===id) return t.people[i]; return { id:id, name:'?' }; }
function pname(t, id){ return person(t, id).name; }
function pidx(t, id){ for(var i=0;i<t.people.length;i++) if(t.people[i].id===id) return i; return 0; }

/* ── the sums: who owes what ── */
/* a cost's shares, in cents, person id → cents. Equal splits hand the odd cents to the first people in the list. */
function sharesOf(t, x){
  var out = {};
  if(x.type === 'custom'){ Object.keys(x.shares||{}).forEach(function(k){ if(x.shares[k]) out[k] = x.shares[k]; }); return out; }
  var among = x.type === 'some' ? t.people.filter(function(p){ return x.among.indexOf(p.id) > -1; }).map(function(p){ return p.id; }) : t.people.map(function(p){ return p.id; });
  if(!among.length) return out;
  /* Overnight B, 26 Nov (Settle Up's family weights): a person can count as more than one — "the Smiths are 4".
     Shares follow the weights; the odd cents go to the biggest leftover fractions first, so the parts always add up exactly. */
  var W = among.map(function(id){ return wOf(t, id); }), tw = W.reduce(function(a,b){ return a + b; }, 0);
  if(tw <= 0){ W = among.map(function(){ return 1; }); tw = among.length; }
  var given = 0, fr = among.map(function(id, i){ var ex = x.amt * W[i] / tw, f = Math.floor(ex + 1e-9); out[id] = f; given += f; return { id:id, r:ex - f, i:i }; });
  fr.sort(function(a,b){ return (b.r - a.r) || (a.i - b.i); });
  for(var k = 0; given < x.amt && k < fr.length * 2; k++){ out[fr[k % fr.length].id] += 1; given++; }
  return out;
}
function wOf(t, id){ var p = person(t, id); var w = p && +p.w; return w > 0 ? w : 1; }
function weighted(t){ return t.people.some(function(p){ return +p.w > 0 && +p.w !== 1; }); }
function standing(t){   /* per person: paid, share, and balance (+ gets back, − owes) */
  var S = {}; t.people.forEach(function(p){ S[p.id] = { paid:0, share:0, bal:0 }; });
  t.exps.forEach(function(x){ if(S[x.payer]) S[x.payer].paid += x.amt; var sh = sharesOf(t, x); Object.keys(sh).forEach(function(k){ if(S[k]) S[k].share += sh[k]; }); });
  t.people.forEach(function(p){ S[p.id].bal = S[p.id].paid - S[p.id].share; });
  (t.paid||[]).forEach(function(m){ if(S[m.from]) S[m.from].bal += m.amt; if(S[m.to]) S[m.to].bal -= m.amt; });
  return S;
}
/* the fewest payments that square everyone: biggest debt pays biggest credit, over and over */
function settle(t){
  var S = standing(t), cr = [], dr = [], out = [];
  t.people.forEach(function(p, i){ var b = S[p.id].bal; if(b > 0) cr.push({ id:p.id, c:b, i:i }); else if(b < 0) dr.push({ id:p.id, c:-b, i:i }); });
  var by = function(a,b){ return b.c - a.c || a.i - b.i; };
  while(cr.length && dr.length){
    cr.sort(by); dr.sort(by);
    var c = cr[0], d = dr[0], x = Math.min(c.c, d.c);
    out.push({ from:d.id, to:c.id, amt:x });
    c.c -= x; d.c -= x;
    if(!c.c) cr.shift(); if(!d.c) dr.shift();
  }
  return out;
}
function spent(t){ return t.exps.reduce(function(a,x){ return a + x.amt; }, 0); }

/* ── the main screen ── */
function render(){
  var main = document.getElementById('main'), bar = document.getElementById('bar'), t = trip();
  if(!t){ bar.style.display = 'none'; main.innerHTML = db.trips.length ? tripsHTML(true) : welcomeHTML(); return; }
  bar.style.display = '';
  var S = standing(t), sq = t.people.every(function(p){ return S[p.id].bal === 0; });
  var h = (EX ? '<div class="card exnote" id="exNote"><span>👀 This is an example trip. Try anything — nothing here is saved.</span><button class="b primary" id="ownBtn" onclick="leaveExample()">Start my own trip</button></div>' : '')
    + (t.done ? '<div class="card exnote"><span>✅ This trip is finished. It is kept here so you can look back.</span><button class="b" onclick="reopenTrip()">Open it again</button></div>' : '')
    + '<div class="card"><div class="tripTop"><div><h2 id="tripName">' + esc(t.name) + '</h2>'
    + '<div class="meta">' + t.people.length + ' people · ' + t.exps.length + (t.exps.length === 1 ? ' cost' : ' costs') + ' · ' + money(spent(t)) + ' spent</div></div>'
    + '<button class="b small" onclick="openTrip()" aria-label="Change the trip name, people or money">✏️ Edit trip</button></div></div>';
  h += '<div class="card" id="balances"><h3>Where everyone stands</h3><p class="meta">Green gets money back. Red owes.</p><ul class="people">' + t.people.map(function(p, i){ var s = S[p.id];
      var st = s.bal > 0 ? '<span class="st gets">gets back<br>' + money(s.bal) + '</span>' : s.bal < 0 ? '<span class="st owes">owes<br>' + money(-s.bal) + '</span>' : '<span class="st even">all square ✓</span>';
      return '<li data-person="' + p.id + '"><span class="av" style="background:' + AV[i % AV.length] + '">' + esc(p.name.charAt(0).toUpperCase()) + '</span>'
        + '<div><div class="nm">' + esc(p.name) + '</div><div class="sm">paid ' + money(s.paid) + ' · share ' + money(s.share) + '</div></div>' + st + '</li>'; }).join('') + '</ul>'
    + (t.exps.length && sq ? '<div class="square">✓ Everyone is square. Nobody owes anything.</div>' : '')
    + (!sq ? '<button class="b primary full" style="margin-top:10px" onclick="openSettle()">🤝 Who pays who</button>' : '') + '</div>';
  var rows = t.exps.slice().reverse().map(function(x){
      return '<li><button data-cost="' + x.id + '" onclick="openAdd(\'' + x.id + '\')"><div><div class="w">' + esc(x.what || 'A cost') + '</div><div class="by">' + esc(pname(t, x.payer)) + ' paid · ' + esc(splitWords(t, x)) + ' · ' + shortDate(x.d) + (x.cur && x.amtOrig ? ' · paid ' + esc(x.cur === 'KSh' ? 'KSh ' : x.cur) + plain(x.amtOrig) + ' at ' + x.rate : '') + '</div></div><span class="amt">' + money(x.amt) + '</span></button></li>'; });
  var paidRows = (t.paid||[]).slice().reverse().map(function(m){

/* ── the quick line: "Jerry paid 140 dinner split 4". No AI — a few plain rules, and it shows what it understood. ── */
function findPeople(t, s){   /* names in s, in the order they are written */
  var hits = [];
  t.people.forEach(function(p){ var nm = p.name.toLowerCase(), first = nm.split(/\s+/)[0], low = ' ' + s.toLowerCase().replace(/[^a-z0-9À-ɏ' ]/g, ' ') + ' ';
    var i = low.indexOf(' ' + nm + ' '); if(i < 0) i = low.indexOf(' ' + first + ' '); if(i > -1) hits.push({ id:p.id, at:i }); });
  return hits.sort(function(a,b){ return a.at - b.at; }).map(function(h){ return h.id; });
}
function parseLine(t, s){

  var am = /(?:ksh|kes|\$|£|€)?\s?(\d[\d,]*(?:\.\d{1,2})?)\s?(k\b)?(?:\s?(?:dollars|bucks|shillings|bob|pounds|euros))?/i.exec(rest);
  if(am){ r.amt = toCents(am[1].replace(/,/g,'')) * (am[2] ? 1000 : 1); rest = (rest.slice(0, am.index) + ' ' + rest.slice(am.index + am[0].length)).trim(); }
  var sp = /\b(split|shared|divided|between|among|with|for everyone|for all)\b(.*)$/i.exec(rest), clause = '';
  if(sp){ clause = sp[0]; rest = rest.slice(0, sp.index).trim(); }
  r.what = rest.replace(/^(for|on|the)\s+/i, '').replace(/\s+(for|on)$/i, '').trim();
  if(r.what) r.what = r.what.charAt(0).toUpperCase() + r.what.slice(1);
  if(clause){
    var named = findPeople(t, clause), n = /(\d+)/.exec(clause);
    if(named.length){ r.type = 'some'; r.among = named.slice(); if(/\bwith\b/i.test(clause) && r.payer && r.among.indexOf(r.payer) < 0) r.among.unshift(r.payer); }
    else if(n){ n = +n[1];
      if(n >= t.people.length){ r.type = 'equal'; if(n > t.people.length) r.note = 'There are only ' + t.people.length + ' people on this trip, so it is split among everyone.'; }
      else { r.type = 'some'; var start = r.payer ? pidx(t, r.payer) : 0; for(var i = 0; i < n; i++) r.among.push(t.people[(start + i) % t.people.length].id);
        r.note = 'Split ' + n + ' ways — check who shares it, and tap to change.'; } }
  }
  if(r.type === 'some' && r.among.length === t.people.length) r.type = 'equal';
  return r;
}
function readLine(){
  var t = trip(), s = document.getElementById('qLine').value, r = parseLine(t, s), saw = document.getElementById('qSaw');
  if(!s.trim()){ saw.className = 'saw bad'; saw.textContent = 'Type a line first, like: ' + t.people[0].name + ' paid 140 dinner split ' + t.people.length; return; }
  if(r.payer) setPayer(r.payer);
  if(r.amt) document.getElementById('amt').value = plain(r.amt);
  if(r.what) document.getElementById('what').value = r.what;
  F.among = r.type === 'some' ? r.among.slice() : t.people.map(function(p){ return p.id; }); setType(r.type);
  var miss = []; if(!r.payer) miss.push('who paid'); if(!r.amt) miss.push('how much');
  var split = r.type === 'some' ? 'split by ' + listWords(r.among.map(function(id){ return pname(t, id); })) : 'split equally among everyone (' + t.people.length + ')';
  saw.className = 'saw' + (miss.length ? ' bad' : '');
  saw.innerHTML = miss.length ? 'I couldn’t tell ' + listWords(miss) + '. Please fill ' + (miss.length > 1 ? 'those' : 'that') + ' in below.'
    : 'Here’s what I understood: <b>' + esc(pname(t, r.payer)) + '</b> paid <b>' + money(r.amt) + '</b>' + (r.what ? ' for <b>' + esc(r.what.toLowerCase()) + '</b>' : '') + ', ' + esc(split) + '. ' + (r.note ? esc(r.note) + ' ' : '') + 'Check it below, then tap <b>Add it</b>.';
}

/* ── settle up: the fewest payments, to send to the group ── */
function settleText(t){ var P = settle(t), L = [t.name + ' — settle up', ''];
  if(!P.length) L.push('Everyone is square. Nobody owes anything.'); else P.forEach(function(p){ L.push(pname(t, p.from) + ' pays ' + pname(t, p.to) + ' ' + money(p.amt)); });
  L.push(''); L.push('Spent on the trip: ' + money(spent(t)) + ' (' + t.exps.length + (t.exps.length === 1 ? ' cost' : ' costs') + ')'); L.push('— kept in ' + APP_NAME); return L.join('\n'); }
function openSettle(){ var t = trip(), P = settle(t), txt = settleText(t), body = encodeURIComponent(txt);
  openSheet('<h3>🤝 Settle up</h3><p class="sub">' + (P.length ? 'The fewest payments that square everyone. When one is paid, tap <b>Paid</b>.' : 'Nobody owes anything.') + '</p>'
    + (P.length ? '<ul class="pays" id="pays">' + P.map(function(p, i){ return '<li data-pay="' + i + '"><span><b>' + esc(pname(t, p.from)) + '</b> pays <b>' + esc(pname(t, p.to)) + '</b></span><span class="amt">' + money(p.amt) + '</span><button class="b small primary" data-paid="' + i + '" onclick="markPaid(' + i + ')">✓ Paid</button></li>'; }).join('') + '</ul>'
      : '<div class="square" id="pays">✓ Everyone is square.</div>')
    + '<div class="note" id="settleNote">' + esc(txt) + '</div>'
    + '<div class="row" style="margin-top:12px"><button class="b primary" id="copyBtn" onclick="copySettle()">📋 Copy the settle-up</button></div>'
    + '<div class="row" style="margin-top:8px"><a class="b" id="smsBtn" href="sms:?&body=' + body + '">📨 Text it</a><a class="b wa" id="waBtn" href="https://wa.me/?text=' + body + '">💬 Send on WhatsApp</a></div>'
    + '<div class="row" style="margin-top:8px"><button class="b" id="anyPayBtn" onclick="openAnyPay()">＋ Record a payment of any amount</button></div>'
    + ((t.paid||[]).length ? '<div class="lab">Already paid</div><ul class="pays">' + t.paid.slice().reverse().map(function(m){ return '<li class="done"><span>✓ ' + esc(pname(t, m.from)) + ' paid ' + esc(pname(t, m.to)) + ' · ' + shortDate(m.d) + '</span><span class="amt">' + money(m.amt) + '</span><button class="b small ghost" onclick="undoPaid(\'' + m.id + '\')">Undo</button></li>'; }).join('') + '</ul>' : '')
    + '<div class="row" style="margin-top:12px"><button class="b ghost" onclick="closeSheet()">Close</button></div>');
}
function markPaid(i){ var t = trip(), p = settle(t)[i]; if(!p) return;
  t.paid = t.paid || []; t.paid.push({ id:uid(), from:p.from, to:p.to, amt:p.amt, d:today() }); save(); render(); openSettle();
  toast(pname(t, p.from) + ' paid ' + pname(t, p.to) + ' ' + money(p.amt) + ' ✓'); }
/* Overnight B, 26 Nov (Splitwise / Settle Up): settling happens in pieces — "Tom paid Maya $50 of the $120".
   Any amount between any two people goes into t.paid, which standing() already counts; Settle up then shows what is left. */
function openAnyPay(){ var t = trip(), P = settle(t), p0 = P[0] || {}, opts = function(sel){ return t.people.map(function(p){ return '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join(''); };
  openSheet('<h3>Record a payment</h3><p class="sub">Money one person gave another, any amount. What is left to settle updates by itself.</p>'
    + '<label for="apFrom">Who paid</label><select id="apFrom">' + opts(p0.from) + '</select>'
    + '<label for="apTo">Who got it</label><select id="apTo">' + opts(p0.to) + '</select>'
    + '<label for="apAmt">How much (' + esc(t.cur) + ')</label><input id="apAmt" inputmode="decimal" autocomplete="off" placeholder="' + (p0.amt ? plain(p0.amt) : '50') + '">'
    + '<div class="row" style="margin-top:16px"><button class="b primary" onclick="saveAnyPay()">✓ Save this payment</button><button class="b ghost" onclick="openSettle()">Back to settle up</button></div>');
}
function saveAnyPay(){ var t = trip(), f = document.getElementById('apFrom').value, to = document.getElementById('apTo').value, c = toCents(document.getElementById('apAmt').value);
  if(f === to){ toast('Pick two different people.'); return; } if(!(c > 0)){ toast('Type how much was paid.'); return; }
  t.paid = t.paid || []; t.paid.push({ id:uid(), from:f, to:to, amt:c, d:today() }); save(); render(); openSettle(); toast(pname(t, f) + ' paid ' + pname(t, to) + ' ' + money(c) + ' ✓'); }
function undoPaid(id){ var t = trip(); t.paid = t.paid.filter(function(m){ return m.id !== id; }); save(); render(); openSettle(); }
function copySettle(){ var txt = settleText(trip()), done = function(){ toast('Copied. Paste it in the group chat.'); };
  var fall = function(){ var a = document.createElement('textarea'); a.value = txt; a.setAttribute('readonly',''); a.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy — press on the words above to copy them.'); } a.remove(); };
  try{ if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fall); else fall(); }catch(e){ fall(); } }

/* ── the example trip: invented people, in memory only ── */
function exampleDB(){
  var d = blank(), P = [['p1','Maya'],['p2','Tom'],['p3','Grace'],['p4','Sam']].map(function(x){ return { id:x[0], name:x[1] }; });
  var day = today();
  var X = [['p1',64000,'The cabin','equal'],['p2',18640,'Groceries','equal'],['p3',7200,'Gas for the drive','some',['p2','p3']],
           ['p4',21200,'Dinner at the lodge','equal'],['p4',15000,'Boat rental','custom',null,{p1:3000,p2:6000,p3:3000,p4:3000}],['p2',2400,'Firewood and ice','equal']];

/* ── 💾 Save a copy / 📂 Bring a copy back (the house ? sheet finds these by #djBackup) ── */
(function(){
  function stamp(){ return (window.djYMD ? djYMD() : new Date().toISOString().slice(0,10)); }
  function saveCopy(){
    var v = null; try{ v = localStorage.getItem(KEY); }catch(e){}
    if(!v){ alert('Nothing saved in ' + APP_NAME + ' yet.'); return; }
    var body = JSON.stringify({ app:APP_NAME, when:stamp(), data:{ [KEY]:v } }, null, 1), name = APP_NAME + ' — copy ' + stamp() + '.json', file;
    try{ file = new File([body], name, { type:'application/json' }); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files:[file] })){ navigator.share({ files:[file], title:name }).catch(function(){}); return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type:'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 1000);
  }
  function bringBack(){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.id = 'djRestoreFile'; inp.style.display = 'none'; document.body.appendChild(inp);
    inp.onchange = function(){ var f = inp.files[0]; if(!f) return; var r = new FileReader(); r.onload = function(){ try{
        var j = JSON.parse(r.result), v = j && j.data && j.data[KEY], d = v && JSON.parse(v); if(!d || !d.trips) throw 0;
        if(!confirm('Bring back the copy from ' + (j.when || '?') + '? It replaces what is in ' + APP_NAME + ' on this phone.')) return;
        localStorage.setItem(KEY, v); location.reload();
      }catch(e){ alert('That file is not a ' + APP_NAME + ' copy.'); } inp.remove(); }; r.readAsText(f); };
    inp.click();
  }
  window.djTripSaveCopy = saveCopy; window.djTripBringBack = bringBack;
  function add(){
    if(document.getElementById('djBackup')) return;
    var box = document.createElement('p'); box.id = 'djBackup'; box.style.cssText = 'text-align:center;margin:14px 0 6px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap';
    var b1 = document.createElement('button'); b1.type = 'button'; b1.textContent = '💾 Save a copy'; b1.onclick = saveCopy;
    var b2 = document.createElement('button'); b2.type = 'button'; b2.textContent = '📂 Bring a copy back'; b2.onclick = bringBack;
    [b1, b2].forEach(function(b){ b.style.cssText = 'font:inherit;font-weight:700;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer'; box.appendChild(b); });
    var f = document.querySelector('.foot'); f.parentNode.insertBefore(box, f);
  }
  add();
})();

render();
