<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Draft War Room</title>
<style>
  :root{ --bg:#F4F6F4; --card:#fff; --card2:#EDF0EC; --ink:#1C2420; --soft:#5E6B62; --faint:#8C958F;
         --navy:#1F3A52; --navy-soft:#1F3A5216; --court:#B3502F; --court-soft:#B3502F1A;
         --grass:#3E9B6A; --grass-soft:#3E9B6A1C; --gold:#C9982A; --gold-soft:#C9982A22;
         --bad:#B4352E; --bad-soft:#B4352E1C; --line:#E2E7E1; --line2:#C9D0C7; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
         --bg:#161A17; --card:#20261F; --card2:#2A312A; --ink:#EDF1EC; --soft:#9AA79C; --faint:#7C857F;
         --navy:#7FA8CC; --navy-soft:#7FA8CC22; --court:#E08A66; --court-soft:#E08A6622;
         --grass:#6DC296; --grass-soft:#6DC29622; --gold:#E8B24A; --gold-soft:#E8B24A22;
         --bad:#E8685F; --bad-soft:#E8685F22; --line:#333B33; --line2:#45504F; } }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45; padding-bottom:96px; }
  header{ background:var(--navy); color:#fff; padding:12px 14px 14px; position:sticky; top:0; z-index:30; }
  header .top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1{ font-size:17px; font-weight:800; letter-spacing:.01em; }
  header h1 small{ display:block; font-size:11px; font-weight:600; opacity:.75; letter-spacing:.04em; text-transform:uppercase; }
  .clock{ text-align:right; }
  .clock .big{ font-size:24px; font-weight:800; line-height:1.05; }
  .clock .lbl{ font-size:10.5px; font-weight:700; opacity:.8; text-transform:uppercase; letter-spacing:.06em; }
  .onclock{ margin-top:9px; background:rgba(255,255,255,.14); border-radius:11px; padding:8px 11px; font-size:13px; font-weight:700; display:flex; justify-content:space-between; gap:8px; }
  .onclock.you{ background:var(--court); }
  main{ max-width:660px; margin:0 auto; padding:12px 13px; }
  .view{ display:none; } .view.on{ display:block; }
  .alert{ background:var(--bad); color:#fff; border-radius:12px; padding:10px 13px; font-size:13.5px; font-weight:700; margin-bottom:10px; }
  .alert.warn{ background:var(--gold); color:#2A2418; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:15px; padding:13px 14px; margin-bottom:11px; }
  .card h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:800; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .rec{ border:2px solid var(--court); }
  .rec .pick{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .rec .pick b{ font-size:23px; font-weight:800; line-height:1.15; }
  .rec .why{ font-size:13.5px; color:var(--soft); margin-top:6px; }
  .rec .backs{ margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .rec .backs div{ font-size:14px; padding:3px 0; display:flex; gap:7px; align-items:baseline; }
  .rec .backs span.n{ color:var(--faint); font-weight:800; font-size:12px; width:16px; flex:none; }
  .pos{ font-size:10.5px; font-weight:800; letter-spacing:.05em; border-radius:999px; padding:2px 7px; flex:none; }
  .pos.QB{ background:var(--court-soft); color:var(--court); } .pos.RB{ background:var(--grass-soft); color:var(--grass); }
  .pos.WR{ background:var(--navy-soft); color:var(--navy); } .pos.TE{ background:var(--gold-soft); color:var(--gold); }
  .pos.K,.pos.DST{ background:var(--card2); color:var(--soft); }
  .rowp{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
  .rowp:first-of-type{ border-top:none; }
  .rowp .rk{ font-size:12px; font-weight:800; color:var(--faint); width:30px; flex:none; text-align:right; }
  .rowp .nm{ flex:1; min-width:0; font-size:15px; font-weight:700; line-height:1.2; }
  .rowp .nm i{ display:block; font-style:normal; font-size:11.5px; font-weight:600; color:var(--soft); margin-top:1px; }
  .rowp button{ font:inherit; font-size:11.5px; font-weight:800; border-radius:9px; padding:7px 9px; border:1px solid var(--line2); background:var(--card2); color:var(--ink); cursor:pointer; flex:none; }
  .rowp button.mine{ background:var(--grass); color:#fff; border-color:var(--grass); }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chips button{ font:inherit; font-size:12.5px; font-weight:800; border-radius:999px; padding:7px 12px; border:1px solid var(--line2); background:var(--card); color:var(--soft); cursor:pointer; }
  .chips button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:7px; }
  .slot{ background:var(--card2); border-radius:11px; padding:8px 10px; font-size:13.5px; }
  .slot b{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
  .slot.empty{ background:var(--bad-soft); } .slot.empty span{ color:var(--bad); font-weight:700; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); padding:5px 6px; border-bottom:1px solid var(--line); }
  td{ padding:7px 6px; border-bottom:1px solid var(--line); }
  tr.next td{ background:var(--court-soft); font-weight:800; }
  td.c{ text-align:center; }
  .field{ margin-top:9px; } .field label{ display:block; font-size:11px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .field input,.field select,.field textarea{ width:100%; font:inherit; font-size:16px; padding:9px 11px; border:1px solid var(--line2); border-radius:11px; background:var(--bg); color:var(--ink); }
  .field textarea{ min-height:130px; resize:vertical; font-size:14px; }
  .row{ display:flex; gap:7px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:120px; }
  .btn{ font:inherit; font-weight:800; font-size:14.5px; padding:11px 14px; border-radius:12px; border:none; background:var(--navy); color:#fff; cursor:pointer; width:100%; }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line2); }
  .btn.warn{ background:var(--bad); }
  .log{ font-size:13.5px; }
  .log div{ padding:6px 0; border-top:1px solid var(--line); display:flex; gap:8px; align-items:baseline; }
  .log div:first-child{ border-top:none; }
  .log .n{ font-size:11.5px; font-weight:800; color:var(--faint); width:44px; flex:none; }
  .log .you{ color:var(--grass); font-weight:800; }
  .empty{ color:var(--faint); font-size:13.5px; padding:6px 0; }
  .note{ font-size:12.5px; color:var(--soft); line-height:1.6; }
  nav{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40; }
  nav button{ background:none; border:none; font:inherit; font-size:10.5px; font-weight:800; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 10px; cursor:pointer; }
  nav button .ic{ font-size:20px; line-height:1; } nav button.on{ color:var(--navy); }
  .toast{ position:fixed; left:50%; bottom:104px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; transition:.2s; pointer-events:none; z-index:60; max-width:90vw; text-align:center; }
  .toast.show{ opacity:1; }
  footer{ text-align:center; font-size:11.5px; color:var(--faint); margin-top:16px; line-height:1.6; padding:0 16px; }
  #pwaInstall{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); z-index:50; background:var(--court); color:#fff; border:none; border-radius:999px; padding:10px 17px; font:800 13.5px -apple-system,system-ui,sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.25); display:none; cursor:pointer; }
  #pwaInstall.show{ display:inline-flex; }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Let's Go NPC<small>Newport Cove · war room</small></h1>
    <div class="clock"><div class="big" id="cPick">—</div><div class="lbl" id="cLbl">pick</div></div>
  </div>
  <div class="onclock" id="onclock"><span id="ocLeft">—</span><span id="ocRight"></span></div>
</header>

<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-team"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-log"></section>
  <footer>
    Draft War Room v1.0 · Daraja Studio · runs offline, nothing leaves your phone.<br>
    Rankings and picks are yours — this app never talks to ESPN.
  </footer>
</main>

<nav>
  <button data-v="board" class="on"><span class="ic">📋</span>Board</button>
  <button data-v="team"><span class="ic">🏈</span>My team</button>
  <button data-v="plan"><span class="ic">🗺</span>Plan</button>
  <button data-v="log"><span class="ic">🧾</span>Log</button>
</nav>
<button id="pwaInstall">⬇ Install app</button>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   LEAGUE CONSTANTS — Newport Cove Football, league 75576161
   12 teams · snake · standard scoring (NO PPR)
   Lineup: 1QB 2RB 2WR 1TE 1FLEX 1K 1DST + 7 bench = 16 rounds
   ============================================================ */
const LG = {
  teams: 12,
  rounds: 16,
  starters: [
    {k:'QB',  label:'QB'},  {k:'RB', label:'RB1'}, {k:'RB', label:'RB2'},
    {k:'WR',  label:'WR1'}, {k:'WR', label:'WR2'}, {k:'TE', label:'TE'},
    {k:'FLEX',label:'FLEX'},{k:'K',  label:'K'},   {k:'DST',label:'D/ST'}
  ],
  bench: 7,
  rules: {
    noKDstBeforeRound: 15,   // K/DST only in the last two rounds
    noQBBeforeRound: 6       // wait for the Kyler Murray / Jayden Daniels tier
  }
};
const FLEXOK = ['RB','WR','TE'];

/* ---- Jerry's saved ESPN pre-draft edits (boosts + demotions).
   These are pinned at the exact ranks he set in ESPN. Everything
   else comes from the list he pastes in on the Log tab. ---- */
const PINNED = [
  {rank:7,   name:"Omarion Hampton",     pos:"RB", note:"BOOSTED — auto-take if he's there"},
  {rank:13,  name:"Christian McCaffrey", pos:"RB", note:"DEMOTED — 450-touch bust risk", avoid:1},
  {rank:14,  name:"Brock Bowers",        pos:"TE", note:"BOOSTED — auto-take if he's there"},
  {rank:20,  name:"A.J. Brown",          pos:"WR", note:"BOOSTED — TD volume in standard"},
  {rank:28,  name:"Emeka Egbuka",        pos:"WR", note:"BOOSTED"},
  {rank:42,  name:"Josh Jacobs",         pos:"RB", note:"DEMOTED — age/mileage/suspension. Avoid unless very late", avoid:2},
  {rank:45,  name:"Luther Burden",       pos:"WR", note:"BOOSTED"},
  {rank:61,  name:"Christian Watson",    pos:"WR", note:"BOOSTED — round 8+ upside bench"},
  {rank:75,  name:"Jonathon Brooks",     pos:"RB", note:"BOOSTED — Hubbard hamstring raises his value"},
  {rank:83,  name:"Tucker Kraft",        pos:"TE", note:"BOOSTED — the TE plan if Bowers is gone"},
  {rank:84,  name:"Harold Fannin",       pos:"TE", note:"DEMOTED", avoid:1},
  {rank:96,  name:"Jordan Mason",        pos:"RB", note:"BOOSTED — round 8+ upside bench"},
  {rank:106, name:"KC Concepcion",       pos:"WR", note:"BOOSTED — round 8+ upside bench"},
  {rank:107, name:"Isaiah Likely",       pos:"TE", note:"BOOSTED — round 8+ upside bench"},
  {rank:111, name:"Blake Corum",         pos:"RB", note:"BOOSTED — round 8+ upside bench"},
  {rank:113, name:"Josh Downs",          pos:"WR", note:"BOOSTED — round 8+ upside bench"}
];

/* ============================ STATE ============================ */
const KEY = 'npcWarRoom_v1';
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.board) return r; }catch(e){}
  return { slot:3, board:PINNED.map(p=>({...p, pinned:1})), picks:[], filter:'ALL', overrideRules:0 };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
const norm = n => (n||'').toLowerCase().replace(/[^a-z]/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),1900); }

/* pick number for a round at a given snake slot */
function pickNo(round, slot){ return round%2 ? (round-1)*LG.teams + slot : round*LG.teams - slot + 1; }
function myPickNos(slot){ const a=[]; for(let r=1;r<=LG.rounds;r++) a.push(pickNo(r, slot)); return a; }
function roundOf(n){ return Math.floor((n-1)/LG.teams) + 1; }

function currentPickNo(){ return S.picks.length + 1; }
function currentRound(){ return roundOf(currentPickNo()); }
function myNext(){ return myPickNos(S.slot).find(n => n >= currentPickNo()) || null; }
function myAfterNext(){ const a=myPickNos(S.slot).filter(n => n >= currentPickNo()); return a[1] || null; }
function isMyTurn(){ return myNext() === currentPickNo(); }
function picksUntilMine(){ const n=myNext(); return n===null ? null : n - currentPickNo(); }

const takenSet = () => new Set(S.picks.map(p => norm(p.name)));
function available(){ const t=takenSet(); return S.board.filter(p => !t.has(norm(p.name))).sort((a,b)=>a.rank-b.rank); }
function myRoster(){ return S.picks.filter(p => p.mine); }

/* which starting slots are still empty */
function rosterSlots(){
  const mine = myRoster().slice();
  const out = LG.starters.map(s => ({...s, fill:null}));
  // fill dedicated slots first, in board order
  out.forEach(s => {
    if(s.k === 'FLEX') return;
    const i = mine.findIndex(p => p.pos === s.k);
    if(i > -1){ s.fill = mine[i]; mine.splice(i,1); }
  });
  const f = out.find(s => s.k === 'FLEX');
  const i = mine.findIndex(p => FLEXOK.includes(p.pos));
  if(i > -1){ f.fill = mine[i]; mine.splice(i,1); }
  return { slots: out, bench: mine };
}
function needSet(){
  const {slots} = rosterSlots();
  const need = {};
  slots.filter(s => !s.fill).forEach(s => {
    if(s.k === 'FLEX') FLEXOK.forEach(k => need[k] = Math.max(need[k]||0, 1));
    else need[s.k] = (need[s.k]||0) + 2;
  });
  return need;
}
function countPos(pos){ return myRoster().filter(p => p.pos === pos).length; }

/* rule gate — returns a blocking reason, or '' if the pick is allowed */
function ruleBlock(p, round){
  if(S.overrideRules) return '';
  if((p.pos === 'K' || p.pos === 'DST') && round < LG.rules.noKDstBeforeRound)
    return 'no K/DST before round ' + LG.rules.noKDstBeforeRound;
  if(p.pos === 'QB' && round < LG.rules.noQBBeforeRound && countPos('QB') === 0)
    return 'no QB before round ' + LG.rules.noQBBeforeRound;
  return '';
}

/* will he survive the lap back to me? */
function wontLast(p){ const a = myAfterNext(); return a !== null && p.rank <= a; }

/* recommendation engine */
function rank(list, round){
  const need = needSet();
  const after = myAfterNext();
  return list.map(p => {
    let sc = 400 - p.rank;
    const block = ruleBlock(p, round);
    if(block) sc -= 10000;
    if(need[p.pos]) sc += need[p.pos] * 7;
    if(p.pos === 'K' || p.pos === 'DST'){
      sc += (round >= LG.rules.noKDstBeforeRound && need[p.pos]) ? 260 : -300;
    }
    const have = countPos(p.pos);
    if(have >= 3 && FLEXOK.includes(p.pos)) sc -= 9 * (have - 2);
    if(p.avoid === 2) sc -= 55;           // Jacobs: avoid unless very late
    else if(p.avoid === 1) sc -= 14;      // demoted, still draftable at value
    if(after !== null && p.rank <= after) sc += 9;   // won't survive the lap
    if(p.pinned && !p.avoid) sc += 5;                // Jerry's own boosts
    return {p, sc, block};
  }).sort((a,b) => b.sc - a.sc);
}

/* positional run over the last 8 picks */
function runWarning(){
  const last = S.picks.slice(-8);
  if(last.length < 5) return null;
  const c = {};
  last.forEach(p => c[p.pos] = (c[p.pos]||0) + 1);
  const hot = Object.keys(c).filter(k => FLEXOK.includes(k) || k === 'QB').sort((a,b)=>c[b]-c[a])[0];
  if(hot && c[hot] >= 4) return { pos:hot, n:c[hot] };
  return null;
}

/* ============================ RENDER ============================ */
function renderHeader(){
  const n = currentPickNo(), r = currentRound(), mine = isMyTurn(), away = picksUntilMine();
  $('#cPick').textContent = n <= LG.teams*LG.rounds ? ('#'+n) : '—';
  $('#cLbl').textContent  = n <= LG.teams*LG.rounds ? ('round ' + r) : 'draft over';
  const oc = $('#onclock');
  oc.classList.toggle('you', mine);
  if(mine){ $('#ocLeft').textContent = "🔥 YOU'RE ON THE CLOCK"; $('#ocRight').textContent = 'pick #' + n; }
  else if(away === null){ $('#ocLeft').textContent = 'All your picks are in'; $('#ocRight').textContent = myRoster().length + ' players'; }
  else { $('#ocLeft').textContent = away === 1 ? 'You are next — 1 pick away' : 'You are up in ' + away + ' picks';
         $('#ocRight').textContent = 'your pick #' + myNext(); }
}

function renderBoard(){
  const round = currentRound(), avail = available(), ranked = rank(avail, round);
  const legal = ranked.filter(x => !x.block);
  const run = runWarning();
  let h = '';

  if(!S.board.length || S.board.length <= PINNED.length){
    h += '<div class="alert warn">Only your ' + PINNED.length + ' custom-ranked players are loaded. Open <b>Log → Paste your ESPN board</b> and paste the rest, so recommendations see the whole pool.</div>';
  }
  if(run) h += '<div class="alert">🚨 RUN ON ' + run.pos + ' — ' + run.n + ' of the last 8 picks. Take yours a round early or pivot.</div>';

  const top = legal[0];
  h += '<div class="card rec"><h3>' + (isMyTurn() ? 'Take him now' : 'If your pick came up now') +
       '<span>' + (isMyTurn() ? 'pick #' + currentPickNo() : 'pick #' + (myNext()||'—')) + '</span></h3>';
  if(!top){
    h += '<div class="empty">No legal player on the board. Paste your ESPN list on the Log tab.</div>';
  } else {
    const p = top.p;
    h += '<div class="pick"><b>' + esc(p.name) + '</b><span class="pos ' + p.pos + '">' + p.pos + '</span>' +
         '<span style="font-size:12px;color:var(--faint);font-weight:800">your rank ' + p.rank + '</span></div>';
    h += '<div class="why">' + esc(whyLine(top, round)) + '</div>';
    const backs = legal.slice(1,4);
    if(backs.length){
      h += '<div class="backs">';
      backs.forEach((x,i) => {
        h += '<div><span class="n">' + (i+2) + '.</span><span class="pos ' + x.p.pos + '">' + x.p.pos + '</span>' +
             '<span style="font-weight:700">' + esc(x.p.name) + '</span>' +
             '<span style="color:var(--faint);font-size:12px">#' + x.p.rank + (wontLast(x.p) ? ' · won’t last' : '') + '</span></div>';
      });
      h += '</div>';
    }
  }
  h += '</div>';

  h += '<div class="chips">' + ['ALL','RB','WR','TE','QB','K','DST'].map(f =>
       '<button data-f="' + f + '"' + (S.filter===f ? ' class="on"' : '') + '>' + f + '</button>').join('') + '</div>';

  h += '<div class="card"><h3>Best available<span>' + avail.length + ' left</span></h3>';
  const list = avail.filter(p => S.filter === 'ALL' || p.pos === S.filter).slice(0, 60);
  if(!list.length) h += '<div class="empty">Nobody here. Paste your board on the Log tab.</div>';
  list.forEach(p => {
    const block = ruleBlock(p, round);
    h += '<div class="rowp"><span class="rk">' + p.rank + '</span>' +
         '<span class="pos ' + p.pos + '">' + p.pos + '</span>' +
         '<span class="nm">' + esc(p.name) +
         (p.note || block || wontLast(p) ? '<i>' + esc([p.note, block ? '⛔ ' + block : '', wontLast(p) ? '⏳ won’t survive the lap' : ''].filter(Boolean).join(' · ')) + '</i>' : '') +
         '</span>' +
         '<button class="mine" data-mine="' + esc(p.name) + '">Mine</button>' +
         '<button data-gone="' + esc(p.name) + '">Gone</button></div>';
  });
  h += '</div>';
  $('#v-board').innerHTML = h;
}

function whyLine(x, round){
  const p = x.p, bits = [];
  if(p.note) bits.push(p.note);
  const need = needSet();
  if(need[p.pos]) bits.push('fills ' + p.pos);
  if(wontLast(p)) bits.push('will not survive the lap back to pick #' + myAfterNext());
  if(p.pos === 'RB') bits.push('standard scoring rewards the volume back');
  if(round >= LG.rules.noKDstBeforeRound && (p.pos === 'K' || p.pos === 'DST')) bits.push('last-two-rounds slot');
  return bits.slice(0,3).join(' · ') || 'best player left on your board';
}

function renderTeam(){
  const {slots, bench} = rosterSlots();
  let h = '<div class="card"><h3>Starting lineup<span>' + myRoster().length + ' drafted</span></h3><div class="slots">';
  slots.forEach(s => {
    h += '<div class="slot' + (s.fill ? '' : ' empty') + '"><b>' + s.label + '</b>' +
         (s.fill ? esc(s.fill.name) : '<span>still open</span>') + '</div>';
  });
  h += '</div></div>';

  h += '<div class="card"><h3>Bench<span>' + bench.length + ' of ' + LG.bench + '</span></h3>';
  if(!bench.length) h += '<div class="empty">Nothing on the bench yet.</div>';
  bench.forEach(p => { h += '<div class="rowp"><span class="pos ' + p.pos + '">' + p.pos + '</span><span class="nm">' + esc(p.name) + '</span></div>'; });
  h += '</div>';

  const need = needSet();
  const keys = Object.keys(need);
  h += '<div class="card"><h3>What you still need</h3>';
  h += keys.length ? '<div class="chips">' + keys.map(k => '<button class="on">' + k + '</button>').join('') + '</div>'
                   : '<div class="empty">Starting lineup is full. Everything from here is upside.</div>';
  h += '<div class="note">Standard scoring, only 4 of 12 make the playoffs: take the volume rusher and the touchdown scorer over the possession receiver when it is close.</div></div>';
  $('#v-team').innerHTML = h;
}

function renderPlan(){
  const nos = myPickNos(S.slot), next = myNext();
  let h = '<div class="card"><h3>Your seat</h3><div class="field"><label>Draft slot (1–12)</label>' +
          '<select id="slotSel">' + Array.from({length:LG.teams},(_,i)=>i+1).map(i =>
            '<option value="' + i + '"' + (i===S.slot ? ' selected' : '') + '>Pick ' + i + ' of 12</option>').join('') +
          '</select></div><div class="note" style="margin-top:8px">Order randomizes one hour before the 7:15 start. Set this the moment you see it.</div></div>';

  h += '<div class="card"><h3>Every pick you own</h3><table><tr><th>Rd</th><th>Pick</th><th class="c">Wait after</th><th>Plan</th></tr>';
  nos.forEach((n,i) => {
    const r = i+1, wait = i < nos.length-1 ? nos[i+1] - n - 1 : 0;
    h += '<tr' + (n === next ? ' class="next"' : '') + '><td>' + r + '</td><td>#' + n + '</td>' +
         '<td class="c">' + (i < nos.length-1 ? wait : '—') + '</td><td style="font-size:12.5px;color:var(--soft)">' + planFor(r) + '</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="card"><h3>Targets, rounds 1–6</h3>';
  const t = takenSet();
  for(let r=1; r<=6; r++){
    const n = nos[r-1];
    const pool = S.board.filter(p => !t.has(norm(p.name)) && !ruleBlock(p, r) && p.rank >= n - LG.teams && p.rank <= n + LG.teams*1.6)
                        .sort((a,b)=>a.rank-b.rank).slice(0,4);
    h += '<div style="padding:7px 0;border-top:1px solid var(--line)"><b style="font-size:13px">Round ' + r + ' · pick #' + n + '</b><br>' +
         (pool.length ? '<span style="font-size:13.5px">' + pool.map(p => esc(p.name) + ' <span style="color:var(--faint)">(' + p.pos + ' ' + p.rank + ')</span>').join(' · ') + '</span>'
                      : '<span class="empty">Paste your full ESPN board to fill this in.</span>') + '</div>';
  }
  h += '</div>';

  h += '<div class="card"><h3>House rules</h3><div class="note">' +
       '· No K or D/ST before round ' + LG.rules.noKDstBeforeRound + '.<br>' +
       '· No QB before round ' + LG.rules.noQBBeforeRound + '.<br>' +
       '· Omarion Hampton or Brock Bowers available at your pick: take him, no thinking.<br>' +
       '· Want a guy? Take him a round early. He will not survive the lap.<br>' +
       '· Rounds 8+: Brooks, Watson, Kraft, Mason, Likely, Downs, Concepcion, Corum.</div>' +
       '<div class="field"><label><input type="checkbox" id="ovr" style="width:auto;margin-right:6px"' + (S.overrideRules?' checked':'') + '>Let me break the rules tonight</label></div></div>';
  $('#v-plan').innerHTML = h;
  $('#slotSel').onchange = e => { S.slot = +e.target.value; save(); renderAll(); toast('Slot ' + S.slot + ' — pick #' + pickNo(1,S.slot) + ' first'); };
  $('#ovr').onchange = e => { S.overrideRules = e.target.checked ? 1 : 0; save(); renderAll(); };
}

function planFor(r){
  if(r === 1) return 'Best back or Hampton/Bowers if there';
  if(r <= 3) return 'RB/WR core — volume over targets';
  if(r <= 5) return 'Fill RB2/WR2, take a falling TE';
  if(r <= 7) return 'QB window opens round 6';
  if(r <= 12) return 'Upside bench: Brooks, Watson, Mason, Likely';
  if(r <= 14) return 'Handcuffs and last upside swings';
  return 'K and D/ST — here, not sooner';
}

function renderLog(){
  let h = '<div class="card"><h3>Add a pick</h3>' +
    '<div class="field"><label>Player</label><input id="qName" placeholder="Type any name — even off your board"></div>' +
    '<div class="row" style="margin-top:8px">' +
      '<div class="field" style="margin:0"><label>Position</label><select id="qPos">' +
        ['RB','WR','TE','QB','K','DST'].map(p => '<option>' + p + '</option>').join('') + '</select></div>' +
      '<div class="field" style="margin:0"><label>Whose?</label><select id="qWho"><option value="0">Someone else</option><option value="1">Mine</option></select></div>' +
    '</div><button class="btn" id="qAdd" style="margin-top:10px">Log pick #' + currentPickNo() + '</button></div>';

  h += '<div class="card"><h3>Picks so far<span>' + S.picks.length + '</span></h3><div class="log">';
  if(!S.picks.length) h += '<div class="empty">Nothing yet. Log each pick as it happens so the board stays honest.</div>';
  S.picks.slice().reverse().forEach(p => {
    h += '<div><span class="n">R' + roundOf(p.n) + ' #' + p.n + '</span><span class="pos ' + p.pos + '">' + p.pos + '</span>' +
         '<span' + (p.mine ? ' class="you"' : '') + '>' + esc(p.name) + (p.mine ? ' ← you' : '') + '</span></div>';
  });
  h += '</div>' + (S.picks.length ? '<button class="btn ghost" id="undo" style="margin-top:10px">Undo last pick</button>' : '') + '</div>';

  h += '<div class="card"><h3>Paste your ESPN board</h3>' +
    '<div class="note">On ESPN open <b>My Team → Edit Pre-Draft Strategy</b>, copy the list, paste it here. One player per line. ' +
    '"Bijan Robinson, RB", "12. Bijan Robinson RB Atl" and plain names all work. Your 16 custom ranks stay pinned where you put them.</div>' +
    '<div class="field"><textarea id="pasteBox" placeholder="1. Ja&apos;Marr Chase WR Cin&#10;2. Bijan Robinson RB Atl&#10;..."></textarea></div>' +
    '<div class="row"><button class="btn" id="pasteGo">Load board</button><button class="btn ghost" id="pasteAdd">Add to board</button></div></div>';

  h += '<div class="card"><h3>Danger zone</h3><button class="btn warn" id="reset">Reset the whole draft</button>' +
       '<div class="note" style="margin-top:8px">Clears every logged pick. Your board stays.</div></div>';

  $('#v-log').innerHTML = h;
  $('#qAdd').onclick = () => {
    const n = $('#qName').value.trim();
    if(!n){ toast('Type a name first'); return; }
    addPick(n, $('#qPos').value, +$('#qWho').value);
  };
  const u = $('#undo'); if(u) u.onclick = () => { S.picks.pop(); save(); renderAll(); toast('Undone'); };
  $('#pasteGo').onclick  = () => loadPaste(true);
  $('#pasteAdd').onclick = () => loadPaste(false);
  $('#reset').onclick = () => { if(confirm('Clear every logged pick? Your board stays.')){ S.picks=[]; save(); renderAll(); toast('Draft reset'); } };
}

/* ============================ ACTIONS ============================ */
function addPick(name, pos, mine){
  if(takenSet().has(norm(name))){ toast(name + ' is already off the board'); return; }
  const known = S.board.find(p => norm(p.name) === norm(name));
  const n = currentPickNo();
  if(mine && !isMyTurn() && !confirm('Pick #' + n + ' is not your turn (yours is #' + (myNext()||'—') + '). Log it as yours anyway?')) return;
  S.picks.push({ n, name: known ? known.name : name, pos: known ? known.pos : pos, mine: mine?1:0 });
  save(); renderAll();
  toast((mine ? '✅ You got ' : '❌ ') + (known ? known.name : name));
}

const NFL = new Set(['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','GNB','HOU','IND','JAX','JAC','KC','KAN','LV','LVR','OAK','LAC','LAR','SD','STL','MIA','MIN','NE','NWE','NO','NOR','NYG','NYJ','PHI','PIT','SEA','SF','SFO','TB','TAM','TEN','WAS','WSH','FA']);

function parseBoard(text){
  const out = [];
  text.split('\n').forEach(line => {
    let s = line.trim();
    if(!s) return;
    s = s.replace(/^\s*\d+\s*[.).:\-]?\s*/, '');           // leading rank number
    s = s.replace(/\([^)]*\)/g, ' ');                        // "(5)" bye weeks etc.
    let pos = '';
    const m = s.match(/(^|[\s,|])(QB|RB|WR|TE|PK|K|DST|D\/ST|DEF)([\s,|]|$)/i);
    if(m){ pos = m[2].toUpperCase(); s = s.replace(m[0], ' '); }
    if(pos === 'PK') pos = 'K';
    if(pos === 'D/ST' || pos === 'DEF') pos = 'DST';
    s = s.split(/[|\t]/)[0].replace(/,/g, ' ');
    let tok = s.split(/\s+/).filter(Boolean);
    while(tok.length > 1 && NFL.has(tok[tok.length-1].toUpperCase().replace(/[^A-Z]/g,''))) tok.pop();
    s = tok.join(' ').trim();
    if(!s || s.length < 2) return;
    if(!pos) pos = /d\/st|defense/i.test(line) ? 'DST' : 'WR';
    if(pos === 'DST' && !/d\/st/i.test(s)) s = s + ' D/ST';
    out.push({ name:s, pos });
  });
  return out;
}

function loadPaste(replace){
  const raw = $('#pasteBox').value;
  const parsed = parseBoard(raw);
  if(!parsed.length){ toast('Nothing to read in that paste'); return; }
  const pinnedByName = new Map(PINNED.map(p => [norm(p.name), p]));
  const base = replace ? [] : S.board.filter(p => !p.pinned);
  const seen = new Set(base.map(p => norm(p.name)));
  let rankCursor = 0;
  const fresh = [];
  parsed.forEach(p => {
    const k = norm(p.name);
    if(pinnedByName.has(k) || seen.has(k)) return;          // pinned ranks win
    seen.add(k);
    fresh.push(p);
  });
  // lay the pasted order into the rank slots the pinned players do not occupy
  const taken = new Set(PINNED.map(p => p.rank));
  const merged = PINNED.map(p => ({...p, pinned:1}));
  fresh.forEach(p => { do { rankCursor++; } while(taken.has(rankCursor)); merged.push({ name:p.name, pos:p.pos, rank:rankCursor }); });
  base.forEach(p => { if(!merged.some(m => norm(m.name) === norm(p.name))){ do { rankCursor++; } while(taken.has(rankCursor)); merged.push({...p, rank:rankCursor}); } });
  S.board = merged.sort((a,b)=>a.rank-b.rank);
  save(); renderAll();
  toast(S.board.length + ' players on the board');
}

function renderAll(){ renderHeader(); renderBoard(); renderTeam(); renderPlan(); renderLog(); }

/* ============================ WIRING ============================ */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if(nb){
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === nb));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + nb.dataset.v));
    window.scrollTo(0,0);
    return;
  }
  const f = e.target.closest('[data-f]');
  if(f){ S.filter = f.dataset.f; save(); renderBoard(); return; }
  const mine = e.target.closest('[data-mine]');
  if(mine){ const p = S.board.find(x => x.name === mine.dataset.mine); if(p) addPick(p.name, p.pos, 1); return; }
  const gone = e.target.closest('[data-gone]');
  if(gone){ const p = S.board.find(x => x.name === gone.dataset.gone); if(p) addPick(p.name, p.pos, 0); return; }
});

renderAll();

(function(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  var btn = document.getElementById('pwaInstall'), deferred = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; if(!standalone) btn.classList.add('show'); });
  btn.addEventListener('click', function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ deferred = null; btn.classList.remove('show'); }); });
  window.addEventListener('appinstalled', function(){ btn.classList.remove('show'); });
})();
