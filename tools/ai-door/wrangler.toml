name = "daraja-ai-door"
main = "worker.js"
compatibility_date = "2026-11-13"

# The daily cap counts here. Made 17 Nov 2026 in the dashboard, not with
# wrangler, so this records what is already live rather than creating it:
# the namespace is called daraja-door-count and the Worker reads it as
# DOOR_COUNT. Without this binding the door still works and the cap is simply
# off — which is why worker.js checks for it rather than assuming. Jerry was
# asked and chose to wire the cap up BEFORE the endpoint was set, so the door
# has never run a single ask without it.
[[kv_namespaces]]
binding = "DOOR_COUNT"
id = "8f788b48bb4443c3be403dad9088ebee"

# The key is NOT here. It goes in Cloudflare's secret store:
#   wrangler secret put ANTHROPIC_API_KEY
