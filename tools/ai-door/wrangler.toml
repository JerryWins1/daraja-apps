name = "daraja-ai-door"
main = "worker.js"
compatibility_date = "2026-11-13"

# The daily cap counts here. Make it once with:
#   wrangler kv namespace create DOOR_COUNT
# then paste the id it prints below. Without it the door still works and the
# cap is simply off — which is why worker.js checks for it rather than assuming.
# [[kv_namespaces]]
# binding = "DOOR_COUNT"
# id = "paste-the-id-wrangler-prints"

# The key is NOT here. It goes in Cloudflare's secret store:
#   wrangler secret put ANTHROPIC_API_KEY
