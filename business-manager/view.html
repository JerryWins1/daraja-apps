<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your estimate</title>
<style>
  :root{ color-scheme:light; --ink:#1C2630; --soft:#566370; --line:#E3DED3; --bg:#F5F2EC; --brand:#1E3A4C; --good:#1F7A4D; --amber:#E8A317; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; }
  .doc{ max-width:680px; margin:0 auto; padding:16px 16px 40px; }
  .paper{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px 18px; }
  .hd{ display:flex; gap:12px; align-items:flex-start; border-bottom:3px solid var(--brand); padding-bottom:12px; margin-bottom:14px; }
  .logo{ font-size:34px; width:52px; height:52px; border-radius:14px; background:#EEF2F5; display:flex; align-items:center; justify-content:center; flex:none; }
  .bn{ font-size:21px; font-weight:850; line-height:1.2; }
  .muted{ color:var(--soft); font-size:14.5px; }
  .kind{ font-size:13px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); }
  .meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  table{ width:100%; border-collapse:collapse; }
  td{ padding:9px 2px; border-bottom:1px solid #EEE9DF; vertical-align:top; }
  td.n{ text-align:right; white-space:nowrap; padding-left:10px; }
  .tot{ display:flex; justify-content:space-between; padding:5px 2px; }
  .grand{ font-weight:850; font-size:20px; border-top:2px solid var(--ink); margin-top:6px; padding-top:9px; }
  .box{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-top:12px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:54px; padding:10px 16px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font:inherit; font-weight:800; color:var(--ink); text-decoration:none; cursor:pointer; margin-top:8px; }
  .btn.main{ background:var(--brand); color:#fff; border-color:transparent; }
  .btn.good{ background:var(--good); color:#fff; border-color:transparent; }
  .big{ font-size:30px; font-weight:850; }
  input.i{ width:100%; min-height:52px; padding:10px 12px; border-radius:12px; border:1.5px solid #CFC8BA; font:inherit; }
  label.ck{ display:flex; gap:10px; align-items:flex-start; margin:10px 0; }
  label.ck input{ width:24px; height:24px; flex:none; margin-top:2px; }
  .paid{ display:inline-block; background:#E3F3EA; color:var(--good); font-weight:850; padding:4px 12px; border-radius:99px; }
  .terms{ font-size:13.5px; color:var(--soft); margin-top:14px; white-space:pre-wrap; }
  .foot{ text-align:center; font-size:12.5px; color:var(--soft); margin-top:18px; }
  @media print{ .noprint{ display:none !important; } body{ background:#fff; } .paper{ border:0; padding:0; } }
</style>
</head>
<body>
<div class="doc" id="doc"><div class="paper">Opening…</div></div>
<script>
/* Customer view for Business Manager. The estimate or invoice is carried inside the link (after #),
   so nothing is stored on a server. Nothing on this page sends anything anywhere by itself. */
(function(){
  'use strict';
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ n = Math.round((+n || 0) * 100) / 100; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fd(s){ if(!s) return ''; var p = s.split('-'); return MON[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]; }
  function today(){ var d = new Date(), m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (x < 10 ? '0' : '') + x; }
  function unb64(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; var bin = atob(s), u = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  async function decode(h){
    var kind = h[0], bytes = unb64(h.slice(1));
    if(kind === 'z'){ var st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function fail(msg){ document.getElementById('doc').innerHTML = '<div class="paper"><b>This link didn’t open.</b><p class="muted">' + esc(msg) + ' Ask the business to send it again.</p></div>'; }
  var D = null;
  async function start(){
    var h = location.hash.replace(/^#/, '');
    if(!h){ fail('The link looks cut short.'); return; }
    try{ D = await decode(h); }catch(e){ fail(window.DecompressionStream ? 'The link may have been cut short when it was copied.' : 'This browser is too old to open it — try a different browser.'); return; }
    draw();
  }
  function draw(){
    var b = D.b || {}, c = D.c || {}, est = D.k === 'est';
    document.title = (est ? 'Estimate' : 'Invoice') + ' #' + D.n + ' — ' + (b.n || '');
    var sub = (D.li || []).reduce(function(a, l){ return a + (+l[1]) * (+l[2]); }, 0);
    var tax = Math.round(sub * (+D.tx || 0)) / 100, cr = (D.cr || []).reduce(function(a, x){ return a + (+x[1]); }, 0);
    var total = Math.round((sub + tax - cr) * 100) / 100, paid = +D.pd || 0, bal = Math.round((total - paid) * 100) / 100;
    var h = '<div class="paper"><div class="hd"><div class="logo">' + esc(b.em || '🧰') + '</div><div style="flex:1;min-width:0"><div class="bn">' + esc(b.n) + '</div><div class="muted">' + esc([b.o, b.p, b.e].filter(Boolean).join(' · ')) + (b.a ? '<br>' + esc(b.a) : '') + (b.l ? '<br>' + esc(b.l) : '') + '</div></div></div>';
    h += '<div class="kind">' + (est ? 'Estimate' : (D.kd === 'deposit' ? 'Deposit invoice' : D.kd === 'progress' ? 'Progress invoice' : 'Invoice')) + ' #' + esc(D.n) + '</div>';
    h += '<div class="meta" style="margin-top:8px"><div><div class="muted">For</div><b>' + esc(c.n) + '</b>' + (c.a ? '<div class="muted">' + esc(c.a) + '</div>' : '') + '</div><div><div class="muted">' + (est ? 'Date' : 'Invoice date') + '</div><b>' + fd(D.d) + '</b>'
      + (est && D.x ? '<div class="muted">Good until ' + fd(D.x) + '</div>' : '') + (!est && D.du ? '<div class="muted">Due ' + fd(D.du) + '</div>' : '') + '</div></div>';
    if(D.ti) h += '<div style="font-weight:800;font-size:18px;margin-bottom:4px">' + esc(D.ti) + '</div>';
    if(est && D.de) h += '<div class="muted" style="white-space:pre-wrap;margin-bottom:8px">' + esc(D.de) + '</div>';
    h += '<table>' + (D.li || []).map(function(l){ return '<tr><td>' + esc(l[0]) + ((+l[1]) !== 1 ? '<div class="muted">' + (+l[1]) + ' × ' + money(l[2]) + '</div>' : '') + '</td><td class="n">' + money((+l[1]) * (+l[2])) + '</td></tr>'; }).join('') + '</table>';
    if(tax || cr) h += '<div class="tot" style="margin-top:6px"><span>Subtotal</span><span>' + money(sub) + '</span></div>';
    if(tax) h += '<div class="tot"><span>Sales tax (' + (+D.tx) + '%)</span><span>' + money(tax) + '</span></div>';
    (D.cr || []).forEach(function(x){ h += '<div class="tot"><span>' + esc(x[0]) + '</span><span>−' + money(x[1]) + '</span></div>'; });
    h += '<div class="tot grand"><span>Total</span><span>' + money(total) + '</span></div>';
    if(!est && paid) h += '<div class="tot"><span>Paid</span><span>−' + money(paid) + '</span></div><div class="tot grand"><span>Balance due</span><span>' + money(bal) + '</span></div>';
    if(est && D.dp) h += '<div class="muted" style="margin-top:6px">A deposit of ' + D.dp + '% (' + money(total * D.dp / 100) + ') is due when you approve.</div>';
    if(D.te) h += '<div class="terms">' + esc(D.te) + '</div>';
    h += '</div>';
    h += est ? approveBox(total) : payBox(bal);
    h += '<button class="btn noprint" onclick="window.print()">🖨️ Print or save as PDF</button>';
    h += '<div class="foot">Sent by ' + esc(b.n) + ' using Business Manager.</div>';
    document.getElementById('doc').innerHTML = h;
  }
  function approveBox(total){
    if(D.sg) return '<div class="box"><span class="paid">✓ Approved</span> by ' + esc(D.sg.name) + ' on ' + fd(D.sg.date) + '</div>';
    return '<div class="box noprint" id="ap"><div style="font-weight:850;font-size:19px">Ready to go ahead?</div><p class="muted" style="margin:4px 0 10px">Type your name to approve this estimate for <b>' + money(total) + '</b>. It sends a message to ' + esc((D.b || {}).o || (D.b || {}).n) + ' so they can get you on the schedule.</p>'
      + '<label class="muted" for="nm">Your full name</label><input class="i" id="nm" autocomplete="name" value="' + esc((D.c || {}).n || '') + '">'
      + '<label class="ck"><input type="checkbox" id="ok"><span>I approve Estimate #' + esc(D.n) + ' for ' + money(total) + ' and agree to the terms above.</span></label>'
      + '<button class="btn good" id="apGo">✅ Approve this estimate</button>'
      + '<button class="btn" id="apQ">💬 I have a question</button></div>';
  }
  function payBox(bal){
    var p = D.py || {}, b = D.b || {}, amt = bal.toFixed(2), note = 'Invoice ' + D.n + ' - ' + (b.n || '');
    if(bal <= 0.004) return '<div class="box" style="text-align:center"><span class="paid">✓ Paid in full</span><p class="muted">Thank you!</p></div>';
    var h = '<div class="box noprint"><div class="muted">Amount due</div><div class="big">' + money(bal) + '</div>';
    if(p.card) h += '<a class="btn main" href="' + esc(safeUrl(p.card)) + '" target="_blank" rel="noopener">💳 Pay by card</a><div class="muted" style="text-align:center;font-size:13px">Enter ' + money(bal) + ' on the next page.</div>';
    if(p.paypal) h += '<a class="btn" href="https://paypal.me/' + encodeURIComponent(p.paypal) + '/' + amt + 'USD" target="_blank" rel="noopener">Pay with PayPal</a>';
    if(p.venmo) h += '<a class="btn" href="https://venmo.com/' + encodeURIComponent(p.venmo) + '?txn=pay&amount=' + amt + '&note=' + encodeURIComponent(note) + '" target="_blank" rel="noopener">Pay with Venmo</a>';
    if(p.cashapp) h += '<a class="btn" href="https://cash.app/' + encodeURIComponent(p.cashapp) + '/' + amt + '" target="_blank" rel="noopener">Pay with Cash App</a>';
    if(p.zelle) h += '<div class="btn" style="cursor:default;flex-direction:column;gap:0">Zelle <span class="muted" style="font-weight:600">send ' + money(bal) + ' to ' + esc(p.zelle) + '</span></div>';
    if(p.check) h += '<div class="muted" style="margin-top:10px;text-align:center">Paying by check? Make it out to <b>' + esc(p.check) + '</b>.</div>';
    if(!p.card && !p.paypal && !p.venmo && !p.cashapp && !p.zelle && !p.check) h += '<p class="muted">Contact ' + esc(b.o || b.n) + ' to pay' + (b.p ? ' at ' + esc(b.p) : '') + '.</p>';
    h += '<button class="btn" id="paidTell">📨 Tell them I’ve paid</button></div>';
    return h;
  }
  function safeUrl(u){ return /^https:\/\//i.test(u) ? u : 'https://' + String(u).replace(/^\w+:\/*/, ''); }
  function reply(text, subject){
    var b = D.b || {};
    if(b.p && (/iphone|ipad|android/i.test(navigator.userAgent) || !b.e)) location.href = 'sms:' + b.p.replace(/[^\d+]/g, '') + '?&body=' + encodeURIComponent(text);
    else if(b.e) location.href = 'mailto:' + encodeURIComponent(b.e) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);
    else alert(text);
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest('button'); if(!t) return;
    if(t.id === 'apGo'){
      var nm = document.getElementById('nm').value.trim();
      if(!nm){ alert('Please type your name.'); return; }
      if(!document.getElementById('ok').checked){ alert('Please tick the box to approve.'); return; }
      var total = document.querySelector('.grand span:last-child').textContent;
      var msg = 'I approve Estimate #' + D.n + (D.ti ? ' (' + D.ti + ')' : '') + ' for ' + total + '.\nSigned: ' + nm + ', ' + fd(today());
      document.getElementById('ap').innerHTML = '<div style="font-weight:850;font-size:19px">Thank you, ' + esc(nm.split(' ')[0]) + '! 🎉</div><p class="muted">Your approval is ready to send. If your messages app didn’t open, tap below.</p><button class="btn good" id="apSend">📨 Send my approval</button>';
      D._msg = msg; reply(msg, 'Approved: Estimate #' + D.n);
    }
    if(t.id === 'apSend') reply(D._msg, 'Approved: Estimate #' + D.n);
    if(t.id === 'apQ') reply('Hi, I have a question about Estimate #' + D.n + (D.ti ? ' (' + D.ti + ')' : '') + ': ', 'Question: Estimate #' + D.n);
    if(t.id === 'paidTell') reply('Hi, I just paid invoice #' + D.n + '. Thank you!', 'Paid: Invoice #' + D.n);
  });
  start();
})();
</script>
</body>
</html>
