     Chrome ends on its own is started again, so a long sentence survives it, and four seconds

  /* ── 10b · the install screen, for someone arriving from the store (22 Nov 2026) ──
     Jerry: "I'd also like to improve the store so we download an app that has an icon on it
     right away rather than having to horse around and download it and all that stuff."

     WHAT HE WAS SEEING. Measured on an iPhone 13 before a line of this was written: a first
     open of whoscoming built four things in two and a half seconds — the welcome tour at
     1.0s (full screen, 72% shade), the greeting at 1.5s and the Home Screen card at 2.5s,

     seconds invisible under the shade, and the Home Screen card — the one thing he wanted
     seen — was buried deepest of all. That is the horsing around.

     alone. Nothing else is let up until it is answered — the tour waits, the greeting waits,
     the start menu waits, and the app's own card is covered. One answer either way and the
     app opens as normal. It never appears once the app is installed, inside a frame, or in a
     browser with no Home Screen at all, which includes every laptop: there a store link just
     opens the app.

     It sits ABOVE the tour on purpose, 2147483100 against 2147483000. Merely equal would have
     made it a race between two setTimeouts, which is the fault being fixed. */
  var DJ_HOLD = 0;
  function djHold(){ return DJ_HOLD === 1; }

    try{ var l = document.querySelector('link[rel="apple-touch-icon"]');

  /* 22 Nov, later the same night. Jerry was asked whether the store should hand out an icon per
     app or one Daraja icon that holds them all, and chose ONE DARAJA ICON. That is not a wording
     change, it is a different install, and the reason is in how phones actually work:

       - iOS does not install a manifest. Safari's Add to Home Screen bookmarks THE PAGE YOU ARE
         ON, with that page's apple-touch-icon and title. Stand on /whoscoming/ and you get a
         Who's Coming icon, whatever any manifest says.
       - Android installs the manifest OF THE PAGE YOU ARE ON. Same result.

     So one Daraja icon cannot be offered from inside an app at all - the person has to be
     standing on the front door when they add it. The store's Get links therefore go to
     home/?dj_install=1&go=<the app>, the front door shows this screen, and whichever way they
     answer it they are sent straight on to the app they tapped. An app reached with the marker
     any other way forwards itself there once. */
  var DJ_HOME_SLUG = 'home';
  var DJ_SITE = 'https://jerrywins1.github.io/daraja-apps/';

     /Apps (installable site)/home/, a page that does not exist. The live address is already
     hardcoded a few lines further down for control/ai.json, so it is hardcoded here too, and
     anything not on the live site is taken to be a copy served from the repo root, which is what
     every local server and every check here does. */
  function djSiteBase(){
    try{ if(location.href.indexOf(DJ_SITE) === 0) return DJ_SITE; }catch(e){}
    try{ return location.origin + '/'; }catch(e){ return '/'; }

  /* Never an open redirect: only a page on this site. And never THIS page, which is not a
     theoretical worry — the first version passed an empty string straight to new URL(), which
     resolves to the current address, so answering the screen on the front door with no app to go
     on to sent the person back to the same URL, marker and all, and the screen came straight back.
     An endless loop, caught by the check that asks whether tapping Install really calls Chrome. */

  function djFrontDoor(){ return slugOf() === DJ_HOME_SLUG; }

  function installScreen(){
    if(!djFromStore() || document.getElementById('djInstall') || !document.documentElement) return;
    var key;
    try{
      if(djHomeScreenOff() || guestVisit()) return;
      key = 'dj_a2hs_' + DJ_HOME_SLUG;   /* one icon, so one record of having it */
      if(localStorage.getItem(key) === 'done'){ var g0 = djGoParam(); if(g0 && djFrontDoor()) location.replace(g0); return; }

      card.innerHTML = '<img id="djInstallIcon" src="' + esc(djFrontDoor() ? 'icon-180.png' : djAppIcon()) + '" alt="" width="96" height="96" style="width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 6px 18px rgba(0,0,0,.18)">'
        + '<div style="font-weight:900;font-size:24px;line-height:1.25;margin-bottom:6px">' + esc(name) + '</div>'
        + '<p style="margin:0 0 6px;color:#55605B;font-size:16px">Put it on your Home Screen and it opens like any other app — full screen, straight from the icon.</p>'
        /* Jerry approved the line above at 05:06 on 22 Nov and it is unchanged. The one below is

    w.__up = function(){ if(w.parentNode) paint(); };

  /* ── 10c · Make it mine — the interview, the report it builds, and the profile (22 Nov 2026) ──
     Jerry: "a way for you to interview the user to see what they would like to see in the system,
     and they could give you something, and then you determine the questions to ask, and then
     either build what they're looking for or add it to the system as a feature… like 'I would
     like to have a report', and then ask him what's on the report that would be special for
     them… If you can build those into all the AI logic, that'd be really cool."

     THE LINE THAT HOLDS, and everything below is built around it: the AI ARRANGES WHAT THE APP
     ALREADY HAS. It never writes code onto the phone, it never invents a number, and a report
     says where each figure came from. A plan that names a figure this app does not keep is not
     rendered blank and it is not guessed at — it is dropped, and the report says it was dropped.

     ONE CONFIRMATION FOR A WHOLE INTERVIEW, not one per question. The door's own rule since
     15 November is that the words are shown before they are sent, and that rule is kept: the
     interview shows what is about to go, in full, once, before the first question — including
     that each answer tapped afterwards goes the same way. Four confirm sheets inside one
     four-question interview would be the pile-up of 21 November wearing a different hat, and a
     sheet nobody reads is worse than one they do. */

  /* Per app, not shared. The four questions ask about THIS app ("what will you mostly use this
     for"), so one answer cannot stand for all of them — and a per-app key goes with that app's
     own Start fresh, which a shared one must not. myKeys() is told to own both names. */
  function djProfileKey(){ return 'dj_profile_' + djRefKey(slugOf()); }
  function djProfile(){ try{ return JSON.parse(localStorage.getItem(djProfileKey()) || '{}') || {}; }catch(e){ return {}; } }
  function djProfileSet(p){ try{ localStorage.setItem(djProfileKey(), JSON.stringify(p || {})); }catch(e){} }
  function djReportsKey(){ return 'dj_reports_' + djRefKey(slugOf()); }
  function djReports(){ try{ return JSON.parse(localStorage.getItem(djReportsKey()) || '[]') || []; }catch(e){ return []; } }
  function djReportsSet(a){ try{ localStorage.setItem(djReportsKey(), JSON.stringify(a || [])); }catch(e){} }

  /* Nowhere near a kids' page or the crisis tool, and not on the pages that are visited
     rather than kept. Same list the rest of the house uses. */
  function djMineOff(){
    try{
      /* An app says no with window.DJ_MINE = false. Church HQ asked whether an internal tool
         should be exempt — that is its own chat's call, not this one's, so the house gives them
         the switch rather than deciding about their app from here. The test copy is already
         exempt, which is why church-demo never saw any of it. */
      if(window.DJ_MINE === false) return true;
      if(embedded || kidsPage() || crisisPage() || guestVisit() || djSandbox()) return true;
      return /\/(welcome|testers|help|testday|control|whats-new|thanks|inspect|watch\.html)(\/|$)/.test(location.pathname);
    }catch(e){ return true; }

  /* ── what this app can put in a report ──────────────────────────────────────
     An app says what it has with window.djReportSource = { name, fields:[{key,label,kind}], get(period) }.
     kind is 'number', 'text', 'list' (array of strings) or 'table' (array of arrays, first row the
     headings). get(period) returns { key: value } and may leave a key out.

     The house ships its own source so the engine is real in EVERY app from the first day instead
     of waiting on 54 chats, and so there is something to drive in a test. Everything in it is
     already on this phone and was put there by the house itself. */
  function djHouseSource(){
    return {
      name: 'Daraja',
      fields: [
        { key: 'days_here',  label: 'days you have opened this app',            kind: 'number' },
        { key: 'apps_here',  label: 'Daraja apps with something saved on this phone', kind: 'number' },
        { key: 'app_list',   label: 'which Daraja apps those are',              kind: 'list' },
        { key: 'problems',   label: 'problems this app recorded',               kind: 'number' },
        { key: 'problem_list', label: 'what those problems said',               kind: 'list' },
        { key: 'text_size',  label: 'your text size setting',                   kind: 'text' }
      ],
      get: function(){
        var out = {}, slug = slugOf();
        try{ var h = JSON.parse(localStorage.getItem('dj_hello_' + slug) || '{}'); out.days_here = h.days || 0; }catch(e){}
        var names = [];
        try{
          for(var k in OWNS){ if(!Object.prototype.hasOwnProperty.call(OWNS, k)) continue;
            var own = OWNS[k], hit = false;
            for(var i = 0; i < (own.k || []).length; i++){ if(localStorage.getItem(own.k[i]) != null){ hit = true; break; } }
            if(hit) names.push(k);
          }
        }catch(e){}
        out.apps_here = names.length; out.app_list = names.sort();
        var pr = djProblems();
        out.problems = pr.length;
        out.problem_list = pr.slice(0, 10).map(function(p){ return (p.t || '') + ' — ' + (p.m || ''); });
        var z = textSize();
        out.text_size = z === 1 ? 'normal' : (z > 1 ? 'larger (' + z + '×)' : 'smaller (' + z + '×)');
        return out;
      }
    };
  }
  function djSource(){ return window.djReportSource || djHouseSource(); }

  /* ── the interview ──────────────────────────────────────────────────────────
     djAI.interview({ kind:'report'|'idea', goal:'…' }). One question at a time, each with
     tappable answers where the AI can offer them and a box where it cannot, and it stops as
     soon as it knows enough. Up to MAX_Q questions, so the number of asks is knowable and can
     be said out loud before it starts — an interview is several asks against the daily cap and
     somebody paying for it should be told that first. */
  var IV_MAX_Q = 5;
  function ivWordsFor(st){
    var s = djSource(), f = (s.fields || []).map(function(x){ return x.key + ' (' + x.label + ')'; }).join('; ');
    var p = djProfile();
    var who = p.use ? ('\nThe person says they use this app for: ' + p.use + '.') : '';
    var base = 'You are interviewing someone who uses an app called "' + (document.title || 'this app').split(/ [—·|-] /)[0].trim()
      + '". They said what they want in their own words below. Ask ONE short question at a time to find out exactly what they want, '
      + 'and stop as soon as you know enough. Never ask more than ' + IV_MAX_Q + ' questions in total. '
      + 'Offer tappable answers whenever you reasonably can.' + who + '\n\n';
    /* 22 Nov, from the Ahead of It chat, and they were right. Until now a keyword test on the
       person's own first sentence decided whether this was a report or a request:
           /\breport|summary|statement|overview|chart|totals?\b/i
       So "a packet for the board meeting" went down the request path and was offered to us by
       email, for something this app could have built out of its own figures there and then. Their
       own first run hit it: they wrote the goal the way an HOA treasurer would, and had to put the
       word "report" in it to get anything built. "A one-pager for the trustees", "what do I owe
       this month", "something I can print for the fridge" would all have missed the same way.

       THE AI DECIDES NOW, AND IT COSTS NOTHING: there was always exactly one ask here either way,
       and all the keyword test ever changed was which prompt that ask carried. So the fields go in
       every time and the model answers with a plan or with a summary. A plan that names nothing
       this app actually keeps is a request too - see ivFinish. */
    base += 'This app can show only these figures, and nothing else:\n  ' + f + '\n'
      + 'If what they want can be put together out of that list - whatever they happen to call it - reply with a finished PLAN.\n'
      + 'If it cannot, reply with a SUMMARY of what they asked for instead, in their own words where you can. Never promise anything outside the list.\n'
      + 'When you know enough, reply with the plan or the summary instead of another question.\n\n'
      + 'Reply with ONE JSON object and nothing else, in one of these three shapes:\n'
      + '{"done":false,"question":"\u2026","options":["\u2026","\u2026"]}\n'
      + '{"done":true,"plan":{"title":"\u2026","period":"all"|"month"|"week","items":[{"field":"<one key from the list>","as":"number"|"text"|"list"|"table","label":"\u2026"}],"watch":"one short sentence"}}\n'
      + '{"done":true,"summary":"\u2026"}\n';
    base += '\nWhat they said they want:\n' + st.goal + '\n';
    if(st.qa.length){ base += '\nWhat you have asked so far, and what they answered:\n';
      st.qa.forEach(function(x){ base += '  Q: ' + x.q + '\n  A: ' + x.a + '\n'; }); }
    return base;
  }

  function ivSheet(html){ var b = sheet(html); return b; }
  function ivWait(msg){ return ivSheet('<div style="font-weight:900;font-size:19px;margin-bottom:6px">Make it mine</div><p style="margin:0;color:#55605B;font-size:15px">' + esc(msg) + '</p>'); }

  async function ivRun(st){
    for(var n = 0; n < IV_MAX_Q + 1; n++){
      ivWait(st.qa.length ? 'Thinking about your answer…' : 'Thinking of the first question…');
      var raw = await doorPost({ prompt: ivWordsFor(st), want: 'json' });
      if(raw == null){ ivFailed(st); return; }
      var j = extractJSON(raw);
      if(!j){ ivFailed(st, 'that came back in a shape I could not read'); return; }
      if(j.done || st.qa.length >= IV_MAX_Q){ ivFinish(st, j); return; }
      var answered = await ivAsk(st, String(j.question || '').trim(), Array.isArray(j.options) ? j.options.slice(0, 4) : []);
      if(answered === null) return;   /* they backed out: cancel means cancel */
      st.qa.push({ q: String(j.question || '').trim(), a: answered });
    }
  }

  function ivAsk(st, question, options){
    return new Promise(function(done){
      var BT = 'display:block;width:100%;text-align:left;font:inherit;font-weight:800;font-size:16px;min-height:52px;padding:10px 14px;margin-bottom:8px;border-radius:14px;border:1.5px solid #C9C1AE;background:#fff;color:#1F2622;cursor:pointer';
      var html = '<div style="font-weight:900;font-size:19px;margin-bottom:2px">Make it mine</div>'
        + '<p style="margin:0 0 10px;color:#55605B;font-size:13px">Question ' + (st.qa.length + 1) + ' of up to ' + IV_MAX_Q + '</p>'
        + '<p style="margin:0 0 12px;font-size:17px;font-weight:700">' + esc(question) + '</p>'
        + '<div id="ivOpts"></div>'
        + '<textarea id="ivBox" aria-label="Your answer" placeholder="' + (options.length ? 'or say it your own way…' : 'your answer…') + '" style="width:100%;box-sizing:border-box;min-height:70px;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:1.5px solid #C9C1AE;background:#fff;color:#1F2622"></textarea>'
        + '<button type="button" id="ivGo" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px;margin-top:10px">Next →</button>'
        + '<div style="text-align:center;margin-top:6px"><button type="button" id="ivStop" style="font:inherit;font-size:13px;color:#55605B;background:none;border:0;min-height:36px;cursor:pointer;text-decoration:underline">stop here</button></div>';
      var b = ivSheet(html);
      var og = b.querySelector('#ivOpts');
      options.forEach(function(o){
        var t = String(o || '').trim(); if(!t) return;
        var btn = document.createElement('button'); btn.type = 'button'; btn.style.cssText = BT; btn.textContent = t;
        btn.onclick = function(){ closeAISheet(); done(t); };
        og.appendChild(btn);
      });
      b.querySelector('#ivGo').onclick = function(){
        var v = (b.querySelector('#ivBox').value || '').trim();
        if(!v) return;
        closeAISheet(); done(v);
      };
      b.querySelector('#ivStop').onclick = function(){ closeAISheet(); done(null); };
    });
  }

  function ivFailed(st, why){
    var b = ivSheet('<div style="font-weight:900;font-size:19px;margin-bottom:6px">That did not work</div>'
      + '<p style="margin:0 0 12px;color:#55605B;font-size:15px">' + esc(why || 'Daraja’s own AI did not answer just now') + '. Nothing was lost — you can try again, or send us what you were after and we will look at it ourselves.</p>'
      + '<button type="button" id="ivAgain" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px">Try again</button>'
      + (djFeedbackOff() ? '' : '<button type="button" id="ivSend" style="' + BTN + ';width:100%;min-height:50px;margin-top:8px">Send it to us instead</button>')
      + '<div style="text-align:center;margin-top:6px"><button type="button" id="ivNo" style="font:inherit;font-size:13px;color:#55605B;background:none;border:0;min-height:36px;cursor:pointer;text-decoration:underline">leave it</button></div>');
    b.querySelector('#ivAgain').onclick = function(){ closeAISheet(); ivRun(st); };
    var sb = b.querySelector('#ivSend');
    if(sb) sb.onclick = function(){ closeAISheet(); ivHandOver(st, ''); };
    b.querySelector('#ivNo').onclick = function(){ djHouseClose(); };
  }

  /* 4 · what it cannot build becomes a request. It goes down the same path as Send us a
     message, as an idea, carrying the interview so the nightly job files exactly what was
     wanted — and nothing about who they are unless they add it themselves on that sheet. */
  function ivTranscript(st, summary){
    var t = 'WHAT THEY ASKED FOR: ' + st.goal + '\n';
    st.qa.forEach(function(x){ t += '\nQ: ' + x.q + '\nA: ' + x.a + '\n'; });
    if(summary) t += '\nWHAT THE INTERVIEW UNDERSTOOD: ' + summary + '\n';
    return t;
  }
  function ivHandOver(st, summary){
    if(djFeedbackOff()) return;
    djFeedback('idea');
    setTimeout(function(){
      try{
        var box = document.querySelector('#djAISheet textarea');
        if(box && !box.value){ box.value = ivTranscript(st, summary); box.dispatchEvent(new Event('input', { bubbles: true })); }
      }catch(e){}
    }, 250);
  }

  function ivFinish(st, j){
    /* A plan that names nothing this app keeps is not a report, it is a request with a title on
       it. Rendering it would be a page of "nothing recorded yet" where the offer to send it to us
       should be. */
    if(j && j.plan){
      var clean = reportClean(j.plan);
      if(clean.items.length){ reportSave(st, j.plan); return; }
    }
    var sum = String((j && (j.summary || j.plan && j.plan.title)) || '').trim() || 'what you described';
    var b = ivSheet('<div style="font-weight:900;font-size:19px;margin-bottom:6px">Here is what I understood</div>'
      + '<p style="margin:0 0 12px;font-size:16px;white-space:pre-wrap">' + esc(sum) + '</p>'
      + '<p style="margin:0 0 12px;color:#55605B;font-size:14.5px">This app cannot build that by itself. If you send it to us it goes on the list with your own words on it.</p>'
      + (djFeedbackOff() ? '' : '<button type="button" id="ivSend" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px">Send it to us</button>')
      + '<div style="text-align:center;margin-top:6px"><button type="button" id="ivNo" style="font:inherit;font-size:13px;color:#55605B;background:none;border:0;min-height:36px;cursor:pointer;text-decoration:underline">no thanks</button></div>');
    var sb = b.querySelector('#ivSend');
    if(sb) sb.onclick = function(){ closeAISheet(); ivHandOver(st, sum); };
    b.querySelector('#ivNo').onclick = function(){ djHouseClose(); };
  }

  /* ── the report the plan describes ──────────────────────────────────────────
     Nothing here runs anything the AI sent. The plan is read as data: a title, a period, and
     a list of field keys. A key that is not in this app's own registry is DROPPED and said to
     have been dropped, because a figure that is quietly missing and a figure that is quietly
     wrong look the same on a page. */
  function reportClean(plan){
    var s = djSource(), known = {}, kept = [], dropped = [];
    (s.fields || []).forEach(function(f){ known[f.key] = f; });
    var items = Array.isArray(plan && plan.items) ? plan.items : [];
    items.slice(0, 12).forEach(function(it){
      var k = String((it && it.field) || '').trim();
      if(known[k]) kept.push({ field: k, label: String((it && it.label) || known[k].label), as: known[k].kind });
      else if(k) dropped.push(k);
    });
    return {
      title: String((plan && plan.title) || 'My report').slice(0, 80),
      period: ['all', 'month', 'week'].indexOf(String(plan && plan.period)) >= 0 ? plan.period : 'all',
      watch: String((plan && plan.watch) || '').slice(0, 200),
      items: kept, dropped: dropped, source: s.name || 'this app'
    };
  }
  function reportHTML(plan){
    var s = djSource(), data = {};
    try{ data = s.get ? (s.get(plan.period) || {}) : {}; }catch(e){ data = {}; }
    var h = '<div style="font-weight:900;font-size:20px;margin-bottom:2px">' + esc(plan.title) + '</div>'
      + '<p style="margin:0 0 12px;color:#55605B;font-size:13px">Every figure below comes from ' + esc(plan.source) + '’s own records on this phone. Nothing is worked out anywhere else.</p>';
    var shown = 0;
    plan.items.forEach(function(it){
      var v = data[it.field];
      if(v === undefined || v === null){ h += '<div style="margin:0 0 10px;color:#55605B;font-size:14.5px"><b>' + esc(it.label) + '</b><br>nothing recorded yet</div>'; return; }
      shown++;
      if(it.as === 'list' && Array.isArray(v)){
        h += '<div style="margin:0 0 12px"><b style="font-size:15px">' + esc(it.label) + '</b><ul style="margin:4px 0 0 18px;padding:0;font-size:15px">'
           + (v.length ? v.map(function(x){ return '<li>' + esc(String(x)) + '</li>'; }).join('') : '<li style="color:#55605B">nothing yet</li>') + '</ul></div>';
      } else if(it.as === 'table' && Array.isArray(v)){
        h += '<div style="margin:0 0 12px"><b style="font-size:15px">' + esc(it.label) + '</b><div style="overflow:auto"><table style="border-collapse:collapse;font-size:14.5px;margin-top:4px">'
           + v.slice(0, 40).map(function(row, i){
               var cell = i === 0 ? 'th' : 'td';
               return '<tr>' + (Array.isArray(row) ? row : [row]).map(function(c){
                 return '<' + cell + ' style="border:1px solid #E2DCCF;padding:4px 8px;text-align:left">' + esc(String(c)) + '</' + cell + '>'; }).join('') + '</tr>';
             }).join('') + '</table></div></div>';
      } else {
        h += '<div style="margin:0 0 12px"><b style="font-size:15px">' + esc(it.label) + '</b><div style="font-size:26px;font-weight:900;line-height:1.2">' + esc(String(v)) + '</div></div>';
      }
    });
    if(!plan.items.length) h += '<p style="margin:0 0 12px;color:#55605B">There was nothing on this app’s list that matched what you asked for.</p>';
    if(plan.watch) h += '<p style="margin:12px 0 0;padding:10px 12px;background:#F7F4EC;border-radius:12px;font-size:15px"><b>What to watch for:</b> ' + esc(plan.watch) + '</p>';
    if(plan.dropped.length) h += '<p style="margin:10px 0 0;color:#55605B;font-size:13px">Left out because this app does not keep it: ' + esc(plan.dropped.join(', ')) + '.</p>';
    return h;
  }
  function reportShow(plan){
    var b = ivSheet(reportHTML(plan)
      + '<button type="button" id="rpOk" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px;margin-top:12px">Done</button>');
    b.querySelector('#rpOk').onclick = function(){ djHouseClose(); };
  }
  function reportSave(st, raw){
    var plan = reportClean(raw);
    var b = ivSheet(reportHTML(plan)
      + '<button type="button" id="rpKeep" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px;margin-top:12px">Keep this report</button>'
      + '<div style="text-align:center;margin-top:6px"><button type="button" id="rpNo" style="font:inherit;font-size:13px;color:#55605B;background:none;border:0;min-height:36px;cursor:pointer;text-decoration:underline">don’t keep it</button></div>');
    b.querySelector('#rpKeep').onclick = function(){
      var all = djReports();
      all.unshift({ id: 'r' + Date.now(), title: plan.title, plan: plan, made: djYMD() });
      djReportsSet(all.slice(0, 20));
      closeAISheet(); reportShow(plan);
    };
    b.querySelector('#rpNo').onclick = function(){ djHouseClose(); };
  }
  function reportsSheet(){
    var all = djReports();
    var h = '<div style="font-weight:900;font-size:19px;margin-bottom:8px">My reports</div>';
    if(!all.length) h += '<p style="margin:0 0 12px;color:#55605B">None yet. "Make it mine" in this menu builds one.</p>';
    var b = ivSheet(h + '<div id="rpList"></div>'
      + '<button type="button" id="rpNew" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px;margin-top:4px">Make another →</button>');
    var L = b.querySelector('#rpList');
    all.forEach(function(r){
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:8px';
      row.innerHTML = '<button type="button" class="rpOpen" style="flex:1;text-align:left;font:inherit;font-weight:800;font-size:16px;min-height:52px;padding:10px 14px;border-radius:14px;border:1.5px solid #E2DCCF;background:#fff;color:#1F2622;cursor:pointer">'
        + esc(r.title) + '<br><small style="font-weight:600;color:#55605B">kept ' + esc(r.made || '') + '</small></button>'
        + '<button type="button" class="rpRen" aria-label="Rename" style="font:inherit;font-size:18px;min-height:52px;width:48px;border-radius:14px;border:1.5px solid #E2DCCF;background:#fff;cursor:pointer">✎</button>'
        + '<button type="button" class="rpDel" aria-label="Delete" style="font:inherit;font-size:18px;min-height:52px;width:48px;border-radius:14px;border:1.5px solid #E2DCCF;background:#fff;cursor:pointer">\u{1F5D1}</button>';
      row.querySelector('.rpOpen').onclick = function(){ closeAISheet(); djBackPush(reportsSheet); reportShow(r.plan); };
      row.querySelector('.rpRen').onclick = function(){
        var nm = prompt('What should this report be called?', r.title);
        if(nm == null) return;
        nm = String(nm).trim().slice(0, 80); if(!nm) return;
        var a = djReports(); for(var i = 0; i < a.length; i++) if(a[i].id === r.id){ a[i].title = nm; a[i].plan.title = nm; }
        djReportsSet(a); closeAISheet(); reportsSheet();
      };
      row.querySelector('.rpDel').onclick = function(){
        if(!confirm('Delete “' + r.title + '”? The app’s own information is not touched.')) return;
        djReportsSet(djReports().filter(function(x){ return x.id !== r.id; }));
        closeAISheet(); reportsSheet();
      };
      L.appendChild(row);
    });
    b.querySelector('#rpNew').onclick = function(){ closeAISheet(); djBackPush(reportsSheet); mineStart(); };
  }

  /* ── the way in ─────────────────────────────────────────────────────────────
     What they want, in their own words, typed or spoken. Then ONE confirmation covering the
     whole interview, then the questions. */
  function mineStart(){
    var s = djSource(), list = (s.fields || []).map(function(f){ return f.label; }).join(', ');
    var b = ivSheet('<div style="font-weight:900;font-size:19px;margin-bottom:4px">Make it mine</div>'
      + '<p style="margin:0 0 12px;color:#55605B;font-size:15px">Tell me what you wish this app did, or what you would like to see. I will ask you a few questions and build it if I can.</p>'
      + '<textarea id="mnBox" aria-label="What would you like?" placeholder="I would like a report that…" style="width:100%;box-sizing:border-box;min-height:88px;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:1.5px solid #C9C1AE;background:#fff;color:#1F2622"></textarea>'
      + '<button type="button" id="mnGo" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px;margin-top:10px">Start →</button>'
      + '<p style="margin:10px 0 0;color:#55605B;font-size:13px">This app can show: ' + esc(list) + '.</p>');
    b.querySelector('#mnGo').onclick = async function(){
      var v = (b.querySelector('#mnBox').value || '').trim(); if(!v) return;
      var st = { goal: v, qa: [] };
      closeAISheet();
      var ok = await mineConfirm(st);
      if(!ok) return;
      ivRun(st);
    };
  }
  /* the one confirmation — the whole of what goes, said once, before anything goes */
  function mineConfirm(st){
    return new Promise(function(done){
      var words = ivWordsFor(st);
      var b = ivSheet('<div style="font-weight:900;font-size:19px;margin-bottom:6px">Before we start</div>'
        + '<p style="margin:0 0 10px;color:#55605B;font-size:15px">This goes to <b>Daraja’s own AI</b>, and so does every answer you give. Up to ' + (IV_MAX_Q + 1) + ' asks out of your household’s ' + 200 + ' a day. Nothing about who you are is sent.</p>'
        + '<button type="button" id="mnShow" style="font:inherit;font-size:13px;font-weight:800;color:#23504F;background:none;border:0;padding:6px 0;min-height:32px;cursor:pointer;text-decoration:underline">see exactly what is sent</button>'
        + '<pre id="mnWords" style="display:none;white-space:pre-wrap;font:inherit;font-size:12.5px;color:#55605B;background:#F7F4EC;border-radius:12px;padding:10px;max-height:34vh;overflow:auto;margin:8px 0 0"></pre>'
        + '<button type="button" id="mnOk" style="' + BTNM + ';width:100%;min-height:52px;font-size:17px;margin-top:12px">Start the questions →</button>'
        + '<div style="text-align:center;margin-top:6px"><button type="button" id="mnNo" style="font:inherit;font-size:13px;color:#55605B;background:none;border:0;min-height:36px;cursor:pointer;text-decoration:underline">cancel</button></div>');
      b.querySelector('#mnWords').textContent = words;
      b.querySelector('#mnShow').onclick = function(){ var w = b.querySelector('#mnWords'); w.style.display = ''; this.style.display = 'none'; };
      b.querySelector('#mnOk').onclick = function(){ closeAISheet(); done(true); };
      b.querySelector('#mnNo').onclick = function(){ djHouseClose(); done(false); };
    });
  }

  /* ── 3 · the setup interview ────────────────────────────────────────────────
     Four questions, fixed, all tappable, no typing and NO AI AT ALL. That is a reshape of the
     ask and here is why: these four answers are the same four whatever the app and whatever the
     person, so sending them to a model would spend asks off the daily cap, need the door to be
     up, need a wait between each question, and could come back with a question nobody chose the
     wording of. Four taps beats all of that. The AI's turn is "Make it mine", above, which is
     where an open-ended want really does need a thinking partner. */
  var DJ_SETUP_Q = [
    { k: 'use',   q: 'What will you mostly use this for?',  a: ['My family', 'My home', 'My work or business', 'My church or group', 'Just me'] },
    { k: 'who',   q: 'Who else is in it with you?',          a: ['Nobody, just me', 'One other person', 'A few of us', 'A whole group'] },
    { k: 'first', q: 'When you open it, what do you want first?', a: ['What is due now', 'The whole picture', 'Somewhere to add something', 'Whatever changed'] },
    { k: 'style', q: 'How do you like answers?',             a: ['Short and plain', 'With a bit of explanation', 'As much detail as there is'] }
  ];
  /* 22 Nov, from The Church App chat after they used the DJ_MINE switch, and measured: the fix
     for the stacking moved the interruption rather than removing it. On church-hq the moment a
     secretary taps "Start with the basics", the setup card opens over the Basics form and sits
     there while f_name already holds "Grace Chapel Nakuru". They were right that for a form-shaped
     app the screen after the welcome IS the task, and right that the switch answers it for THEIR
     app. But a person typing is a person typing in any app, so the house owes them this much:
     ONCE SOMEBODY HAS STARTED PUTTING SOMETHING IN, the offer does not come this visit at all. It
     is not recorded as a refusal, so it asks on a later open when they are not mid-sentence, and
     the row in the ? menu is there the whole time either way.

     A first `input` event, once, rather than looking at field values: an app that prefills a box
     would otherwise look busy from the first millisecond and never be offered anything. */
  var DJ_TYPED = 0;
  try{ document.addEventListener('input', function(){ DJ_TYPED = 1; }, { capture: true, once: true }); }catch(e){
    try{ document.addEventListener('input', function(){ DJ_TYPED = 1; }, true); }catch(e2){}
  }
  /* The same test twice would drift, and the greeting needs it as much as the offer does:
     without it the two both wake when the tour closes and the greeting wins by a few hundred
     milliseconds, which is the covered-greeting fault for the third time in two days. */
  function setupPending(){
    try{
      if(DJ_TYPED) return false;   /* it is not going to appear this visit, so nothing waits for it */
      if(djMineOff()) return false;
      if(djProfile().done) return false;
      return localStorage.getItem('dj_setup_no_' + djRefKey(slugOf())) !== '1';
    }catch(e){ return false; }
  }
  function setupOffer(force, tries){
    if(!force && djMineOff()) return;
    if(document.getElementById('djSetup')) return;
    var p = djProfile();
    if(!force && p.done) return;
    if(!force){ try{ if(localStorage.getItem('dj_setup_no_' + djRefKey(slugOf())) === '1') return; }catch(e){ return; } }
    /* IT WAITS FOR THE WELCOME TOUR, and this is the whole of the sequencing decision.
       The ask said "on a first open, in place of or before the tour, your call". Before the tour
       would have meant a store arrival meeting THREE full screens in a row — the install screen,
       this, then the tour — the night after the pile-up of 21 November was fixed. The tour is the
       app explaining itself and is what the person came for; being asked to tune it afterwards is
       the right way round, and it leaves exactly one new screen rather than two. The profile does
       not trim the tour anyway: a tour's steps belong to each app's own chat. */
    if(!force){
      var pending = false;
      try{ pending = !!(window.DJ_TOUR && !localStorage.getItem('dj_tour_' + window.DJ_TOUR.slug)); }catch(e){}
      /* 22 Nov, same night, from The Church App chat and confirmed here before changing anything:
         on church-hq at a first open this card opened ON TOP of the app's OWN welcome card
         (#djStart, z-index 9000) and swallowed every tap — elementFromPoint at the middle of the
         screen returned djSetup, and a click retried 60 times and timed out. A church secretary
         met two full-screen cards before she could type a service time.

         The comment below this used to say the sequencing left "exactly one new screen rather
         than two", and it was wrong: waiting for the house's own tour is not the same as waiting
         for an app's own welcome. cardOpen() is the test the house already had for that, and it
         covers djStart, introOv, fsIntro, djGate, hello, welcome, firstRun and djCoachCard as
         well as anything full-screen of the app's own, so it fixes the eight at once rather than
         the one that was reported. Measured after: church-hq's own card is alone again, and the
         seven apps checked with it are unchanged. */
      if(DJ_TYPED) return;   /* they are working: not this visit, and not a refusal either */
      var own = false; try{ own = cardOpen(); }catch(e){}
      if(djHold() || document.getElementById('djTour') || pending || own){
        if((tries || 0) < 40) setTimeout(function(){ try{ setupOffer(false, (tries || 0) + 1); }catch(e){} }, 1500);
        return;
      }
    }
    DJ_HOLD = 1;
    var w = document.createElement('div'); w.id = 'djSetup';
    w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', 'Set this up for you');
    w.style.cssText = 'position:fixed;inset:0;z-index:2147483090;background:#F7F4EC;color:#1F2622;'
      + 'font:17px/1.5 -apple-system,system-ui,sans-serif;overflow:auto;'
      + 'padding:calc(26px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom));box-sizing:border-box';
    var card = document.createElement('div'); card.style.cssText = 'max-width:460px;margin:0 auto';
    w.appendChild(card);
    var at = -1, got = {};
    var BT = 'display:block;width:100%;text-align:left;font:inherit;font-weight:800;font-size:17px;min-height:56px;padding:12px 16px;margin-bottom:10px;border-radius:14px;border:1.5px solid #C9C1AE;background:#fff;color:#1F2622;cursor:pointer';
    var LNK = 'font:inherit;font-size:15px;font-weight:700;color:#55605B;background:none;border:0;min-height:48px;padding:10px;cursor:pointer;text-decoration:underline';
    function close(saved){
      DJ_HOLD = 0;

        : { kind:'quote', custId:c ? c.id : '', name:c ? c.name : String(j.customer || '').trim(), work:String(j.work || '').trim() }, '✨ Sorted by ' + (aiLabel() === 'my AI' ? 'the AI' : aiLabel()) + ' — check it, then Save it.');

  var title = p.work.split(/[,.;]/)[0].trim(); title = title.charAt(0).toUpperCase() + title.slice(1); if(title.length > 48) title = title.slice(0, 45).trim() + '…';

/* ── line items ── */
/* v1.9.8 (20 Nov, Jerry: "If you go one screen too far … you can't go back"). Business Manager's screens are hash
   routes, so the phone's Back already walks them. The boxes that slide up were the gap: with one open, the phone's
   Back left the app and the box stayed. Now each box joins the house's back trail (djBack, house v68+): the phone's
   Back or edge swipe closes it, and a box opened from another box (Running late → the message) gets a ← Back chip and
   a Back that returns to the box before. Closing a box any other way (✕, Save, Send) takes its steps off the trail. */
var SHB = 0, SHB_UNWIND = 0;
function sheetBack(fn){ if(!window.djBack || djBack.navigating()) return; SHB++; djBack.push(function(){ SHB = Math.max(0, SHB - 1); if(SHB_UNWIND) return; fn(); }); }
function sheetGone(){ var s = $('bmSheet'); if(!s) return; if(s.querySelector('#tkMic')) micStop(); s.remove(); }
/* v2.0.8 (21 Nov): the talk box opts out of the back trail (noBack). Jerry tried last night's v1.9.7 side by side and
   it listened on his iPhone while the current app didn't; the only difference in that path was this: opening a box adds
   a history step (pushState) for the phone's Back, right as the microphone starts — which looks to be what cuts an
   iPhone's listening off. The talk box closes with ✕ as it did in v1.9.7; every other box keeps Back. */
function sheet(html, onOpen, noBack){
  var had = !!$('bmSheet'); sheetGone();
  if(!had && !noBack) sheetBack(sheetGone);
  var w = document.createElement('div'); w.className = 'shade'; w.id = 'bmSheet'; w.setAttribute('role', 'dialog');
  var chip = (SHB > 1 && window.djBack) ? djBack.button() : '';
  w.innerHTML = '<div class="sheet"><button class="x" onclick="BM.closeSheet()" aria-label="Close">✕</button>' + chip + html + '</div>';
  var cb = w.querySelector('.djBackB'); if(cb) cb.onclick = function(){ djBack.go(); };
  w.addEventListener('click', function(e){ if(e.target === w && !w.getAttribute('data-hold')) closeSheet(); });
  document.body.appendChild(w); if(onOpen) onOpen(w);
  return w;
}
function closeSheet(quiet){ var s = $('bmSheet'); if(!s) return; if(!quiet && s.getAttribute('data-compose')) clearPending(); sheetGone();
  if(SHB && window.djBack && !djBack.navigating()){ SHB_UNWIND = 1; var n = SHB; while(n-- > 0 && djBack.depth()) djBack.go(); SHB_UNWIND = 0; SHB = 0; } }

/* ── AI helpers (all optional; the app works without them) ── */
/* pricing with AI lives in the Quick Quote engine below (aiQuote); the old line format is still read by parsePriceAnswer */
/* the AI answers in plain lines ("Labor | 3 | 110"); older answers in JSON still work */
function bulletless(t){ return String(t || '').split(/\r?\n/).map(function(l){ return l.replace(/^\s*[-*•·]\s+/, '').replace(/\*\*|`/g, '').trim(); }).filter(Boolean); }
function parsePriceAnswer(t){
  var out = { items:[], note:'' }, js = null;
  try{ js = djAI.extractJSON(t); }catch(e){}
  var arr = js && (Array.isArray(js) ? js : js.items);
  if(Array.isArray(arr)){ arr.forEach(function(x){ if(x && x.name) out.items.push({ name:String(x.name), qty:num(x.qty) || 1, price:num(x.price) }); }); out.note = js.note || ''; if(out.items.length) return out; }
  bulletless(t).forEach(function(l){
    l = l.replace(/^\d+[.)]\s+/, '');
    if(/^note\s*:/i.test(l)){ out.note = l.replace(/^note\s*:\s*/i, ''); return; }
    var name, qty = 1, price, p = l.split('|').map(function(x){ return x.trim(); }).filter(Boolean), m;
    if(p.length >= 3){ name = p[0]; qty = num(p[1]) || 1; price = p[2]; }
    else if(p.length === 2){ name = p[0]; price = p[1]; }
    else if((m = l.match(/^(.+?)\s*(?:[:–—=]|\s-\s)\s*\$?\s*([\d,]+(?:\.\d{1,2})?)/))){ name = m[1]; price = m[2]; }
    else return;
    if(!/\d/.test(String(price)) || /^(item|total|subtotal|tax)\b/i.test(name)) return;
    if((m = name.match(/^(\d+(?:\.\d+)?)\s*[x×]\s+(.+)$/i))){ qty = +m[1]; name = m[2]; }
    out.items.push({ name:name.replace(/[:\s]+$/, ''), qty:qty, price:num(price) });
  });
  return out;
}

  var j = job(jid), c = cust(j.customerId), inc = jobTotal(j) - jobTax(j);

  djAI.ask({ title:'Review this job', circle:false,
    prompt:'I run a small ' + TRADES[S.biz.trade].name.toLowerCase() + ' business. Review this finished job like a sharp, friendly mentor who is also ' + L('a CPA', 'an accountant') + '.\n\nJob: ' + j.title + '\nDetails: ' + (j.desc || '') + '\nPriced at (before tax): ' + money(inc) + '\nLine items: ' + (j.items || []).map(function(l){ return l.name + ' ' + num(l.qty) + '×' + cur(num(l.price)); }).join('; ')
      + '\nMaterials & costs: ' + money(jobMaterials(j)) + (exp ? ' (' + exp + ')' : '') + '\nHelper hours: ' + jobHours(j) + ', helper pay ' + money(jobLabor(j)) + '\nPaid so far: ' + money(jobPaid(j)) + ' of ' + money(jobTotal(j))
      + (j.estSent && j.signed ? '\nEstimate sent ' + j.estSent + ', approved ' + j.signed.date : '') + '\nMy notes: ' + (j.notes || '(none)')
      + '\n\nGive me: 1) one line on how it went, 2) up to three specific things to do differently on the next job like this (pricing, materials, time), 3) one sentence I could reuse in my next estimate. Plain words, short.',

function b64u(bytes){ var bin = ''; for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

}

/* ── 📅 Next 30 / 60 days (v1.7 · 18 Nov 2026, Jerry: "Yes, all of them") ──────────────────────

/* v2.0 (20 Nov, truck-cab day part 3): a bill can repeat every month (on a day of the month), every 3 months or once

var BIG = L(500, 20000);

/* v2.0.4 (21 Nov, Jerry's Menards receipt read as one wrong line and a total of -$174.39). The reader was given the
   photo already shrunk for saving, so small receipt print was a few pixels high. It now reads the full photo, cleaned
   up: grey, contrast stretched so faint thermal print goes dark, and sized to about 2,000 px across. */
async function ocrPrep(file){
  var url = URL.createObjectURL(file);
  try{
    var img = await new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = url; });
    var W = img.naturalWidth, H = img.naturalHeight, k = Math.min(2.5, 2000 / Math.min(W, H) > 1 ? Math.min(2000 / Math.min(W, H), 2.5) : 2400 / Math.max(W, H) < 1 ? 2400 / Math.max(W, H) : 1);
    var c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
    var g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
    var d = g.getImageData(0, 0, c.width, c.height), p = d.data, hist = new Uint32Array(256), n = p.length / 4;
    for(var i = 0; i < p.length; i += 4){ var y = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 | 0; p[i] = y; hist[y]++; }
    var lo = 0, hi = 255, acc = 0; for(; lo < 255; lo++){ acc += hist[lo]; if(acc > n * 0.02) break; } acc = 0; for(; hi > 0; hi--){ acc += hist[hi]; if(acc > n * 0.02) break; }
    var span = Math.max(1, hi - lo);
    for(var j = 0; j < p.length; j += 4){ var v = Math.max(0, Math.min(255, (p[j] - lo) * 255 / span)); p[j] = p[j + 1] = p[j + 2] = v; }
    g.putImageData(d, 0, 0);
    return await new Promise(function(res){ c.toBlob(res, 'image/png'); });
  } finally { URL.revokeObjectURL(url); }
}

/* reading receipt text: works on Home Depot / Lowe's style receipts and pasted eReceipts */
/* v2.0.4 (21 Nov, Jerry's Menards receipt). Store slips like Menards put the item name on one line and, under it, the
   item number with "qty @ price" and the line total (sometimes the total drops to a line of its own). Their plain
   "TOTAL" is before tax and "TOTAL SALE" is what was paid. And the phone's reader garbles some characters on thermal
   paper ("J614066 b @7.97" for "3614066 6 @7.97"). This reads that layout, works out a line from qty × price when
   its total is missing or unreadable, and takes the paid total over the before-tax one. parseReceipt then keeps
   whichever reading of the slip adds up best. */
function ocrDigits(t){ return String(t).replace(/[OoQD]/g, '0').replace(/[Il|]/g, '1').replace(/[J]/g, '3').replace(/[Ss]/g, '5').replace(/[b]/g, '6').replace(/[B]/g, '8').replace(/[Z]/g, '2'); }
function parseRows(text){
  var MONEY = /(-?\$?\s?\d{1,5}(?:,\d{3})*\.\d{2})/, out = { items:[], tax:0, total:0, sub:0 };
  var lines = String(text || '').split(/\r?\n/).map(function(l){ return l.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
  var bare = function(l){ var m = l && l.match(/^-?\$?\s?(\d{1,5}(?:,\d{3})*\.\d{2})\s*[A-Z]{0,2}$/); return m ? num(m[1]) : null; };

    var lab = l.replace(MONEY, '').trim(), amt = (l.match(MONEY) || [])[1], val = amt != null ? Math.abs(num(amt)) : (bare(nx) != null ? bare(nx) : null);
    if(/^(total\s+sale|grand\s+total|amount\s+due|balance\s+due|total\s+due)\b/i.test(lab)){ if(val != null){ out.total = val; if(amt == null) i++; } name = ''; continue; }
    if(/^(sub-?\s?total|total)\b/i.test(lab) && !/number|items|saved|savings/i.test(lab)){ if(val != null){ out.sub = out.sub || val; if(amt == null) i++; } name = ''; continue; }
    if(/^(sales\s+)?(tax|vat)\b/i.test(lab)){ if(val != null){ out.tax = out.tax || val; if(amt == null) i++; } name = ''; continue; }
    if(/\b(visa|master ?card|amex|discover|debit|credit|cash|change|tender|auth|contactless|arqc|aid|number of items)\b/i.test(lab)){ name = ''; continue; }
    /* the item-number row: a 6–8 character code (allowing for misread digits), maybe "qty @ price", maybe the line total */
    var row = l.match(/^([A-Za-z0-9]{6,9})\b\s*(.*)$/);
    if(name && row && (ocrDigits(row[1]).match(/\d/g) || []).length >= 4){
      var rest = row[2], qty = 1, unit = 0, tot = null, q;
      if((q = rest.match(/(\S+)\s*@\s*\$?\s?(\S+?)(?=\s|$)/))){ qty = parseInt(ocrDigits(q[1]), 10) || 1; unit = num(ocrDigits(q[2].replace(/^[^\d]+/, ''))); rest = rest.replace(q[0], ' '); }
      var tm = rest.match(/(\d{1,5}(?:,\d{3})*\.\d{2})\s*[A-Z]{0,2}\s*$/); if(tm) tot = num(tm[1]);
      if(tot == null && bare(nx) != null){ tot = bare(nx); i++; }
      if(unit && qty > 1 && (tot == null || Math.abs(r2(qty * unit) - tot) > 0.015)){ var calc = r2(qty * unit); if(tot == null || !(tot > 0)) tot = calc; else if(Math.abs(calc - tot) > 0.015) tot = tot; }
      if(tot != null && tot > 0) out.items.push({ name:(name + (qty > 1 ? ' (' + qty + ' @ ' + cur(unit.toFixed(2)) + ')' : '')).slice(0, 60), amount:tot });
      name = ''; continue;
    }
    if(name && bare(l) != null){ out.items.push({ name:name.slice(0, 60), amount:bare(l) }); name = ''; continue; }   /* the item number was lost: the price alone follows the name */
    /* a name line: words, no price */
    if(/[A-Za-z]{2}/.test(l) && !MONEY.test(l)) name = l.replace(/\s{2,}/g, ' '); else name = '';
  }
  if(!out.total && out.sub) out.total = r2(out.sub + out.tax);
  return out;
}
function parseReceipt(text){
  var a = parseReceiptLines(text), b = parseRows(text);
  function miss(r, tot){ var s = r.items.reduce(function(x, y){ return x + y.amount; }, 0); return tot ? Math.abs(r2(tot - (r.tax || 0) - s)) : 1e9; }
  var tot = b.total || a.total, tax = b.tax || a.tax;
  var useB = b.items.length && (!a.items.length || miss({ items:b.items, tax:tax }, tot) <= miss({ items:a.items, tax:tax }, tot) || b.items.length > a.items.length);
  var items = (useB ? b.items : a.items).slice();
  /* v2.0.6 (21 Nov): the phone read "TOTAL SALE" as "[OTAL SALE" and "TAX" as "Sm (4X", so totals came in as items.
     The numbers give them away even when the words don't: look for three amounts where one plus another makes the
     third (160.73 + 13.66 = 174.39). The biggest is the total, the smaller of the other two the tax, the rest the
     before-tax total — and none of the three is an item. */
  var vals = []; String(text || '').replace(/(\d{1,5}(?:,\d{3})*\.\d{2})/g, function(m){ var v = num(m); if(v > 0 && vals.indexOf(v) < 0) vals.push(v); return m; });
  vals.sort(function(x, y){ return y - x; });

    if(Math.abs(r2(vals[B] + vals[C]) - vals[A]) < 0.011 && vals[C] < vals[B] * 0.2){ if(!tot || tot === vals[B]) tot = vals[A]; if(!tax) tax = vals[C]; A = vals.length; break; } }

function parseReceiptLines(text){

  if(KE) SKIP = new RegExp(SKIP.source.replace('tax|', 'tax|vat|m-?pesa|till|'), 'i');

    if(!out.tax && (KE ? /\b(tax|vat)\b/i : /\btax\b/i).test(l) && !/\bpre-?tax\b/i.test(l) && (m = l.match(/(-?\$?\s?[\d,]+\.\d{2})\s*$/))) out.tax = num(m[1]);
    if(SKIP.test(l)){ pending = ''; pendingQty = 0; return; }
    m = l.match(/^(.*?[A-Za-z].*?)\s+(-?\$?\s?\d{1,5}(?:,\d{3})*\.\d{2})(?:\s*-)?\s*[A-Z]{0,2}$/);

    if(!m){

      if(pending && /^(item|sku|model|upc|qty|quantity|store\s*so|internet|ships?|delivered|sold by)\b|item\s*#/i.test(l)){ var qq = l.match(/\bqty\.?\s*:?\s*(\d+)/i); if(qq && +qq[1] > 1) pendingQty = +qq[1]; return; }
      pending = /[A-Za-z]{3}/.test(l) && !/\d+\.\d{2}/.test(l) ? l : ''; pendingQty = 0; return;
    }

    var q = l.match(/(\d+)\s*@\s*\$?([\d.]+)/); if(q) name += ' (' + q[1] + ' @ ' + cur((+q[2]).toFixed(2)) + ')';

  return out;
}

/* ══ Quick Quote inside Business Manager (v1.1 · 9 Oct 2026) ═══════════════════════════════════════
   The quote engine from Quick Quote v1.2, on Business Manager's own jobs and price list:
   ⚡ a draft from the price list (keyword match, hours → labor, add-ons unless included, the trip rule),
   ✨ the owner's own AI through djAI (JSON or plain lines back), and THE PRICE LIST ALWAYS WINS over AI prices.
   Three options (Good / Better / Best) live on the job as j.tiers; j.items is always the option being edited
   (j.edit), so every total, link and invoice keeps working. j.pick is the option the customer chose.
   Photos (≤4, shrunk on the phone) are kept in the bizmgr_files store; j.photos holds their ids. */
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ── options ── */
function tierItems(j, k){ return k === (j.edit || 0) ? j.items : (j.tiers[k] || {}).items || []; }
function tierTotal(j, k){ return r2(lineSum(tierItems(j, k)) * (1 + num(S.biz.taxRate) / 100)); }
function tierSync(j){ try{ if(j && j.tiers && j.tiers[j.edit || 0]) j.tiers[j.edit || 0].items = j.items; }catch(e){} }
function tierSelect(j, k){ if(!j.tiers || !j.tiers[k]) return; tierSync(j); j.edit = k; j.items = j.tiers[k].items || []; }
function allLines(j){ return j.tiers ? [].concat.apply([], j.tiers.map(function(t, k){ return tierItems(j, k); })) : (j.items || []); }
function bare(l){ return { name:l.name, qty:num(l.qty) || 1, price:num(l.price) }; }
function extraLine(name, price){ var m = matchPrice(name); return m ? { name:m.name, qty:1, price:num(m.price) } : { name:name, qty:1, price:num(price) }; }
function buildTiers(base, names){
  names = names || S.quote.names;
  var has = function(list, n){ return list.some(function(i){ var a = matchPrice(i.name); return norm(i.name) === norm(n) || (a && a === matchPrice(n)); }); };
  var better = clone(base); parseAdds(S.quote.betterAdds).forEach(function(a){ if(!a.pct && !has(better, a.name)) better.push(extraLine(a.name, a.amt)); });
  var best = clone(better); parseAdds(S.quote.bestAdds).forEach(function(a){ if(!a.pct && !has(best, a.name)) best.push(extraLine(a.name, a.amt)); });
  return [{ name:names[0], items:clone(base) }, { name:names[1], items:better }, { name:names[2], items:best }];
}
function offerTiers(jid){
  var j = job(jid); if(!j || j.tiers) return; if(!j.items.length){ toast('Add at least one line first'); return; }
  j.tiers = buildTiers(j.items); j.edit = 0; j.pick = null; j.items = j.tiers[0].items; logJob(j, 'Offered three options'); save(); render();
  toast(parseAdds(S.quote.betterAdds).length || parseAdds(S.quote.bestAdds).length ? '3 options ready — tap one to change it' : '3 options ready — set what Better and Best add in More → How you price');
}
function untier(jid){
  var j = job(jid); if(!j || !j.tiers) return;
  if(!confirm('Go back to one price? This keeps “' + j.tiers[j.edit || 0].name + '” and drops the other options.')) return;
  j.items = clone(j.items); delete j.tiers; delete j.pick; delete j.edit; save(); render();
}
function tierEdit(jid, k){ var j = job(jid); if(!j || !j.tiers) return; if(j.signed && k !== (j.edit || 0)){ toast('It’s approved — tap Undo approval to switch options'); return; } tierSelect(j, k); save(); render(); }

function starterUntouched(){ var T = (TRADES[S.biz.trade] || TRADES.other).items; return S.prices.length === T.length && T.every(function(x, i){ return S.prices[i] && S.prices[i].name === x[0] && num(S.prices[i].price) === x[2]; }); }
async function qqJob(e, dbh, d, imp, n){
  var nm = String(e.customer || '').trim() || 'Customer';
  var c = S.customers.filter(function(x){ return String(x.name || '').toLowerCase() === nm.toLowerCase(); })[0];
  if(!c){ c = { id:uid(), name:nm, phone:'', email:'', address:'', created:today() }; S.customers.push(c); }
  var date = qqDay(e.at), desc = String(e.job || '').trim();
  var j = { id:uid(), num:S.seq.job++, customerId:c.id, title:qqTitle(desc), desc:desc, status:'new', created:date, items:[], times:[], log:[{ d:today(), t:'Brought over from Quick Quote' }], qnote:e.note ? oneSentence(e.note) : '', via:e.via || 'list', from:'quickquote' };
  if(Array.isArray(e.tiers) && e.tiers.length){
    j.tiers = e.tiers.map(function(t, k){ return { name:String((t && t.name) || S.quote.names[k] || ('Option ' + (k + 1))), items:qqLines(t && t.items) }; });
    var hasPick = e.pick != null && j.tiers[e.pick], k0 = hasPick ? +e.pick : Math.min(+e.edit || 0, j.tiers.length - 1);
    j.edit = k0; j.items = j.tiers[k0].items; if(hasPick) j.pick = +e.pick;
  } else j.items = qqLines(e.items);
  j.price = lineSum(j.items);
  if(e.approval && e.approval.name){ var ad = qqDay(e.approval.at);
    j.signed = { name:String(e.approval.name), date:ad, at:e.approval.at || '', total:jobTotal(j), via:'quickquote', option:String(e.approval.option || '') };
    if(/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(e.approval.sig || '')) j.signed.sigImg = e.approval.sig;
    j.status = 'approved'; j.estSent = ad; }
  else if(e.sent){ j.status = 'estimate'; j.estSent = date; }
  var ph = [];
  for(var i = 0; i < (e.photos || []).length && ph.length < 4; i++){ var pid = e.photos[i];
    if(imp.photos[pid]){ ph.push(imp.photos[pid]); continue; }
    var data = await qqPhoto(dbh, pid, d);
    if(typeof data === 'string' && /^data:image\//.test(data)){ var nid = 'ph' + uid(); try{ await putFile(nid, data); imp.photos[pid] = nid; ph.push(nid); n.ph++; }catch(x){} } }
  if(ph.length) j.photos = ph;
  S.jobs.push(j); return j;
}
async function qqImport(){
  var d = qqData(); if(!d || !S){ alert('I can’t find Quick Quote on this phone. It has to be the same phone and the same web browser.'); return; }
  var imp = S.imports.qq || {}; imp.map = imp.map || {}; imp.photos = imp.photos || {};
  var n = { p:0, q:0, i:0, ph:0, same:0 };
  /* the business and how they price */
  if(d.biz){ if(!S.biz.name && d.biz.name) S.biz.name = String(d.biz.name); if(!S.biz.phone && d.biz.phone) S.biz.phone = String(d.biz.phone); }
  var P = d.profile || {};
  ['included', 'addons', 'city', 'county', 'neverOther'].forEach(function(k){ if(typeof P[k] === 'string' && P[k].trim()) S.quote[k] = P[k]; });
  ['trip', 'tone', 'detail'].forEach(function(k){ if(typeof P[k] === 'string' && P[k]) S.quote[k] = P[k]; });
  if(num(P.tripUnder)) S.quote.tripUnder = num(P.tripUnder); if(Array.isArray(P.never)) S.quote.never = P.never.slice();
  if(d.opt){ if(Array.isArray(d.opt.names) && d.opt.names.length === 3) S.quote.names = d.opt.names.map(String); if(typeof d.opt.betterAdds === 'string') S.quote.betterAdds = d.opt.betterAdds; if(typeof d.opt.bestAdds === 'string') S.quote.bestAdds = d.opt.bestAdds; }
  Object.keys(d.seen || {}).forEach(function(k){ S.quote.seen[k] = Math.max(S.quote.seen[k] || 0, +d.seen[k] || 0); });
  /* the price list: theirs replaces the untouched starter list; same names update, new ones are added */
  if(Array.isArray(d.prices) && d.prices.length){
    if(starterUntouched()){ S.prices = []; S.setup.starter = false; }
    d.prices.forEach(function(p){ if(!p || !String(p.name || '').trim()) return; var nm = String(p.name).trim(), pr = num(p.price), ex = S.prices.filter(function(x){ return norm(x.name) === norm(nm); })[0];
      if(ex){ if(num(ex.price) !== pr){ ex.price = pr; n.p++; } } else { S.prices.push({ name:nm, price:pr }); n.p++; } });
  }
  /* saved estimates and invoices — the open one in Quick Quote is newer than its saved copy */
  var saved = Array.isArray(d.saved) ? d.saved.slice() : [];
  if(d.cur && d.cur.id){ var ix = -1; saved.forEach(function(x, k){ if(x && x.id === d.cur.id) ix = k; }); if(ix >= 0) saved[ix] = d.cur; }
  var ests = saved.filter(function(x){ return x && x.id && x.kind !== 'invoice'; }).reverse(), invs = saved.filter(function(x){ return x && x.id && x.kind === 'invoice'; }).reverse();
  var dbh = ests.concat(invs).some(function(x){ return (x.photos || []).length; }) ? await qqIdb() : null;
  try{
    for(var a = 0; a < ests.length; a++){ var e = ests[a]; if(imp.map[e.id] && job(imp.map[e.id])){ n.same++; continue; } var j = await qqJob(e, dbh, d, imp, n); imp.map[e.id] = j.id; n.q++; }
    for(var b = 0; b < invs.length; b++){ var v = invs[b]; if(imp.map[v.id] && inv(imp.map[v.id])){ n.same++; continue; }
      var jj = imp.map[v.fromEst] ? job(imp.map[v.fromEst]) : null;
      if(!jj){ jj = await qqJob(Object.assign({}, v, { tiers:null, sent:true }), dbh, d, imp, n); }
      var items = qqLines(v.items), tot = lineSum(items), date = qqDay(v.at), nn = parseInt(v.num, 10);
      if(!(nn > 0) || S.invoices.some(function(x){ return x.num === nn; })) nn = S.seq.inv;
      var bv = { id:uid(), num:nn, jobId:jj.id, customerId:jj.customerId, kind:'single', date:date, due:/^\d{4}-\d\d-\d\d$/.test(v.due || '') ? v.due : date, taxRate:0, lines:items, credits:[],
        payments:v.status === 'paid' ? [{ amount:tot, date:/^\d{4}-\d\d-\d\d$/.test(v.paidAt || '') ? v.paidAt : date, method:'Other' }] : [], sent:date, reminders:[], from:'quickquote' };
      S.invoices.push(bv); S.seq.inv = Math.max(S.seq.inv, nn + 1); imp.map[v.id] = bv.id; n.i++;
      if(['new', 'estimate', 'approved', 'scheduled', 'working'].indexOf(jj.status) >= 0) jj.status = 'done'; autoClose(jj); logJob(jj, 'Invoice #' + nn + ' brought over from Quick Quote'); }
  } finally { if(dbh) try{ dbh.close(); }catch(x){} }
  imp.at = today(); S.imports.qq = imp; save(); render();
  sheet('<h3>📥 Brought over from Quick Quote</h3><div class="card"><div class="tot"><span>Price list items added or updated</span><b>' + n.p + '</b></div><div class="tot"><span>Quotes</span><b>' + n.q + '</b></div><div class="tot"><span>Invoices' + (QM() && n.i ? ' (kept for when you turn on Business Manager)' : '') + '</span><b>' + n.i + '</b></div><div class="tot"><span>Photos</span><b>' + n.ph + '</b></div>'
    + (n.same ? '<p class="hint">' + n.same + ' were already here, so they weren’t copied again.</p>' : '') + '</div><p class="muted">Nothing in Quick Quote was changed or deleted.</p>' + (S.setup.done ? '<button class="btn main full" onclick="BM.closeSheet();BM.go(\'jobs/all\')">See my quotes</button>' : '<button class="btn main full" onclick="BM.closeSheet()">OK</button>'));
}
