<!doctype html>

<head>
<script id="dj-house-v63">
/* 4 Oct 2026 — Jerry: "why is it talking to me … turn them all off right now." One switch for every app:
   nothing speaks unless the person turns the voice on (localStorage dj_voice = 'on'). Exceptions: the store's
   videos (you pressed ▶) and Rafiki (talking is the whole app; it has its own mute). */
(function(){ try{
  if(!window.speechSynthesis || /\/shop\/watch\.html|\/rafiki\//.test(location.pathname)) return;
  var real = speechSynthesis.speak.bind(speechSynthesis);
  /* v62 (7 Oct deep check): a button the person taps to HEAR something ("🔊 Read it to me", "Listen") is asking
     for the voice, so it speaks even when the voice switch is off. Only for a few seconds after that tap. */
  var askedAt = 0, ASK = /read (it|this|that)( out)?( to me)?|read to me|read aloud|🔊|listen|hear it|say it again/i;
  document.addEventListener('click', function(e){ try{ var t = e.target && e.target.closest && e.target.closest('button,a,[role="button"]'); if(!t) return;
    var words = (t.textContent || '') + ' ' + (t.getAttribute('aria-label') || '') + ' ' + (t.title || '');
    if(ASK.test(words) && !/turn (the )?voice|voice is on|sound (on|off)|mute/i.test(words)) askedAt = Date.now(); }catch(err){} }, true);
  window.djSayNow = function(){ askedAt = Date.now(); };
  speechSynthesis.speak = function(u){ try{ if(localStorage.getItem('dj_voice') === 'on' || Date.now() - askedAt < 6000) return real(u); }catch(e){} };
}catch(e){} })();

/* ═══ Daraja house standard — safety net, local dates, talk-into-any-box ═══ */
(function(){
  if(window.__djHouse) return; window.__djHouse = true;

  /* ── 0 · 🧪 the test copy (v57 · 4 Oct 2026) ─────────────────────────────────
     Jerry: "If we're in test mode and I want to test as a first-time user, what do I do?"
     ?dj_sandbox=1 opens a fresh copy that has never seen this person: every save goes to this
     browser TAB only (sessionStorage, prefix sbx:), IndexedDB names get an sbx_ prefix, and the
     real data is never read or written. Close the tab and the test copy is gone. If the browser
     refuses the swap, it says so and does NOT pretend: the real data would be at risk. */
  (function(){
    var on = false, q = ''; try{ q = location.search; }catch(e){}
    try{
      if(/[?&]dj_sandbox=1/.test(q)){ var s0 = window.sessionStorage; for(var i = s0.length - 1; i >= 0; i--){ var k0 = s0.key(i); if(k0 && k0.indexOf('sbx:') === 0) s0.removeItem(k0); } s0.setItem('dj_sandbox', '1'); on = true; try{ history.replaceState(null, '', location.href.replace(/([?&])dj_sandbox=1&?/, '$1').replace(/[?&](#|$)/, '$1')); }catch(e){} }
      else if(window.sessionStorage.getItem('dj_sandbox') === '1') on = true;
    }catch(e){ on = false; }
    if(!on) return;
    var S = window.sessionStorage, P = 'sbx:';
    function keys(){ var ks = []; for(var i = 0; i < S.length; i++){ var k = S.key(i); if(k && k.indexOf(P) === 0) ks.push(k.slice(P.length)); } return ks; }
    var api = { getItem:function(k){ return S.getItem(P + k); }, setItem:function(k, v){ S.setItem(P + k, String(v)); }, removeItem:function(k){ S.removeItem(P + k); },
      clear:function(){ keys().forEach(function(k){ S.removeItem(P + k); }); }, key:function(n){ var ks = keys(); return ks[n] == null ? null : ks[n]; } };
    var fake = new Proxy({}, {
      get:function(t, p){ if(p === 'length') return keys().length; if(Object.prototype.hasOwnProperty.call(api, p)) return api[p]; if(typeof p === 'string'){ var v = S.getItem(P + p); return v === null ? undefined : v; } return undefined; },
      set:function(t, p, v){ api.setItem(p, v); return true; }, deleteProperty:function(t, p){ api.removeItem(p); return true; },
      has:function(t, p){ return Object.prototype.hasOwnProperty.call(api, p) || p === 'length' || S.getItem(P + p) !== null; },
      ownKeys:function(){ return keys(); },
      getOwnPropertyDescriptor:function(t, p){ var v = S.getItem(P + p); return v === null ? undefined : { value:v, enumerable:true, configurable:true, writable:true }; } });
    var ok = false;
    try{ Object.defineProperty(window, 'localStorage', { configurable:true, get:function(){ return fake; } }); ok = (window.localStorage === fake); }catch(e){ ok = false; }
    if(!ok){
      try{ window.sessionStorage.removeItem('dj_sandbox'); }catch(e){}
      alert('This browser won’t open a separate test copy. To see the app as a new person, open it in a Private window instead. Your real data is untouched.');
      try{ location.replace(location.href.replace(/([?&])dj_sandbox=1&?/, '$1').replace(/[?&]$/, '')); }catch(e){}
      return;
    }
    try{ var idb = window.indexedDB, o = idb.open.bind(idb), d = idb.deleteDatabase.bind(idb);
      idb.open = function(n, v){ return v === undefined ? o('sbx_' + n) : o('sbx_' + n, v); }; idb.deleteDatabase = function(n){ return d('sbx_' + n); }; }catch(e){}
    window.__djSandbox = true;
    function bar(){
      if(!document.body || document.getElementById('djSbx')) return;
      var b = document.createElement('div'); b.id = 'djSbx'; b.setAttribute('role', 'status');
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:2147482900;background:#5B3FA0;color:#fff;font:700 14px/1.3 -apple-system,system-ui,sans-serif;padding:8px 10px 8px 12px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px';
      b.innerHTML = '<span style="flex:1">🧪 Test copy: you’re a brand-new user here. Your real data is safe.</span><button type="button" style="font:inherit;font-weight:800;font-size:13px;background:#fff;color:#5B3FA0;border:0;border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer">Leave</button>';
      b.querySelector('button').onclick = function(){ try{ api.clear(); window.sessionStorage.removeItem('dj_sandbox'); }catch(e){} location.href = location.href.replace(/([?&])dj_sandbox=1&?/, '$1').replace(/[?&]$/, ''); };
      document.body.appendChild(b);
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bar); else bar();
    setTimeout(bar, 1500);
  })();

  /* v62: a Start fresh that erased an app's file store finishes here, before the app opens it again */
  (function(){ try{ var w = JSON.parse(localStorage.getItem('dj_idb_wipe') || 'null'); if(!Array.isArray(w) || !w.length) return; var left = w.length;
    w.forEach(function(n){ var r = indexedDB.deleteDatabase(String(n)); r.onsuccess = function(){ if(--left <= 0){ try{ localStorage.removeItem('dj_idb_wipe'); }catch(e){} } }; }); }catch(e){} })();

  /* v62 (found #51): a tour that was closed half way put the app on Level 3 for good. Put the level back. */
  (function(){ try{ for(var i = localStorage.length - 1; i >= 0; i--){ var k = localStorage.key(i); if(!k || k.indexOf('dj_tour_lvl_') !== 0) continue;
      var o = JSON.parse(localStorage.getItem(k) || 'null'); if(!o || o.path !== location.pathname) continue;
      Object.keys(o.keys || {}).forEach(function(x){ if(o.keys[x] === null) localStorage.removeItem(x); else localStorage.setItem(x, o.keys[x]); });
      localStorage.removeItem(k); } }catch(e){} })();

  /* ── 1 · the real local day ──────────────────────────────────────────────
     toISOString() converts to UTC. At 7pm in Illinois that is already tomorrow,
     so "today" landed on the wrong date and daily streaks broke overnight. */
  window.djYMD = function(d){
    d = d || new Date();
    if(typeof d === 'string') d = new Date(d + (d.length === 10 ? 'T12:00:00' : ''));
    return d.getFullYear() + '-' +
           String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0');
  };

  /* ── 2 · saving must never fail silently ─────────────────────────────────
     Every app writes with localStorage.setItem. If the phone refuses, the old
     code threw, the save function stopped halfway, and nobody was told. */
  try{
    var proto = window.Storage && Storage.prototype;
    if(proto && !proto.__djGuarded){
      var realSet = proto.setItem;
      /* v62 (7 Oct deep check): Our Table, Every Day, Who's Coming and My Circle keep their data under dj_ names,
         so skipping every dj_ key meant they never said "Saved ✓". Skip only the house's own bookkeeping. */
      var HOUSE_KEY = /^dj_(textsize|hello_|tour_|seen_|a2hs_|tipseen_|lastopen|menu_seen_|voice|ai_choice|circle_include|sandbox|level_|glass_|tester_code|idb_wipe|name$|.*_seen$|.*_tip|.*_intro)/;
      proto.setItem = function(k, v){
        try{ var r = realSet.call(this, k, v); if(!HOUSE_KEY.test(String(k)) && String(k).indexOf('sbx:dj_tour') !== 0) savedPulse(); return r; }
        catch(err){ djSaveFailed(err); return undefined; }
      };
      proto.__djGuarded = true;
    }
  }catch(e){}

  var toldOnce = false;
  function djSaveFailed(err){
    if(toldOnce) return; toldOnce = true;
    var full = err && (err.name === 'QuotaExceededError' ||
               err.code === 22 || err.code === 1014);
    djBanner(
      full ? 'This phone is out of room, so that did not save.'
           : 'This phone would not let the app save that.',
      full ? 'Free up some space in Settings › General › iPhone Storage, then tap Try again. Nothing you can see on screen has been lost yet — but do not close the app until it saves.'
           : 'This usually means private browsing, or Settings › Safari › Block All Cookies is switched on. Turn that off and tap Try again.',
      [['Try again', function(){ location.reload(); }]]
    );
  }

  /* ── 3 · nothing white-screens without a way out ─────────────────────────
     A single bad record used to leave a blank page and no route back. */
  var netShown = false;
  function net(msg){
    if(netShown) return; netShown = true;
    djBanner('Something went wrong on this screen.',
      'Your saved work is untouched. Reloading fixes almost everything.' +
      (msg ? '\n\n(' + String(msg).slice(0,120) + ')' : ''),
      [['Reload', function(){ location.reload(); }]]);
  }
  /* v44 (22 Sep 2026): a service worker that fails to update is a leftover from a page that moved
     (the old store under Apps (installable site)/store/, archived 12 Sep) — not this app's fault.
     Jerry could not get rid of the bar it raised. Never show it for that; throw the leftover away. */
  function swNoise(m){ return /ServiceWorker|service worker/i.test(String(m || '')); }
  window.addEventListener('error', function(e){
    if(e && e.target && e.target !== window && e.target.tagName) return; /* a missing image is not a crash */
    if(swNoise(e && e.message)) return;
    net(e && e.message);
  });
  window.addEventListener('unhandledrejection', function(e){
    var m = e && e.reason && e.reason.message;
    if(swNoise(m)){ try{ e.preventDefault(); }catch(_){} return; }
    net(m);
  });
  function tidyWorkers(){
    try{ if(!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) return;
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){
        try{ fetch(r.scope, {method:'HEAD', cache:'no-store'}).then(function(x){ if(x.status === 404) r.unregister(); }, function(){}); }catch(e){}
      }); }, function(){}); }catch(e){}
  }
  setTimeout(tidyWorkers, 4000);

  /* one calm bar, never an alert() the person cannot read at their own pace */
  function djBanner(title, body, buttons){
    if(!document.body){ document.addEventListener('DOMContentLoaded', function(){ djBanner(title, body, buttons); }); return; }
    var old = document.getElementById('djBanner'); if(old) old.remove();
    var w = document.createElement('div');
    w.id = 'djBanner';
    w.setAttribute('role','alert');
    w.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;'
      + 'background:#7A2E1E;color:#fff;padding:16px 16px calc(16px + env(safe-area-inset-bottom));'
      + 'font:15px/1.45 -apple-system,system-ui,sans-serif;box-shadow:0 -6px 26px rgba(0,0,0,.35)';
    var h = document.createElement('div');
    h.style.cssText = 'font-weight:800;font-size:16px;margin-bottom:4px'; h.textContent = title;
    var p = document.createElement('div');
    p.style.cssText = 'opacity:.94;white-space:pre-wrap'; p.textContent = body;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
    (buttons||[]).forEach(function(b){
      var el = document.createElement('button');
      el.textContent = b[0];
      el.style.cssText = 'font:inherit;font-weight:800;min-height:44px;padding:10px 16px;border:none;'
        + 'border-radius:12px;background:#fff;color:#7A2E1E;cursor:pointer';
      el.onclick = b[1]; row.appendChild(el);
    });
    var x = document.createElement('button');
    x.textContent = 'Dismiss';
    x.setAttribute('aria-label','Dismiss this message');
    x.style.cssText = 'font:inherit;font-weight:700;min-height:44px;padding:10px 16px;border:1px solid rgba(255,255,255,.55);'
      + 'border-radius:12px;background:transparent;color:#fff;cursor:pointer';
    x.onclick = function(){ w.remove(); };
    row.appendChild(x);
    w.appendChild(h); w.appendChild(p); w.appendChild(row);
    document.body.appendChild(w);
  }
  window.djBanner = djBanner;

  /* ── 4 · talk into any typing box ────────────────────────────────────────
     Rafiki and Feedback Studio had this; twenty-one apps did not. The button
     only appears once you tap into a box, so no screen changes until you want it. */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, micBtn = null, curBox = null;

  function eligible(el){
    if(!el || el.dataset.djMic === 'off' || el.hasAttribute('data-nomic')) return false;   /* v63: an app with its own 🎤 marks the box data-nomic */
    var t = (el.tagName||'').toLowerCase();
    if(t === 'textarea') return true;
    if(t !== 'input') return false;
    var ty = (el.type||'text').toLowerCase();
    if(['text','search','tel','url','email'].indexOf(ty) < 0) return false;
    if(el.readOnly || el.disabled) return false;
    /* Leave alone any box that already has its own microphone — Rafiki, Feedback
       Studio and In My Own Words built their own and theirs are better placed.
       Stop at <body>: once our own button is on the page its emoji is inside body's
       text, which would make every box after the first one look already-served. */
    var p = el.parentElement;
    for(var i=0; i<3 && p && p !== document.body && p !== document.documentElement; i++, p = p.parentElement){
      var t = p.textContent || '';
      if(micBtn && p.contains(micBtn)) t = t.split('\u{1F3A4}').join('');
      if(t.indexOf('\u{1F3A4}') >= 0) return false;
    }
    return true;
  }

  function place(box){
    if(!micBtn){
      micBtn = document.createElement('button');
      micBtn.type = 'button';
      micBtn.id = 'djMic';
      micBtn.textContent = '\u{1F3A4}';
      micBtn.setAttribute('aria-label','Say it instead of typing');
      micBtn.title = 'Say it instead of typing';
      /* every app has its own button styling — min-height:44px, padding, box-sizing —
         so this one states its shape outright or it comes out the wrong size */
      micBtn.style.cssText = 'position:absolute !important;z-index:2147482000;'
        + 'box-sizing:border-box !important;width:40px !important;height:40px !important;'
        + 'min-width:40px !important;min-height:40px !important;max-width:40px !important;'
        + 'max-height:40px !important;padding:0 !important;margin:0 !important;'
        + 'border-radius:50% !important;border:1px solid rgba(128,128,128,.4);background:#fff;'
        + 'color:#1F2622;font-size:19px;line-height:1;cursor:pointer;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center';
      micBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
      micBtn.addEventListener('click', function(e){ e.preventDefault(); talk(); });
      document.body.appendChild(micBtn);
    }
    var r = box.getBoundingClientRect();
    /* scrolled out of sight — inside a sheet or off the page — so show nothing */
    if(r.bottom < 4 || r.top > window.innerHeight - 4 || r.width < 60){ hide(); return; }
    micBtn.hidden = false; micBtn.style.setProperty('display','flex','important');
    /* measure what the browser actually made, rather than trusting the numbers above */
    var m = micBtn.getBoundingClientRect();
    var w = m.width  || 40, h = m.height || 40;
    micBtn.style.top  = (window.scrollY + r.top + (r.height - h)/2) + 'px';
    micBtn.style.left = (window.scrollX + r.right - w - 6) + 'px';
    /* a short box would be swallowed by the button — sit just outside it instead */
    if(r.width < w + 90) micBtn.style.left = (window.scrollX + r.right + 6) + 'px';
  }
  function hide(){ if(micBtn){ micBtn.hidden = true; micBtn.style.setProperty('display','none','important'); } }

  function talk(){
    var box = curBox; if(!box) return;
    if(rec){ try{ rec.stop(); }catch(e){} return; }
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true;
    rec.continuous = (box.tagName.toLowerCase() === 'textarea');
    var base = (box.value || '').trim();
    micBtn.textContent = '⏹';
    micBtn.style.background = '#D96C4F';
    micBtn.setAttribute('aria-label','Stop listening');
    rec.onresult = function(e){
      var t = '';
      for(var i=0; i<e.results.length; i++) t += e.results[i][0].transcript;
      box.value = (base ? base + ' ' : '') + t;
      box.dispatchEvent(new Event('input', {bubbles:true}));
    };
    function done(){
      rec = null;
      if(micBtn){ micBtn.textContent = '\u{1F3A4}'; micBtn.style.background = '#fff';
                  micBtn.setAttribute('aria-label','Say it instead of typing'); }
      box.dispatchEvent(new Event('change', {bubbles:true}));
    }
    rec.onend = done;
    rec.onerror = done;
    try{ rec.start(); }catch(e){ done(); }
  }


  /* ── 5 · the floating helpers must not sit on the words ──────────────────
     The ? and the 💡 were each pinned to the right edge about 150px up from the
     bottom. On a 5.4" phone that is the middle of the screen, so both sat on top

  /* ── 6 · "Start fresh" must actually clear this app, and only this app ───────
     The first registry I shipped listed key names I had assumed rather than read.
     Against what the apps really write, 21 of 26 were wrong: The Key saves under
     'daraja_thekey_v1', so a person who had filled in their whole will-and-papers
     page was told "there is nothing saved in this app yet". These names were read

  var OWNS = {
    nownext:      {k:['now_next_v1','now_next_profiles_v1','nn7_prefs','nn_code_v1','hz_prefs_v1',
                      'nn_dev','nn_fam_since','nn_family','nn_ph_reg','nn_week_v1'], p:['now_next_v1_','nn_']},
    ahead:        {k:['ahead_v1'], p:['ahead_'], idb:['ahead_papers']},   /* v62: the papers pocket (attached policies, statements) lives in IndexedDB */
    breakeven:    {k:['breakeven_v1'], p:['breakeven_']},

    nextstep:     {k:['nextstep_board_v1'], p:['nextstep_','nsb_']},

    academy:      {k:['daraja_academy_v1'], p:['academy_']},
    feedback:     {k:['feedback_studio_v1'], p:['fbs_']},

    churchkey:    {k:['daraja_churchkey_v1'], p:[]},

    goodstanding: {k:['goodstanding_v1'], p:['goodstanding_']},
    receipts:     {k:['receiptmaker_org_v1'], p:['receiptmaker_','receipts_']},
    businessmanager: {k:['bizmgr_v1'], p:['bizmgr_']}
  };

  function slugOf(){
    var s = (window.DJ_START && window.DJ_START.slug) ||
            (location.pathname.replace(/\/index\.html$/,'').split('/').filter(Boolean).pop() || '');
    s = String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
    var alias = {churchkey:'churchkey', thekey:'thekey', churchserve:'serve', churchsteward:'steward',
                 churchhq:'churchhq', churchdrive:'drive', churchclubhouse:'clubhouse',
                 churchgameday:'gameday', npgoodstanding:'goodstanding', npreceipts:'receipts',
                 f1:'pitwall', feedbackstudio:'feedback', storykeeper:'storykeeper'};
    return alias[s] || s;
  }

  function myKeys(){
    var me = slugOf(), mine = OWNS[me];
    if(!mine) return null;                            /* unknown app — do not guess */
    var guard = {};
    Object.keys(OWNS).forEach(function(a){
      if(a === me) return;
      OWNS[a].k.forEach(function(x){ guard[x] = a; });
    });
    /* two apps genuinely share the shoebox count, so neither may erase it */
    var shared = {'occ_counter_v1':1, 'occTipSeen':1, 'now_next_v1':(me !== 'nownext') ? 1 : 0};
    var out = [];
    try{
      for(var i=0; i<localStorage.length; i++){
        var k = localStorage.key(i); if(!k) continue;
        if(k.indexOf('dj_') === 0) continue;
        if(shared[k]) continue;
        var owned = mine.k.indexOf(k) >= 0;
        if(!owned) for(var j=0; j<mine.p.length; j++) if(k.indexOf(mine.p[j]) === 0){ owned = true; break; }
        if(!owned && k.indexOf('fs_coach_' + me) === 0) owned = true;
        if(!owned) continue;
        if(guard[k] && mine.k.indexOf(k) < 0) continue;   /* another app's, by name */
        out.push(k);
      }
    }catch(e){}
    return out;
  }

  function startFresh(){
    var keys = myKeys();
    if(keys === null){ alert('This app is not set up to erase itself yet — tell Jerry.'); return; }
    var dbs = (OWNS[slugOf()] || {}).idb || [];

/* ── money math ─────────────────────────────────────────────── */
function lineSum(lines){ return r2((lines || []).reduce(function(a, l){ return a + num(l.qty) * num(l.price); }, 0)); }
function jobSub(j){ return F('lineItems') && j.items && j.items.length ? lineSum(j.items) : r2(num(j.price)); }
function jobTax(j){ return r2(jobSub(j) * num(S.biz.taxRate) / 100); }
function jobTotal(j){ return r2(jobSub(j) + jobTax(j)); }
function invSub(v){ return lineSum(v.lines); }
function invTax(v){ return r2(invSub(v) * num(v.taxRate) / 100); }
function invCredits(v){ return r2((v.credits || []).reduce(function(a, c){ return a + num(c.amount); }, 0)); }
function invTotal(v){ return r2(invSub(v) + invTax(v) - invCredits(v)); }
function invPaid(v){ return r2((v.payments || []).reduce(function(a, p){ return a + num(p.amount); }, 0)); }
function invBal(v){ return r2(invTotal(v) - invPaid(v)); }
function invOverdue(v){ return invBal(v) > 0.004 && v.due && v.due < today(); }
function jobInvoices(j){ return S.invoices.filter(function(v){ return v.jobId === j.id; }); }
function jobBilled(j){ return r2(jobInvoices(j).reduce(function(a, v){ return a + invTotal(v); }, 0)); }
function jobPaid(j){ return r2(jobInvoices(j).reduce(function(a, v){ return a + invPaid(v); }, 0)); }
function jobMaterials(j){ return r2(S.expenses.filter(function(e){ return e.jobId === j.id; }).reduce(function(a, e){ return a + num(e.amount); }, 0)); }
function jobHours(j){ return r2((j.times || []).reduce(function(a, t){ return a + num(t.hours); }, 0)); }
function jobLabor(j){ return r2((j.times || []).reduce(function(a, t){ var c = S.crew.filter(function(x){ return x.id === t.who; })[0]; return a + num(t.hours) * (c ? num(c.rate) : 0); }, 0)); }
function cust(id){ return S.customers.filter(function(c){ return c.id === id; })[0] || { name:'(no customer)', id:'' }; }
function job(id){ return S.jobs.filter(function(j){ return j.id === id; })[0]; }
function inv(id){ return S.invoices.filter(function(v){ return v.id === id; })[0]; }
function owed(){ return S.invoices.filter(function(v){ return invBal(v) > 0.004 && v.sent; }); }

/* ── job stages, only the ones this business uses ───────────── */
var STAGE = { new:'New', estimate:'Estimate sent', approved:'Approved', scheduled:'Scheduled', working:'Working', done:'Done — bill it', closed:'Paid & closed', lost:'Didn’t get it' };
function stages(){ var a = ['new']; if(F('estimates')) a.push('estimate', 'approved'); if(F('schedule')) a.push('scheduled'); a.push('working', 'done', 'closed'); return a; }
function nextStage(j){ var a = stages(), i = a.indexOf(j.status); return i >= 0 && i < a.length - 1 ? a[i + 1] : null; }
function autoClose(j){ if(!j) return; var b = jobBilled(j); if(b > 0 && jobPaid(j) >= b - 0.004 && b >= jobTotal(j) - 0.004 && j.status !== 'lost') j.status = 'closed'; }
function pill(st, label){ return '<span class="pill ' + st + '">' + esc(label || STAGE[st] || st) + '</span>'; }

/* ── screens ────────────────────────────────────────────────── */
var TABS = { home:1, jobs:1, money:1, more:1 };
var route = [], after = null;
function go(h){ if(location.hash === '#' + h) render(); else location.hash = h; }
function back(){ if(history.length > 1) history.back(); else go('home'); }
function setHead(title, sub){ $('ttl').textContent = title; $('sub').textContent = sub || ''; document.title = 'Business Manager' + (title && title !== 'Business Manager' ? ' — ' + title : ''); }

function render(){
  route = (location.hash.replace(/^#/, '') || 'home').split('/');
  var r = route[0];
  if(!S || !S.setup.done){ if(r !== 'setup') r = 'welcome'; }
  var V = VIEWS[r] || VIEWS.home;
  after = null;
  var html = V();
  $('main').innerHTML = html;
  var tab = TABS[r] ? r : ({ job:'jobs', newjob:'jobs', editjob:'jobs', cust:'jobs', newcust:'jobs', editcust:'jobs', custs:'jobs', sched:'jobs', inv:'money', expenses:'money', expense:'money', import:'money', export:'money', hours:'money', pl:'money' })[r] || 'more';
  document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-go') === tab); });
  var setupMode = (r === 'welcome' || r === 'setup');
  $('tabs').style.display = setupMode ? 'none' : '';
  $('backBtn').hidden = !!TABS[r] || setupMode;
  window.scrollTo(0, 0);

}

  h.push('<div class="muted" style="margin:2px 2px 10px">' + (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + (S.biz.owner ? ', ' + esc(first(S.biz.owner)) : '') + '.</div>');
  var ow = owed(), owT = ow.reduce(function(a, v){ return a + invBal(v); }, 0), od = ow.filter(invOverdue).length;
  var m0 = t.slice(0, 7), paidM = 0; S.invoices.forEach(function(v){ (v.payments || []).forEach(function(p){ if((p.date || '').slice(0, 7) === m0) paidM += num(p.amount); }); });
  h.push('<div class="stats"><button class="stat owe" onclick="BM.go(\'money\')"><div class="lbl">Owed to me</div><div class="val">' + money0(owT) + '</div><div class="small muted">' + ow.length + ' unpaid' + (od ? ' · <b style="color:var(--bad)">' + od + ' late</b>' : '') + '</div></button>'
    + '<button class="stat paid" onclick="BM.go(\'money\')"><div class="lbl">Paid this month</div><div class="val">' + money0(paidM) + '</div><div class="small muted">' + MON[new Date().getMonth()] + ' so far</div></button></div>');
  if(F('schedule')){
    var tj = S.jobs.filter(function(j){ return j.date === t && j.status !== 'lost' && j.status !== 'closed'; }).sort(byTime);
    h.push('<h2>Today</h2>');

    if(up.length) h.push('<h2>Next 7 days</h2>' + up.map(jobCard).join('') + '<button class="btn sm full" onclick="BM.go(\'sched\')">See the whole schedule</button>');
  }
  var n = needs();
  h.push('<h2>Needs you' + (n.length ? ' (' + n.length + ')' : '') + '</h2>');
  h.push(n.length ? n.slice(0, 8).map(function(x){ return '<button class="card tap need" onclick="' + x.go + '"><span class="ic">' + x.em + '</span><span class="grow"><b>' + esc(x.t) + '</b><div class="small muted">' + esc(x.s) + '</div></span><span class="pill">' + esc(x.a) + '</span></button>'; }).join('') : '<div class="card muted">✅ All caught up. Nice work.</div>');
  h.push('<h2>Quick</h2><div class="btns"><button class="btn main" onclick="BM.go(\'newjob\')">➕ New job</button>'

function byDate(a, b){ return (a.date || '9').localeCompare(b.date || '9') || byTime(a, b); }
function byTime(a, b){ return (a.time || '99').localeCompare(b.time || '99'); }
function needs(){
  var t = today(), out = [];
  S.invoices.forEach(function(v){ if(invOverdue(v)){ var c = cust(v.customerId), d = daysBetween(v.due, t); out.push({ em:'⏰', t:c.name + ' — ' + money(invBal(v)) + ' is ' + d + ' day' + (d === 1 ? '' : 's') + ' late', s:'Invoice #' + v.num + (v.reminders && v.reminders.length ? ' · last reminder ' + fd(v.reminders[v.reminders.length - 1]) : ' · no reminder yet'), a:'Remind', go:"BM.remind('" + v.id + "')", k:0 }); } });
  S.invoices.forEach(function(v){ if(!v.sent){ out.push({ em:'🧾', t:'Invoice #' + v.num + ' isn’t sent yet', s:cust(v.customerId).name + ' · ' + money(invTotal(v)), a:'Send', go:"BM.go('inv/" + v.id + "')", k:1 }); } });
  S.jobs.forEach(function(j){
    var c = cust(j.customerId);
    if(j.status === 'done' && jobBilled(j) < jobTotal(j) - 0.004) out.push({ em:'💵', t:'Bill ' + c.name, s:j.title + ' is done · ' + money(jobTotal(j) - jobBilled(j)) + ' not billed yet', a:'Bill it', go:"BM.go('job/" + j.id + "')", k:1 });
    if(F('estimates') && j.status === 'estimate' && j.estSent && daysBetween(j.estSent, t) >= 3) out.push({ em:'📨', t:'Follow up with ' + c.name, s:'Estimate sent ' + fd(j.estSent) + ' · ' + money(jobTotal(j)), a:'Check in', go:"BM.followUp('" + j.id + "')", k:2 });
    if(F('estimates') && j.status === 'new' && daysBetween(j.created, t) >= 1) out.push({ em:'📝', t:'Send ' + c.name + ' a price', s:j.title, a:'Estimate', go:"BM.go('job/" + j.id + "')", k:3 });
    if(F('schedule') && j.status === 'approved' && !j.date) out.push({ em:'📅', t:'Put ' + c.name + ' on the schedule', s:j.title + ' was approved', a:'Schedule', go:"BM.go('job/" + j.id + "')", k:3 });
  });
  return out.sort(function(a, b){ return a.k - b.k; });
}
function jobCard(j){
  var c = cust(j.customerId), late = jobInvoices(j).some(invOverdue);
  return '<button class="card tap" onclick="BM.go(\'job/' + j.id + '\')"><div class="row"><div class="grow"><b>' + esc(j.title || 'Job') + '</b><div class="small muted">' + esc(c.name) + (j.date ? ' · ' + fd(j.date) + (j.time ? ' ' + ft(j.time) : '') : '') + '</div></div><div style="text-align:right"><div style="font-weight:800">' + money0(jobTotal(j)) + '</div>' + (late ? pill('overdue', 'Late') : pill(j.status)) + '</div></div></button>';
}

  if(!F('lineItems')) h += '<label class="f" for="jp">Price</label><input class="i" id="jp" inputmode="decimal" value="' + (j.price || '') + '">';
  if(F('schedule')) h += '<div class="two"><div><label class="f" for="jdt">Day</label><input class="i" id="jdt" type="date" value="' + esc(j.date || '') + '"></div><div><label class="f" for="jtm">Time</label><input class="i" id="jtm" type="time" value="' + esc(j.time || '') + '"></div></div>';
  h += '<label class="f" for="js">Where it stands</label><select class="i" id="js">' + stages().concat(['lost']).map(function(s){ return '<option value="' + s + '"' + (s === j.status ? ' selected' : '') + '>' + STAGE[s] + '</option>'; }).join('') + '</select></div>';
  h += '<button class="btn main full" onclick="BM.saveEditJob(\'' + j.id + '\')">Save</button><button class="btn danger full" style="margin-top:8px" onclick="BM.delJob(\'' + j.id + '\')">Delete job</button>';
  return h;
};
function saveEditJob(id){
  var j = job(id); j.customerId = $('jc').value; j.title = $('jt').value.trim() || j.title; j.desc = $('jd').value.trim();
  if($('jp')) j.price = num($('jp').value);
  if($('jdt')){ j.date = $('jdt').value; j.time = $('jtm').value; }
  j.status = $('js').value; save(); go('job/' + id);
}
function delJob(id){
  var n = S.invoices.filter(function(v){ return v.jobId === id; }).length;
  if(!confirm('Delete this job' + (n ? ' and its ' + n + ' invoice' + (n > 1 ? 's' : '') : '') + '? This can’t be undone.')) return;
  S.jobs = S.jobs.filter(function(j){ return j.id !== id; }); S.invoices = S.invoices.filter(function(v){ return v.jobId !== id; });
  S.expenses.forEach(function(e){ if(e.jobId === id) e.jobId = ''; });
  save(); go('jobs');
}

/* ── one job ── */
VIEWS.job = function(){
  var j = job(route[1]); if(!j) return '<div class="empty"><div class="em">🤷</div>That job is gone.</div>';
  var c = cust(j.customerId), h = [];
  setHead(j.title, '#' + j.num + ' · ' + c.name);
  var st = stages(), si = st.indexOf(j.status), nx = nextStage(j);
  /* where it stands */
  h.push('<div class="card"><div class="row"><div class="grow">' + pill(j.status) + '</div><button class="btn sm" onclick="BM.go(\'editjob/' + j.id + '\')">✏️ Edit</button></div>'
    + (si >= 0 ? '<div class="steps" aria-hidden="true">' + st.map(function(s, i){ return '<span class="' + (i <= si ? 'on' : '') + '"></span>'; }).join('') + '</div>' : '')
    + nextAction(j, nx) + '</div>');
  /* customer */
  h.push('<div class="card"><div class="row"><div class="grow"><b>' + esc(c.name) + '</b><div class="small muted">' + esc([c.phone, c.address].filter(Boolean).join(' · ')) + '</div></div><button class="btn sm" onclick="BM.go(\'cust/' + c.id + '\')">›</button></div><div class="btns" style="margin-top:8px">' + contactBtns(c) + '</div></div>');
  if(j.desc) h.push('<div class="card"><div class="muted small" style="font-weight:800">DETAILS</div><div style="white-space:pre-wrap">' + esc(j.desc) + '</div></div>');
  /* price */
  h.push('<h2>' + (F('estimates') ? 'Price / estimate' : 'Price') + '</h2><div class="card">');
  if(F('lineItems')){
    if(j.items.length) h.push('<table class="lines">' + j.items.map(function(l, i){ return '<tr onclick="BM.editItem(\'' + j.id + '\',' + i + ')" style="cursor:pointer"><td>' + esc(l.name) + (num(l.qty) !== 1 ? '<div class="small muted">' + num(l.qty) + ' × ' + money(l.price) + '</div>' : '') + '</td><td class="n">' + money(num(l.qty) * num(l.price)) + '</td></tr>'; }).join('') + '</table>');
    else h.push('<p class="muted" style="margin:0 0 8px">No price yet. Add items from your price list, type your own, or let the AI draft them from the details.</p>');
    h.push('<div class="btns" style="margin:8px 0"><button class="btn sm" onclick="BM.addItem(\'' + j.id + '\')">➕ Add item</button>' + (hasAI() ? '<button class="btn sm" onclick="BM.aiPrice(\'' + j.id + '\')">✨ Draft it for me</button>' : '') + '</div>');
  } else {
    h.push('<div class="row"><div class="grow">' + esc(j.title) + '</div><button class="btn sm" onclick="BM.go(\'editjob/' + j.id + '\')">' + (num(j.price) ? money(j.price) : 'Set price') + '</button></div>');
  }
  h.push(totals(jobSub(j), num(S.biz.taxRate), [], 0) + '</div>');
  if(F('estimates') && j.status !== 'lost'){
    h.push('<div class="card">' + (j.signed ? '<div>✅ <b>Approved</b> by ' + esc(j.signed.name) + ' on ' + fd(j.signed.date) + '</div>' : j.estSent ? '<div>📨 Estimate sent ' + fd(j.estSent) + ' — waiting to hear back</div>' : '<div class="muted">Estimate not sent yet.</div>')
      + '<div class="btns" style="margin-top:10px"><button class="btn sm main" onclick="BM.sendEstimate(\'' + j.id + '\')">' + (j.estSent ? 'Send again' : '📨 Send estimate') + '</button><button class="btn sm" onclick="BM.previewEst(\'' + j.id + '\')">👀 Preview</button>'
      + (!j.signed ? '<button class="btn sm" onclick="BM.approved(\'' + j.id + '\')">👍 They said yes</button>' : '') + '</div>'
      + '<p class="hint">The customer gets a link to look it over on their phone, type their name, and approve it.</p></div>');
  }
  /* schedule */
  if(F('schedule') && j.status !== 'lost' && j.status !== 'closed'){
    h.push('<h2>Schedule</h2><div class="card"><div class="two"><div><label class="f" for="sd" style="margin-top:0">Day</label><input class="i" type="date" id="sd" value="' + esc(j.date || '') + '" onchange="BM.setWhen(\'' + j.id + '\')"></div><div><label class="f" for="stm" style="margin-top:0">Time</label><input class="i" type="time" id="stm" value="' + esc(j.time || '') + '" onchange="BM.setWhen(\'' + j.id + '\')"></div></div>'
      + (j.date ? '<div class="btns" style="margin-top:10px"><button class="btn sm" onclick="BM.ics(\'' + j.id + '\')">📅 Add to my calendar</button><button class="btn sm" onclick="BM.update(\'' + j.id + '\',\'scheduled\')">💬 Confirm with ' + esc(first(c.name)) + '</button></div>' : '') + '</div>');
  }
  /* updates */
  if(j.status !== 'lost' && j.status !== 'closed') h.push('<h2>Send an update</h2><div class="btns"><button class="btn sm" onclick="BM.update(\'' + j.id + '\',\'onway\')">🚚 On my way</button><button class="btn sm" onclick="BM.update(\'' + j.id + '\',\'late\')">⏳ Running late</button><button class="btn sm" onclick="BM.update(\'' + j.id + '\',\'finished\')">✅ Work is done</button><button class="btn sm" onclick="BM.update(\'' + j.id + '\',\'custom\')">✍️ Something else</button></div>');
  /* costs */
  if(F('materials') || F('expenses')){
    var ex = S.expenses.filter(function(e){ return e.jobId === j.id; });
    h.push('<h2>Materials & costs</h2><div class="card">' + (ex.length ? '<table class="lines">' + ex.map(function(e){ return '<tr onclick="BM.addExpense(\'' + e.id + '\')" style="cursor:pointer"><td>' + esc(e.vendor || e.cat) + '<div class="small muted">' + fd(e.date) + ' · ' + esc(e.cat) + '</div></td><td class="n">' + money(e.amount) + '</td></tr>'; }).join('') + '</table>' : '<p class="muted" style="margin:0">No costs recorded for this job.</p>')
      + '<div class="btns" style="margin-top:8px"><button class="btn sm" onclick="BM.addExpense(null,\'' + j.id + '\')">➕ Add a cost or receipt</button></div></div>');
  }
  /* hours */
  if(F('crew')){
    h.push('<h2>Hours</h2><div class="card">' + ((j.times || []).length ? '<table class="lines">' + j.times.map(function(t, i){ var w = S.crew.filter(function(c){ return c.id === t.who; })[0]; return '<tr onclick="BM.delHours(\'' + j.id + '\',' + i + ')" style="cursor:pointer"><td>' + esc(w ? w.name : 'Someone') + '<div class="small muted">' + fd(t.date) + '</div></td><td class="n">' + num(t.hours) + ' hr</td></tr>'; }).join('') + '</table><div class="tot"><span>Total</span><b>' + jobHours(j) + ' hr</b></div>' : '<p class="muted" style="margin:0">No hours logged.</p>')
      + '<div class="btns" style="margin-top:8px">' + (S.clock && S.clock.jobId === j.id ? '<button class="btn sm good" onclick="BM.clockOut()">⏱ Clock out</button>' : '<button class="btn sm" onclick="BM.clockPick(\'' + j.id + '\')">⏱ Clock in</button>') + '<button class="btn sm" onclick="BM.logHours(\'' + j.id + '\')">➕ Log hours</button></div></div>');
  }
  /* billing */
  if(j.status !== 'lost'){
    var vs = jobInvoices(j), billed = jobBilled(j), left = r2(jobTotal(j) - billed);
    h.push('<h2>Billing</h2><div class="card">' + (vs.length ? vs.map(function(v){ var b = invBal(v); return '<button class="card tap" style="margin-bottom:8px" onclick="BM.go(\'inv/' + v.id + '\')"><div class="row"><div class="grow"><b>Invoice #' + v.num + '</b> <span class="muted small">' + esc(KIND[v.kind] || '') + '</span><div class="small muted">' + fd(v.date) + '</div></div><div style="text-align:right"><b>' + money(invTotal(v)) + '</b><div>' + invPill(v) + '</div></div></div></button>'; }).join('') : '')
      + '<div class="tot"><span>Job total</span><b>' + money(jobTotal(j)) + '</b></div><div class="tot"><span>Billed so far</span><span>' + money(billed) + '</span></div><div class="tot"><span>Paid so far</span><span>' + money(jobPaid(j)) + '</span></div>'
      + '<div class="btns" style="margin-top:10px">' + (F('deposits') && !vs.length ? '<button class="btn sm" onclick="BM.newInvoice(\'' + j.id + '\',\'deposit\')">Deposit (' + num(S.biz.depositPct) + '%)</button>' : '')
      + (F('deposits') ? '<button class="btn sm" onclick="BM.newInvoice(\'' + j.id + '\',\'progress\')">Progress bill</button>' : '')
      + (left > 0.004 ? '<button class="btn sm main" onclick="BM.newInvoice(\'' + j.id + '\',\'final\')">🧾 ' + (vs.length ? 'Final invoice (' + money(left) + ')' : 'Make the invoice') + '</button>' : '') + '</div></div>');
  }
  /* how did it go */
  if(j.status === 'done' || j.status === 'closed'){
    var inc = jobTotal(j) - jobTax(j), mat = jobMaterials(j), lab = jobLabor(j), pr = inc - mat - lab, mg = inc > 0 ? Math.round(pr / inc * 100) : 0;
    h.push('<h2>How did this job do?</h2><div class="card"><div class="tot"><span>Charged (before tax)</span><span>' + money(inc) + '</span></div><div class="tot"><span>Materials & costs</span><span>−' + money(mat) + '</span></div>'
      + (F('crew') ? '<div class="tot"><span>Crew pay (' + jobHours(j) + ' hr)</span><span>−' + money(lab) + '</span></div>' : '')
      + '<div class="tot grand"><span>Kept</span><span style="color:' + (pr >= 0 ? 'var(--good)' : 'var(--bad)') + '">' + money(pr) + ' <span class="small">(' + mg + '%)</span></span></div>'
      + '<p class="hint">' + (mg < 15 ? '⚠️ Thin. Was it priced too low, or did it run long?' : mg < 35 ? 'OK, but watch it. Many trades aim for 35%+ after materials and help.' : '👍 Healthy margin.') + ' Your own time isn’t counted here.</p>'
      + (hasAI() ? '<button class="btn sm full" onclick="BM.review(\'' + j.id + '\')">✨ Review this job with AI — what to do differently</button>' : '') + (j.review ? '<div class="banner" style="margin-top:10px;white-space:pre-wrap">' + esc(j.review) + '</div>' : '') + '</div>');
  }
  /* notes */
  h.push('<h2>Notes</h2><textarea class="i" id="jn" placeholder="Private notes — only you see these" onchange="BM.saveNote(\'' + j.id + '\')">' + esc(j.notes || '') + '</textarea>');
  if((j.log || []).length) h.push('<h2>History</h2><div class="card small muted">' + j.log.slice().reverse().slice(0, 12).map(function(l){ return fd(l.d) + ' — ' + esc(l.t); }).join('<br>') + '</div>');
  return h.join('');
};
function nextAction(j, nx){
  var b = function(label, fn, cls){ return '<button class="btn full ' + (cls || 'main') + '" style="margin-top:10px" onclick="' + fn + '">' + label + '</button>'; };
  if(j.status === 'lost') return b('Bring this job back', "BM.setStage('" + j.id + "','new')", '');
  if(j.status === 'closed') return '<p class="hint">Paid in full. 🙌</p>';
  if(j.status === 'new' && F('estimates')) return b('📨 Send the estimate', "BM.sendEstimate('" + j.id + "')") + '<button class="btn sm full" style="margin-top:6px" onclick="BM.setStage(\'' + j.id + '\',\'lost\')">Didn’t get it</button>';
  if(j.status === 'estimate') return b('👍 They said yes', "BM.approved('" + j.id + "')") + '<button class="btn sm full" style="margin-top:6px" onclick="BM.setStage(\'' + j.id + '\',\'lost\')">They said no</button>';
  if(j.status === 'done'){ var left = r2(jobTotal(j) - jobBilled(j)); return left > 0.004 ? b('🧾 Bill it — ' + money(left), "BM.newInvoice('" + j.id + "','final')") : b('See the invoice', "BM.go('inv/" + (jobInvoices(j)[0] || {}).id + "')", ''); }
  if(!nx) return '';
  var label = { approved:'👍 Approved', scheduled:'📅 Put on the schedule', working:'🔨 Start the work', done:'✅ Work is done', closed:'Mark paid & closed' }[nx] || STAGE[nx];
  if(nx === 'scheduled' && !j.date) return b(label, "document.getElementById('sd').focus();document.getElementById('sd').scrollIntoView({block:'center'})");
  return b(label, "BM.setStage('" + j.id + "','" + nx + "')");
}
function setStage(id, st){
  var j = job(id); j.status = st; logJob(j, 'Marked “' + STAGE[st] + '”'); save(); render();
  if(st === 'done') toast('Nice. Next: bill it.');
}
function logJob(j, t){ (j.log = j.log || []).push({ d:today(), t:t }); }
function setWhen(id){ var j = job(id); j.date = $('sd').value; j.time = $('stm').value; if(j.date && (j.status === 'approved' || (j.status === 'new' && !F('estimates')))) j.status = 'scheduled'; save(); render(); }
function saveNote(id){ job(id).notes = $('jn').value; save(); toast('Saved'); }
function totals(sub, tax, credits, paid){
  var t = r2(sub * tax / 100), cr = r2((credits || []).reduce(function(a, c){ return a + num(c.amount); }, 0)), tot = r2(sub + t - cr);
  var h = '';
  if(tax || cr || paid) h += '<div class="tot"><span>Subtotal</span><span>' + money(sub) + '</span></div>';
  if(tax) h += '<div class="tot"><span>Sales tax (' + tax + '%)</span><span>' + money(t) + '</span></div>';
  (credits || []).forEach(function(c){ h += '<div class="tot"><span>' + esc(c.name) + '</span><span>−' + money(c.amount) + '</span></div>'; });
  h += '<div class="tot grand"><span>Total</span><span>' + money(tot) + '</span></div>';
  if(paid) h += '<div class="tot"><span>Paid</span><span>−' + money(paid) + '</span></div><div class="tot grand"><span>Balance due</span><span>' + money(tot - paid) + '</span></div>';
  return h;
}

/* ── line items ── */
function sheet(html, onOpen){
  closeSheet();
  var w = document.createElement('div'); w.className = 'shade'; w.id = 'bmSheet'; w.setAttribute('role', 'dialog');
  w.innerHTML = '<div class="sheet"><button class="x" onclick="BM.closeSheet()" aria-label="Close">✕</button>' + html + '</div>';
  w.addEventListener('click', function(e){ if(e.target === w) closeSheet(); });
  document.body.appendChild(w); if(onOpen) onOpen(w);
  return w;
}
function closeSheet(){ var s = $('bmSheet'); if(s) s.remove(); }
function addItem(jid){
  var h = '<h3>Add to the price</h3><p class="muted" style="margin:0 0 10px">Tap one from your price list, or make your own.</p>';
  h += '<button class="opt" onclick="BM.editItem(\'' + jid + '\',-1)"><span class="e">✍️</span><span>Type my own item</span></button>';
  h += S.prices.map(function(p, i){ return '<button class="opt" onclick="BM.pickPrice(\'' + jid + '\',' + i + ')"><span class="grow">' + esc(p.name) + '</span><span>' + (num(p.price) ? money(p.price) : 'set price') + '</span></button>'; }).join('');
  sheet(h);
}
function pickPrice(jid, i){ var p = S.prices[i]; editItem(jid, -1, { name:p.name, qty:1, price:p.price }); }
function editItem(jid, idx, preset){
  var j = job(jid), l = idx >= 0 ? j.items[idx] : (preset || { name:'', qty:1, price:'' });
  sheet('<h3>' + (idx >= 0 ? 'Change item' : 'New item') + '</h3><label class="f" for="iN">What</label><input class="i" id="iN" value="' + esc(l.name) + '" placeholder="Labor, part, service…">'
    + '<div class="two"><div><label class="f" for="iQ">How many</label><input class="i" id="iQ" inputmode="decimal" value="' + esc(l.qty) + '"></div><div><label class="f" for="iP">Price each</label><input class="i" id="iP" inputmode="decimal" value="' + esc(l.price) + '" placeholder="$"></div></div>'
    + '<div class="btns" style="margin-top:14px"><button class="btn main" onclick="BM.saveItem(\'' + jid + '\',' + idx + ')">Save</button>' + (idx >= 0 ? '<button class="btn danger" onclick="BM.delItem(\'' + jid + '\',' + idx + ')">Remove</button>' : '') + '</div>',
    function(){ setTimeout(function(){ var f = (preset && preset.name) ? $('iP') : $('iN'); if(f) f.focus(); }, 80); });
}
function saveItem(jid, idx){
  var j = job(jid), l = { name:$('iN').value.trim(), qty:num($('iQ').value) || 1, price:num($('iP').value) };
  if(!l.name){ alert('What is it?'); return; }
  if(idx >= 0) j.items[idx] = l; else j.items.push(l);
  if(!S.prices.some(function(p){ return p.name.toLowerCase() === l.name.toLowerCase(); }) && idx < 0 && l.price) S.prices.push({ name:l.name, price:l.price });
  save(); closeSheet(); render();
}
function delItem(jid, idx){ job(jid).items.splice(idx, 1); save(); closeSheet(); render(); }

/* ── AI helpers (all optional; the app works without them) ── */
function aiPrice(jid){
  var j = job(jid);
  if(!j.desc && !j.title){ alert('Add some details about the job first.'); return; }
  var pl = S.prices.map(function(p){ return '- ' + p.name + ': $' + num(p.price); }).join('\n');
  djAI.ask({ title:'Draft the price', want:'json', circle:false,
    prompt:'I run a small ' + TRADES[S.biz.trade].name.toLowerCase() + ' business. Draft line items for an estimate.\n\nJob: ' + j.title + '\nDetails: ' + (j.desc || '(none)') + '\n\nMy price list (use these prices where they fit):\n' + (pl || '(none yet)') + '\n\nAnswer with JSON only, like {"items":[{"name":"Labor (per hour)","qty":3,"price":110}],"note":"one short sentence of anything I should check"}. Use realistic US prices when my list has nothing that fits. Keep it to the items a customer would expect to see.',
    onResult:function(v){ var items = (v && (v.items || v)) || []; if(!Array.isArray(items) || !items.length){ alert('I couldn’t read items in that answer.'); return; }
      items.forEach(function(x){ if(x && x.name) j.items.push({ name:String(x.name), qty:num(x.qty) || 1, price:num(x.price) }); });
      if(v.note) logJob(j, 'AI note: ' + v.note); save(); render(); toast('Added ' + items.length + ' items — check the prices'); } });
}
function review(jid){
  var j = job(jid), c = cust(j.customerId), inc = jobTotal(j) - jobTax(j);
  var exp = S.expenses.filter(function(e){ return e.jobId === j.id; }).map(function(e){ return e.vendor + ' ' + money(e.amount); }).join(', ');
  djAI.ask({ title:'Review this job', circle:false,
    prompt:'I run a small ' + TRADES[S.biz.trade].name.toLowerCase() + ' business. Review this finished job like a sharp, friendly mentor who is also a CPA.\n\nJob: ' + j.title + '\nDetails: ' + (j.desc || '') + '\nPriced at (before tax): ' + money(inc) + '\nLine items: ' + (j.items || []).map(function(l){ return l.name + ' ' + num(l.qty) + '×$' + num(l.price); }).join('; ')
      + '\nMaterials & costs: ' + money(jobMaterials(j)) + (exp ? ' (' + exp + ')' : '') + '\nHelper hours: ' + jobHours(j) + ', helper pay ' + money(jobLabor(j)) + '\nPaid so far: ' + money(jobPaid(j)) + ' of ' + money(jobTotal(j))
      + (j.estSent && j.signed ? '\nEstimate sent ' + j.estSent + ', approved ' + j.signed.date : '') + '\nMy notes: ' + (j.notes || '(none)')
      + '\n\nGive me: 1) one line on how it went, 2) up to three specific things to do differently on the next job like this (pricing, materials, time), 3) one sentence I could reuse in my next estimate. Plain words, short.',
    onResult:function(v, raw){ j.review = String(raw || v).trim(); save(); render(); } });
}

/* ── messages ── */
function tpl(kind, o){
  var b = S.biz, n = first(o.c && o.c.name), sig = '\n— ' + (b.owner ? first(b.owner) + ', ' : '') + (b.name || '');
  var T = {
    estimate:'Hi ' + n + ', thanks for having me out. Here’s your estimate for ' + o.title + ': ' + o.amount + '.\n\nYou can look it over and approve it here:\n' + o.link + '\n\nAny questions, just reply.' + sig,
    followup:'Hi ' + n + ', just checking in on the estimate for ' + o.title + '. Happy to answer questions or adjust anything. Here it is again:\n' + o.link + sig,
    invoice:'Hi ' + n + ', here’s your invoice for ' + o.title + '. Amount due: ' + o.amount + (o.due ? ' (due ' + fdLong(o.due) + ')' : '') + '.\n\nYou can see it and pay here:\n' + o.link + '\n\nThank you for your business!' + sig,
    reminder:'Hi ' + n + ', a friendly reminder that invoice #' + o.num + ' for ' + o.amount + ' was due ' + fdLong(o.due) + '. Here’s the link to pay:\n' + o.link + '\n\nIf you’ve already sent it, thank you — please ignore this.' + sig,
    scheduled:'Hi ' + n + ', you’re on the schedule for ' + fd(o.date) + (o.time ? ' at ' + ft(o.time) : '') + ' for ' + o.title + '. Reply here if that needs to change.' + sig,
    onway:'Hi ' + n + ', this is ' + (b.owner ? first(b.owner) : 'your contractor') + ' with ' + (b.name || 'us') + ' — I’m on my way and should be there in about 20 minutes.',
    late:'Hi ' + n + ', I’m running about 30 minutes behind. Sorry about that — I’ll be there as soon as I can.' + sig,

    thanks:'Thank you for your payment, ' + n + '! It was a pleasure working for you.' + (b.reviewLink ? ' If you were happy with the work, a quick review would mean a lot:\n' + b.reviewLink : '') + sig,
    custom:'Hi ' + n + ', ' + sig
  };
  return T[kind] || T.custom;

/* ── money ── */
function period(p){
  var d = new Date(), y = d.getFullYear(), m = d.getMonth();
  if(p === 'lm'){ var a = new Date(y, m - 1, 1); return [ymd(a), ymd(new Date(y, m, 0)), MON[a.getMonth()] + ' ' + a.getFullYear()]; }
  if(p === 'ty') return [y + '-01-01', y + '-12-31', String(y)];
  if(p === 'ly') return [(y - 1) + '-01-01', (y - 1) + '-12-31', String(y - 1)];
  if(p === 'all') return ['0000', '9999', 'All time'];
  return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0)), MON[m] + ' ' + y];
}
function pl(from, to){
  var inc = [], exp = {}, out = 0, inn = 0, personal = 0;
  S.invoices.forEach(function(v){ (v.payments || []).forEach(function(p){ if(p.date >= from && p.date <= to){ inc.push({ date:p.date, amount:num(p.amount), method:p.method, v:v }); inn += num(p.amount); } }); });
  S.expenses.forEach(function(e){ if(e.date >= from && e.date <= to){ if(e.cat === 'Personal (not business)'){ personal += num(e.amount); return; } exp[e.cat] = (exp[e.cat] || 0) + num(e.amount); out += num(e.amount); } });
  /* sales tax collected is not income: pull the taxed share of each payment back out */
  var tax = 0; inc.forEach(function(p){ var t = invTotal(p.v), tx = invTax(p.v); if(t > 0 && tx > 0) tax += p.amount * tx / t; });
  tax = r2(tax);
  return { inc:inc, income:r2(inn - tax), salesTax:tax, gross:r2(inn), exp:exp, out:r2(out), profit:r2(inn - tax - out), personal:r2(personal) };
}

function readFile(inp){ var f = inp.files && inp.files[0]; if(!f) return; if(/\.xlsx?$/i.test(f.name)){ alert('That’s an Excel file. Open it in Excel or Google Sheets and save it as CSV first.'); return; } var r = new FileReader(); r.onload = function(){ parseImport(String(r.result)); }; r.readAsText(f); }

function csvRows(t){
  var rows = [], row = [], cur = '', q = false, delim = (t.split('\n')[0].split('\t').length > t.split('\n')[0].split(',').length) ? '\t' : ',';
  for(var i = 0; i < t.length; i++){
    var ch = t[i];

    else if(ch === '"') q = true;

    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); if(row.some(function(x){ return x.trim(); })) rows.push(row); row = []; cur = ''; }
    else cur += ch;

function anyDate(s){

function parseImport(text){

  for(var i = 0; i < Math.min(rows.length, 15); i++){ var low = rows[i].join('|').toLowerCase(); if(/date/.test(low) && /(amount|debit|credit|withdrawal)/.test(low)){ hi = i; break; } }

  var cD = col(/trans.*date|^date|posted|post date|date/), cDesc = col(/desc|payee|merchant|name|memo|details|item/), cA = col(/^amount|amount/), cDr = col(/debit|withdrawal|charge/), cCr = col(/credit|deposit|payment/, /card/);
  if(hi < 0){ /* no header: guess date, description, amount by looking */
    var s = body[0] || []; s.forEach(function(v, k){ if(cD < 0 && anyDate(v) && /\d/.test(v)) cD = k; else if(cA < 0 && /^-?\(?\$?-?[\d,]+\.\d{2}\)?$/.test(v)) cA = k; else if(cDesc < 0 && /[a-z]/i.test(v)) cDesc = k; });
  }
  if(cD < 0 || (cA < 0 && cDr < 0)){ alert('I couldn’t tell which columns are the date and the amount. Make sure the file has a header row like “Date, Description, Amount”.'); return; }
  var items = body.map(function(r){
    var a; if(cDr >= 0){ var dr = num((r[cDr] || '').replace(/[()]/g, '')), cr = cCr >= 0 ? num((r[cCr] || '').replace(/[()]/g, '')) : 0; a = dr ? -Math.abs(dr) : Math.abs(cr); }
    else { var raw = r[cA] || ''; a = num(raw.replace(/[()]/g, '')); if(/^\(.*\)$/.test(raw.trim())) a = -Math.abs(a); }
    return { date:anyDate(r[cD]), desc:(cDesc >= 0 ? r[cDesc] : r.filter(function(x, k){ return k !== cD && k !== cA; }).join(' ')).replace(/\s+/g, ' ').trim(), raw:a };
  }).filter(function(x){ return x.date && x.raw; });
