<style>
  :root{ color-scheme:light;

    --brand:#1E3A4C; --brand2:#2C5670; --amber:#E8A317; --amberSoft:#FDF3DC;

    --r:16px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); }
  body{ font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
  button,input,select,textarea{ font:inherit; color:inherit; }
  a{ color:var(--brand2); }
  header.top{ position:sticky; top:0; z-index:20; background:var(--brand); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:10px; }
  header.top .back{ background:rgba(255,255,255,.14); border:0; color:#fff; min-width:44px; min-height:44px; border-radius:12px; font-size:22px; cursor:pointer; }
  header.top h1{ font-size:20px; margin:0; flex:1; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.top .sub{ font-size:13px; opacity:.8; font-weight:600; }
  main{ max-width:720px; margin:0 auto; padding:14px 16px 24px; }
  h2{ font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--soft); margin:22px 2px 8px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; }
  .card.tap{ cursor:pointer; display:block; width:100%; text-align:left; }
  .card.tap:active{ background:#FAF8F3; }
  .row{ display:flex; align-items:center; gap:10px; }
  .grow{ flex:1; min-width:0; }
  .muted{ color:var(--soft); font-size:15px; }
  .small{ font-size:13.5px; }
  .big{ font-size:30px; font-weight:850; letter-spacing:-.01em; line-height:1.1; }
  .brief p{ margin:0 0 6px; font-size:16.5px; line-height:1.45; } .brief .chip{ min-height:36px; padding:4px 12px; }
  .talkbtn{ min-height:60px; font-size:18px; margin-bottom:10px; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .daytexts{ margin:0 0 10px; }
  .alerts{ background:#FFF6E5; border-color:#E8C987; } .alerts .alert1{ border-top:1px solid #EBD9B0; padding-top:8px; margin-top:8px; } .alerts .alert1 p{ margin:0 0 6px; font-size:16px; line-height:1.4; } .alerts .btns .btn{ min-height:42px; } .daytexts .btn{ flex:1 1 30%; padding:8px 6px; font-size:15px; }
  .live{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -2px 10px; padding:0 2px 4px; scrollbar-width:none; } .live::-webkit-scrollbar{ display:none; }
  .live .live1{ flex:0 0 88%; scroll-snap-align:start; text-align:left; margin:0; cursor:pointer; font:inherit; color:inherit; }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; cursor:pointer; text-align:left; }
  .stat .lbl{ font-size:14px; color:var(--soft); font-weight:700; }

  .btn.main{ background:var(--brand); color:#fff; border-color:transparent; }
  .btn.amber{ background:var(--amber); color:#241A00; border-color:transparent; }
  .btn.good{ background:var(--good); color:#fff; border-color:transparent; }

  .pill.working{ background:#FFF0D6; color:#8A4B00; } .pill.done{ background:var(--badSoft); color:var(--bad); }
  .pill.closed,.pill.paid{ background:var(--goodSoft); color:var(--good); } .pill.overdue{ background:var(--bad); color:#fff; }

  /* bottom bar */
  nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--line); display:flex; padding:4px 4px calc(4px + env(safe-area-inset-bottom)); }

  nav.tabs button.on{ color:var(--brand); background:#EEF2F5; }
  nav.tabs button.plus .e{ background:var(--amber); color:#241A00; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; margin-top:-4px; box-shadow:0 3px 10px rgba(0,0,0,.18); }

  .sheet{ background:var(--bg); width:100%; max-width:600px; max-height:90vh; overflow:auto; border-radius:22px 22px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); }

  .opt{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; min-height:58px; margin-bottom:8px; cursor:pointer; font-weight:750; }
  .opt .e{ font-size:24px; width:32px; text-align:center; flex:none; }
  .opt small{ display:block; font-weight:500; color:var(--soft); font-size:14px; }
  /* setup chat */
  .chat{ display:flex; flex-direction:column; gap:10px; }
  .bubble{ background:#fff; border:1px solid var(--line); border-radius:18px 18px 18px 6px; padding:12px 14px; max-width:92%; }
  .bubble.me{ align-self:flex-end; background:var(--brand); color:#fff; border-color:var(--brand); border-radius:18px 18px 6px 18px; }
  .answers{ display:grid; gap:8px; margin-top:4px; }
  .answers.grid{ grid-template-columns:1fr 1fr; }
  .toggle{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #EEE9DF; }
  .toggle:last-child{ border-bottom:0; }
  .switch{ position:relative; width:54px; height:32px; flex:none; }
  .switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; inset:0; cursor:pointer; z-index:1; }
  .switch span{ position:absolute; inset:0; background:#CBC5B8; border-radius:99px; transition:.2s; }
  .switch span::after{ content:""; position:absolute; left:3px; top:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + span{ background:var(--good); }
  .switch input:checked + span::after{ transform:translateX(22px); }
  .switch input:focus-visible + span{ outline:3px solid #9CC3DD; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); z-index:200; background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:750; max-width:90vw; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .bar{ height:10px; border-radius:9px; background:#E9E4DA; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--brand2); }
  /* Quick Quote engine (v1.1): options, photos, the sign-here pad */
  .tiers{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-bottom:8px; }
  .tier{ min-height:58px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-weight:750; font-size:13.5px; padding:6px 4px; cursor:pointer; line-height:1.2; overflow-wrap:anywhere; color:var(--ink); }
  .tier b{ display:block; font-size:15px; margin-top:2px; }
  .tier.on{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .tier:disabled{ cursor:default; }
  .from{ font-size:12.5px; color:var(--good); font-weight:700; }
  .opt.pre{ border-color:var(--brand); box-shadow:inset 0 0 0 2px var(--brand); }
  .vopt{ display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; cursor:pointer; color:var(--ink); min-height:58px; }
  .vopt.on{ border-color:var(--good); box-shadow:inset 0 0 0 2px var(--good); background:var(--goodSoft); }
  .vopt .ol{ font-size:14px; color:var(--soft); margin:2px 0; }
  .vopt .ot{ font-weight:850; font-size:18px; text-align:right; }
  .phs{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:8px; }
  .ph{ position:relative; }
  .ph img{ width:100%; height:120px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; background:#EEE; }
  .ph .px{ position:absolute; top:4px; right:4px; min-width:44px; min-height:44px; border-radius:12px; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:18px; cursor:pointer; }
  .sgpad canvas{ display:block; width:100%; height:150px; background:#fff; border:1.5px dashed #B9B1A2; border-radius:12px; touch-action:none; }
  .sigimg{ display:block; max-width:280px; width:100%; height:auto; background:#fff; border:1px solid var(--line); border-radius:10px; }
  .foot{ text-align:center; font-size:12.5px; color:var(--soft); margin-top:14px; }
  #bmVer{ margin:0 auto 10px; padding:0 16px; } #main:has(.foot) ~ #bmVer{ display:none; }
  #bmPrint{ display:none; }
  @media (max-width:380px){ .stats{ grid-template-columns:1fr; } .two{ grid-template-columns:1fr; } }
  @media print{ nav.tabs, header.top .back, .noprint{ display:none !important; } body{ padding:0; background:#fff; }
    body.bmprinting > *:not(#bmPrint){ display:none !important; } body.bmprinting #bmPrint{ display:block; } }
</style>

<script>
/* Business Manager — one simple app for a one-truck trade business.
   Everything lives on this phone under one key (bizmgr_v1). Customers get links to view.html,
   which carries the estimate or invoice inside the link itself, so nothing needs a server yet. */
(function(){
'use strict';
if(/^#ok\//.test(location.hash)) window.DJ_GUEST = true;
var KEY = 'bizmgr_v1';
var S = null, preview = false;   /* preview: the tour is showing the example business — nothing is saved */
/* v1.1 (9 Oct 2026): Quick Quote lives inside Business Manager. S.mode is 'quotes' (Quick Quote — estimates only:
   invoices, expenses, profit, schedule, crew, tax dates and to-dos are hidden, never deleted) or 'full'. The store
   links add ?mode=quotes or ?mode=full, which preselects the choice in the setup interview. Turning on the rest
   later keeps every quote, price and signature — nothing is retyped. */
/* v1.4 (20 Oct 2026): one file, two regions. Jerry: "We need a Kenyan version. I don't want to make it hard for the
   American market." The same file is shipped to business-manager/ (US) and business-manager-ke/ (Kenya); the folder
   picks the region (?region=ke also works, for testing). Kenya: money in whole shillings (KES 18,500), M-Pesa first
   (Till / Buy Goods, Paybill + account, Send Money) plus bank transfer and cash, a payment can carry its M-Pesa code,
   VAT 16% only when VAT-registered, the KRA PIN on estimates and invoices, KRA due dates (VAT and Turnover Tax by the
   20th, PAYE by the 9th, the income tax return by 30 June, eTIMS), +254 phones, town and county, Kenyan examples and
   starting prices. Same saved book (bizmgr_v1), so the Kenya test checks keep working; a Kenyan book carries region:'ke'.
   Every Kenya change sits behind KE: with the region US every word, price and $ is exactly as before. */
var KE = /\/business-manager-ke(\/|$)/.test(location.pathname) || /[?&]region=ke\b/.test(location.search);
function L(us, ke){ return KE ? ke : us; }
var TAXN = L('Sales tax', 'VAT'), CUR = L('$', 'KES'), TRIPMIN = L(300, 5000);
var VER = 'v2.4 · 2026-11-26';
/* Prices (membership model, Jerry 10 Oct 2026 — matches the business shelf page): quotes only $49 a year, the full
   office $149 a year; the $49 counts toward it, so the upgrade is $100 a year more. Founding members: first year free,
   then half price. Change them here only. No payment gates while testing — nobody pays. */
var PRICE = { quotes:'$49 a year', full:'$149 a year', upgrade:'$100 a year' };
window.BM_REGION = KE ? 'ke' : 'us';
var URLMODE = (location.search.match(/[?&]mode=(quotes|full)\b/) || [])[1] || '';
var QHIDE = { deposits:1, schedule:1, materials:1, crew:1, expenses:1, todos:1, reminders:1 };
function QM(){ return !!(S && S.mode === 'quotes'); }
function appName(){ return (S && S.mode) ? (S.mode === 'quotes' ? 'Quick Quote' : 'Business Manager') : (URLMODE === 'quotes' ? 'Quick Quote' : 'Business Manager'); }

/* ── little helpers ─────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ymd(d){ d = d || new Date(); if(window.djYMD) try{ return djYMD(d); }catch(e){} var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (x < 10 ? '0' : '') + x; }
function today(){ return ymd(new Date()); }
function addDays(s, n){ var d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
function parseD(s){ var p = String(s || '').split('-'); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / 864e5); }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fd(s){ if(!s) return ''; var d = parseD(s); if(KE) return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); }
function fdLong(s){ if(!s) return ''; var d = parseD(s); if(KE) return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function ft(t){ if(!t) return ''; var p = t.split(':'), h = +p[0], m = p[1] || '00'; return ((h + 11) % 12 + 1) + (m !== '00' ? ':' + m : '') + (h < 12 ? 'am' : 'pm'); }
function money(n){ if(KE) return money0(n); n = Math.round((+n || 0) * 100) / 100; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money0(n){ n = Math.round(+n || 0); if(KE) return (n < 0 ? '-KES ' : 'KES ') + Math.abs(n).toLocaleString('en-KE'); return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US'); }
function num(v){ var t = String(v == null ? '' : v); if(KE) t = t.replace(/\b(kes|kshs?|shs?)\.?/ig, ''); var n = parseFloat(t.replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; }
function cur(n){ return KE ? 'KES ' + n : '$' + n; }   /* amounts inside AI requests */
/* phone links: in Kenya a number typed as 07… or 01… is dialled as +254… */
function tel(p){ var t = String(p || '').replace(/[^\d+]/g, ''); if(KE && /^0[17]\d{8}$/.test(t)) t = '+254' + t.slice(1); else if(KE && /^254\d{9}$/.test(t)) t = '+' + t; return t; }
function r2(n){ return Math.round(n * 100) / 100; }
function first(name){ return String(name || '').trim().split(/\s+/)[0] || 'there'; }
function toast(t){ var o = document.querySelector('.toast'); if(o) o.remove(); var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600); }
function hasAI(){ return !!(window.djAI && djAI.ask); }

/* ── the trades: starter prices, wording ────────────────────── */
var TRADES = {
  plumbing:   { name:'Plumbing', em:'🔧', items:[['Service call / trip charge',1,95],['Labor (per hour)',1,110],['Drain cleaning',1,175],['Faucet replace (labor)',1,225],['Water heater install, 40–50 gal',1,1450],['Toilet replace (labor)',1,250]] },

/* ── money math ─────────────────────────────────────────────── */
function lineSum(lines){ return r2((lines || []).reduce(function(a, l){ return a + num(l.qty) * num(l.price); }, 0)); }
function jobSub(j){ return F('lineItems') && j.items && j.items.length ? lineSum(j.items) : r2(num(j.price)); }
function jobTax(j){ return r2(jobSub(j) * num(S.biz.taxRate) / 100); }
function jobTotal(j){ return r2(jobSub(j) + jobTax(j)); }
function invSub(v){ return lineSum(v.lines); }
function invTax(v){ return r2(invSub(v) * num(v.taxRate) / 100); }
function invCredits(v){ return r2((v.credits || []).reduce(function(a, c){ return a + num(c.amount); }, 0)); }
function invTotal(v){ return r2(invSub(v) + invTax(v) - invCredits(v)); }
function invPaid(v){ return r2((v.payments || []).reduce(function(a, p){ return a + num(p.amount); }, 0)); }
function invBal(v){ return r2(invTotal(v) - invPaid(v)); }
function invOverdue(v){ return invBal(v) > 0.004 && v.due && v.due < today(); }
function jobInvoices(j){ return S.invoices.filter(function(v){ return v.jobId === j.id; }); }
function jobBilled(j){ return r2(jobInvoices(j).reduce(function(a, v){ return a + invTotal(v); }, 0)); }
function jobPaid(j){ return r2(jobInvoices(j).reduce(function(a, v){ return a + invPaid(v); }, 0)); }
function jobMaterials(j){ return r2(S.expenses.filter(function(e){ return e.jobId === j.id; }).reduce(function(a, e){ return a + num(e.amount); }, 0)); }
function jobHours(j){ return r2((j.times || []).reduce(function(a, t){ return a + num(t.hours); }, 0)); }
function jobLabor(j){ return r2((j.times || []).reduce(function(a, t){ var c = S.crew.filter(function(x){ return x.id === t.who; })[0]; return a + num(t.hours) * (c ? num(c.rate) : 0); }, 0)); }
function cust(id){ return S.customers.filter(function(c){ return c.id === id; })[0] || { name:'(no customer)', id:'' }; }
function job(id){ return S.jobs.filter(function(j){ return j.id === id; })[0]; }
function inv(id){ return S.invoices.filter(function(v){ return v.id === id; })[0]; }
function owed(){ return S.invoices.filter(function(v){ return invBal(v) > 0.004 && v.sent; }); }

/* v1.9.8 (20 Nov, Jerry: "If you go one screen too far … you can't go back"). Business Manager's screens are hash
   routes, so the phone's Back already walks them. The boxes that slide up were the gap: with one open, the phone's
   Back left the app and the box stayed. Now each box joins the house's back trail (djBack, house v68+): the phone's
   Back or edge swipe closes it, and a box opened from another box (Running late → the message) gets a ← Back chip and
   a Back that returns to the box before. Closing a box any other way (✕, Save, Send) takes its steps off the trail. */
var SHB = 0, SHB_UNWIND = 0;
function sheetBack(fn){ if(!window.djBack || djBack.navigating()) return; SHB++; djBack.push(function(){ SHB = Math.max(0, SHB - 1); if(SHB_UNWIND) return; fn(); }); }
function sheetGone(){ var s = $('bmSheet'); if(!s) return; if(s.querySelector('#tkMic')) micStop(); s.remove(); }
/* v2.0.8 (21 Nov): the talk box opts out of the back trail (noBack). Jerry tried last night's v1.9.7 side by side and
   it listened on his iPhone while the current app didn't; the only difference in that path was this: opening a box adds
   a history step (pushState) for the phone's Back, right as the microphone starts — which looks to be what cuts an
   iPhone's listening off. The talk box closes with ✕ as it did in v1.9.7; every other box keeps Back. */
function sheet(html, onOpen, noBack){
  var had = !!$('bmSheet'); sheetGone();
  if(!had && !noBack) sheetBack(sheetGone);
  var w = document.createElement('div'); w.className = 'shade'; w.id = 'bmSheet'; w.setAttribute('role', 'dialog');
  var chip = (SHB > 1 && window.djBack) ? djBack.button() : '';
  w.innerHTML = '<div class="sheet"><button class="x" onclick="BM.closeSheet()" aria-label="Close" title="Close">✕</button>' + chip + html + '</div>';
  var cb = w.querySelector('.djBackB'); if(cb) cb.onclick = function(){ djBack.go(); };
  w.addEventListener('click', function(e){ if(e.target === w && !w.getAttribute('data-hold')) closeSheet(); });
  document.body.appendChild(w); if(onOpen) onOpen(w);
  return w;
}
function closeSheet(quiet){ var s = $('bmSheet'); if(!s) return; if(!quiet && s.getAttribute('data-compose')) clearPending(); sheetGone();
  if(SHB && window.djBack && !djBack.navigating()){ SHB_UNWIND = 1; var n = SHB; while(n-- > 0 && djBack.depth()) djBack.go(); SHB_UNWIND = 0; SHB = 0; } }

/* pricing with AI lives in the Quick Quote engine below (aiQuote); the old line format is still read by parsePriceAnswer */
/* the AI answers in plain lines ("Labor | 3 | 110"); older answers in JSON still work */
function bulletless(t){ return String(t || '').split(/\r?\n/).map(function(l){ return l.replace(/^\s*[-*•·]\s+/, '').replace(/\*\*|`/g, '').trim(); }).filter(Boolean); }
function parsePriceAnswer(t){
  var out = { items:[], note:'' }, js = null;
  try{ js = djAI.extractJSON(t); }catch(e){}
  var arr = js && (Array.isArray(js) ? js : js.items);
  if(Array.isArray(arr)){ arr.forEach(function(x){ if(x && x.name) out.items.push({ name:String(x.name), qty:num(x.qty) || 1, price:num(x.price) }); }); out.note = js.note || ''; if(out.items.length) return out; }
  bulletless(t).forEach(function(l){
    l = l.replace(/^\d+[.)]\s+/, '');
    if(/^note\s*:/i.test(l)){ out.note = l.replace(/^note\s*:\s*/i, ''); return; }
    var name, qty = 1, price, p = l.split('|').map(function(x){ return x.trim(); }).filter(Boolean), m;
    if(p.length >= 3){ name = p[0]; qty = num(p[1]) || 1; price = p[2]; }
    else if(p.length === 2){ name = p[0]; price = p[1]; }
    else if((m = l.match(/^(.+?)\s*(?:[:–—=]|\s-\s)\s*\$?\s*([\d,]+(?:\.\d{1,2})?)/))){ name = m[1]; price = m[2]; }
    else return;
    if(!/\d/.test(String(price)) || /^(item|total|subtotal|tax)\b/i.test(name)) return;
    if((m = name.match(/^(\d+(?:\.\d+)?)\s*[x×]\s+(.+)$/i))){ qty = +m[1]; name = m[2]; }
    out.items.push({ name:name.replace(/[:\s]+$/, ''), qty:qty, price:num(price) });
  });
  return out;
}

function period(p){
  var d = new Date(), y = d.getFullYear(), m = d.getMonth();
  if(p === 'lm'){ var a = new Date(y, m - 1, 1); return [ymd(a), ymd(new Date(y, m, 0)), MON[a.getMonth()] + ' ' + a.getFullYear()]; }
  if(p === 'ty') return [y + '-01-01', y + '-12-31', String(y)];
  if(p === 'ly') return [(y - 1) + '-01-01', (y - 1) + '-12-31', String(y - 1)];
  if(p === 'all') return ['0000', '9999', 'All time'];
  return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0)), MON[m] + ' ' + y];
}
function pl(from, to){
  var inc = [], exp = {}, out = 0, inn = 0, personal = 0;
  S.invoices.forEach(function(v){ (v.payments || []).forEach(function(p){ if(p.date >= from && p.date <= to){ inc.push({ date:p.date, amount:num(p.amount), method:p.method, v:v }); inn += num(p.amount); } }); });
  S.expenses.forEach(function(e){ if(e.date >= from && e.date <= to){ if(e.cat === 'Personal (not business)'){ personal += num(e.amount); return; } exp[e.cat] = (exp[e.cat] || 0) + num(e.amount); out += num(e.amount); } });

  var tax = 0; inc.forEach(function(p){ var t = invTotal(p.v), tx = invTax(p.v); if(t > 0 && tx > 0) tax += p.amount * tx / t; });
  tax = r2(tax);
  return { inc:inc, income:r2(inn - tax), salesTax:tax, gross:r2(inn), exp:exp, out:r2(out), profit:r2(inn - tax - out), personal:r2(personal) };
}

/* ── 📅 Next 30 / 60 days (v1.7 · 18 Nov 2026, Jerry: "Yes, all of them") ──────────────────────
   A cash look-ahead on this phone, nothing sent anywhere. Money coming in is every unpaid invoice's balance by its
   due date (a late one counts in the next 30 days, flagged); money going out is the repeating costs the person types
   in here (S.repeats: name, amount, day of the month — insurance, the truck payment), since expenses don't repeat.
   Start from "cash in the bank today" (S.ahead.cash) and the two big numbers are what should be there at day 30 and day 60.
   Windows: day 0 is today; "next 30 days" is day 0 to day 29, "days 31 to 60" is day 30 to day 59, so nothing counts twice. */
function aheadState(){ if(!S.ahead || typeof S.ahead !== 'object') S.ahead = { cash:'' }; if(!Array.isArray(S.repeats)) S.repeats = []; return S.ahead; }
/* v2.0 (20 Nov, truck-cab day part 3): a bill can repeat every month (on a day of the month), every 3 months or once
   a year (from its next due date, r.next). r.warn: show it under ⚠️ Worth knowing on Today before it is due. */
var BIG = L(500, 20000);
function repEvery(r){ var e = Math.round(num(r.every)); return e === 3 || e === 12 ? e : 1; }
function repWarn(r){ return r.warn != null ? !!r.warn : (repEvery(r) > 1 || num(r.amount) >= BIG); }
function repeatDates(r, from, to){   /* every date this bill falls on between from and to (inclusive) */
  var out = [], d = parseD(from), end = parseD(to), ev = repEvery(r);
  if(ev === 1){ var day = Math.min(31, Math.max(1, Math.round(num(r.day)) || 1));
    for(var y = d.getFullYear(), m = d.getMonth(), g = 0; g < 40 && new Date(y, m, 1) <= end; g++, m++){
      var last = new Date(y, m + 1, 0).getDate(), when = new Date(y, m, Math.min(day, last));
      if(when >= d && when <= end) out.push(ymd(when)); }
    return out; }
  if(!r.next) return out;
  var a = parseD(r.next), ad = a.getDate();
  for(var k = 0; k < 80; k++){ var y2 = a.getFullYear(), m2 = a.getMonth() + k * ev, last2 = new Date(y2, m2 + 1, 0).getDate(), w = new Date(y2, m2, Math.min(ad, last2));
    if(w > end) break; if(w >= d) out.push(ymd(w)); }
  return out;
}
function repWhen(r){ var ev = repEvery(r); if(ev === 1) return 'On the ' + ordinal(r.day) + ' of each month'; var nx = repeatDates(r, today(), addDays(today(), 400))[0]; return (ev === 3 ? 'Every 3 months' : 'Once a year') + (nx ? ' · next ' + fd(nx) : ''); }
function ahead(){
  aheadState();
  var t = today(), d30 = addDays(t, 30), d60 = addDays(t, 60), R = { t:t, d30:d30, d60:d60, inA:[], inB:[], outA:[], outB:[], later:0, laterN:0 };
  S.invoices.forEach(function(v){ var b = invBal(v); if(b <= 0.004) return; var due = v.due || t, x = { v:v, amt:b, due:due, late:due < t };
    if(due < d30) R.inA.push(x); else if(due < d60) R.inB.push(x); else { R.later += b; R.laterN++; } });
  S.repeats.forEach(function(r){ var a = num(r.amount); if(!a) return;
    repeatDates(r, t, addDays(d30, -1)).forEach(function(dt){ R.outA.push({ r:r, amt:a, due:dt }); });
    repeatDates(r, d30, addDays(d60, -1)).forEach(function(dt){ R.outB.push({ r:r, amt:a, due:dt }); }); });
  function sum(l){ return r2(l.reduce(function(a, x){ return a + x.amt; }, 0)); }
  ['inA', 'inB', 'outA', 'outB'].forEach(function(k){ R[k].sort(function(a, b){ return a.due.localeCompare(b.due); }); R[k + 'Sum'] = sum(R[k]); });
  R.cash = S.ahead.cash === '' || S.ahead.cash == null ? null : num(S.ahead.cash);
  R.at30 = r2((R.cash || 0) + R.inASum - R.outASum);
  R.at60 = r2(R.at30 + R.inBSum - R.outBSum);
  R.lateSum = r2(R.inA.filter(function(x){ return x.late; }).reduce(function(a, x){ return a + x.amt; }, 0));
  return R;
}

function csvRows(t){
  var rows = [], row = [], cur = '', q = false, delim = (t.split('\n')[0].split('\t').length > t.split('\n')[0].split(',').length) ? '\t' : ',';
  for(var i = 0; i < t.length; i++){
    var ch = t[i];
    if(q){ if(ch === '"'){ if(t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"') q = true;
    else if(ch === delim){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); if(row.some(function(x){ return x.trim(); })) rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur); if(row.some(function(x){ return x.trim(); })) rows.push(row);
  return rows.map(function(r){ return r.map(function(x){ return x.trim(); }); });
}
function anyDate(s){

  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ var y = +m[3]; if(y < 100) y += 2000; return y + '-' + pad(+m[1]) + '-' + pad(+m[2]); }
  var d = new Date(s); return isNaN(d) ? '' : ymd(d);
}
function parseImport(text){
  var rows = csvRows(String(text || '').replace(/^﻿/, ''));

  var hi = -1;
  for(var i = 0; i < Math.min(rows.length, 15); i++){ var low = rows[i].join('|').toLowerCase(); if(/date/.test(low) && /(amount|debit|credit|withdrawal)/.test(low)){ hi = i; break; } }
  var head = hi >= 0 ? rows[hi].map(function(x){ return x.toLowerCase(); }) : [], body = rows.slice(hi + 1);
  function col(re, not){ for(var k = 0; k < head.length; k++) if(re.test(head[k]) && !(not && not.test(head[k]))) return k; return -1; }
  var cD = col(/trans.*date|^date|posted|post date|date/), cDesc = col(/desc|payee|merchant|name|memo|details|item/), cA = col(/^amount|amount/), cDr = col(/debit|withdrawal|charge/), cCr = col(/credit|deposit|payment/, /card/);
  if(hi < 0){ /* no header: guess date, description, amount by looking */
    var s = body[0] || []; s.forEach(function(v, k){ if(cD < 0 && anyDate(v) && /\d/.test(v)) cD = k; else if(cA < 0 && /^-?\(?\$?-?[\d,]+\.\d{2}\)?$/.test(v)) cA = k; else if(cDesc < 0 && /[a-z]/i.test(v)) cDesc = k; });
  }

  var items = body.map(function(r){
    var a; if(cDr >= 0){ var dr = num((r[cDr] || '').replace(/[()]/g, '')), cr = cCr >= 0 ? num((r[cCr] || '').replace(/[()]/g, '')) : 0; a = dr ? -Math.abs(dr) : Math.abs(cr); }
    else { var raw = r[cA] || ''; a = num(raw.replace(/[()]/g, '')); if(/^\(.*\)$/.test(raw.trim())) a = -Math.abs(a); }

function setRows(items, sign){

function cleanVendor(d){ return String(d || '').replace(/\s+#?\d{3,}.*$/, '').replace(/\b(pos|debit|purchase|card|visa|mc|recurring)\b/ig, '').replace(/\s{2,}/g, ' ').trim().slice(0, 40) || d; }

/* ── receipts: photo or emailed receipt → items → which job each one is for ──────────
   The photo is read on the phone (Tesseract, loaded on first use). An emailed receipt is pasted.
   Every item then goes to a job (or is split between two), to the shop, or is marked personal.
   Tax is spread across the items in proportion. Photos are kept in the phone's file store. */
var OCR_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

var STORES = KE ? ['Nakuru Hardware', 'Tile & Carpet', 'Doshi', 'Mabati Rolling Mills', 'Bamburi', 'Crown Paints', 'Basco', 'Naivas', 'Quickmart', 'Carrefour', 'Chandarana', 'TotalEnergies', 'Rubis', 'Shell', 'Safaricom', 'Hardware'] : ['Home Depot', 'Lowe’s', 'Menards', 'Ace Hardware', 'True Value', 'Harbor Freight', 'Northern Tool', 'Ferguson', 'Johnstone Supply', 'Grainger', 'Fastenal', 'Sherwin-Williams', 'Tractor Supply', 'Walmart', 'Costco', 'Sam’s Club', 'Target', 'Amazon', 'SupplyHouse', 'Winsupply', 'Graybar', 'ABC Supply', 'Floor & Decor', '84 Lumber', 'AutoZone', 'O’Reilly', 'NAPA'];

/* the phone's file store, for receipt photos */
function fdb(){ return new Promise(function(res, rej){ var r = indexedDB.open('bizmgr_files', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('f'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
async function putFile(id, blob){ var db = await fdb(); return new Promise(function(res, rej){ var t = db.transaction('f', 'readwrite'); t.objectStore('f').put(blob, id); t.oncomplete = function(){ res(id); }; t.onerror = function(){ rej(t.error); }; }); }
async function getFile(id){ var db = await fdb(); return new Promise(function(res){ var q = db.transaction('f').objectStore('f').get(id); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }); }
async function delFile(id){ try{ var db = await fdb(); db.transaction('f', 'readwrite').objectStore('f').delete(id); }catch(e){} }
async function shrink(file){
  var url = URL.createObjectURL(file);
  try{
    var img = await new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = url; });
    var k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.8); });
  } finally { URL.revokeObjectURL(url); }
}
function loadScript(src){ return new Promise(function(res, rej){ if(window.Tesseract) return res(); var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('offline')); }; document.head.appendChild(s); }); }

async function rcPhoto(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  var msg = $('ocrMsg'); msg.hidden = false; msg.textContent = 'Saving the photo…';
  var blob = await shrink(f).catch(function(){ return f; }), pid = 'rc_' + uid();

  var text = '';

    msg.textContent = 'Getting the receipt reader ready (first time takes a moment)…';
    await loadScript(OCR_JS);
    var w = await Tesseract.createWorker('eng', 1, Object.assign({ logger:function(m){ if(m.status === 'recognizing text') msg.textContent = 'Reading the receipt… ' + Math.round(m.progress * 100) + '%'; } }, OCR_OPT));
    try{ await w.setParameters({ tessedit_pageseg_mode:'6', preserve_interword_spaces:'1' }); }catch(e){}   /* a receipt is one block of rows */
    var out = await w.recognize(await ocrPrep(f).catch(function(){ return blob; })); text = out.data.text || ''; await w.terminate();

  try{ img = await new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ res(String(fr.result).split(',')[1] || ''); }; fr.onerror = function(){ res(''); }; fr.readAsDataURL(blob); }); }catch(e){}
  if(blob && blob.type !== 'image/jpeg') img = '';   /* the AI door takes JPEG, PNG or WebP — never an iPhone's HEIC straight from the camera */

/* reading receipt text: works on Home Depot / Lowe's style receipts and pasted eReceipts */
/* v2.0.4 (21 Nov, Jerry's Menards receipt). Store slips like Menards put the item name on one line and, under it, the
   item number with "qty @ price" and the line total (sometimes the total drops to a line of its own). Their plain
   "TOTAL" is before tax and "TOTAL SALE" is what was paid. And the phone's reader garbles some characters on thermal
   paper ("J614066 b @7.97" for "3614066 6 @7.97"). This reads that layout, works out a line from qty × price when
   its total is missing or unreadable, and takes the paid total over the before-tax one. parseReceipt then keeps
   whichever reading of the slip adds up best. */
function ocrDigits(t){ return String(t).replace(/[OoQD]/g, '0').replace(/[Il|]/g, '1').replace(/[J]/g, '3').replace(/[Ss]/g, '5').replace(/[b]/g, '6').replace(/[B]/g, '8').replace(/[Z]/g, '2'); }
function parseRows(text){
  var MONEY = /(-?\$?\s?\d{1,5}(?:,\d{3})*\.\d{2})/, out = { items:[], tax:0, total:0, sub:0 };

  var bare = function(l){ var m = l && l.match(/^-?\$?\s?(\d{1,5}(?:,\d{3})*\.\d{2})\s*[A-Z]{0,2}$/); return m ? num(m[1]) : null; };
  var name = '';

    var lab = l.replace(MONEY, '').trim(), amt = (l.match(MONEY) || [])[1], val = amt != null ? Math.abs(num(amt)) : (bare(nx) != null ? bare(nx) : null);
    if(/^(total\s+sale|grand\s+total|amount\s+due|balance\s+due|total\s+due)\b/i.test(lab)){ if(val != null){ out.total = val; if(amt == null) i++; } name = ''; continue; }
    if(/^(sub-?\s?total|total)\b/i.test(lab) && !/number|items|saved|savings/i.test(lab)){ if(val != null){ out.sub = out.sub || val; if(amt == null) i++; } name = ''; continue; }
    if(/^(sales\s+)?(tax|vat)\b/i.test(lab)){ if(val != null){ out.tax = out.tax || val; if(amt == null) i++; } name = ''; continue; }
    if(/\b(visa|master ?card|amex|discover|debit|credit|cash|change|tender|auth|contactless|arqc|aid|number of items)\b/i.test(lab)){ name = ''; continue; }

      var tm = rest.match(/(\d{1,5}(?:,\d{3})*\.\d{2})\s*[A-Z]{0,2}\s*$/); if(tm) tot = num(tm[1]);

      if(tot != null && tot > 0) out.items.push({ name:(name + (qty > 1 ? ' (' + qty + ' @ ' + cur(unit.toFixed(2)) + ')' : '')).slice(0, 60), amount:tot });
      name = ''; continue;
    }
    if(name && bare(l) != null){ out.items.push({ name:name.slice(0, 60), amount:bare(l) }); name = ''; continue; }   /* the item number was lost: the price alone follows the name */
    /* a name line: words, no price */
    if(/[A-Za-z]{2}/.test(l) && !MONEY.test(l)) name = l.replace(/\s{2,}/g, ' '); else name = '';

function parseReceipt(text){

  var items = (useB ? b.items : a.items).slice();
  /* v2.0.6 (21 Nov): the phone read "TOTAL SALE" as "[OTAL SALE" and "TAX" as "Sm (4X", so totals came in as items.
     The numbers give them away even when the words don't: look for three amounts where one plus another makes the
     third (160.73 + 13.66 = 174.39). The biggest is the total, the smaller of the other two the tax, the rest the
     before-tax total — and none of the three is an item. */

function parseReceiptLines(text){

  if(KE) SKIP = new RegExp(SKIP.source.replace('tax|', 'tax|vat|m-?pesa|till|'), 'i');

/* ══ Quick Quote inside Business Manager (v1.1 · 9 Oct 2026) ═══════════════════════════════════════
   The quote engine from Quick Quote v1.2, on Business Manager's own jobs and price list:
   ⚡ a draft from the price list (keyword match, hours → labor, add-ons unless included, the trip rule),
   ✨ the owner's own AI through djAI (JSON or plain lines back), and THE PRICE LIST ALWAYS WINS over AI prices.
   Three options (Good / Better / Best) live on the job as j.tiers; j.items is always the option being edited
   (j.edit), so every total, link and invoice keeps working. j.pick is the option the customer chose.
   Photos (≤4, shrunk on the phone) are kept in the bizmgr_files store; j.photos holds their ids. */
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ── options ── */
function tierItems(j, k){ return k === (j.edit || 0) ? j.items : (j.tiers[k] || {}).items || []; }
function tierTotal(j, k){ return r2(lineSum(tierItems(j, k)) * (1 + num(S.biz.taxRate) / 100)); }
function tierSync(j){ try{ if(j && j.tiers && j.tiers[j.edit || 0]) j.tiers[j.edit || 0].items = j.items; }catch(e){} }
function tierSelect(j, k){ if(!j.tiers || !j.tiers[k]) return; tierSync(j); j.edit = k; j.items = j.tiers[k].items || []; }
function allLines(j){ return j.tiers ? [].concat.apply([], j.tiers.map(function(t, k){ return tierItems(j, k); })) : (j.items || []); }
function bare(l){ return { name:l.name, qty:num(l.qty) || 1, price:num(l.price) }; }
function extraLine(name, price){ var m = matchPrice(name); return m ? { name:m.name, qty:1, price:num(m.price) } : { name:name, qty:1, price:num(price) }; }
function buildTiers(base, names){
  names = names || S.quote.names;
  var has = function(list, n){ return list.some(function(i){ var a = matchPrice(i.name); return norm(i.name) === norm(n) || (a && a === matchPrice(n)); }); };
  var better = clone(base); parseAdds(S.quote.betterAdds).forEach(function(a){ if(!a.pct && !has(better, a.name)) better.push(extraLine(a.name, a.amt)); });
  var best = clone(better); parseAdds(S.quote.bestAdds).forEach(function(a){ if(!a.pct && !has(best, a.name)) best.push(extraLine(a.name, a.amt)); });
  return [{ name:names[0], items:clone(base) }, { name:names[1], items:better }, { name:names[2], items:best }];
}
function offerTiers(jid){
  var j = job(jid); if(!j || j.tiers) return; if(!j.items.length){ toast('Add at least one line first'); return; }
  j.tiers = buildTiers(j.items); j.edit = 0; j.pick = null; j.items = j.tiers[0].items; logJob(j, 'Offered three options'); save(); render();
  toast(parseAdds(S.quote.betterAdds).length || parseAdds(S.quote.bestAdds).length ? '3 options ready — tap one to change it' : '3 options ready — set what Better and Best add in More → How you price');
}
function untier(jid){
  var j = job(jid); if(!j || !j.tiers) return;
  if(!confirm('Go back to one price? This keeps “' + j.tiers[j.edit || 0].name + '” and drops the other options.')) return;
  j.items = clone(j.items); delete j.tiers; delete j.pick; delete j.edit; save(); render();
}
function tierEdit(jid, k){ var j = job(jid); if(!j || !j.tiers) return; if(j.signed && k !== (j.edit || 0)){ toast('It’s approved — tap Undo approval to switch options'); return; } tierSelect(j, k); save(); render(); }
function tierName(jid, v){ var j = job(jid); if(!j || !j.tiers) return; var k = j.edit || 0; j.tiers[k].name = String(v || '').trim() || S.quote.names[k] || 'Option ' + (k + 1); save(); render(); }
function setQNote(jid, v){ var j = job(jid); if(!j) return; j.qnote = oneSentence(v); save(); var q = $('qn'); if(q) q.value = j.qnote; toast('Saved'); }
function estAmount(j){
  if(j.tiers && j.tiers.length && (j.pick == null || !j.tiers[j.pick])){ var ts = j.tiers.map(function(t, k){ return tierTotal(j, k); }); return j.tiers.length + ' options, from ' + money(Math.min.apply(null, ts)); }
  return money(jobTotal(j));
}

/* ── matching: a line matches a price-list item when their important words line up ── */
var STOP = { the:1, a:1, an:1, of:1, and:1, or:1, 'for':1, to:1, 'in':1, on:1, 'with':1, per:1, 'new':1, old:1, replace:1, replacement:1, install:1, installation:1, labor:1, service:1, gal:1, gallon:1, x:1 };
function norm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function words(s){ return norm(s).split(' ').filter(function(w){ return w.length > 1 && !STOP[w] && !/^\d+$/.test(w); }).map(function(w){ return w.replace(/(ing|es|s)$/, ''); }); }
function matchPrice(name){
  var w = words(name); if(!w.length) return null; var best = null, bs = 0;
  S.prices.forEach(function(p){ if(!p.name) return; var pw = words(p.name); if(!pw.length) return; var hit = pw.filter(function(x){ return w.indexOf(x) >= 0; }).length, sc = hit / pw.length;
    if(hit && sc > bs && (sc >= 0.67 || (pw.length >= 2 && hit >= 2))){ bs = sc; best = p; } });
  if(!best && /trip|service call/i.test(name)) best = tripItem() || null;
  if(!best && /labou?r|hour/i.test(name) && !words(name).length) best = laborItem() || null;
  return best;
}
function tripItem(){ return S.prices.filter(function(p){ return /trip|service call/i.test(p.name || ''); })[0]; }
function laborItem(){ return S.prices.filter(function(p){ return /labou?r/i.test(p.name || '') && /hour/i.test(p.name || ''); })[0] || S.prices.filter(function(p){ return /labou?r/i.test(p.name || ''); })[0]; }
/* add-ons from the profile: "Permit: $75", "Materials markup: 15%" */
function parseAdds(text){ return String(text || '').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){ var m = (KE ? /^(.*?)[:\-–]\s*(?:\$|kes|kshs?\.?|shs?\.?)?\s*([\d.,]+)\s*(%)?/i : /^(.*?)[:\-–]\s*\$?\s*([\d.,]+)\s*(%)?/).exec(l); return m ? { name:m[1].trim(), amt:parseFloat(m[2].replace(/,/g, '')), pct:!!m[3] } : null; }).filter(Boolean); }
function addons(){ return parseAdds(S.quote.addons); }
function oneSentence(t){ t = String(t || '').replace(/\s+/g, ' ').trim(); var m = /^(.+?[.!?])(\s|$)/.exec(t); t = m ? m[1] : t; if(t.length > 160) t = t.slice(0, 157).replace(/\s\S*$/, '') + '…'; return t; }
function qtyFor(p, low){ if(/pipe/i.test(p.name)){ var m = /(\d+)\s*(?:ft|feet|foot)\b/.exec(low); if(m) return Math.max(1, Math.round(+m[1] / 10)); } var n = /\b(two|three|four|2|3|4)\s+(?:\w+\s){0,2}(toilets|faucets|drains)/.exec(low); if(n) return ({ two:2, three:3, four:4 })[n[1]] || +n[1]; return 1; }
function applyTrip(items){
  var t = tripItem(); if(!t) return; if(items.some(function(i){ return matchPrice(i.name) === t; })) return;
  var sub = lineSum(items), Qd = S.quote;
  if(Qd.trip === 'every' || (Qd.trip === 'small' && sub < (num(Qd.tripUnder) || 300))) items.unshift({ name:t.name, qty:1, price:num(t.price) });
}

/* ── ⚡ a draft from the price list ── */
function draftItems(text){
  var jw = words(text), items = [], Qd = S.quote, low = text.toLowerCase();
  S.prices.forEach(function(p){ if(!p.name) return; if(/trip|service call/i.test(p.name) || (/labou?r/i.test(p.name) && /hour/i.test(p.name))) return; var pw = words(p.name); if(!pw.length) return;
    var hit = pw.filter(function(x){ return jw.indexOf(x) >= 0; }).length; if(hit / pw.length >= 0.5 || (pw.length >= 2 && hit >= 2)) items.push({ name:p.name, qty:qtyFor(p, low), price:num(p.price) }); });
  var hrs = /(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/i.exec(text), lab = laborItem(); if(hrs && lab) items.push({ name:lab.name, qty:+hrs[1], price:num(lab.price) });
  var inc = String(Qd.included || '').toLowerCase();
  addons().forEach(function(a){ if(a.pct) return; var aw = words(a.name);
    /* already included in the price, says the profile ("includes … haul-away") → don't charge it twice */
    if(aw.some(function(x){ return inc.indexOf(x) >= 0; }) || (/dispos|haul/i.test(a.name) && /haul|dispos/.test(inc)) || (/permit/i.test(a.name) && /permit/.test(inc))) return;
    var hint = aw.some(function(x){ return jw.indexOf(x) >= 0; }) || (/permit/i.test(a.name) && /water heater|gas line|repipe|sewer|panel|furnace|roof/i.test(text)) || (/dispos|haul/i.test(a.name) && /haul|dispos|old (unit|one|heater|toilet)/i.test(text));
    if(hint) items.push({ name:a.name, qty:1, price:num(a.amt) }); });
  applyTrip(items);
  return items;
}
function draftLocal(jid, extraNote){
  var j = job(jid); if(!j) return;
  var text = (j.title || '') + '. ' + (j.desc || '');
  if(!String(j.title || j.desc || '').trim()){ alert('Describe the job first — tap ✏️ Edit.'); return; }
  var keep = j.items.filter(function(l){ return l.receiptId; }), own = j.items.filter(function(l){ return !l.receiptId; });
  if(typeof extraNote !== 'string' && own.length && !confirm('Replace the ' + own.length + ' line' + (own.length > 1 ? 's' : '') + ' on this ' + (QM() ? 'quote' : 'job') + ' with a fresh draft from your price list?')) return;
