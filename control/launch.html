<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23504F">
<title>Launch Board</title>
<!-- Launch idea 1 (control/launch-plan.md). Reads control/launch.json, which
     tools/launch/board.py writes from the repo each night. Nothing here is hand-typed. -->
<style>
:root{--bg:#F4F4F1;--card:#fff;--ink:#1B2421;--soft:#50605C;--line:#DADDD6;--brand:#23504F;
  --ok:#2E7D5A;--ok-soft:#E2F2EB;--no:#B3502F;--no-soft:#F7E8E2}
@media (prefers-color-scheme:dark){:root{--bg:#11171A;--card:#1A2226;--ink:#E7ECEA;--soft:#A9B6B2;--line:#2A3539;
  --brand:#7FB3B1;--ok:#5FB78D;--ok-soft:#122A21;--no:#E58A6E;--no-soft:#2E1E18;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
header{background:#23504F;color:#fff;padding:16px}
.wrap{max-width:900px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
h1{margin:0;font-size:22px}.sub{opacity:.85;font-size:14px}
.big{font-size:40px;font-weight:900;line-height:1.1;margin-top:8px}
.bar{height:10px;border-radius:6px;background:#ffffff33;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#F2B134}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.top{display:flex;align-items:center;gap:10px}.top b{flex:1;font-size:17px}
.pill{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px}
.ok{background:var(--ok-soft);color:var(--ok)}.no{background:var(--no-soft);color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:13px;padding:2px 8px;border-radius:8px}
.notes{font-size:13px;color:var(--soft);margin-top:6px}
a{color:var(--brand)}
.filter{display:flex;gap:8px;margin:14px 0 0}.filter button{font:inherit;font-weight:700;min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filter button[aria-pressed=true]{background:#23504F;color:#fff;border-color:#23504F}
</style>
</head>
<body>
<header><div class="wrap"><h1>🚀 Launch Board</h1>
<div class="sub" id="made">Loading…</div><div class="big" id="score"></div><div class="bar"><i id="fill" style="width:0"></i></div></div></header>
<main class="wrap">
<div class="filter"><button id="fNot" aria-pressed="true">Not ready</button><button id="fAll" aria-pressed="false">All apps</button></div>
<div id="list"></div>
<p class="notes">Every check is read from the apps themselves each night (tools/launch/board.py). An app is ready when every chip is green.</p>
</main>
<script>
var D=null, all=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(){
  var L=document.getElementById('list'), rows=D.apps.slice().sort(function(a,b){return a.ready-b.ready||a.name.localeCompare(b.name)});
  if(!all) rows=rows.filter(function(r){return !r.ready});
  L.innerHTML=rows.length?rows.map(function(r){
    var ch=Object.keys(r.checks).map(function(k){return '<span class="'+(r.checks[k]?'ok':'no')+'">'+(r.checks[k]?'✓ ':'✗ ')+esc(k)+'</span>'}).join('');
    return '<div class="card"><div class="top"><span style="font-size:22px">'+esc(r.em||'')+'</span><b>'+esc(r.name)+'</b><span class="pill '+(r.ready?'ok':'no')+'">'+(r.ready?'Ready':'Not yet')+'</span></div>'
      +'<div class="chips">'+ch+'</div>'
      +(r.notes.length?'<div class="notes">'+r.notes.map(esc).join('<br>')+'</div>':'')
      +'<div class="notes">'+(r.chat?'Chat: '+esc(r.chat)+' · ':'')+r.videos+' video'+(r.videos==1?'':'s')+' · <a href="'+esc(r.url)+'" target="_blank" rel="noopener">open the app</a></div></div>'}).join('')
    :'<div class="card">Every app is ready. 🎉</div>';
}
function pick(a){all=a;document.getElementById('fAll').setAttribute('aria-pressed',a);document.getElementById('fNot').setAttribute('aria-pressed',!a);draw()}
document.getElementById('fAll').onclick=function(){pick(true)};document.getElementById('fNot').onclick=function(){pick(false)};
fetch('launch.json?t='+Date.now()).then(function(r){return r.json()}).then(function(d){D=d;
  document.getElementById('made').textContent='Checked '+d.made+' · shared layer v'+d.house;
  document.getElementById('score').textContent=d.ready+' of '+d.total+' apps ready';
  document.getElementById('fill').style.width=Math.round(100*d.ready/d.total)+'%';draw()})
 .catch(function(){document.getElementById('made').textContent='Could not load the board. Try again in a minute.'});
</script>
</body>
</html>
