<!doctype html>
<html lang="en">
<head>
<script id="dj-house-v63">
/* 4 Oct 2026 — Jerry: "why is it talking to me … turn them all off right now." One switch for every app:
   nothing speaks unless the person turns the voice on (localStorage dj_voice = 'on'). Exceptions: the store's
   videos (you pressed ▶) and Rafiki (talking is the whole app; it has its own mute). */
(function(){ try{
  if(!window.speechSynthesis || /\/shop\/watch\.html|\/rafiki\//.test(location.pathname)) return;
  var real = speechSynthesis.speak.bind(speechSynthesis);
  /* v62 (7 Oct deep check): a button the person taps to HEAR something ("🔊 Read it to me", "Listen") is asking
     for the voice, so it speaks even when the voice switch is off. Only for a few seconds after that tap. */
  var askedAt = 0, ASK = /read (it|this|that)( out)?( to me)?|read to me|read aloud|🔊|listen|hear it|say it again/i;
  document.addEventListener('click', function(e){ try{ var t = e.target && e.target.closest && e.target.closest('button,a,[role="button"]'); if(!t) return;
    var words = (t.textContent || '') + ' ' + (t.getAttribute('aria-label') || '') + ' ' + (t.title || '');
    if(ASK.test(words) && !/turn (the )?voice|voice is on|sound (on|off)|mute/i.test(words)) askedAt = Date.now(); }catch(err){} }, true);
  window.djSayNow = function(){ askedAt = Date.now(); };
  speechSynthesis.speak = function(u){ try{ if(localStorage.getItem('dj_voice') === 'on' || Date.now() - askedAt < 6000) return real(u); }catch(e){} };
}catch(e){} })();

/* ═══ Daraja house standard — safety net, local dates, talk-into-any-box ═══ */
(function(){
  if(window.__djHouse) return; window.__djHouse = true;

  /* ── 0 · 🧪 the test copy (v57 · 4 Oct 2026) ─────────────────────────────────
     Jerry: "If we're in test mode and I want to test as a first-time user, what do I do?"
     ?dj_sandbox=1 opens a fresh copy that has never seen this person: every save goes to this
     browser TAB only (sessionStorage, prefix sbx:), IndexedDB names get an sbx_ prefix, and the
     real data is never read or written. Close the tab and the test copy is gone. If the browser
     refuses the swap, it says so and does NOT pretend: the real data would be at risk. */
  (function(){
    var on = false, q = ''; try{ q = location.search; }catch(e){}
    try{
      if(/[?&]dj_sandbox=1/.test(q)){ var s0 = window.sessionStorage; for(var i = s0.length - 1; i >= 0; i--){ var k0 = s0.key(i); if(k0 && k0.indexOf('sbx:') === 0) s0.removeItem(k0); } s0.setItem('dj_sandbox', '1'); on = true; try{ history.replaceState(null, '', location.href.replace(/([?&])dj_sandbox=1&?/, '$1').replace(/[?&](#|$)/, '$1')); }catch(e){} }
      else if(window.sessionStorage.getItem('dj_sandbox') === '1') on = true;
    }catch(e){ on = false; }
    if(!on) return;
    var S = window.sessionStorage, P = 'sbx:';
    function keys(){ var ks = []; for(var i = 0; i < S.length; i++){ var k = S.key(i); if(k && k.indexOf(P) === 0) ks.push(k.slice(P.length)); } return ks; }
    var api = { getItem:function(k){ return S.getItem(P + k); }, setItem:function(k, v){ S.setItem(P + k, String(v)); }, removeItem:function(k){ S.removeItem(P + k); },
      clear:function(){ keys().forEach(function(k){ S.removeItem(P + k); }); }, key:function(n){ var ks = keys(); return ks[n] == null ? null : ks[n]; } };
    var fake = new Proxy({}, {
      get:function(t, p){ if(p === 'length') return keys().length; if(Object.prototype.hasOwnProperty.call(api, p)) return api[p]; if(typeof p === 'string'){ var v = S.getItem(P + p); return v === null ? undefined : v; } return undefined; },
      set:function(t, p, v){ api.setItem(p, v); return true; }, deleteProperty:function(t, p){ api.removeItem(p); return true; },
      has:function(t, p){ return Object.prototype.hasOwnProperty.call(api, p) || p === 'length' || S.getItem(P + p) !== null; },
      ownKeys:function(){ return keys(); },
      getOwnPropertyDescriptor:function(t, p){ var v = S.getItem(P + p); return v === null ? undefined : { value:v, enumerable:true, configurable:true, writable:true }; } });
    var ok = false;
    try{ Object.defineProperty(window, 'localStorage', { configurable:true, get:function(){ return fake; } }); ok = (window.localStorage === fake); }catch(e){ ok = false; }
    if(!ok){
      try{ window.sessionStorage.removeItem('dj_sandbox'); }catch(e){}
      alert('This browser won’t open a separate test copy. To see the app as a new person, open it in a Private window instead. Your real data is untouched.');
      try{ location.replace(location.href.replace(/([?&])dj_sandbox=1&?/, '$1').replace(/[?&]$/, '')); }catch(e){}
      return;
    }
    try{ var idb = window.indexedDB, o = idb.open.bind(idb), d = idb.deleteDatabase.bind(idb);
      idb.open = function(n, v){ return v === undefined ? o('sbx_' + n) : o('sbx_' + n, v); }; idb.deleteDatabase = function(n){ return d('sbx_' + n); }; }catch(e){}
    window.__djSandbox = true;
    function bar(){
      if(!document.body || document.getElementById('djSbx')) return;
      var b = document.createElement('div'); b.id = 'djSbx'; b.setAttribute('role', 'status');
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:2147482900;background:#5B3FA0;color:#fff;font:700 14px/1.3 -apple-system,system-ui,sans-serif;padding:8px 10px 8px 12px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px';
      b.innerHTML = '<span style="flex:1">🧪 Test copy: you’re a brand-new user here. Your real data is safe.</span><button type="button" style="font:inherit;font-weight:800;font-size:13px;background:#fff;color:#5B3FA0;border:0;border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer">Leave</button>';
      b.querySelector('button').onclick = function(){ try{ api.clear(); window.sessionStorage.removeItem('dj_sandbox'); }catch(e){} location.href = location.href.replace(/([?&])dj_sandbox=1&?/, '$1').replace(/[?&]$/, ''); };
      document.body.appendChild(b);
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bar); else bar();
    setTimeout(bar, 1500);
  })();

  /* v62: a Start fresh that erased an app's file store finishes here, before the app opens it again */
  (function(){ try{ var w = JSON.parse(localStorage.getItem('dj_idb_wipe') || 'null'); if(!Array.isArray(w) || !w.length) return; var left = w.length;
    w.forEach(function(n){ var r = indexedDB.deleteDatabase(String(n)); r.onsuccess = function(){ if(--left <= 0){ try{ localStorage.removeItem('dj_idb_wipe'); }catch(e){} } }; }); }catch(e){} })();

  /* v62 (found #51): a tour that was closed half way put the app on Level 3 for good. Put the level back. */
  (function(){ try{ for(var i = localStorage.length - 1; i >= 0; i--){ var k = localStorage.key(i); if(!k || k.indexOf('dj_tour_lvl_') !== 0) continue;
      var o = JSON.parse(localStorage.getItem(k) || 'null'); if(!o || o.path !== location.pathname) continue;
      Object.keys(o.keys || {}).forEach(function(x){ if(o.keys[x] === null) localStorage.removeItem(x); else localStorage.setItem(x, o.keys[x]); });
      localStorage.removeItem(k); } }catch(e){} })();

  /* ── 1 · the real local day ──────────────────────────────────────────────
     toISOString() converts to UTC. At 7pm in Illinois that is already tomorrow,
     so "today" landed on the wrong date and daily streaks broke overnight. */
  window.djYMD = function(d){
    d = d || new Date();
    if(typeof d === 'string') d = new Date(d + (d.length === 10 ? 'T12:00:00' : ''));
    return d.getFullYear() + '-' +
           String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0');
  };

  /* ── 2 · saving must never fail silently ─────────────────────────────────
     Every app writes with localStorage.setItem. If the phone refuses, the old
     code threw, the save function stopped halfway, and nobody was told. */
  try{
    var proto = window.Storage && Storage.prototype;
    if(proto && !proto.__djGuarded){
      var realSet = proto.setItem;
      /* v62 (7 Oct deep check): Our Table, Every Day, Who's Coming and My Circle keep their data under dj_ names,
         so skipping every dj_ key meant they never said "Saved ✓". Skip only the house's own bookkeeping. */
      var HOUSE_KEY = /^dj_(textsize|hello_|tour_|seen_|a2hs_|tipseen_|lastopen|menu_seen_|voice|ai_choice|circle_include|sandbox|level_|glass_|tester_code|idb_wipe|name$|.*_seen$|.*_tip|.*_intro)/;
      proto.setItem = function(k, v){
        try{ var r = realSet.call(this, k, v); if(!HOUSE_KEY.test(String(k)) && String(k).indexOf('sbx:dj_tour') !== 0) savedPulse(); return r; }
        catch(err){ djSaveFailed(err); return undefined; }
      };
      proto.__djGuarded = true;
    }
  }catch(e){}

  var toldOnce = false;
  function djSaveFailed(err){
    if(toldOnce) return; toldOnce = true;
    var full = err && (err.name === 'QuotaExceededError' ||
               err.code === 22 || err.code === 1014);
    djBanner(
      full ? 'This phone is out of room, so that did not save.'
           : 'This phone would not let the app save that.',
      full ? 'Free up some space in Settings › General › iPhone Storage, then tap Try again. Nothing you can see on screen has been lost yet — but do not close the app until it saves.'
           : 'This usually means private browsing, or Settings › Safari › Block All Cookies is switched on. Turn that off and tap Try again.',
      [['Try again', function(){ location.reload(); }]]
    );
  }

  /* ── 3 · nothing white-screens without a way out ─────────────────────────
     A single bad record used to leave a blank page and no route back. */
  var netShown = false;
  function net(msg){
    if(netShown) return; netShown = true;
    djBanner('Something went wrong on this screen.',
      'Your saved work is untouched. Reloading fixes almost everything.' +
      (msg ? '\n\n(' + String(msg).slice(0,120) + ')' : ''),
      [['Reload', function(){ location.reload(); }]]);
  }
  /* v44 (22 Sep 2026): a service worker that fails to update is a leftover from a page that moved
     (the old store under Apps (installable site)/store/, archived 12 Sep) — not this app's fault.
     Jerry could not get rid of the bar it raised. Never show it for that; throw the leftover away. */
  function swNoise(m){ return /ServiceWorker|service worker/i.test(String(m || '')); }
  window.addEventListener('error', function(e){
    if(e && e.target && e.target !== window && e.target.tagName) return; /* a missing image is not a crash */
    if(swNoise(e && e.message)) return;
    net(e && e.message);
  });
  window.addEventListener('unhandledrejection', function(e){
    var m = e && e.reason && e.reason.message;
    if(swNoise(m)){ try{ e.preventDefault(); }catch(_){} return; }
    net(m);
  });
  function tidyWorkers(){
    try{ if(!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) return;
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){
        try{ fetch(r.scope, {method:'HEAD', cache:'no-store'}).then(function(x){ if(x.status === 404) r.unregister(); }, function(){}); }catch(e){}
      }); }, function(){}); }catch(e){}
  }
  setTimeout(tidyWorkers, 4000);

  /* one calm bar, never an alert() the person cannot read at their own pace */
  function djBanner(title, body, buttons){
    if(!document.body){ document.addEventListener('DOMContentLoaded', function(){ djBanner(title, body, buttons); }); return; }
    var old = document.getElementById('djBanner'); if(old) old.remove();
    var w = document.createElement('div');
    w.id = 'djBanner';
    w.setAttribute('role','alert');
    w.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;'
      + 'background:#7A2E1E;color:#fff;padding:16px 16px calc(16px + env(safe-area-inset-bottom));'
      + 'font:15px/1.45 -apple-system,system-ui,sans-serif;box-shadow:0 -6px 26px rgba(0,0,0,.35)';
    var h = document.createElement('div');
    h.style.cssText = 'font-weight:800;font-size:16px;margin-bottom:4px'; h.textContent = title;
    var p = document.createElement('div');
    p.style.cssText = 'opacity:.94;white-space:pre-wrap'; p.textContent = body;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
    (buttons||[]).forEach(function(b){
      var el = document.createElement('button');
      el.textContent = b[0];
      el.style.cssText = 'font:inherit;font-weight:800;min-height:44px;padding:10px 16px;border:none;'
        + 'border-radius:12px;background:#fff;color:#7A2E1E;cursor:pointer';
      el.onclick = b[1]; row.appendChild(el);
    });
    var x = document.createElement('button');
    x.textContent = 'Dismiss';
    x.setAttribute('aria-label','Dismiss this message');
    x.style.cssText = 'font:inherit;font-weight:700;min-height:44px;padding:10px 16px;border:1px solid rgba(255,255,255,.55);'
      + 'border-radius:12px;background:transparent;color:#fff;cursor:pointer';
    x.onclick = function(){ w.remove(); };
    row.appendChild(x);
    w.appendChild(h); w.appendChild(p); w.appendChild(row);
    document.body.appendChild(w);
  }
  window.djBanner = djBanner;

  /* ── 4 · talk into any typing box ────────────────────────────────────────
     Rafiki and Feedback Studio had this; twenty-one apps did not. The button
     only appears once you tap into a box, so no screen changes until you want it. */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, micBtn = null, curBox = null;

  function eligible(el){
    if(!el || el.dataset.djMic === 'off' || el.hasAttribute('data-nomic')) return false;   /* v63: an app with its own 🎤 marks the box data-nomic */
    var t = (el.tagName||'').toLowerCase();
    if(t === 'textarea') return true;
    if(t !== 'input') return false;
    var ty = (el.type||'text').toLowerCase();
    if(['text','search','tel','url','email'].indexOf(ty) < 0) return false;
    if(el.readOnly || el.disabled) return false;
    /* Leave alone any box that already has its own microphone — Rafiki, Feedback
       Studio and In My Own Words built their own and theirs are better placed.
       Stop at <body>: once our own button is on the page its emoji is inside body's
       text, which would make every box after the first one look already-served. */
    var p = el.parentElement;
    for(var i=0; i<3 && p && p !== document.body && p !== document.documentElement; i++, p = p.parentElement){
      var t = p.textContent || '';
      if(micBtn && p.contains(micBtn)) t = t.split('\u{1F3A4}').join('');
      if(t.indexOf('\u{1F3A4}') >= 0) return false;
    }
    return true;
  }

  function place(box){
    if(!micBtn){
      micBtn = document.createElement('button');
      micBtn.type = 'button';
      micBtn.id = 'djMic';
      micBtn.textContent = '\u{1F3A4}';
      micBtn.setAttribute('aria-label','Say it instead of typing');
      micBtn.title = 'Say it instead of typing';
      /* every app has its own button styling — min-height:44px, padding, box-sizing —
         so this one states its shape outright or it comes out the wrong size */
      micBtn.style.cssText = 'position:absolute !important;z-index:2147482000;'
        + 'box-sizing:border-box !important;width:40px !important;height:40px !important;'
        + 'min-width:40px !important;min-height:40px !important;max-width:40px !important;'
        + 'max-height:40px !important;padding:0 !important;margin:0 !important;'
        + 'border-radius:50% !important;border:1px solid rgba(128,128,128,.4);background:#fff;'
        + 'color:#1F2622;font-size:19px;line-height:1;cursor:pointer;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center';
      micBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
      micBtn.addEventListener('click', function(e){ e.preventDefault(); talk(); });
      document.body.appendChild(micBtn);
    }
    var r = box.getBoundingClientRect();
    /* scrolled out of sight — inside a sheet or off the page — so show nothing */
    if(r.bottom < 4 || r.top > window.innerHeight - 4 || r.width < 60){ hide(); return; }
    micBtn.hidden = false; micBtn.style.setProperty('display','flex','important');
    /* measure what the browser actually made, rather than trusting the numbers above */
    var m = micBtn.getBoundingClientRect();
    var w = m.width  || 40, h = m.height || 40;
    micBtn.style.top  = (window.scrollY + r.top + (r.height - h)/2) + 'px';
    micBtn.style.left = (window.scrollX + r.right - w - 6) + 'px';
    /* a short box would be swallowed by the button — sit just outside it instead */
    if(r.width < w + 90) micBtn.style.left = (window.scrollX + r.right + 6) + 'px';
  }
  function hide(){ if(micBtn){ micBtn.hidden = true; micBtn.style.setProperty('display','none','important'); } }

  function talk(){
    var box = curBox; if(!box) return;
    if(rec){ try{ rec.stop(); }catch(e){} return; }
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true;
    rec.continuous = (box.tagName.toLowerCase() === 'textarea');
    var base = (box.value || '').trim();
    micBtn.textContent = '⏹';
    micBtn.style.background = '#D96C4F';
    micBtn.setAttribute('aria-label','Stop listening');
    rec.onresult = function(e){
      var t = '';
      for(var i=0; i<e.results.length; i++) t += e.results[i][0].transcript;
      box.value = (base ? base + ' ' : '') + t;
      box.dispatchEvent(new Event('input', {bubbles:true}));
    };
    function done(){
      rec = null;
      if(micBtn){ micBtn.textContent = '\u{1F3A4}'; micBtn.style.background = '#fff';
                  micBtn.setAttribute('aria-label','Say it instead of typing'); }
      box.dispatchEvent(new Event('change', {bubbles:true}));
    }
    rec.onend = done;
    rec.onerror = done;
    try{ rec.start(); }catch(e){ done(); }
  }


  /* ── 5 · the floating helpers must not sit on the words ──────────────────
     The ? and the 💡 were each pinned to the right edge about 150px up from the
     bottom. On a 5.4" phone that is the middle of the screen, so both sat on top
     of whatever was written there — and in The Key they landed on exactly the same
     spot as each other, which hid one of them completely. They now share one dock
     in the bottom-right corner, stacked, and the dock lifts itself above whatever
     bottom bar the app has so it never covers a menu. */

  /* ── 6 · "Start fresh" must actually clear this app, and only this app ───────
     The first registry I shipped listed key names I had assumed rather than read.
     Against what the apps really write, 21 of 26 were wrong: The Key saves under
     'daraja_thekey_v1', so a person who had filled in their whole will-and-papers
     page was told "there is nothing saved in this app yet". These names were read
     out of each app's own source. Anything belonging to another app is protected
     even when a pattern would otherwise match it. */
  var OWNS = {
    nownext:      {k:['now_next_v1','now_next_profiles_v1','nn7_prefs','nn_code_v1','hz_prefs_v1',
                      'nn_dev','nn_fam_since','nn_family','nn_ph_reg','nn_week_v1'], p:['now_next_v1_','nn_']},
    ahead:        {k:['ahead_v1'], p:['ahead_'], idb:['ahead_papers']},   /* v62: the papers pocket (attached policies, statements) lives in IndexedDB */
    breakeven:    {k:['breakeven_v1'], p:['breakeven_']},
    compass:      {k:['daraja_compass_v1','compassTipSeen'], p:['compass_']},
    nextstep:     {k:['nextstep_board_v1'], p:['nextstep_','nsb_']},
    occ:          {k:['occ_counter_v1','occTipSeen'], p:['occ_']},
    drive:        {k:['occ_counter_v1','occTipSeen'], p:['drive_','church_drive_']},
    safety:       {k:['my_safety_plan_v1'], p:['safety_']},
    zuri:         {k:['zuri_ops_v1'], p:['zuri_']},
    academy:      {k:['daraja_academy_v1'], p:['academy_']},
    feedback:     {k:['feedback_studio_v1'], p:['fbs_']},
    storykeeper:  {k:['story_keeper_v1','story_ask_v1'], p:['story_'], idb:['story_voice']},   /* v63: Start fresh also erases the voice recordings */
    thekey:       {k:['daraja_thekey_v1','daraja_thekey_v2'], p:[]},   /* v62: v2 = the accounts, papers and people entries */
    churchkey:    {k:['daraja_churchkey_v1'], p:[]},
    drumbeat:     {k:['drumbeat_v1','drumbeat_groups_v1'], p:['drumbeat_']},
    flipkit:      {k:['flipkit_v1','flipkit_aa','flipkit_seen'], p:['flipkit_']},
    rafiki:       {k:['rafiki_v1','rafiki_aa'], p:['rafiki_']},
    pitwall:      {k:['pitwall_state_v1'], p:['pitwall_','f1_']},
    churchhq:     {k:['church_hq_v1'], p:['church_hq_']},
    steward:      {k:['steward_v1'], p:['steward_']},
    serve:        {k:['serveboard_v1'], p:['serveboard_','serve_']},
    clubhouse:    {k:['clubhouse_stars'], p:['clubhouse_']},
    gameday:      {k:[], p:['gameday_','church_gameday_']},
    goodstanding: {k:['goodstanding_v1'], p:['goodstanding_']},
    receipts:     {k:['receiptmaker_org_v1'], p:['receiptmaker_','receipts_']}
  };

  function slugOf(){
    var s = (window.DJ_START && window.DJ_START.slug) ||
            (location.pathname.replace(/\/index\.html$/,'').split('/').filter(Boolean).pop() || '');
    s = String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
    var alias = {churchkey:'churchkey', thekey:'thekey', churchserve:'serve', churchsteward:'steward',
                 churchhq:'churchhq', churchdrive:'drive', churchclubhouse:'clubhouse',
                 churchgameday:'gameday', npgoodstanding:'goodstanding', npreceipts:'receipts',
                 f1:'pitwall', feedbackstudio:'feedback', storykeeper:'storykeeper'};
    return alias[s] || s;
  }

  function myKeys(){
    var me = slugOf(), mine = OWNS[me];
    if(!mine) return null;                            /* unknown app — do not guess */
    var guard = {};
    Object.keys(OWNS).forEach(function(a){
      if(a === me) return;
      OWNS[a].k.forEach(function(x){ guard[x] = a; });
    });
    /* two apps genuinely share the shoebox count, so neither may erase it */
    var shared = {'occ_counter_v1':1, 'occTipSeen':1, 'now_next_v1':(me !== 'nownext') ? 1 : 0};
    var out = [];
    try{
      for(var i=0; i<localStorage.length; i++){
        var k = localStorage.key(i); if(!k) continue;
        if(k.indexOf('dj_') === 0) continue;
        if(shared[k]) continue;
        var owned = mine.k.indexOf(k) >= 0;
        if(!owned) for(var j=0; j<mine.p.length; j++) if(k.indexOf(mine.p[j]) === 0){ owned = true; break; }
        if(!owned && k.indexOf('fs_coach_' + me) === 0) owned = true;
        if(!owned) continue;
        if(guard[k] && mine.k.indexOf(k) < 0) continue;   /* another app's, by name */
        out.push(k);
      }
    }catch(e){}
    return out;
  }

  function startFresh(){
    var keys = myKeys();
    if(keys === null){ alert('This app is not set up to erase itself yet — tell Jerry.'); return; }
    var dbs = (OWNS[slugOf()] || {}).idb || [];
    if(!keys.length && !dbs.length){ alert('There is nothing saved in this app yet — nothing to erase.'); return; }

/* ---------- saving: this device first, then the Claude store ---------- */
let saveTimer = null, writeChain = Promise.resolve(), docRef = null;
function save() {
  S.updatedAt = Date.now();
  lsSet(LS_KEY, S);
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { state: JSON.parse(JSON.stringify(S)), updatedAt: S.updatedAt };
    writeChain = writeChain.then(() => docRef.set(body)).catch(() => {});
  }, 700);
}

/* ---------- speech ---------- */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) { toast("Reading aloud isn't available on this device."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch { toast("Reading aloud isn't available on this device."); }
}
function speakBtn(getText, label) {
  return h("button", { class: "speak", type: "button", onclick: () => speak(typeof getText === "function" ? getText() : getText), html: ICON.speaker + `<span>${label || "Read this to me"}</span>` });
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200); }

/* ---------- capability wiring ---------- */
function use(name) {
  try { return window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch { return Promise.resolve(null); }
}
async function boot() {
  applyTextSize();
  render();
  const [db, user, mcp, sample] = await Promise.all([use("db"), use("user"), use("mcp"), use("sample")]);
  Object.assign(caps, { db, user, mcp, sample, ready: true });
  if (user) caps.uid = await user.id();
  if (db && caps.uid) {
    docRef = db.doc("data/users/" + caps.uid + "/porch");
    docRef.onSnapshot((snap) => {
      if (snap.exists) {
        const d = snap.data();
        if (d && d.state && (d.updatedAt || 0) > (S.updatedAt || 0)) {
          S = Object.assign(freshState(), JSON.parse(JSON.stringify(d.state)));
          S.profile = Object.assign(freshState().profile, S.profile);
          lsSet(LS_KEY, S);
          if (S.profile.setupDone && ui.view === "setup" && ui.step === 0) ui.view = "home";
          applyTextSize();
          render();
        } else if (d && (d.updatedAt || 0) < (S.updatedAt || 0)) save();
      } else if (S.updatedAt) save();
    }, () => { docRef = null; });
  }
  if (db) subscribeFamily(db);
  render();
  if (S.profile.setupDone && has("calendar")) loadCalendar();
}
function has(goal) { return S.profile.goals.includes(goal); }
function applyTextSize() { const r = document.documentElement; r.classList.remove("size-2", "size-3"); if (S.profile.textSize > 1) r.classList.add("size-" + S.profile.textSize); }

function mcpCopy(e, server) {
  const code = e && e.code;
  switch (code) {
    case "needs_reauth": return `Your ${server} connection needs a refresh. In Claude, open Settings, then Connectors, and reconnect ${server}. Then tap Try again.`;
    case "server_not_connected":
    case "selection_required":
    case "server_not_found": return `${server} isn't connected to your Claude account yet. In Claude, open Settings, then Connectors, choose ${server}, and sign in with your Google account. Then come back and tap Try again.`;
    case "not_in_manifest": return `You chose not to let Porchlight use ${server}. You can turn it back on from this page's Permissions menu.`;
    case "approval_required": return `Claude needs your OK before I can use ${server}. Tap Try again and choose Allow.`;
    case "blocked_by_policy": return `Your account's settings don't allow ${server} here.`;
    case "server_unavailable":
    case "rate_limited": return `${server} isn't answering right now. Wait a minute and tap Try again.`;
    case "tool_error": return `${server} said: ${e.message || "something went wrong"}.`;
    case "not_granted":
    case "capability_disabled":
    case "capability_removed": return `Connecting ${server} only works when you open Porchlight inside Claude.`;
    default: return `Something went wrong talking to ${server}. Tap Try again.`;
  }
}
function sampleCopy(e) {
  switch (e && e.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      caps.sampleOff = true; return "You chose not to let me use Claude here, so I'm using simple rules instead.";
    case "rate_limited": return "I've been asked a lot just now. Give me a minute and try again.";
    case "session_expired": return "Please sign in to Claude again, then try once more.";
    case "refused": return "I can't help with that one. Try asking a different way.";
    case "cancelled": return "";
    default: return "I couldn't finish that just now. Please try again.";
  }
}
const canAsk = () => caps.sample && !caps.sampleOff;

function renderNav() {

async function loadCalendar(force) {
  if (!caps.ready) return;
  if (!caps.mcp) { cal.status = "error"; cal.error = "Your calendar shows up when you open Porchlight inside Claude."; render(); return; }
  cal.status = "loading"; if (ui.view === "home") render();
  const now = new Date(), end = new Date(now); end.setDate(end.getDate() + 2); end.setHours(0, 0, 0, 0);
  try {
    const r = await caps.mcp.callTool("Google Calendar", "list_events", { startTime: localISO(now), endTime: localISO(end), orderBy: "startTime", pageSize: 10 }, force ? { cache: { refresh: true, staleTime: 300000 } } : { cache: { staleTime: 300000 } });
    const evs = (r.payload && r.payload.events) || [];
    const today = new Date().toDateString();
    cal.events = evs.filter((e) => e.status !== "cancelled").map((e) => {
      let when;
      if (e.start && e.start.dateTime) {
        const d = new Date(e.start.dateTime);
        when = (d.toDateString() === today ? "" : "Tmrw ") + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      } else {
        const ds = (e.start && e.start.date || "").slice(0, 10);
        const [y, m, dd] = ds.split("-").map(Number);
        const d = new Date(y, (m || 1) - 1, dd || 1);
        when = d.toDateString() === today ? "All day" : "Tmrw, all day";
      }
      return { when, title: e.summary || "(No title)" };
    });
    cal.status = "ready";
  } catch (e) { cal.status = "error"; cal.error = mcpCopy(e, "Google Calendar"); }
  if (ui.view === "home") render();
}

const SCAM_RE = /(gift ?card|wire transfer|verify your (account|identity)|account (is |has been )?(suspended|locked)|password (expired|reset)|urgent action|act now|you('ve| have) won|lottery|sweepstakes|bitcoin|crypto|social security number|irs refund|tech support|unusual sign-?in)/i;
const LATER_RE = /(unsubscribe|newsletter|% off|sale|deal|webinar|promo|no-?reply|noreply|digest)/i;
function ruleSort(m) {
  const hay = `${m.from} ${m.subject} ${m.snippet}`.toLowerCase();
  const vip = P().vips.some((v) => v && hay.includes(v.toLowerCase()));
  if (vip) return { group: "reply", why: "From someone on your important list." };
  if (SCAM_RE.test(hay)) return { group: "scam", why: "Has warning signs of a scam. Don't click links." };
  if (m.labels.some((l) => /CATEGORY_(PROMOTIONS|SOCIAL|FORUMS)/.test(l)) || LATER_RE.test(hay)) return { group: "later", why: "Looks like an ad or newsletter." };
  if (m.labels.includes("IMPORTANT")) return { group: "important", why: "Gmail marked this as important." };
  return { group: "important", why: "Worth a look when you have time." };
}

async function sortMail() {
  mail.error = null; mail.note = null;
  if (P().provider !== "gmail") { mail.items = EXAMPLE_MAIL.slice(); mail.status = "example"; render(); return; }
  if (!caps.ready) { mail.status = "loading"; render(); setTimeout(sortMail, 1500); return; }
  if (!caps.mcp) { mail.items = EXAMPLE_MAIL.slice(); mail.status = "example"; mail.note = "I can read your Gmail when you open Porchlight inside Claude. For now, here are examples."; render(); return; }
  mail.status = "loading"; render();
  let threads;
  try {
    const r = await caps.mcp.callTool("Gmail", "search_threads", { query: "in:inbox newer_than:5d", pageSize: 30 }, { cache: false });
    threads = (r.payload && r.payload.threads) || [];
  } catch (e) { mail.status = "error"; mail.error = mcpCopy(e, "Gmail"); render(); return; }
  mail.items = threads.filter((t) => t.messages && t.messages.length).map((t) => {
    const m = t.messages[t.messages.length - 1];
    const item = { id: t.id, msgId: m.id, from: m.sender || "", subject: decodeEntities(m.subject || "(No subject)"), snippet: decodeEntities(m.snippet || ""), date: m.date, labels: m.labelIds || [], url: t.viewUrl || m.viewUrl || "", count: t.messages.length };
    return Object.assign(item, ruleSort(item));
  });
  mail.status = "ready"; mail.at = new Date();
  if (canAsk() && mail.items.length) {
    mail.status = "thinking"; render();
    const list = mail.items.map((m, i) => ({ i, from: m.from, subject: m.subject, preview: m.snippet.slice(0, 220), gmailLabels: m.labels.filter((l) => /IMPORTANT|CATEGORY/.test(l)) }));
    const prompt = `You help ${P().name}, an older adult who is not comfortable with technology, sort their email inbox.
People who matter most to them: ${P().vips.join("; ") || "(none listed)"}.

Put every email in exactly one group:
- "reply": a real person or an organization they deal with expects an answer or action from them (family, friends, doctor, church, a bill that is due, a form to return). Emails from the people above usually go here.
- "important": worth reading but needs no reply (appointment reminders, delivery notices, statements, receipts, news from their own groups).
- "scam": signs of phishing or fraud: fake urgency, prizes, gift cards, requests for passwords or payment from unexpected senders, misspelled company names, odd sender addresses. When unsure about a money or login request from an unknown sender, choose "scam".
- "later": ads, sales, newsletters, social media notices.

For each, write "why": under 14 plain words a grandparent would understand, no jargon.
Reply with only a JSON array like [{"i":0,"group":"reply","why":"Your daughter asks if you can come Sunday."}].

Emails:
${JSON.stringify(list)}`;
    try {
      const res = await caps.sample.json(prompt, { modelTier: "quick", cache: { gcTime: 600000 } });
      if (Array.isArray(res)) for (const r of res) {
        const m = mail.items[Number(r.i)];
        if (m && GROUPS[r.group]) { m.group = r.group; if (r.why) m.why = String(r.why).slice(0, 140); }
      }
    } catch (e) { mail.note = sampleCopy(e) || null; }
    mail.status = "ready";
  }
  render();
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

async function openReader(m, startReply) {
  const bodyBox = h("div", { class: "mailbody" }, m.snippet);
  const explainBox = h("div");
  const replyBox = h("div");
  let fullText = m.snippet, lastMsgId = m.msgId;
  const closeBtn = h("button", { class: "btn btn-quiet", type: "button", onclick: closeSheet }, "Close");
  const head = h("div", { class: "card-head" }, h("h2", null, m.subject), closeBtn);
  const meta = h("p", null, h("b", null, "From: "), m.from);
  const actions = h("div", { class: "row" },
    h("button", { class: "btn btn-quiet", type: "button", onclick: () => speak(`Email from ${senderName(m.from)}. ${m.subject}. ${fullText}`), html: ICON.speaker + "<span>Read it to me</span>" }),
    canAsk() ? h("button", { class: "btn btn-quiet", type: "button", onclick: () => explain() }, "Explain it simply") : null,
    m.group !== "scam" ? h("button", { class: "btn btn-quiet", type: "button", onclick: () => composeReply() }, "Help me answer") : null,
    h("button", { class: "btn btn-quiet", type: "button", onclick: () => { addTask(`Follow up: ${m.subject}`, senderName(m.from)); toast("Added to your to-do list."); } }, "Add to my to-do list"),
    m.url ? h("a", { class: "btn btn-quiet", href: m.url, target: "_blank", rel: "noopener" }, "Open in Gmail ↗") : null);
  const warn = m.group === "scam" ? h("div", { class: "note" }, h("b", null, "Be careful. "), m.why + " Don't click links, call numbers, or send money from this email. If you're unsure, call the company using a number you already trust.") : null;
  openSheet([head, meta, warn, bodyBox, actions, explainBox, replyBox]);

  if (!m.example && caps.mcp) {
    bodyBox.replaceChildren(h("div", { class: "status" }, h("span", { class: "spinner" }), "Opening the whole email…"));
    try {
      const r = await caps.mcp.callTool("Gmail", "get_thread", { threadId: m.id, messageFormat: "PLAIN_TEXT" }, { cache: { staleTime: 300000 } });
      const msgs = (r.payload && r.payload.messages) || [];
      const last = msgs[msgs.length - 1];
      if (last) {
        lastMsgId = last.id || lastMsgId;
        fullText = decodeEntities(last.plaintextBody || last.plaintext_body || last.snippet || m.snippet).replace(/\n{3,}/g, "\n\n").trim();
      }
      bodyBox.textContent = fullText.slice(0, 8000) + (fullText.length > 8000 ? "\n\n… (open in Gmail to see the rest)" : "");
    } catch (e) { bodyBox.replaceChildren(m.snippet, h("p", { class: "muted small" }, mcpCopy(e, "Gmail"))); }
  }

  async function explain() {
    explainBox.replaceChildren(h("div", { class: "status" }, h("span", { class: "spinner" }), "Reading it carefully…"));
    try {
      const { text } = await caps.sample(`Explain this email to ${P().name}, an older adult, in 3 short plain sentences: who it is from, what it is about, and what (if anything) they should do. If it looks like a scam, say so first and say not to click anything. No jargon, no markdown.\n\nFrom: ${m.from}\nSubject: ${m.subject}\n\n${fullText.slice(0, 6000)}`, { modelTier: "quick" });
      explainBox.replaceChildren(helperSays(text.trim()));
    } catch (e) { const c = sampleCopy(e); explainBox.replaceChildren(c ? h("div", { class: "note" }, c) : ""); }
  }

  function composeReply() {
    const wish = h("input", { class: "input", id: "f-wish", placeholder: "In your own words, like: Yes, I'll be there Sunday" });
    const draft = h("textarea", { class: "input", id: "f-draft", placeholder: "Your answer will appear here. You can change any of it." });
    const status = h("div");
    const writeBtn = h("button", { class: "btn btn-quiet", type: "button" }, "Write it for me");
    writeBtn.onclick = async () => {
      if (!canAsk()) { status.replaceChildren(h("div", { class: "note" }, "I can write answers when you open Porchlight inside Claude. You can still type your answer in the box.")); return; }
      writeBtn.disabled = true; status.replaceChildren(h("div", { class: "status" }, h("span", { class: "spinner" }), "Writing…"));
      try {
        const { text } = await caps.sample(`Write a short, warm email reply for ${P().name} to send. Keep their meaning: "${wish.value.trim() || "a kind, brief reply"}". Plain text only, no subject line, no markdown, under 90 words. Sign it "${P().name}".\n\nThe email they are answering:\nFrom: ${m.from}\nSubject: ${m.subject}\n\n${fullText.slice(0, 4000)}`, { modelTier: "quick", cache: false, onText: ({ text }) => { draft.value = text; } });
        draft.value = text.trim(); status.replaceChildren();
      } catch (e) { const c = sampleCopy(e); status.replaceChildren(c ? h("div", { class: "note" }, c) : ""); }
      finally { writeBtn.disabled = false; }
    };
    const sendBtn = h("button", { class: "btn btn-primary btn-big", type: "button" }, "Send my answer");
    sendBtn.onclick = () => {
      const body = draft.value.trim();
      if (!body) { toast("Please write your answer first."); draft.focus(); return; }
      if (m.example) { status.replaceChildren(h("div", { class: "note" }, "This is an example email, so nothing was sent. With your real Gmail, this button sends your answer.")); return; }
      if (!caps.mcp) { status.replaceChildren(h("div", { class: "note" }, "Sending works when you open Porchlight inside Claude.")); return; }
      const to = senderEmail(m.from);
      const yes = h("button", { class: "btn btn-danger", type: "button" }, "Yes, send it");
      const no = h("button", { class: "btn btn-quiet", type: "button", onclick: () => status.replaceChildren() }, "Not yet");
      yes.onclick = async () => {
        yes.disabled = true; no.disabled = true;
        status.replaceChildren(h("div", { class: "status" }, h("span", { class: "spinner" }), "Sending…"));
        try {
          await caps.mcp.callTool("Gmail", "reply", { messageId: lastMsgId, body });
          status.replaceChildren(h("div", { class: "good" }, `Sent to ${senderName(m.from)}.`));
          sendBtn.disabled = true; draftBtn.disabled = true;
          S.mailDone = [m.id].concat(S.mailDone).slice(0, 300); save();
        } catch (e) {
          status.replaceChildren(h("div", { class: "note" }, mcpCopy(e, "Gmail") + " Before trying again, check your Gmail Sent folder, in case it went through."));
        }
      };
      status.replaceChildren(h("div", { class: "card" }, h("p", null, h("b", null, `Send this answer to ${senderName(m.from)}`), to ? ` (${to})` : "", "?"), h("div", { class: "row" }, yes, no)));
    };
    const draftBtn = h("button", { class: "btn btn-quiet", type: "button" }, "Save it as a draft instead");
    draftBtn.onclick = async () => {
      const body = draft.value.trim();
      if (!body) { toast("Please write your answer first."); return; }
      if (m.example || !caps.mcp) { status.replaceChildren(h("div", { class: "note" }, m.example ? "This is an example email, so nothing was saved." : "Saving drafts works when you open Porchlight inside Claude.")); return; }
      draftBtn.disabled = true;
      try {
        const to = senderEmail(m.from);
        const input = { replyToMessageId: lastMsgId, body, subject: /^re:/i.test(m.subject) ? m.subject : "Re: " + m.subject };
        if (to) input.to = [to];
        await caps.mcp.callTool("Gmail", "create_draft", input);
        status.replaceChildren(h("div", { class: "good" }, "Saved in your Gmail Drafts. You can send it from Gmail any time."));
      } catch (e) { status.replaceChildren(h("div", { class: "note" }, mcpCopy(e, "Gmail"))); draftBtn.disabled = false; }
    };
    replyBox.replaceChildren(h("div", { class: "card" },
      h("h3", null, `Your answer to ${senderName(m.from)}`),
      h("div", { class: "field" }, h("label", { for: "f-wish" }, "What do you want to say?"), wish),
      writeBtn,
      h("div", { class: "field" }, h("label", { for: "f-draft" }, "Your answer"), draft),
      sendBtn, draftBtn, status));
    replyBox.scrollIntoView({ behavior: "smooth", block: "start" });
    wish.focus();
  }
  if (startReply) composeReply();
}

/* ================================================================
   TO-DO
================================================================ */
function addTask(text, from) { text = (text || "").trim(); if (!text) return null; const t = { id: uid(), text: text.slice(0, 200), done: false, from: from || "", at: Date.now() }; S.tasks.unshift(t); S.tasks = S.tasks.slice(0, 200); save(); return t; }
function viewTodo() {
  const input = h("input", { class: "input", id: "f-task", placeholder: "For example: Call the pharmacy" });
  const add = () => { if (addTask(input.value)) { render(); setTimeout(() => $("#f-task") && $("#f-task").focus(), 0); } };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  const open = S.tasks.filter((t) => !t.done), done = S.tasks.filter((t) => t.done);
  const item = (t) => h("li", { class: "todo" + (t.done ? " done" : "") },
    h("button", { class: "check", type: "button", "aria-label": (t.done ? "Mark not done: " : "Mark done: ") + t.text, onclick: () => { t.done = !t.done; save(); render(); if (t.done) toast("Nice work!"); } }),
    h("span", { class: "text" }, t.text, t.from ? h("span", { class: "from" }, "From an email by " + t.from) : null),
    h("button", { class: "del", type: "button", "aria-label": "Remove " + t.text, onclick: () => { S.tasks = S.tasks.filter((x) => x !== t); save(); render(); } }, "Remove"));
  return [
    h("div", { class: "hello" }, h("h1", null, "My to-do list")),
    h("div", { class: "card" }, h("div", { class: "field" }, h("label", { for: "f-task" }, "Add something to remember"), input), h("button", { class: "btn btn-primary btn-big", type: "button", onclick: add }, "Add to my list")),
    open.length ? h("ul", { class: "list" }, open.map(item)) : helperSays("Your list is empty. Add anything you want me to remember, or ask me on the Talk page, like “Remind me to call Sarah.”"),
    done.length ? h("h2", null, `Finished (${done.length})`) : null,
    done.length ? h("ul", { class: "list" }, done.map(item)) : null,
    done.length ? h("button", { class: "btn btn-quiet", type: "button", onclick: () => { S.tasks = S.tasks.filter((t) => !t.done); save(); render(); } }, "Clear finished items") : null,
  ];
}

================================================================ */
function viewMessages() {
  const tabs = h("div", { class: "tabs", role: "tablist" },
    h("button", { type: "button", role: "tab", "aria-selected": ui.msgTab === "chat" ? "true" : "false", onclick: () => { ui.msgTab = "chat"; render(); } }, `Talk with ${P().helper}`),
    h("button", { type: "button", role: "tab", "aria-selected": ui.msgTab === "family" ? "true" : "false", onclick: () => { ui.msgTab = "family"; render(); } }, "Family notes"));
  return [h("div", { class: "hello" }, h("h1", null, "Talk")), tabs].concat(ui.msgTab === "chat" ? viewChat() : viewFamily());
}

let chatBusy = false, chatCtl = null;
function chatRules() {
  const open = S.tasks.filter((t) => !t.done).map((t) => t.text);
  return `You are ${P().helper}, a warm, patient personal helper inside an app called Porchlight, talking with ${P().name}, an older adult who is not comfortable with technology.
How to talk: short sentences, plain words, no jargon, no markdown symbols. Be kind and encouraging, never rushed. Keep answers under 110 words unless asked for more.
Values: clean, family-friendly humor only. Respect Christian faith and traditional values; you may share a Bible verse or a prayer if asked.
Safety: never ask for passwords, PINs, bank or card numbers, or Social Security numbers. If they paste a message, email, or text, tell them plainly whether it looks like a scam and what to do. Encourage calling a trusted family member or the company's real phone number when unsure.
The app has big buttons at the bottom: Home, Mail (sorts their email), To-Do (their list), Talk (here), My Setup (change answers, text size). Point them to these when it helps.
Their to-do list right now: ${open.length ? open.join("; ") : "empty"}.
Today is ${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}.`;
}
function viewChat() {
  const log = h("div", { class: "chat", id: "chatlog" });
  if (!chatTurns.length) log.append(helperSays(`Hi ${P().name}! Ask me anything. I can tell you a joke, explain a confusing email or text, help you write a note, or add things to your to-do list.`));
  for (const t of chatTurns) log.append(t.role === "user" ? h("div", { class: "mine" }, h("div", { class: "bubble me" }, t.content)) : helperSays(t.content));
  const input = h("textarea", { class: "input", id: "f-chat", placeholder: "Type here. You can also paste a text message you got." , rows: 3 });
  const status = h("div");
  const send = (text) => sendChat(text || input.value, input, status, log);
  const quick = ["Tell me a joke", "Is this a scam? I'll paste it next", "Help me write a thank-you note", "What's on my list today?", "Share a Bible verse"];
  return [
    log,
    status,
    h("div", { class: "chips" }, quick.map((q) => h("button", { class: "btn btn-quiet", type: "button", onclick: () => send(q) }, q))),
    h("div", { class: "card" }, h("div", { class: "field" }, h("label", { for: "f-chat" }, `Your message to ${P().helper}`), input),
      h("div", { class: "row" }, h("button", { class: "btn btn-primary btn-big", type: "button", onclick: () => send() }, "Send"),
        chatTurns.length ? h("button", { class: "btn btn-quiet", type: "button", onclick: () => { chatTurns = []; lsSet(LS_KEY + ".chat", chatTurns); render(); } }, "Start a new talk") : null)),
  ];
}
async function sendChat(text, input, status, log) {
  text = (text || "").trim();
  if (!text || chatBusy) return;
  chatTurns.push({ role: "user", content: text.slice(0, 4000) });
  if (input) input.value = "";
  log.append(h("div", { class: "mine" }, h("div", { class: "bubble me" }, text)));
  const p = h("p", null, "Thinking…");
  const bubble = h("div", { class: "bubble" }, p);
  const row = h("div", { class: "say" }, h("div", { class: "avatar", "aria-hidden": "true" }, (P().helper || "S").charAt(0).toUpperCase()), bubble);
  log.append(row);
  row.scrollIntoView({ behavior: "smooth", block: "end" });

  if (!canAsk()) {
    let reply;
    if (/joke|laugh|funny/i.test(text)) reply = JOKES[Math.floor(Math.random() * JOKES.length)];
    else if (/verse|bible|scripture|pray/i.test(text)) { const [v, r] = VERSES[Math.floor(Math.random() * VERSES.length)]; reply = `“${v}” — ${r}`; }
    else if (/list|to-?do|today/i.test(text)) { const open = S.tasks.filter((t) => !t.done); reply = open.length ? "Here's your list: " + open.map((t) => t.text).join("; ") + "." : "Your to-do list is empty right now."; }
    else reply = caps.ready ? "To have a real conversation, open Porchlight inside Claude. I can still tell you a joke, share a verse, or read your to-do list." : "One moment, I'm still getting ready. Try again in a few seconds.";
    p.textContent = reply; bubble.append(speakBtn(reply));
    chatTurns.push({ role: "assistant", content: reply }); lsSet(LS_KEY + ".chat", chatTurns.slice(-30));
    return;
  }
  chatBusy = true;
  chatCtl = new AbortController();
  const stop = h("button", { class: "btn btn-quiet", type: "button", onclick: () => chatCtl && chatCtl.abort() }, "Stop");
  status.replaceChildren(stop);
  const turns = [{ role: "user", content: chatRules() }].concat(chatTurns.slice(-16));
  const opts = { modelTier: "quick", signal: chatCtl.signal, onText: ({ text }) => { p.textContent = text; } };
  const lim = await caps.sample.limits().catch(() => null);
  if (lim && lim.tools) {
    opts.tools = [{
      name: "add_to_do",
      description: "Adds one item to the person's to-do list in the app. Use when they ask you to remind them of something or add a task. Returns a confirmation.",
      inputSchema: { type: "object", properties: { text: { type: "string", description: "The item, short and clear, like 'Call Sarah about Sunday dinner'" } }, required: ["text"] },
      execute: (inp) => { const t = addTask(String(inp.text || "")); if (!t) throw new Error("Nothing to add"); return "Added: " + t.text; },
    }];
  } else opts.cache = false;
  try {
    const { text: out } = await caps.sample(turns, opts);
    p.textContent = out.trim();
    bubble.append(speakBtn(out.trim()));
    chatTurns.push({ role: "assistant", content: out.trim() });
  } catch (e) {
    const c = sampleCopy(e);
    p.textContent = e.text ? e.text + (c ? "\n\n(" + c + ")" : "") : c || "(Stopped.)";
    if (e.text) chatTurns.push({ role: "assistant", content: e.text });
    else chatTurns.pop();
  } finally {
    chatBusy = false; status.replaceChildren();
    lsSet(LS_KEY + ".chat", chatTurns.slice(-30));
    renderNav();
  }
}

/* family board (shared db collection "family") */
let familyUnsub = null;
function subscribeFamily(db) {
  if (familyUnsub) return;
  family.status = "loading";
  familyUnsub = db.collection("family").orderBy("at", "desc").limit(50).onSnapshot(async (snap) => {
    family.posts = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    family.status = "ready";
    const ids = [...new Set(family.posts.map((p) => p.by).filter(Boolean))];
    if (caps.user && ids.length) family.profiles = await caps.user.profiles(ids);
    if (ui.view === "messages" || ui.view === "home") render();
  }, (e) => { family.status = "error"; family.error = e.code === "revoked" ? "This board isn't available right now." : "I couldn't load family notes."; if (ui.view === "messages") render(); });
}
function viewFamily() {
  if (!caps.db) {
    return [helperSays(caps.ready ? "Family notes work when you open Porchlight inside Claude. Then tap Share at the top of the page and invite your family. They'll be able to leave you notes here." : "One moment, I'm still getting ready.")];
  }
  const input = h("textarea", { class: "input", id: "f-post", placeholder: "Write a note to your family", rows: 3 });
  const status = h("div");
  const postBtn = h("button", { class: "btn btn-primary btn-big", type: "button" }, "Post my note");
  postBtn.onclick = async () => {
    const text = input.value.trim();
    if (!text) { toast("Please write your note first."); return; }
    if (!caps.uid) { status.replaceChildren(h("div", { class: "note" }, "Please sign in to Claude to post a note.")); return; }
    postBtn.disabled = true;
    try {
      await caps.db.collection("family").add({ by: caps.uid, text: text.slice(0, 1000), at: Date.now() });
      input.value = ""; toast("Posted!");
    } catch (e) {
      status.replaceChildren(h("div", { class: "note" }, e.code === "invalid_argument" ? "You can read notes here, but you don't have permission to post. Ask the owner to give you Contributor access." : e.code === "quota_exceeded" ? "The board is full. Ask the owner to remove some old notes." : "I couldn't post that. Please try again."));
    } finally { postBtn.disabled = false; }
  };
  const posts = family.posts.map((p) => {
    const prof = family.profiles[p.by] || {};
    const isMe = p.by === caps.uid;
    return h("article", { class: "post" },
      h("div", { class: "who" }, prof.avatarUrl ? h("img", { src: prof.avatarUrl, alt: "" }) : null, h("span", null, isMe ? "You" : prof.name || "Someone"), h("span", { class: "muted small" }, new Date(p.at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))),
      h("div", { class: "body" }, String(p.text || "")),
      h("div", { class: "row" }, speakBtn(`${isMe ? "You" : prof.name || "Someone"} wrote: ${p.text}`, "Read it to me"),
        isMe ? h("button", { class: "del btn btn-quiet", type: "button", onclick: () => caps.db.doc("family/" + p.id).delete().catch(() => toast("I couldn't remove that.")) }, "Remove") : null));
  });
  return [
    h("div", { class: "card" }, h("div", { class: "field" }, h("label", { for: "f-post" }, "New note"), input), postBtn, status),
    family.status === "error" ? h("div", { class: "note" }, family.error) : null,
    posts.length ? h("div", { class: "list" }, posts) : helperSays("No notes yet. Invite family with the Share button at the top of this page in Claude, then leave the first note!"),
  ];
}

let confirmErase = false;
function viewSettings() {
  const conn = (ok, label) => h("li", null, h("b", null, label + ": "), ok);
  const out = [
    h("div", { class: "hello" }, h("h1", null, "My Setup")),
    h("div", { class: "card" },
      h("h2", null, `${P().name}'s helper, ${P().helper}`),
      h("p", null, "Want to change what I help with, your email, or your favorite websites? I'll ask the questions again with your answers already filled in."),
      h("button", { class: "btn btn-primary btn-big", type: "button", onclick: () => { ui.step = 1; go("setup"); } }, "Answer the setup questions again")),
    h("div", { class: "card" },
      h("h2", null, "Word size"),
      h("div", { class: "sizes" }, [1, 2, 3].map((n) => h("button", { class: "choice", type: "button", "aria-pressed": P().textSize === n ? "true" : "false", onclick: () => { P().textSize = n; applyTextSize(); save(); render(); } }, h("span", { style: `font-size:${[0, 1.1, 1.35, 1.6][n]}rem` }, "Aa"), h("span", null, ["", "Big", "Bigger", "Biggest"][n]))))),
    h("div", { class: "card" },
      h("h2", null, "Connections"),
      h("ul", { class: "list" },
        conn(caps.mcp ? (P().gmailOk ? "Connected" : "Not checked yet") : "Only inside Claude", "Gmail"),
        conn(caps.mcp ? (P().calOk ? "Connected" : "Not checked yet") : "Only inside Claude", "Google Calendar"),
        conn(canAsk() ? "Ready" : caps.sampleOff ? "Turned off" : "Only inside Claude", "Smart help from Claude"),
        conn(docRef ? "Saved to your Claude account" : "Saved on this device only", "Your answers and list")),
      h("button", { class: "btn btn-quiet", type: "button", onclick: managePermissions }, "Change what Porchlight may use")),
    h("div", { class: "card" },
      h("h2", null, "Start fresh"),
      h("p", null, "This erases your answers, your to-do list, and our conversation. Your email and calendar are not touched."),
      confirmErase
        ? h("div", { class: "row" },
            h("button", { class: "btn btn-danger", type: "button", onclick: eraseAll }, "Yes, erase everything"),
            h("button", { class: "btn btn-quiet", type: "button", onclick: () => { confirmErase = false; render(); } }, "No, keep it"))
        : h("button", { class: "btn btn-quiet", type: "button", onclick: () => { confirmErase = true; render(); } }, "Erase my information")),
  ];
  return out;
}
async function managePermissions() {
  try {
    const perms = await use("permissions");
    if (perms && perms.manage) { await perms.manage(); return; }
    else { toast("Open the Permissions menu at the top of this page in Claude."); return; }
  } catch {}
  toast("Open the Permissions menu at the top of this page in Claude.");
}
async function eraseAll() {
  confirmErase = false;
  S = freshState(); chatTurns = [];
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_KEY + ".chat"); } catch {}
  if (docRef) { const ref = docRef; writeChain = writeChain.then(() => ref.delete()).catch(() => {}); }
  mail.status = "idle"; mail.items = []; cal.status = "idle";
  applyTextSize(); ui.step = 0; go("setup");
}

  mail: "Tap Go through my mail and I'll sort your newest emails. Red ones need your answer. Orange ones might be scams, so don't click links in them. Blue ones are good to know. Gray ones can wait. Tap Read it to open an email. Nothing is ever sent unless you tap Send and then Yes.",
  todo: "Type something you want to remember and tap Add to my list. When you finish it, tap the square box next to it. You can also ask me on the Talk page to add things for you.",
  messages: "Type a message in the box and tap Send. Ask me anything, or paste a text message you got and I'll tell you if it looks like a scam. Family notes is a board your invited family can write on too.",
  settings: "Here you can redo the setup questions, make the words bigger, and see what's connected.",
};
function openHelp() {
  const text = HELP[ui.view] || HELP.home;
  openSheet([
    h("div", { class: "card-head" }, h("h2", null, "Help"), h("button", { class: "btn btn-quiet", type: "button", onclick: closeSheet }, "Close")),
    helperSays(text),
    h("div", { class: "card" }, h("h3", null, "Staying safe"), h("p", null, "I will never ask for your passwords, PINs, bank numbers, or Social Security number. If an email or text asks for these, it's almost always a scam. When in doubt, call a family member or the company's real phone number.")),
    ui.view !== "messages" && ui.view !== "setup" ? h("button", { class: "btn btn-primary btn-big", type: "button", onclick: () => { closeSheet(); ui.msgTab = "chat"; go("messages"); } }, `Ask ${P().helper} a question`) : null,
  ]);
}

/* ================================================================
   STORE VIDEOS — shop/watch.html drives the app with porchTour.scene(name).
   It shows an example person and example mail. Inside the store's player the
   real saved data is set aside with parent.tourSet and put back when it ends.
================================================================ */
const DEMO = {
  updatedAt: 1,
  profile: { setupDone: true, name: "Margaret", helper: "Sunny", goals: ["email", "todo", "weather", "websites", "smile"], provider: "gmail", vips: ["Sarah", "Dr. Patel"], place: "75201", tickers: [], bankName: "", bankUrl: "", sites: [{ name: "Our church", url: "https://example.org/" }], verse: true, jokes: true, order: ["email", "todo", "weather", "smile", "websites"], textSize: 1, gmailOk: true },
  tasks: [
    { id: "d1", text: "Call the pharmacy about my refill", done: false, from: "", at: 1 },
    { id: "d2", text: "Follow up: Sunday dinner?", done: false, from: "Sarah (your daughter)", at: 1 },
    { id: "d3", text: "Water the tomatoes", done: true, from: "", at: 1 },
  ],
  mailDone: [],
};
const DEMO_CHAT = [
  { role: "user", content: "Is this a scam? “USPS: your package is on hold. Pay $1.99 at usps-redelivery.co”" },
  { role: "assistant", content: "Yes, this looks like a scam. The Post Office doesn't text you asking for money, and that web address isn't the real one. Don't tap the link. You can delete the message." },
];
window.porchTour = {
  scene(name) {
    try {
      if (!this.loaded) {
        this.loaded = true;
        try { if (window.parent !== window && window.parent.tourSet) window.parent.tourSet(LS_KEY, JSON.stringify(DEMO)); } catch {}
        S = JSON.parse(JSON.stringify(DEMO));
        applyTextSize();
      }
      $("#sheet").hidden = true;   /* not closeSheet(): that cancels speech, and the video's narration may be speaking */
      const setupStep = (id) => { ui.view = "setup"; ui.step = Math.max(0, liveSteps().findIndex((s) => s.id === id)); window.scrollTo(0, 0); render(); };
      const ex = (id) => EXAMPLE_MAIL.find((m) => m.id === id);
      switch (name) {
        case "welcome": case "name": case "helper": case "goals": case "provider": case "connect": case "vips": case "size": case "done":
          setupStep(name); break;
        case "home": go("home"); break;
        case "mail": mail.items = EXAMPLE_MAIL.slice(); mail.status = "example"; mail.note = null; go("mail"); break;
        case "scam": this.scene("mail"); openReader(ex("ex3")); break;
        case "reply":
          this.scene("mail"); openReader(ex("ex1"), true);
          if ($("#f-wish")) $("#f-wish").value = "Yes, I'll be there Sunday at five";
          if ($("#f-draft")) $("#f-draft").value = "Hi Sarah,\n\nYes, I'll be there Sunday at five. I'll bring a pie.\n\nLove,\nMargaret";
          break;
        case "todo": go("todo"); break;
        case "talk": chatTurns = DEMO_CHAT.slice(); ui.msgTab = "chat"; go("messages"); break;
        case "family": ui.msgTab = "family"; go("messages"); break;
        case "settings": go("settings"); break;
        case "help": go("home"); openHelp(); break;
      }
    } catch (e) {}
  },
};

boot();
</script>
